/* Adding a second place later: the same PLACE steps, no person step, and it
   lands you in the new property. */
function addPlace() {
  flow = 'place'; fs = 0;
  draft = { name: me.name, existingPerson: me.id };
  drawFirst();
}

/* Accepting spends the code, attaches the person, and brings whatever came
   with them. If the inviter had already been logging jobs against their name,
   they become THAT person rather than a second copy of them. */
async function acceptInvite() {
  const inv = draft.invite || {};
  const live = lookupInvite(String(draft.code || '').toUpperCase());
  // Re-checked at the moment of accepting, not only when it was typed. A code
  // revoked while somebody was reading the preview has to fail here.
  if (!live || live.state !== 'sent' || (live.expires_on && live.expires_on < today()))
    throw new Error('that invite is no longer good — ask them for a new code');

  const personId = inv.for_person_id || draft.existingPerson || uid();
  const writes = [];
  const existing = (DB.person || []).find(p => p.id === personId);
  if (existing) {
    // Keep their history; take the name they just gave us if it differs.
    if (draft.name && draft.name !== existing.name)
      writes.push({ op:'upsert', table:'person', record:{ ...existing, name:draft.name } });
  } else {
    writes.push({ op:'upsert', table:'person',
      record:{ id:personId, name:draft.name, role:'resident' } });
  }
  writes.push({ op:'upsert', table:'membership', record:{ id:uid(),
    property_id:inv.property_id, person_id:personId, access:inv.access || 'log',
    scope_structure_id:inv.scope_structure_id || '' } });
  // Land IN the place they were invited to, as themselves — not on whichever
  // property happens to be first in the sheet, and not as its owner.
  localStorage.setItem('dwellogs.me', personId);
  localStorage.setItem('dwellogs.place', inv.property_id);
  localStorage.setItem('dwellogs.new', inv.property_id);
  writes.push({ op:'upsert', table:'invite', record:{ ...live, state:'accepted',
    accepted_on:today(), accepted_by_id:personId } });
  if (inv.their_structure_id) {
    const st = (DB.structure || []).find(x => x.id === inv.their_structure_id);
    if (st) writes.push({ op:'upsert', table:'structure', record:{ ...st,
      responsible_id:personId, visibility:draft.share || 'presence_only' } });
  }
  (draft.animals || []).forEach(a => {
    const animalId = uid();
    writes.push({ op:'upsert', table:'animal', record:{ id:animalId, owner_id:personId,
      property_id:inv.property_id, name:a.name, type:a.type, role:'pet',
      cared_for_by_id:personId, acquired_on:'' } });
    writes.push({ op:'upsert', table:'placement', record:{ id:uid(), animal_id:animalId,
      property_id:inv.property_id, arrived_on:today(),
      note:'Came with ' + (draft.name || 'them') } });
  });
  await DwelLogs.write(writes);
}

/* A thing and the check-ups its template carries. Written three times over --
   once in the first-run setup, once on the Add screen, once for the well a
   systems answer implies -- and the three had already drifted: the Add screen
   was quietly dropping `muted`, `interval_source` and the on-arrival kind, so
   the same dishwasher got different check-ups depending on which screen you
   happened to add it from. One writer now.

   `typeIds` is for the first run only, where the catalogue is still sitting in
   the same unwritten batch and cannot be looked up yet. Everywhere else the
   catalogue is on the books and the name finds it. */
const typeNameOf = a => ((DB.asset_type || [])
  .find(t => t.id === a.asset_type_id) || {}).name || '';
function thingWrites(typeName, o) {
  o = o || {};
  let tid = (o.typeIds || {})[typeName]
    || ((DB.asset_type || []).find(x => x.name === typeName) || {}).id;
  const tmpl = Object.values(STARTER).flat().find(x => x[0] === typeName);
  if (!tmpl) return { id:null, writes:[], checks:0 };
  const id = uid(), writes = [];
  /* A type added to the catalogue after somebody's setup is not in their rows,
     and this returned nothing -- so counting one on the screen saved nothing
     and said nothing. Randi's own data (1 Oct export) had 19 types and no
     appliances, safety, power or cooling at all. Add what is missing instead. */
  if (!tid) {
    const cat = Object.keys(STARTER).find(c => STARTER[c].some(x => x[0] === typeName));
    let cid = ((DB.category || []).find(x => x.name === cat) || {}).id;
    if (!cid) { cid = uid(); writes.push({ op:'upsert', table:'category', record:{ id:cid, name:cat } }); }
    tid = uid();
    writes.push({ op:'upsert', table:'asset_type', record:{ id:tid, category_id:cid, name:typeName,
      source:(tmpl[1][0] || [])[3] || 'owner' } });
    /* Twice in one save -- three fridges -- must not make three types. */
    /* Marked as not saved yet. Without the mark, the account's save took these
       for rows it already had and sent only what had changed -- nothing -- so
       the new kind reached the database with no category (Pool, 5 Oct). */
    (DB.asset_type = DB.asset_type || []).push({ id:tid, category_id:cid, name:typeName, __pending:true });
    if (!(DB.category || []).some(x => x.id === cid)) (DB.category = DB.category || []).push({ id:cid, name:cat, __pending:true });
  }
  writes.push({ op:'upsert', table:'asset', record:{ id, property_id:o.propId || (prop || {}).id,
    structure_id:o.structId || '', asset_type_id:tid, area_id:o.areaId || '',
    parent_asset_id:o.parentId || '',
    name:o.name || typeName, status:'active', power_source:o.powered || '',
    installed_on:o.installed || '' } });
  tmpl[1].forEach(([title, n, unit, src, whenSource]) => {
    /* Her number beats the template's, and the row says so: interval_source
       becomes `owner`, so nothing downstream goes on claiming the manual said
       every three years when she said every two. */
    const ov = o.every ? o.every(typeName, title) : null;
    if (ov && unit !== 'arrival') { n = ov.n; unit = ov.unit; src = 'owner'; }
    const rec = { id:uid(), asset_id:id, title, responsibility:'owner', cost_source:'entered',
      /* Unticked does not mean deleted. The rule is still written, muted, so it
         can be turned back on without retyping and so the app never quietly
         forgets what a water heater needs. */
      muted: o.keep && !o.keep(typeName, title) ? 'TRUE' : '',
      interval_source:src, applies_when_source:(whenSource || []).join(', ') };
    // An arrival check-up has no date. It is due when she pulls up somewhere
    // new, and a made-up date would only make it look overdue in the meantime.
    if (unit === 'arrival') rec.kind = 'on_arrival';
    else {
      /* Every unit, not just the two the templates happened to use. This fell
         through to setFullYear for anything else, so the first check-up set to
         "every 2 weeks" came out due in 2028. Templates only ever said months
         and years, which is why it survived -- until the cadence became
         something a person could type. */
      Object.assign(rec, { kind:'interval', every_n:n, every_unit:unit,
        next_due_on:rollFrom(today(), n, unit) });
    }
    writes.push({ op:'upsert', table:'schedule', record:rec });
  });
  return { id, writes, checks:tmpl[1].length, rec:writes[0].record };
}

/* The rooms this draft describes, as area rows. Setup calls it with nothing on
   the books; the same screen reopened later calls it with rooms already there.
   So it is keyed by NAME and it only ever adds: reopening the rooms screen and
   pressing Done must not make a second Kitchen, and lowering a count is not a
   demolition order. Removing a room is its own decision, made on the room. */
function areaWrites(structId) {
  const out = [], byName = {};
  (DB.area || []).filter(a => a.structure_id === structId)
    .forEach(a => { byName[a.name] = a.id; });
  const add = rec => { if (byName[rec.name]) return null;
    byName[rec.name] = rec.id; out.push({ op:'upsert', table:'area', record:rec }); return rec.id; };
  (draft.spaces || []).forEach(k => {
    const def = SPACES.find(x => x[0] === k);
    if (!def || !def[2]) return;          // a slab is not a room you can stand in
    add({ id:uid(), structure_id:structId, name:AREA_NAME[k] || k, kind:def[2] });
  });
  ROOMS.forEach(r => {
    const n = (draft.rooms || {})[r[0]] || 0;
    for (let i = 1; i <= n; i++)
      add({ id:uid(), structure_id:structId,
        name:roomName(r) + (n > 1 ? ' ' + i : ''), kind:r[2] });
  });
  /* A room somebody named themselves is made exactly as typed, with no kind
     guessed for it. A wrong kind is worse than none.

     Parents go down before children, so the child has an id to point at. Two
     passes rather than a sort, because somebody types "Overhead storage" before
     they think to add the "Second floor" it is on, and the order they thought of
     things in is not a thing to hold against them. */
  const named = (draft.namedRooms || []).map(r => typeof r === 'string' ? { name:r } : r)
    .filter(r => r && r.name);
  named.filter(r => !r.parent).forEach(r =>
    add({ id:uid(), structure_id:structId, name:r.name }));
  named.filter(r => r.parent).forEach(r =>
    add({ id:uid(), structure_id:structId, name:r.name,
      parent_area_id: byName[r.parent] || '' }));
  return out;
}

/* The whole point of starting empty: this is every table a new person touches,
   and therefore the v1 core. Nine of them. */
async function createEverything() {
  // Joining is not setting up. It creates no place, no building and no
  // check-ups — it attaches a person to somebody else's place and stops.
  if (flow === 'join') return acceptInvite();
  /* Whoever is signed in IS the person setting this up. Relying on
     draft.existingPerson alone missed every route into this flow except
     "Add a place", and each of those wrote a new owner with the same name. */
  if (me && !draft.existingPerson) draft.existingPerson = me.id;
  const personId = draft.existingPerson || uid(), propId = uid(), structId = uid();
  const writes = [];
  if (me && draft.existingPerson === me.id && draft.name && draft.name !== me.name)
    writes.push({ op:'upsert', table:'person', record:{ ...me, name:draft.name } });
  if (!draft.existingPerson)
    writes.push({ op:'upsert', table:'person', record:{ id:personId, name:draft.name, role:'owner' } });
  writes.push(
    { op:'upsert', table:'property', record:{ id:propId, name:draft.place, kind:draft.kind,
        region:draft.region, postcode:draft.postcode || '', country:draft.country || 'United States',
        currency:'USD', units:'imperial', acquired_on:today(),
        climate:(draft.climate || []).join(', '), freezes:draft.freezes || 'not_sure_yet',
        hazards:(draft.hazards || []).join(', '),
        terrain:(draft.terrain || []).join(', '),
        elevation: draft.elevation == null ? '' : draft.elevation,
        /* Confirmed only when a person actually said so. Unknown gets a date to
           be asked again, not a blank that nags every time the app opens.

           It used to turn on `freezes` -- and freezes is one of the fields the
           region GUESS fills in, so the guess confirmed itself. Type a state,
           never scroll down, leave: three hazards on the record and a date
           saying somebody agreed to them. `profileTouched` is the only value
           here that means a person went near the screen. */
        profile_confirmed_on:
          draft.profileTouched && draft.freezes !== 'not_sure_yet' ? today() : '',
        profile_review_on:
          draft.profileTouched && draft.freezes !== 'not_sure_yet' ? '' : inMonths(4) } },
    { op:'upsert', table:'membership', record:{ id:uid(), property_id:propId,
        person_id:personId, access:'owner' } });
  // Nothing on it yet means no building row. An empty lot with a phantom
  // "Main house" on it is a lie the app would then keep asking questions about.
  const bare = ['land','lot'].includes(draft.pkind);
  if (!bare)
    writes.push({ op:'upsert', table:'structure', record:{ id:structId, property_id:propId,
      name:draft.building,
      kind: draft.bkind === '__other' ? 'other' : draft.bkind,
      kind_other: draft.bkindOther || '' } });

  const moreIds = [];
  (draft.more || []).forEach((b, i) => {
    const id2 = uid(); moreIds[i] = id2;
    writes.push({ op:'upsert', table:'structure', record:{ id:id2, property_id:propId,
      name:b.name, kind: b.kind === '__other' ? 'other' : b.kind,
      attached_to_id: b.attached ? structId : '',
      // Opt-in, not opt-out. Somebody else's building starts closed and they
      // open it, rather than starting open and hoping they notice.
      visibility: b.theirs ? 'presence_only' : 'shared' } });
  });

  // Templates ship with the app, written once into this property's catalogue.
  const catIds = {}, typeIds = {};
  Object.entries(STARTER).forEach(([cat, list]) => {
    const cid = catIds[cat] = uid();
    writes.push({ op:'upsert', table:'category', record:{ id:cid, name:cat } });
    list.forEach(([tname, checks]) => {
      const tid = typeIds[tname] = uid();
      writes.push({ op:'upsert', table:'asset_type',
        record:{ id:tid, category_id:cid, name:tname, source:(checks[0] || [])[3] || 'owner' } });
    });
  });

  // The systems answers land in TWO places on purpose. The structure field is a
  // fact about the building — "city water" is true and creates nothing to
  // service. The asset is a thing with a maintenance life. Neither is derivable
  // from the other, so both get written, and an unanswered question writes
  // 'not_sure_yet' rather than a default nobody chose.
  const sys = draft.sys || {};
  const structRec = (writes.find(w => w.table === 'structure') || { record:{} }).record;
  SYSTEMS.forEach(q => {
    const v = sys[q.k];
    const vt = withTyped(q, v, '');
    structRec[q.k] = vt == null || (q.multi && !vt.length) ? 'not_sure_yet' : (q.multi ? vt.join(', ') : vt);
  });
  structRec.spaces = (draft.spaces || []).join(', ');
  structRec.visibility = 'shared';   // the one you set up is your own
  structRec.people_living = draft.people == null ? '' : draft.people;
  structRec.children_here = draft.kids || '';
  structRec.heated = (sys.heat || []).some(h => h !== 'none') ? 'TRUE' : '';

  // Areas first, so a thing can land in one.
  areaWrites(structId).forEach(w => writes.push(w));

  // One asset per thing, each carrying its template's check-ups.
  const made = [];
  function addThing(typeName, name, powered, allowMore, areaId) {
    if (!typeIds[typeName]) return null;
    // Ticking the dryer on one screen and naming it as the problem on the next
    // is ONE dryer. If the second mention brought a better name, keep the name
    // and drop the duplicate — never end the first run with two of a thing
    // somebody owns one of.
    if (!allowMore) {
      const already = made.find(m => m.type === typeName);
      if (already) { if (name) already.rec.name = name; return already.rec.id; }
    }
    const t = thingWrites(typeName, { typeIds, propId, structId, areaId, powered,
      name: name || typeName, keep:picked, every:everyFor });
    t.writes.forEach(w => writes.push(w));
    made.push({ type:typeName, rec:t.rec });
    return t.id;
  }
  SYSTEMS.forEach(q => {
    const v = sys[q.k]; if (!v) return;
    const picked = q.multi ? v : [v];
    picked.forEach(val => {
      const o = q.o.find(x => x[0] === val); if (!o) return;
      o[2].forEach(tn => addThing(tn, null, q.k === 'heat' ? val : ''));
    });
  });
  /* The other buildings answered for themselves. Their answers go on their own
     rows, and what those answers imply -- a holding tank, a heater under the
     sink -- is made against that building rather than thrown on the house. The
     dedupe is per building on purpose: two buildings really do have two water
     heaters, and the one thing nobody has is two of them in the same shed. */
  (draft.more || []).forEach((b, i) => {
    const own = b.sys || {};
    const typedHere = Object.keys(draft.other || {}).some(k => k.endsWith('#' + i));
    if ((!Object.keys(own).length && !typedHere) || !moreIds[i]) return;
    const rec2 = (writes.find(w => w.table === 'structure'
      && w.record.id === moreIds[i]) || {}).record;
    if (!rec2) return;
    const g2 = kgroup(b.kind);
    SYSTEMS.filter(q => !(q.off || []).includes(g2)).forEach(q => {
      const v = withTyped(q, own[q.k], '#' + i);
      rec2[q.k] = v == null || (q.multi && !v.length) ? 'not_sure_yet' : (q.multi ? v.join(', ') : v);
    });
    rec2.heated = (own.heat || []).some(h => h !== 'none') ? 'TRUE' : '';
    const seen = new Set();
    SYSTEMS.forEach(q => {
      const v = own[q.k]; if (!v) return;
      (q.multi ? v : [v]).forEach(val => {
        const o = q.o.find(x => x[0] === val); if (!o) return;
        o[2].forEach(tn => {
          if (seen.has(tn)) return; seen.add(tn);
          thingWrites(tn, { typeIds, propId, structId:moreIds[i],
            powered: q.k === 'heat' ? val : '', keep:picked })
            .writes.forEach(w => writes.push(w));
        });
      });
    });
  });
  if (draft.parkedAt || draft.stayKind || Object.values(draft.here || {}).some(v => v.length))
    writes.push({ op:'upsert', table:'placement', record:{ id:uid(), structure_id:structId,
      property_id:propId, address:draft.parkedAt || '', arrived_on:today(),
      stay_kind:draft.stayKind || 'not_sure_yet',
      water:(draft.here.water || []).join(', '), waste:(draft.here.waste || []).join(', '),
      power:(draft.here.power || []).join(', ') } });

  (draft.household || []).forEach(name =>
    writes.push({ op:'upsert', table:'person', record:{ id:uid(), name, role:'resident' } }));
  (draft.animals || []).forEach(a => {
    const animalId = uid();
    writes.push({ op:'upsert', table:'animal', record:{ id:animalId, property_id:propId,
      name:a.name, type:a.type, role:'pet', acquired_on:'' } });
    writes.push({ op:'upsert', table:'placement', record:{ id:uid(), animal_id:animalId,
      property_id:propId, arrived_on:today() } });
  });

  // Counts, so three fridges are three rows. Each gets its own check-ups,
  // because the one in the garage and the one in the kitchen do not share a
  // filter change.
  /* Areas are already in `writes` by now, so their generated ids can be found
     by the name the picker offered. Names are unique within a plan. */
  const areaByName = {};
  writes.forEach(w => { if (w.table === 'area') areaByName[w.record.name] = w.record.id; });

  const units = {}, perRoom = {};
  Object.entries(draft.things || {}).forEach(([tn, n]) => {
    for (let i = 1; i <= n; i++) {
      const room = n > 1 ? ((draft.where || {})[tn + '#' + i] || '') : '';
      let nm;
      if (room) {
        /* Named after where it is, which is how she says it out loud. Two in
           the SAME room still need telling apart, so those keep a number. */
        const c = perRoom[tn + '|' + room] = (perRoom[tn + '|' + room] || 0) + 1;
        nm = room + ' ' + tn.toLowerCase() + (c > 1 ? ' ' + c : '');
      } else nm = n > 1 ? tn + ' ' + i : tn;
      const id = addThing(tn, nm, '', true, room ? (areaByName[room] || '') : '');
      if (id) units[tn + '#' + i] = id;
    }
  });
  made.forEach(m => { if (!units[m.type + '#1']) units[m.type + '#1'] = m.rec.id; });

  /* ONE table now. "Clean the gutters this week" and "the dryer works sometimes"
     are the same row with a different kind, which is the whole point of the
     merge: they end up on the same board, opened by the same screen, and the
     person can change their mind about which it is by editing one field.
     The asset is guessed from the words and never demanded. */
  (draft.jobs || []).forEach(j => {
    const key = guessThing(j.title);
    const fault = j.kind === 'fault';
    const jid = uid();
    let schedId = '';
    /* A repeat set during setup is the same rule the job screen would make, so
       the very first "mark it done" rolls it forward and puts the next one on
       the list. Without this the repeat would have been a note to nobody. */
    if (j.rep === 'yes') {
      schedId = uid();
      writes.push({ op:'upsert', table:'schedule', record:{ id:schedId,
        asset_id: key ? (units[key] || '') : '', structure_id:structId, title:j.title,
        kind: j.answer === 'reading' ? 'reading' : 'interval',
        every_n: j.every_n || 6, every_unit: j.every_unit || 'month',
        /* NOT `|| today()`. Saying a thing repeats is not saying when it is
           first wanted, and filling that in for them makes the app produce a
           date nobody chose -- which reads as late the following morning. An
           undated rule sits under "No date" until it is dated or done once;
           doing it once is what anchors "every six months" anyway. */
        next_due_on: j.due_on || '' } });
    }
    writes.push({ op:'upsert', table:'job', record:{ id:jid, property_id:propId,
      kind: j.kind || 'task', title:j.title, notes:j.notes || '',
      source:'owner', status:'open', schedule_id:schedId,
      asset_id: key ? (units[key] || '') : '', structure_id:structId,
      start_on: j.start_on || '', due_on: j.due_on || '',
      est_minutes: j.est_minutes || '', est_cost: j.est_cost || '',
      prerequisites: j.prerequisites || '', safety: j.safety || 'none',
      first_seen_on: fault ? today() : '',
      state: fault ? (j.state || 'degraded') : '',
      workaround: fault ? (j.workaround || '') : '',
      reported_on: fault ? (j.reported_on || '') : '',
      reply: fault ? (j.reply || '') : '',
      now:  j.kind === 'improvement' ? (j.now  || '') : '',
      want: j.kind === 'improvement' ? (j.want || '') : '',
      slot: (!fault && !j.due_on) ? 'this_week' : '',
      column: fault ? 'investigating' : 'todo' } });
    (j.steps || []).forEach((st, n) => writes.push({ op:'upsert', table:'step',
      record:{ id:uid(), job_id:jid, text:st.text, position:n + 1,
               done: st.done ? 'TRUE' : '' } }));
  });

  // What nothing on our lists could say. One row per word, counted, and never
  // promoted without a person reading it.
  // Each typing carries WHERE it was typed, because that is the part that cannot
  // be reconstructed later and the part that decides the answer. "Forty people
  // asked for a cistern" and "thirty-eight of them are on boats" are different
  // findings, and only the second says where to put it. The tally across rows
  // is the server's job; the client only ever reports its own one.
  const ctxKind = draft.bkind === '__other' ? (draft.bkindOther || 'other') : draft.bkind;
  const ctxGroup = kgroup(draft.bkind);
  const suggest = (obj, field, typed) => writes.push({ op:'upsert', table:'suggestion',
    record:{ id:uid(), object:obj, field, typed, normalised:typed.toLowerCase().trim(),
      property_id:propId, count:1, context_kind:ctxKind, context_group:ctxGroup,
      by_kind:ctxKind + ':1', first_seen_on:today(), last_seen_on:today(), status:'new' } });
  Object.entries(draft.other || {}).forEach(([k, typed]) => {
    const [obj, field] = k.split('.'); suggest(obj, String(field).split('#')[0], typed);
  });
  if (draft.bkindOther) suggest('structure', 'kind', draft.bkindOther);
  /* One row per room typed. draft.other keeps a single value per key, so
     routing these through it meant the second room quietly erased the first. */
  (draft.namedRooms || []).forEach(nm => suggest('area', 'kind', nm));

  await DwelLogs.write(writes);
  return { propId, structId };
}

const byId = t => Object.fromEntries((DB[t] || []).map(r => [r.id, r]));
function schedules() {
  const A = byId('asset');
  /* Code.gs already skips muted rules when it builds the digest; the home
     screen was still listing them, which would have made unticking look like
     it did nothing. */
  const isMuted = s => s.muted === true || String(s.muted).toUpperCase() === 'TRUE';
  // A check-up for several things names them all, from its open task (8 Oct).
  const J = {}; (DB.job || []).forEach(j => { if (j.schedule_id && OPEN_STATUS.includes(String(j.status || 'open')) && j.status !== 'archived') J[j.schedule_id] = j; });
  const many = j => j && (DB.job_also || []).some(x => x.job_id === j.id && x.status !== 'archived');
  return (DB.schedule || []).filter(s => s.status !== 'archived' && !isMuted(s)).map(s => {
    const d = daysTo(s.next_due_on);
    return { ...s, thing: many(J[s.id]) ? jobAbout(J[s.id]) : (A[s.asset_id] || {}).name || '—', d,
      state: d == null ? 'ok' : d <= 0 ? 'attn' : d <= 14 ? 'soon' : 'ok' };
  }).sort((a, b) => (a.d ?? 1e6) - (b.d ?? 1e6));
}

   The line on the site is drawn by hand. This one is drawn by YOUR HOUSE: one
   motif per thing you track, in the order you added them, with its height set
   by how close that thing is to needing you. Two people never get the same
   line, and yours changes as the place does — which is the whole idea, a pulse
   being a reading rather than a decoration.

   The motifs are the same visual language as the site: a baseline with events
   on it, some borrowed from a heart trace and some from the thing itself. A
   well gets a pump curve. A septic tank gets a square wave. Anything that
   burns gets a flame spike. */

/* How soon the most pressing thing under it wants you. */
function subjState(kind, id) {

async function saveSupply(id, forKind, forId) {

  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  await boot();
  const [k, i] = supplyFor(rec);

}

/* Moving a thing. A fridge carried out to the ADU is the SAME fridge -- same
   age, same filter history, same warranty -- and an app that answers "moved" by
   making you delete one and add another throws all of that away and calls it
   tidying.

   So a move is two writes and no deletions: the thing points somewhere new, and
   `placement` gets a row saying when it arrived, with the old row closed off.
   That table has carried `arrived_on` and `left_on` since the beginning and has
   been waiting for a screen. Where it used to be stays true, because it was. */
function drawThingTo(kind, id) {
  const row = subjRow(kind, id); if (!row) return show('home');
  const places = buildings();
  hideTabs();
  const now = row.structure_id
    ? ((DB.structure || []).find(x => x.id === row.structure_id) || {}).name : null;
  app.innerHTML = `<button class="back" onclick="subject('${kind}','${id}')">&lsaquo; Back</button>
    <h1>Where is ${esc(subjName(kind, id))} now?</h1>

      esc(String(SUBJECT[kind].what(row) || 'thing').toLowerCase())} &mdash;

    <label for="mv-s">Which building?</label>
    <select id="mv-s" onchange="moveAreas()">
      <option value="">Nowhere in particular</option>

        >${esc(x.name)}</option>`).join('')}</select>

    <div id="mv-arw"><label for="mv-a">Which room or area
        <span style="font-weight:400;color:var(--muted)">&mdash; optional</span></label>

    <div class="actions">

    </div>`;
  moveAreas(row.area_id);
}
function moveAreas(sel) {
  const box = $('#mv-a'); if (!box) return;
  const mine = (DB.area || []).filter(a => a.structure_id === $('#mv-s').value
    && a.status !== 'archived');
  box.innerHTML = `<option value="">Somewhere in the building</option>`
    + mine.map(a => `<option value="${a.id}"${sel === a.id ? ' selected' : ''}
      >${esc(a.name)}</option>`).join('');

}
async function saveThingTo(kind, id) {
  const row = subjRow(kind, id), table = SUBJECT[kind].table;
  const stId = $('#mv-s').value, arId = ($('#mv-a') || {}).value || '';
  const when = $('#mv-d').value || today();
  if (stId === row.structure_id && arId === (row.area_id || ''))
    return say('That is where it already is.');
  const writes = [{ op:'upsert', table, record:{ ...row, structure_id:stId, area_id:arId } }];
  // Close the stay it was on rather than editing it: where it used to be is a
  // fact that stays true, and a history you can rewrite is not a history.
  const open = (DB.placement || []).find(pl => pl[SUBJECT[kind].fk] === id && !pl.left_on);
  if (open) writes.push({ op:'upsert', table:'placement',
    record:{ ...open, left_on:when } });
  /* Nothing writes a placement when a thing is first added -- a row per asset
     saying "it is where it is" earns nothing. So the first move is also where
     the old stay gets written down, backdated to whatever we honestly know: the
     day it was installed, or blank, which reads as "it was there, we never knew
     since when". Better than losing that it was ever in the house. */
  else if (row.structure_id) writes.push({ op:'upsert', table:'placement',
    record:{ id:uid(), property_id:(prop || {}).id, structure_id:row.structure_id,
      area_id:row.area_id || '', [SUBJECT[kind].fk]:id,
      arrived_on:row.installed_on || row.acquired_on || '', left_on:when } });
  const fresh = { id:uid(), property_id:(prop || {}).id, arrived_on:when,
    structure_id:stId || '', area_id:arId };
  fresh[SUBJECT[kind].fk] = id;
  writes.push({ op:'upsert', table:'placement', record:fresh });
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  await boot(); subject(kind, id);
  const to = stId ? ((DB.structure || []).find(x => x.id === stId) || {}).name : 'nowhere in particular';
  say('Moved to ' + to + '. Everything it has needed came with it.');
}

/* Same one, or its own? Asked only when the answer is genuinely unknown to the
   app -- the place already has one of these and this building has just said it
   has one too. Sharing records a hookup, which is what `hookup` is for: what a
   building is ACTUALLY connected to, asked and never assumed. Its own makes a
   second thing with its own check-ups, which is right for two wells and wrong
   for one well and a long pipe.

   Not sure yet is the default and it writes neither, because the systems answer
   on the building is already true and saved -- the ADU has a holding tank
   either way. Only whose it is stays open. */
let SHARE_ASK = null;
const HOOKUP_UTIL = { water:'water', waste:'sewer_septic', power:'electric',
  heat:'heat', hot_water:'hot_water', cooling:'cooling' };
function drawShare() {
  const { stId, pending } = SHARE_ASK;
  const st = (DB.structure || []).find(x => x.id === stId) || {};
  hideTabs();
  app.innerHTML = `<h1>Same one, or its own?</h1>

/* Where to go once "same one, or its own?" is answered: on to the building
   she asked for, or back to wherever the screen came from. */
function afterShare(then) {
  if (then && then.goTo) return reopen(then.stepId, then.goTo);
  if (CATCH_PENDING.length) { CATCH_BACK = STEP_FROM; STEP_FROM = null; return drawCatchUp(CATCH_PENDING.splice(0)); }
  leaveStep();
}
async function saveShare() {
  const { stId, pending, then } = SHARE_ASK;
  const st = (DB.structure || []).find(x => x.id === stId) || {};
  const writes = [];
  let shared = 0, own = 0;
  pending.forEach((x, i) => {
    const pick = (document.querySelector(`input[name="sh-${i}"]:checked`) || {}).value;
    if (pick === 'share') {
      shared++;
      writes.push({ op:'upsert', table:'hookup', record:{ id:uid(), structure_id:stId,
        utility:HOOKUP_UTIL[x.sys] || x.sys, source_asset_id:x.other, started_on:today() } });
    } else if (pick === 'own') {
      own++;
      /* Named after where it is. Two called "Irrigation system" -- the garden's
         and the pool area's, which do not connect -- were the same line twice
         on every list, the problem "kitchen fire extinguisher" already solved. */
      const nm = uniqueName((st.name ? st.name + ' ' : '') + x.tn.toLowerCase(),
        (DB.asset || []).map(a => a.name).filter(Boolean));
      thingWrites(x.tn, { structId:stId, powered:x.powered, name:nm }).writes.forEach(w => writes.push(w));
    }
  });
  SHARE_ASK = null;
  if (!writes.length) { afterShare(then); return say('Left open.'); }
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  const after = AFTER_STEP, from = STEP_FROM;
  await boot(); AFTER_STEP = after; STEP_FROM = from; afterShare(then);
  const bits = [];
  if (shared) bits.push(shared === 1 ? 'one shared' : shared + ' shared');
  if (own) bits.push(own === 1 ? 'one of its own' : own + ' of its own');
  say('Noted — ' + bits.join(', ') + '.');
}

        <select id="pl-k">${[['','—'],['yes','yes'],['no','no'],['not_sure_yet','varies']]
          .map(([v, l]) => `<option value="${v}"${st.children_here === v ? ' selected' : ''}>${l}</option>`).join('')}</select>
      </div></div>
    
    <!-- Place-wide, not this building: under "Who lives in Guard House?" an

/* Names on the log, minus the account holders and the tradespeople. Setup
   wrote these from draft.household; after setup there is no draft, so the row
   is written straight out. */
function logPeople() {
  const mine = new Set((DB.membership || []).map(m => m.person_id));
  return (DB.person || []).filter(p =>
    p.role !== 'provider' && p.status !== 'archived' && !mine.has(p.id));
}
/* Adding a name redraws this screen from the database, so anything typed above
   and not yet saved would be gone -- type "3", add Dave, and the headcount you
   just typed is wiped by the redraw that shows him. So the count goes down in
   the same write. Nothing on this screen is lost by doing something else on it. */
function whoElseWrites(stId) {
  const st = (DB.structure || []).find(x => x.id === stId) || {};
  const v = (($('#pl-n') || {}).value || '').trim(), n = Number(v);
  return [{ op:'upsert', table:'structure', record:{ ...st,
    /* 0 is an answer -- a guest house nobody lives in. It used to be dropped
       as blank, so the guard house stayed on "still blank" for good. */
    people_living: v !== '' && Number.isFinite(n) && n >= 0 ? Math.floor(n) : '',
    children_here: (($('#pl-k') || {}).value) || '' } }];
}
/* Somebody already on the log, by name. Adding "Jared" twice made two Jareds,
   and both turned up under "Whose is it?" (Randi, 1 Oct). */
const personNamed = n => (DB.person || []).find(p => p.status !== 'archived'
  && String(p.name || '').trim().toLowerCase() === String(n || '').trim().toLowerCase());
async function addLogPerson(stId) {
  const v = ($('#hh-n').value || '').trim();
  if (!v) return say('A name, however you say it.');
  if (personNamed(v)) { $('#hh-n').value = ''; return say(v + ' is already on the list.'); }
  await DwelLogs.write(whoElseWrites(stId).concat(
    [{ op:'upsert', table:'person', record:{ id:uid(), name:v, role:'resident' } }]));
  await boot(); drawWhoElse(stId); say(v + ' is on the list.');
}
async function dropLogPerson(id, stId) {
  const name = ((DB.person || []).find(x => x.id === id) || {}).name;
  /* Archived, not deleted. Their name is on entries that already happened, and
     an entry that suddenly says nobody did it is a worse record than one
     naming somebody who has moved out. */
  await DwelLogs.write(whoElseWrites(stId).concat([{ op:'archive', table:'person', id }]));
  await boot(); drawWhoElse(stId); say(name ? name + ' taken off the list.' : 'Taken off.');
}
async function saveWhoElse(stId, goTo) {
  const added = ($('#hh-n').value || '').trim();
  const writes = whoElseWrites(stId);
  // Same rule as the setup steps: a name sitting in the box is an answer.
  if (added && !personNamed(added)) writes.push({ op:'upsert', table:'person',
    record:{ id:uid(), name:added, role:'resident' } });
  await DwelLogs.write(writes);
  const name = ((DB.structure || []).find(x => x.id === stId) || {}).name || 'That one';
  const from = FORM_FROM;
  await boot();
  if (goTo) { FORM_FROM = from; drawWhoElse(goTo); return say(name + ' saved.'); }
  formBack(added ? 'Noted — ' + added + ' is on the list.' : 'Noted.', from);
}
/* Offered, never forced, and never automatic. It is their spreadsheet: the app
   does not get to restructure it because it happened to open. Everything it
   does is additive, and it says exactly what it did. */
async function runMigrate() {
  say('Adding what is missing…');
  let r;
  try { r = await DwelLogs.migrate(); }
  catch (e) { return say('Could not update the sheet: ' + e.message); }
  const m = r.migrated || {};
  await boot();
  const bits = [];
  if ((m.added_tables || []).length) bits.push(m.added_tables.length + ' new tabs');
  if ((m.added_columns || []).length) bits.push(m.added_columns.length + ' new columns');
  if ((m.renamed || []).length) bits.push(m.renamed.length + ' carried over');
  say(bits.length ? 'Done — ' + bits.join(', ') + '. Nothing was removed.'
                  : 'Nothing to add. Your sheet was already current.');
}
function animalHint() {

/* Whose it is and where it lives are two questions, and they have different
   answers more often than you would think: the barn cat belongs to the place,
   the dog belongs to a person and leaves when they do. Asked, not inferred. */
/* Short, sayable over the phone, and not a word. */
function inviteCode() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // no O/0, no I/1
  return Array.from({length:6}, () => A[Math.floor(Math.random()*A.length)]).join('');

 "0.18.0", "on": "2026-10-05", "stamp": "362995ee84", "new": ["Home looks 30 days ahead, or 90, or everything: your choice at the top, and it remembers. Anything late always shows; the rest is one line that opens Jobs.", "Something broke, on Home, next to Add a job.", "On a thing's page: Something's wrong with it, a job about that thing in one tap.", "Slide a check-up left to Stop it reminding you: on Home, on Jobs and on a page's Comes round. It can be turned back on under Check-ups. Check-ups on a page slide right to Done too."], "fixed": ["Adding a thing of a kind your account did not have yet, like a pool, failed with an error about \"category_id\". It saves now.", "What kind of thing? is grouped, with what fits the building first: a pool area opens on Pool & spa.", "History on a building or a group puts the thing first and what was done under it, with dates as Oct 5 rather than 2026-10-05.", "Opening a building or a group starts on To do, not on whichever tab the last one was left on.", "Saving Rooms, What's in it or What it runs on goes back to the page you opened it from -- the barn, the coop -- not Home. Adding a thing does the same, by way of its check-ups.", "Buildings, and Rooms & things, leave out jobs about animals and vehicles. Deworming the cat showed under Buildings because the cat lives in the house.", "Waiting invites say what they let somebody do, and the date they stop working, in words.", "Adding an animal, Who lives here and Move it go back to the page you opened them from, on save or Cancel."], "gone": ["Parked for now, to get the basics right first: What it needs on a job, spares and Running low; Soonest, Quickest and Cheapest; the Costs tab; papers; the kind of job; parts of a thing; and Whose it is on a building. Nothing you saved is lost, and each comes back when it is needed."]}, {"version": "0.17.0", "on": "2026-10-05", "stamp": "e8fba74c7a", "new": ["Pools and hot tubs: the pool, its pump, filter, salt cell or chlorinator, cleaner, refi og said nothing about the invite. Home says so now, with Sign in."], "gone": ["The email box on your screen, unless your log is in a Google Sheet. It was for the digest, and only the Sheet sends one so far."]}, {"version": "0.12.0", "on": "2026-10-04", "stamp": "eb51df326e", "new": ["Invite somebody through your account: choose who it is for, what they can do, and the whole place or one building. Send the code by text or any app. They sign in with their own email, see what the invite offers, and accept -- arriving as the person already on your list, with what they have already done.", "Join with a code, from your screen, if you are already signed in and somebody invites you to another place."], "fixed": ["Save on a job no longer sits on the line below it.", "\"Also for\" on a job is one folded line, \"Also for other things…\", instead of a tick box for everything on the place. It opens by itself when something is ticked, or when you came from an animal's page and there are only a few others.", "Date boxes on an iPhone, like \"Good until\" on an invite, ran past the right edge of the screen. They fit now, with the date on the left like every other box."], "gone": ["\"They can see costs\" on an invite, until costs can actually be kept from somebody."]}, {"version": "0.11.0", "on": "2026-10-04", "stamp": "2b14b52e51", "new": ["The first screen leads with signing in: your email, then the code from the email. New or returning, it is the same step. Using it on this phone only is still there, with what that means said plainly.", "Signed in with no signal, everything is still there to look at and change. Changes wait on the phone and go up as soon as the signal comes back, even a bar of it. Home says how many are waiting.", "Put it on your home screen: the steps for your phone, on Home and on your screen, including Chrome on an iPhone and Android. On Android, an Install button when the phone offers one."], "fixed": ["Sign out goes back to the first screen, to sign in again /* ---- ordering work ------------------------------------------------------

   The job table's own note says what this is for: one table so a board can ask
   "what can I do this weekend with two hours and fifty dollars" across
   everything at once. That was the argument for collapsing four tables into
   one, and nothing had ever asked the question.

   Three orders, because there are three reasons somebody opens a list of work:
   it is overdue, I have an hour, or I have ten pounds.

   Blank is not zero, and this is where that matters most. Most jobs carry no
   estimate, and a "cheapest first" list that floats every unpriced job to the
   top on the grounds that nothing costs nothing would be a list that lies to
   you in the direction you most want to believe. Unknowns sort LAST in every
   order and say so on the card. */

function jobMetric(j, mode) {

  if (mode === 'cost') return numOr(j.est_cost);
  return j.due_on ? daysTo(j.due_on) : null;
}
function orderJobs(list, mode) {
  mode = mode || JOB_ORDER;

  const within = j => {
    if (cap.mins != null) { const m = numOr(j.est_minutes); if (m == null || m > cap.mins) return false; }
    if (cap.cost != null) { const c = numOr(j.est_cost); if (c == null || c > cap.cost) return false; }
    return true;
  };
  return list.filter(within).slice().sort((a, b) => {
    const x = jobMetric(a, mode), y = jobMetric(b, mode);
    if (x == null && y == null) return 0;
    if (x == null) return 1;            // unknown goes last, never first
    if (y == null) return -1;
    return x - y;
  });
}
/* What the card should say, given what the list is sorted by. */
const doneOn = j => j.done_on || ((DB.completion || []).find(c => c.job_id === j.id) || {}).done_on || '';
function jobMeta(j, mode) {
  const n = jobLines(j).length;

  return jobMeta1(j, mode);

/* ---- the subject screen -------------------------------------------------

   Every thing in here is the same shape from a distance: it is somewhere, it
   has work against it, it holds other things, it has cost money and it has a
   past. A room, a dishwasher, a goat, a car, a building, a person. Writing that
   screen seven times is writing the same drift seven times -- the Add screen
   and the setup screen had already disagreed about what a check-up is, and
   those were only two copies of something much smaller.

   So: one renderer, and a table of what actually differs. What differs turns
   out to be three things -- the column other tables use to point at it, the
   words for what it is, and what it holds. Everything else is shared.

   The FK is the whole trick. `job` carries asset_id, area_id, structure_id,
   animal_id, vehicle_id and property_id; so do schedule, completion, reading,

    what: () => 'Place',

  structure: { table:'structure', fk:'structure_id', icon:'buildings',
    what: st => kindLabel(st.kind) || 'Building',
    holds: ['area','asset','animal','vehicle'] },
  area: { table:'area', fk:'area_id', icon:'rooms',
    what: a => (a.kind || 'Room').replace(/_/g, ' '),
    holds: ['area','asset','animal','vehicle'] },
  asset: { table:'asset', fk:'asset_id', icon:'things',
    what: a => ((DB.asset_type || []).find(t => t.id === a.asset_type_id) || {}).name || 'Thing',
    holds: ['asset'] },
  animal: { table:'animal', fk:'animal_id', icon:'animal',
    what: a => typeLabel(a.type), holds: [] },
  vehicle: { table:'vehicle', fk:'vehicle_id', icon:'things',
    what: v => [v.year, v.make, v.model].filter(Boolean).join(' ')
      || (v.kind || 'vehicle').replace(/_/g, ' '), holds: [] },
  /* A person is the one subject nothing points at with a matching *_id: work
     reaches them through owner_id and claimed_by_id, which is two columns and a
     different question -- "meant for" is not "did". Handled where it differs,
     shared everywhere else. */

    what: p => (p.role || '').replace(/_/g, ' ') || 'Person', holds: [] }

const subjRow = (kind, id) => ((DB[(SUBJECT[kind] || {}).table] || []).find(r => r.id === id) || null);
const subjName = (kind, id) => {
  const r = subjRow(kind, id); if (!r) return '';
  return r.name || (SUBJECT[kind].what(r) || '').replace(/^./, c => c.toUpperCase());
};
/* Rows of `table` that sit inside this subject. Areas are the exception worth

   floor and not the storage -- otherwise the list is flat and the nesting you
   just described is nowhere on screen. */

  const live = (DB[child] || []).filter(r => r.status !== 'archived' && r.id !== id);
  if (child === 'area') {

    if (kind === 'structure') return live.filter(r => r.structure_id === id && !r.parent_area_id);
    return [];

/* Everything underneath a subject. A task list that shows only what points at

const stepWhere = st => ((DB.area || []).find(x => x.id === st.area_id) || {}).name

/* The work anywhere under here -- including a round that merely STOPS here. A

  const jobIds = new Set(jobsUnder(kind, id).map(j => j.id));

    return ((DB.supply || []).find(x => x.id === i) || {}).name || '';
  };
  const about = r => { const f = SUBJ_FKS.find(x => r[x]); return f ? name(r[f]) : ''; };
  const who = i => ((DB.person || []).find(p => p.id === i) || {}).name || '';
  const out = [];
  (DB.completion || []).filter(mine).forEach(c => out.push({

    job:c.job_id || '' }));

    id:r.id, kind:'read', on:r.taken_on, what:r.what || 'Reading', about:about(r),
    by:who(r.by_person_id),

/* What it has cost, anywhere under here. Same walk as the work, because the

    if (seen.has(c.id)) return;

   (docs/no-scorekeeping.md, Money -- decided 5 Oct). */
const paidBy = c => c.cost && c.paid_by_id && (!me || c.paid_by_id !== me.id)
  ? 'paid by ' + (((DB.person || []).find(p => p.id === c.paid_by_id) || {}).name || 'somebody else') : '';

/* Work pointing at this subject. A person's is the work they hold or were
   meant for; everything else is the column with its name on it. */
function subjJobs(kind, id) {
  const open = j => j.status !== 'done' && j.status !== 'archived';
  if (kind === 'person')
    return (DB.job || []).filter(j => j.claimed_by_id === id || j.owner_id === id);
  const fk = SUBJECT[kind].fk;
  const also = new Set((DB.job_also || []).filter(a => a.status !== 'archived' && a[fk] === id).map(a => a.job_id));
  return (DB.job || []).filter(j => j[fk] === id || also.has(j.id));
}
/* What it has cost. Some subjects are named on a completion directly; the rest
   reach money through the jobs that were done on them. Both, never twice --
   a completion naming the dishwasher AND the job on the dishwasher is one
   payment, and counting it twice would make the screen a liar about the only
   number on it nobody can check by eye. */
function subjSpend(kind, id) {
  const fk = SUBJECT[kind].fk, seen = new Set(), out = [];
  const take = c => { if (!c || seen.has(c.id)) return; seen.add(c.id); out.push(c); };
  if (fk && (DB.completion || []).some(c => fk in c))
    (DB.completion || []).filter(c => c[fk] === id).forEach(take);
  const jobs = new Set(subjJobs(kind, id).map(j => j.id));
  (DB.completion || []).filter(c => jobs.has(c.job_id)).forEach(take);
  return out;
}
const money = v => {
  const n = Number(v);
  return Number.isFinite(n) && n ? n.toLocaleString(undefined,
    { style:'currency', currency:((prop || {}).currency || 'USD'),
      maximumFractionDigits:0 }) : '';
};
/* Where it is, from the inside out. Each step is tappable, because "which
   building was that room in" is a question you ask by wanting to go there. */
function subjWhere(kind, row) {
  const out = [];
  let a = kind === 'area' ? (DB.area || []).find(x => x.id === row.parent_area_id)
        : row.area_id ? (DB.area || []).find(x => x.id === row.area_id) : null;
  let guard = 0;
  while (a && guard++ < 6) {
    out.push(['area', a.id, a.name]);
    a = (DB.area || []).find(x => x.id === a.parent_area_id);
  }
  const stId = kind === 'structure' ? row.attached_to_id : row.structure_id;
  const st = stId && (DB.structure || []).find(x => x.id === stId);
  if (st) out.push(['structure', st.id, st.name]);
  if (kind !== 'property' && prop) out.push(['property', prop.id, prop.name]);
  /* On a place that is one building, the house is named after the place, so the
     chain comes out "Home > Home". Saying it twice is not more information. */
  return out.filter((x, i) => !i || x[2] !== out[i - 1][2]);
}

let SUBJ_TAB = 'todo', SUBJ_Q = '', SUBJ_SORT = 'date', SUBJ_WIN = 'all';
/* Every page has the same frame (decided 7 Oct): Back, then what this page is
   on the left and you on the right; then what is in it, as tiles; then its
   tasks. The bottom bar is under all of it. */
function pageHead(title, step, back) {
  return `<button class="back" onclick="${back}">&lsaquo; Back</button>
    ${step ? `<p class="step">${esc(step)}</p>` : ''}
    <div class="homehead"><h1 style="margin:0">${esc(title)}</h1>
      <button class="who" onclick="drawMe()">${icon('person', 18)}<span>${esc((me || {}).name || '')}</span></button></div>`;
}
/* Where a thing is, in words -- "Kitchen, House" -- which is what its tile
   says under its name. Saying what it is again told you nothing (7 Oct: "I
   should see where it is, otherwise there is no context"). */
const whereWords = (k, r) => subjWhere(k, r).filter(x => x[0] !== 'property').map(x => x[2]).join(', ');
const kindIcon = (k, r) => k === 'animal' ? (ICON[r.type] ? r.type : 'animal')
  : k === 'structure' ? (ICON[r.kind] ? r.kind : 'house')
  : k === 'area' ? 'rooms' : k === 'vehicle' ? ({ car:'car', suv:'car', van:'car', golf_cart:'car', bus:'truck', truck:'truck',
      motorcycle:'motorcycle', atv:'atv', utv:'atv', tractor:'tractor', trailer:'trailer', mower:'mower', snowblower:'mower' }[r.kind] || 'car') : 'things';
const isLeaf = (k, r) => k === 'animal' || (k === 'structure' && kgroup(r.kind) === 'land');
function itemTile(k, r, showWhere, skipId) {
  const jobs = jobsUnder(k, r.id).filter(openJob);
  const late = jobs.some(j => { const d = daysTo(j.due_on); return d != null && d < 0; });
  const sub = showWhere ? subjWhere(k, r).filter(x => x[0] !== 'property' && x[1] !== skipId).map(x => x[2]).join(', ') : '';
  return `<button type="button"${isLeaf(k, r) ? ' class="leaf"' : ''} onclick="subject('${k}','${r.id}')">${icon(kindIcon(k, r), 26)}
    <span class="cap">${esc(subjName(k, r.id))}${sub ? `<br><span class="meta">${esc(sub)}</span>` : ''}${
      jobs.length ? `<br><span class="chip ${late ? 'attn' : 'ok'}">${jobs.length} to do</span>` : ''}</span></button>`;
}
const addTile = (label, go) => `<button type="button" class="addtile" onclick="${go}"><span class="plus" aria-hidden="true">+</span>
  <span class="cap">${esc(label)}</span></button>`;
/* Any list folds up when its heading is tapped, and stays as you left it
   (8 Oct: "can we collapse lists?"). Links on the heading still work. */
const folded = (k, shut) => { try { const v = localStorage.getItem('dwellogs.fold.' + k); return v ? v === '1' : !!shut; } catch (e) { return !!shut; } };
function keepFold(el) { try { localStorage.setItem('dwellogs.fold.' + el.dataset.k, el.open ? '0' : '1'); } catch (e) {} }
const fold = (k, title, inner, right = '', shut) => `<details class="fold" data-k="${esc(k)}"${folded(k, shut) ? '' : ' open'} ontoggle="keepFold(this)">
  <summary class="listhead"><h2>${esc(title)}</h2>${right}</summary>${inner}</details>`;
const foldTasks = (k, tabs, inner) => fold(k, 'Tasks', inner,
  tabs.replace(/^\s*<div class="listhead"><h2>Tasks<\/h2>/, '').replace(/<\/div>\s*$/, ''));
const tileSect = (title, tiles) => fold('t.' + title, title, `<div class="pick tiles3">${tiles}</div>`);
/* One thing, and the four questions somebody actually arrives with: where did I
   leave off, what is next, what am I doing, and what does it need before I can
   start. Two tabs because those are two different jobs -- To do is a list you
   act on, History is the same records with the inputs taken off. */
function subject(kind, id, tab) {
  LAST_VIEW = () => subject(kind, id, tab);
  const def = SUBJECT[kind]; if (!def) return show('home');
  const row = subjRow(kind, id); if (!row) return show('home');
  hideTabs();
  const last = SUBJ_TRAIL[SUBJ_TRAIL.length - 1];
  /* A different page opens on To do (5 Oct: it kept whichever tab the last
     one was left on, so a building opened on History). Following the money
     down passes its tab. */
  if (!last || last[0] !== kind || last[1] !== id) { SUBJ_TRAIL.push([kind, id]); SUBJ_Q = ''; SUBJ_TAB = 'todo'; }
  if (SUBJ_TRAIL.length > 20) SUBJ_TRAIL.shift();
  if (tab) SUBJ_TAB = tab;
  const here = `subject('${kind}','${id}')`;
  const name = subjName(kind, id);
  const all = jobsUnder(kind, id), open = all.filter(openJob);
  const past = historyUnder(kind, id);
  const where = subjWhere(kind, row).filter(x => x[2] !== name);
  const has = t => (DB[t] || []).filter(r => def.fk && r[def.fk] === id);
  const papers = has('document'), stock = has('supply');
  const rules = has('schedule').filter(r => r.muted !== 'TRUE');
  const q = SUBJ_Q.toLowerCase();
  const hit = (...bits) => !q || bits.filter(Boolean).join(' ').toLowerCase().includes(q);

  const sect = (title, body, add) => !body && !add ? '' :
    `${title ? `<h2 style="margin-top:1.6rem">${esc(title)}</h2>` : ''}${body || ''}${add || ''}`;

  /* Before you can start. Prose in `prerequisites` cannot be checked against
     anything; the rest can, and saying "waiting on Dave" or "no filter on the
     shelf" on the card is the difference between a list and a plan. */
  const blockers = j => {
    const out = [];
    if (j.blocked_on_person_id) out.push('waiting on '
      + (((DB.person || []).find(p => p.id === j.blocked_on_person_id)) || {}).name || 'somebody');
    if (j.depends_on_id) { const d = jobById(j.depends_on_id);
      if (d && openJob(d)) out.push('after ' + (d.title || 'another task')); }
    (DB.job_supply || []).filter(x => x.job_id === j.id).forEach(x => {
      const sp = (DB.supply || []).find(y => y.id === x.supply_id); if (!sp) return;
      const have = Number(sp.on_hand), need = Number(x.how_many) || 1;
      if (!Number.isFinite(have) || have < need) out.push('needs ' + sp.name);
    });
    if (j.needs_decision) out.push('a decision first');
    return out;
  };
  const jobCard = j => {
    const at = JOB_AT.map(([k2, f]) => [k2, j[f]]).find(([, v]) => v);
    const shared = alsoOf(j.id).length > 0;
    const about = at && (at[1] !== id || shared) ? jobAbout(j) : '';
    const stop = blockers(j);
    /* A round that merely calls here is not ABOUT here, and saying so is the
       difference between "water the greenhouse" and "watering comes through". */
    const via = !at || at[1] !== id
      ? (DB.step || []).find(st => st.job_id === j.id
          && (st.area_id === id || st.structure_id === id)) : null;
    return taskCard(j, via ? 'comes through' : about, stop.length ? ['soon', stop[0]] : null);
  };

  const spend = spendUnder(kind, id, SUBJ_WIN);
  /* Tasks, with To do and History as two links on its own line (7 Oct). */
  const tabs = `<div class="listhead"><h2>Tasks</h2><div class="spans">
      <button type="button" class="skiplink" aria-pressed="${SUBJ_TAB === 'todo'}"
        onclick="SUBJ_TAB='todo';${here}">To do${
        open.length ? ' ' + open.length : ''}</button>
      <button type="button" class="skiplink" aria-pressed="${SUBJ_TAB === 'past'}"
        onclick="SUBJ_TAB='past';${here}">History${
        past.length ? ' ' + past.length : ''}</button>
      ${PARKED.costs ? '' : `<button type="button" aria-pressed="${SUBJ_TAB === 'cost'}"
        onclick="SUBJ_TAB='cost';${here}">Costs${
        spendTotal(spend) ? ' · ' + esc(money(spendTotal(spend))) : ''}</button>`}
    </div></div>`;

  /* Costs drill the way work drills: this level, then what it splits into,
     down to one job. The split is what makes it worth opening -- a number for
     the place tells you nothing you can act on, and "the barn, £340" tells you
     where to look next. */
  const costs = () => {
    const total = spendTotal(spend);
    const win = `<div class="chips" style="margin:.6rem 0 .2rem">
      ${COST_WINDOWS.map(([k2, l]) => `<button type="button" aria-pressed="${SUBJ_WIN === k2}"
        onclick="SUBJ_WIN='${k2}';${here}">${l}</button>`).join('')}</div>`;
    if (!spend.length) return win + `<p class="hint" style="margin-top:.8rem">Nothing recorded${
      SUBJ_WIN === 'all' ? ' here yet' : ' in that window'}.</p>`;
    const noFig = spend.filter(c => !c.cost).length;
    const head = `<div class="card"><span class="title" style="font-size:1.4rem">${
      esc(money(total) || 'nothing recorded')}</span>
      <p class="meta">${spend.length} ${spend.length === 1 ? 'entry' : 'entries'}${
        noFig ? ' · ' + noFig + ' with no figure' : ''}</p></div>`;
    /* Blank is not zero. A place whose spend is mostly unpriced should say so
       rather than quietly reading as cheap. */
    /* Only the outermost children. A property holds its structures AND, by
       property_id, every animal and asset on it -- so a vet bill in the barn
       came out under the barn and again under Bessie, and the percentages
       summed past a hundred. A row is dropped when it already lives inside
       another row on the same list. */
    let kids = def.holds.map(child => subjHolds(kind, id, child)
      .map(r => ({ child, r, n: spendTotal(spendUnder(child, r.id, SUBJ_WIN)) })))
      .flat().filter(x => x.n > 0);
    const inside = new Set();
    kids.forEach(x => descendants(x.child, x.r.id)
      .forEach(([, i]) => { if (i !== x.r.id) inside.add(i); }));
    kids = kids.filter(x => !inside.has(x.r.id)).sort((a3, b3) => b3.n - a3.n);
    const split = kids.length ? `<h3 style="font-size:.95rem;color:var(--muted);margin:1.1rem 0 .4rem"
      >Where it went</h3>` + kids.map(x => `<div class="card tap">
        <button onclick="subject('${x.child}','${x.r.id}','cost')">
          <span class="title">${esc(x.r.name || SUBJECT[x.child].what(x.r))}</span>
          <p class="meta">${esc(money(x.n))}${total ? ' · ' + Math.round(x.n / total * 100) + '%' : ''}</p>
        </button></div>`).join('') : '';
    const rest = total - kids.reduce((a3, x) => a3 + x.n, 0);
    const here2 = kids.length && rest > 0
      ? `<div class="card"><span class="title">${esc(money(rest))}</span>
         <p class="meta">on ${esc(name)} itself</p></div>` : '';
    const lines = `<h3 style="font-size:.95rem;color:var(--muted);margin:1.1rem 0 .4rem"
      >Every entry</h3><div class="rows">${spend.slice()
      .sort((a3, b3) => String(b3.done_on).localeCompare(String(a3.done_on)))
      .map(c => `<div class="row">
        <span>${esc(c.what || 'Done')}${c.job_id
          ? ` <button class="skiplink" onclick="drawJob('${c.job_id}')">the task</button>` : ''}</span>
        <span class="meta">${[c.cost ? money(c.cost) : 'no figure', paidBy(c),
          agoWords(daysTo(c.done_on))].filter(Boolean).map(esc).join(' · ')}</span>
      </div>`).join('')}</div>`;
    return win + head + split + here2 + lines;
  };

  const search = `<input id="sq" placeholder="search ${esc(name)}" value="${esc(SUBJ_Q)}"
    onchange="SUBJ_Q=this.value;${here};queueMicrotask(()=>{const e=$('#sq');if(e){e.focus();
      e.setSelectionRange(e.value.length,e.value.length);}})" style="margin:0 0 .8rem">`;

  const todo = () => {
    const shown = orderJobs(open.filter(j => hit(j.title, j.notes)));
    /* What is IN a place comes before what needs doing in it. On a property with
       any real amount of work the buildings were below the fold, so the screen
       for a place answered "what is outstanding" and never "what is here" --
       which is the question you open a building with. A thing has nothing
       inside it, so its work stays first. */
    const work = sect('',
      open.length ? (!PARKED.sorts && open.length > 1 ? jobBar(here) : '')
        + (shown.map(jobCard).join('') || `<p class="hint">Nothing matches.</p>`)
        : `<p class="hint">Nothing to do.</p>`);
    /* What a building is, from its own page. Until it had rooms or things the
       house's page was "Needs doing" and nothing else, so there was no way in
       from there to say what is in it (Randi, 5 Oct). */
    const doors = /* A stage of a filter system, a pool's pump: a part has its own dates,
         and lives where its thing lives (v0.17.0). */
      /* "I want to log issues with it, or mark it for removal eventually"
         (Randi, 5 Oct, on the barn's utility sink). Two jobs already in the
         model -- a fault, and a change that removes -- one tap each. */
      kind === 'asset' ? `<div class="actions" style="margin:.2rem 0 0">
        <button class="add" onclick="addJobHere('asset','${id}','fault')">Something's wrong with it</button>
        ${PARKED.retire ? '' : `<button class="ghost" onclick="addJobHere('asset','${id}','improvement','Replace or remove ${esc(String(row.name || 'it').replace(/'/g, ''))}')">Replace or remove it</button>`}
        ${PARKED.parts ? '' : `<button class="ghost" onclick="drawAddThing('${row.structure_id || ''}','${row.area_id || ''}','${id}')">A part of it</button>`}</div>` : '';
    return doors + work
      + (rules.length ? sect('Comes round', rules.filter(r => hit(r.title)).map(r =>
        swipe(`<div class="card tap"><button onclick="openSched('${r.id}')">
          <span class="title">${esc(r.title)}</span>
          <p class="meta">${r.every_n ? 'every ' + esc(r.every_n) + ' ' + esc(r.every_unit)
            + (r.every_n > 1 ? 's' : '') : esc(r.kind || '')}${
            r.next_due_on ? ' &middot; ' + esc(whenDue(daysTo(r.next_due_on))) : ''}</p>
        </button></div>`, `stopRule('${r.id}')`, `quickDone('${r.id}', true)`, 'Stop')).join('')) : '')
      + fedBy()
      /* Was "On the shelf", which said nothing about what goes there (5 Oct). */
      + (PARKED.needs ? '' : stock.length ? sect('Spares you keep for it', stock.filter(x => hit(x.name, x.part_number)).map(x =>
        `<div class="card tap"><button onclick="drawSupply('${x.id}')">
          <span class="title">${esc(x.name)}${x.part_number
            ? ` <span style="font-weight:400;color:var(--muted)">${esc(x.part_number)}</span>` : ''}</span>
          <p class="meta">${esc(shelfLine(x))}${supplyLow(x)
            ? ' <span class="chip soon">running low</span>' : ''}</p></button></div>`).join(''),
        `<div class="actions" style="margin-top:.6rem">
          <button class="add" onclick="drawSupply('', '${kind}', '${id}')">Something you keep</button></div>`)
        : (MOVABLE.includes(kind) || kind === 'area' ? sect('Spares you keep for it', '<p class="hint" style="margin-top:0">The next filter, bags of salt, a spare part &mdash; and how many are left, so it can say when to buy more.</p>',
          `<div class="actions"><button class="add"
            onclick="drawSupply('', '${kind}', '${id}')">Something you keep</button></div>`) : ''))
      /* `document` stores `name` and `good_until`. This read `title` and
         `expires_on`, so every paper here showed as "Paper" with a blank line
         under it, and the tap called drawDoc with an id it ignores -- opening a
         blank new-paper form instead of the paper. Invisible while the file
         itself was in a Drive folder you could go and look in. Not invisible
         now that a paper IS its link. */
      + (papers.length ? sect('Papers', papers.filter(d => hit(d.name, d.kind)).map(d => {
        const u = safeUrl(d.url);
        const what = (PAPER_KIND.find(x => x[0] === d.kind) || [])[1] || d.kind || '';
        return `<div class="card"><span class="title">${esc(d.name || what || 'Paper')}</span>
          <p class="meta">${esc(what)}${d.good_until
            ? ' \u00b7 good until ' + esc(d.good_until) : ''}</p>
          ${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">Open it</a>` : ''}</div>`;
      }).join('')) : '')
      + (kind === 'structure' && !PARKED.whose ? whoseSection(row) : '');
  };

  /* History is the to-do list with the inputs taken off -- same records, read
     only. Sorted by when, or grouped by what it was about, because "when did I
     last do a mite check" and "everything that ever happened to hive 2" are the
     same rows asked for two different ways. */
  const past2 = () => {
    const rows = past.filter(r => hit(r.what, r.about, r.by, r.extra));
    if (!rows.length) return `<p class="hint" style="margin-top:1rem">${
      past.length ? 'Nothing matches.' : 'Nothing yet.'}</p>`;
    /* The thing on top, what was done under it (5 Oct: the job was the bold
       line and the thing was lost in the grey). Dates as people say them. */
    const line = histLine;
    if (SUBJ_SORT === 'thing') {
      const by = {};
      rows.forEach(r => { (by[r.about || name] = by[r.about || name] || []).push(r); });
      return Object.keys(by).sort().map(k =>
        `<h3 style="font-size:.95rem;color:var(--muted);margin:1rem 0 .3rem">${esc(k)}</h3>
         <div class="rows">${by[k].map(line).join('')}</div>`).join('');
    }
    return `<div class="rows" style="margin-top:.6rem">${rows.map(line).join('')}</div>`;
  };
  const sortBar = past.length > 2 ? `<div class="chips" style="margin:.6rem 0 .2rem">
      ${[['date','By when'], ['thing','By thing']].map(([k2, l]) =>
        `<button type="button" aria-pressed="${SUBJ_SORT === k2}"
          onclick="SUBJ_SORT='${k2}';${here}">${l}</button>`).join('')}</div>` : '';

  function fedBy() {
    const fed = (DB.hookup || []).filter(h => h.structure_id === id && !h.ended_on);
    const feeds = kind === 'asset'
      ? (DB.hookup || []).filter(h => h.source_asset_id === id && !h.ended_on) : [];
    if (!fed.length && !feeds.length) return '';
    const asset = i2 => (DB.asset || []).find(x => x.id === i2) || {};
    const struct = i2 => (DB.structure || []).find(x => x.id === i2) || {};
    const upstream = h => {
      const out = [], seen = new Set([id]); let cur = h;
      while (cur && out.length < 6) {
        const a2 = asset(cur.source_asset_id); if (!a2.id) break;
        const inSt = a2.structure_id;
        out.push(inSt && inSt !== id ? struct(inSt).name : null);
        if (!inSt || seen.has(inSt)) break;
        seen.add(inSt);
        cur = (DB.hookup || []).find(x => x.structure_id === inSt
          && x.utility === h.utility && !x.ended_on);
      }
      return out.filter(Boolean);
    };
    return sect('Fed by',
      fed.map(h => { const a2 = asset(h.source_asset_id), chain = upstream(h);
        return `<div class="card tap"><button onclick="subject('asset','${a2.id}')">
          <span class="title">${esc(a2.name || h.utility)}</span>
          <p class="meta">${esc(String(h.utility || '').replace(/_/g, ' '))}${
            chain.length ? ' &middot; ' + chain.map(esc).join(' &lsaquo; ') : ''}${
            h.started_on ? '' : ' &middot; not live yet'}</p></button></div>`; }).join('')
      + feeds.map(h => `<div class="card tap"><button onclick="subject('structure','${h.structure_id}')">
          <span class="title">${esc(struct(h.structure_id).name || 'a building')}</span>
          <p class="meta">runs on this${h.utility ? ' &middot; '
            + esc(String(h.utility).replace(/_/g, ' ')) : ''}</p></button></div>`).join(''));
  }

  const worst = open.filter(j => ({ unusable:3, degraded:2, intermittent:1 })[j.state])
    .sort((x, y) => ({ unusable:3, degraded:2, intermittent:1 })[y.state]
                  - ({ unusable:3, degraded:2, intermittent:1 })[x.state])[0];
  const leftOff = past[0];

  /* What is in it, as tiles, each with a + (7 Oct): a building shows its rooms
     and areas, then its things; a place its buildings and its outdoor spaces. */
  AT_NOW = { kind, id };
  const kidTiles = (() => {
    const rs = child => subjHolds(kind, id, child).filter(r => hit(r.name || subjName(child, r.id)))
      .filter(r => kind !== 'property' || ['structure','area','animal','vehicle'].includes(child) || !r.structure_id);
    const tl = (child, rows, where) => rows.map(r => itemTile(child, r, where, id)).join('');
    // A section only when there is something in it; adding is the bottom bar's Add (8 Oct).
    const sec = (title, child, rows, where) => rows.length ? tileSect(title, tl(child, rows, where)) : '';
    if (kind === 'property') {
      const st = rs('structure');

/* Done from a card, today, without opening it (4 Oct). A check-up that is
   still a rule gets its job first, the way opening it does; one answered with
   a number goes to the reading screen, because a tick would lose the number.
   Afterwards it stays where you were. */
async function quickDone(id, rule) {
  let jid = id;
  if (rule) {
    const r = (DB.schedule || []).find(x => x.id === id); if (!r) return;
    if (r.kind === 'reading') return openSched(id);
    let j = (DB.job || []).find(x => x.schedule_id === id && String(x.status) !== 'done');
    if (!j) {
      j = { id:uid(), property_id:prop.id, kind:'task', title:r.title || 'Check', source:'schedule',
        schedule_id:id, status:'open', due_on:r.next_due_on || '', asset_id:r.asset_id || '',
        structure_id:r.structure_id || '', area_id:r.area_id || '', animal_id:r.animal_id || '' };
      await DwelLogs.write([{ op:'upsert', table:'job', record:j }]);
      await reload();
    }
    jid = j.id;
  }
  JOB_BACK = LAST_VIEW;
  return finishJob(jid, today());
}
async function removeJob(id) {
  if (isDraft(id)) return leaveJob();
  try { await DwelLogs.write([{ op:'archive', table:'job', id }]); }
  catch (e) { return say('Could not remove it: ' + e.message); }
  await reload();
  if (JOB_OPEN === id) return leaveJob('Removed.');
  (LAST_VIEW || drawJobs)(); say('Removed.');
}

/* WHEN it was last done, and deliberately not BY WHOM.

   An earlier draft of this said "Last done by Dave \u2014 and the 3 before that",
   and Randi cut it: "we dont want the data to cause rifts or fact checks or
   resentment... people can see the history logs under an item and see that for
   themselves if they care to check."

   She is right, and the line to hold is worth stating once: a run of somebody's
   name is not a fact, it is a scoreboard, and a scoreboard in a shared
   household has one use. The maintenance question \u2014 when was this last done,
   is it due \u2014 needs no person in it at all. The record of who did it is kept,
   in the log, where somebody goes to look on purpose. The app does not put it
   in front of anybody, and it never counts. */
/* History is the FINISHED CARDS, not a list of receipts. A repeating job makes
   a new row each time round and the finished one keeps everything that was on
   it \u2014 title, notes, ticked steps, what it was estimated at \u2014 so the record of
   "what did this look like last March" already exists and needs no snapshot.
   The completion beside it carries what it actually cost and who did it. */
function historyOf(j) {
  const past = (DB.job || []).filter(x => x.id !== j.id && String(x.status) === 'done'
    && ((j.schedule_id && x.schedule_id === j.schedule_id) || x.parent_job_id === j.id));
  const comp = Object.fromEntries((DB.completion || []).map(c => [c.job_id, c]));
  return past
    .map(x => ({ job:x, done: x.done_on || (comp[x.id] || {}).done_on || '', c: comp[x.id] || {} }))
    .filter(r => r.done)
    .sort((x, y) => String(y.done).localeCompare(String(x.done)));
}

/* The same card, frozen. Same order, same headings, no inputs \u2014 so opening a
   past one feels like looking at the job rather than reading a report about it.
   Randi: "id expect the history card to look just like the card to be done when

function jobCardRead(r) {
  const j = r.job, c = r.c;
  const who = ((DB.person || []).find(p => p.id === c.by_person_id) || {}).name;
  const steps = (DB.step || []).filter(x => x.job_id === j.id)

  const kind = (JOB_KIND.find(k => k[0] === j.kind) || [])[1] || 'Task';
  const row = (label, val) => val ? `<p class="meta"><b>${esc(label)}</b> ${esc(val)}</p>` : '';
  return `<p class="step" style="margin-top:.6rem">${esc(kind)}</p>
    <p class="title">${esc(j.title || '')}</p>

    <p class="meta" style="margin-top:.6rem"><b>When</b></p>
    ${row('Started', niceDate(j.start_on))}${row('Was due', niceDate(j.due_on))}${row('Done', niceDate(r.done))}
    <p class="meta" style="margin-top:.6rem"><b>What it took</b></p>
    ${row('Estimated', j.est_minutes ? j.est_minutes + ' minutes' : '')}

    ${row('Needed', j.prerequisites)}
    ${j.safety && j.safety !== 'none' ? row('Careful of', j.safety.replace(/_/g, ' ')) : ''}
    ${who ? `<p class="meta" style="margin-top:.6rem"><b>Done by</b> ${esc(who)}</p>` : ''}

}


/* A job claimed three weeks ago and untouched is a different fact from one
   claimed this morning. The board should be able to say so without anybody
   doing arithmetic. */
function sinceWords(at) {
  if (!at) return '';
  const d = Math.round((Date.now() - new Date(at)) / 864e5);
  if (isNaN(d)) return '';
  if (d <= 0) return 'since today';
  if (d === 1) return 'since yesterday';
  if (d < 7) return 'for ' + d + ' days';
  if (d < 14) return 'for a week';
  if (d < 60) return 'for ' + Math.round(d / 7) + ' weeks';
  return 'for ' + Math.round(d / 30) + ' months';
}

/* ONE form for a job, used by the job screen and by setup.

   There were two. Setup collected a title and a vague "this week / sometime";
   the job screen collected everything. So somebody setting up a place could
   not say "November" at the moment they were thinking about November, and the
   dates and the repeat they wanted were on a screen they could only reach by
   tapping a job that did not exist yet. Two forms for one object is the bug.
   A date picker bolted onto the old one would only have made two forms that
   disagreed less.

   `live` means the job is a row in DB: steps write straight through and the
   repeat is a schedule row. Otherwise it is a draft entry held in memory until
   the place exists, and the same markup reads and writes that object instead. */

  return list.map(([k, l]) =>
    `<option value="${k}"${v === k ? ' selected' : ''}>${esc(l)}</option>`).join('');
}
