/* A date typed into a box, or nothing. Never a guess. */
const asDay = v => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || '').trim());
  if (!m) return '';
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return d.getFullYear() === +m[1] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[3]
    ? ymd(d) : '';
};
/* Who did a piece of past work. The list is deliberately short and deliberately
   nameless: not sure, us, whoever was here before, or a company.

   Randi, 2026-09-29: "Not sure we want to give an optional who did it question"
   -- then, a minute later: "maybe its previous owners, maybe its a service."
   Both are right, and together they are the whole rule. Asking WHICH HOUSEMATE
   did something three months ago is a ledger reconstructed from memory, which
   is the rift this app is built not to cause. Asking whether it was the people
   who lived here before, a company you can ring again, or simply the household
   is provenance -- it tells you how much to trust the date, and it survives
   somebody moving out. So `us` is as specific as this ever gets, and
   by_person_id is written only when somebody ticks a job off as they do it. */
const DID_IT = [['not_sure','Not sure'], ['us','Us'],
                ['before_us','Whoever was here before'], ['service','A company']];

/* Work that happened before the app knew about it. This is not "finish the
   open job" -- the open job is the NEXT one. It records what happened and
   re-anchors the rule to it, so a septic pumped in June on a three-year cycle
   is next due in June, not three years from the afternoon you typed it in. */
async function logPast(schedId, on, who, serviceId, jobId) {
  const sc = (DB.schedule || []).find(x => x.id === schedId);
  const done = asDay(on);
  if (!done) return say('Put a date on it first.');
  if (done > today()) return say('That is in the future. Mark it done when it happens.');
  const writes = [{ op:'upsert', table:'completion', record:{ id:uid(),
    schedule_id: schedId || '', job_id: jobId || '',
    asset_id:(sc || {}).asset_id || '', animal_id:(sc || {}).animal_id || '',
    vehicle_id:(sc || {}).vehicle_id || '',
    done_on:done, recorded_on:today(), origin:'planned',
    what:(sc || {}).title || 'Done before',
    did_it: who || 'not_sure', service_id: who === 'service' ? (serviceId || '') : '' } }];
  if (sc && sc.every_n && sc.kind !== 'once') {
    const next = rollFrom(done, sc.every_n, sc.every_unit);
    writes.push({ op:'upsert', table:'schedule', record:{ ...sc, next_due_on: next } });
    /* The open occurrence moves with the rule. Leaving it where it was is how
       you end up with a job due next September for something now anchored to
       June -- the rule and the card disagreeing about the same thing. */
    (DB.job || []).filter(x => x.schedule_id === schedId && openJob(x))
      .forEach(x => writes.push({ op:'upsert', table:'job', record:{ ...x, due_on: next } }));
  }
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  await reload();
  const nx = (DB.schedule || []).find(x => x.id === schedId) || {};
  say('Noted — done ' + agoWords(daysTo(done)) + (nx.next_due_on
    ? '. Next one ' + whenDue(daysTo(nx.next_due_on)) + '.' : '.'));
  return true;
}

/* Finishing writes a completion — append-only history — and, when there is a
   rule behind it, moves the rule on. That is the loop the whole app is for. */
async function finishJob(id, on) {
  const j = jobById(id); if (!j) return;
  /* The date is whatever the box says, and the box starts on today. Ticking
     something off on Sunday that you actually did on Friday used to file it as
     Sunday and count the next one from Sunday -- two days of drift per turn,
     forever, on a rule nobody would think to check. */
  const done = asDay(on) || today();
  const cid = uid();
  const writes = [{ op:'upsert', table:'completion',
      record:{ id:cid, job_id:id, asset_id:j.asset_id || '', schedule_id:j.schedule_id || '',
               animal_id:j.animal_id || '', vehicle_id:j.vehicle_id || '',
               done_on:done, recorded_on:today(), origin:'planned',
               what:j.title || 'Done', by_person_id:me.id } },
    /* Randi, 2026-09-27: "when a job gets completed, if un owned it could be
       assigned to who finished it." That is assignment used as a RECORD OF FACT
       rather than a directive \u2014 the only honest way to write this field by
       machine. Nobody is being told to do anything; the job simply turned out
       to be somebody's, and now the history says whose. If it was already
       assigned, that stands: the person it was meant for keeps the credit or
       the blame, and who actually did it is on the completion either way. The
       claim is left alone too \u2014 Dave taking it and Randi finishing it is a real
       and interesting fact, and overwriting it would hide that. */
    { op:'upsert', table:'job', record:{ ...j, status:'done', done_on:done,
        owner_id: j.owner_id || me.id, completion_id:cid } }];
  const sc = (DB.schedule || []).find(x => x.id === j.schedule_id);
  if (sc && sc.every_n && sc.kind !== 'once') {
    const next = rollFrom(done, sc.every_n, sc.every_unit);
    writes.push({ op:'upsert', table:'schedule', record:{ ...sc, next_due_on: next } });
    writes.push({ op:'upsert', table:'job', record:{ id:uid(), property_id:prop.id, kind:j.kind,
      title:j.title, source:'schedule', schedule_id:sc.id, asset_id:j.asset_id || '',
      structure_id:j.structure_id || '', area_id:j.area_id || '', animal_id:j.animal_id || '',
      notes:j.notes || '', est_minutes:j.est_minutes || '', est_cost:j.est_cost || '',
      prerequisites:j.prerequisites || '', safety:j.safety || '', status:'open', due_on: next } });
  }
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  await reload();
  show('home');
  say(sc && sc.kind !== 'once' ? 'Done. The next one is on the list.' : 'Done.');
}

/* Everything else on the person screen says what state it is in — a place says
   "yours, one building", the sheet button says change-or-connect. Reminders
   were the one setting you had to open in order to find out what it was.

   The second half matters more than the summary. A digest is sent by a
   time-driven trigger INSIDE their sheet, so with no sheet there is nothing
   running to send it, and with no email address there is nowhere for it to
   arrive. Both are silent failures: you set a weekly digest, you are told you
   will hear from us, and then you never do. Say it here instead. */
const TELL_CH = { none:'Nothing is sent', email:'Emailed to you', calendar:'In your calendar' };
const TELL_CAD = { only_when_it_changes:'only when something changes', weekly:'once a week',
                   daily:'daily', monthly:'monthly' };
const TELL_WHAT = { due_soon:'things coming up', overdue:'things already late',
                    new_issues:'new problems', low_supplies:'running low',
                    someone_waiting:'somebody waiting on you' };

  const bits = String(p.what || '').split(',').map(x => TELL_WHAT[x.trim()]).filter(Boolean);
  const detail = [bits.join(', ') || 'nothing chosen',
    p.lead_days ? p.lead_days + ' days ahead' : null,
    p.max_per_week ? 'at most ' + p.max_per_week + ' a week' : null].filter(Boolean).join(' \u00b7 ');
  const warn = !localStorage.getItem('dwellogs.url')
    ? 'Nothing can send this yet \u2014 the digest goes out from your sheet, and there is no sheet.'
    : (p.channel === 'email' && !me.email)
      ? 'There is no email address on you, so it has nowhere to arrive.'
      : '';
  return { line:(TELL_CH[p.channel] || p.channel) + ', ' + (TELL_CAD[p.cadence] || p.cadence),

}

async function doLift() {
  const l = DwelLogs.localSnapshot() || {};
  // People and places first so the name-mirror columns have something to mirror
  // when a human opens the spreadsheet; the ids do not care about order.
  const ORDER = ['person','property','membership','structure','area','animal','placement',
    'category','asset_type','asset','supply','supply_link','schedule','completion','reading',
    'issue','work_item','document','service','visit','coverage','invite','suggestion',
    'reminder_pref','feedback'];
  const rows = [];
  ORDER.forEach(t => (l[t] || []).forEach(r => rows.push({ op:'upsert', table:t, record:r })));
  (Object.keys(l)).forEach(t => { if (!ORDER.includes(t))
    (l[t] || []).forEach(r => rows.push({ op:'upsert', table:t, record:r })); });
  if (!rows.length) return startOnSheet();

  // Chunked, because one request carrying a whole ranch is a request that times
  // out halfway and leaves nobody able to say what got through.
  const SIZE = 150, total = Math.ceil(rows.length / SIZE);
  for (let i = 0; i < total; i++) {
    say('Moving ' + rows.length + ' rows up… ' + (i + 1) + ' of ' + total);
    try { await DwelLogs.write(rows.slice(i * SIZE, (i + 1) * SIZE)); }
    catch (e) { return say('Stopped partway: ' + e.message + ' \u2014 nothing on this device was touched.'); }
  }
  await boot();
  say('Moved. The copy on this device is still there, untouched.');
}

function startOnSheet() {
  // They chose the empty sheet on purpose. Do not touch the local copy.
  firstRun();
  say('Starting fresh. Your device copy is still on this device.');
}

/* ---- taking it with you --------------------------------------------------

   "Move out, and your log moves with you" has been on the front page since the
   start, and nothing in the app could do it. It belongs on the PERSON, not on
   the place: a place cannot want to be taken away, and `membership` already
   says which ones are yours.

   One zip per place, one CSV per table, because the whole premise is that this
   is your spreadsheet -- a JSON blob would be a thing only this app can read,
   which is the opposite of the promise. The zip is written by hand (stored, no
   compression) so the app stays self-contained: pulling in a library to leave
   would be its own small joke. */
const CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0; }
  return b => { let c = 0xFFFFFFFF;
    for (let i = 0; i < b.length; i++) c = t[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0; };
})();
function zipOf(files) {
  const enc = new TextEncoder(), parts = [], dir = [];
  let at = 0;
  const u16 = n => [n & 255, (n >> 8) & 255];
  const u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
  files.forEach(([name, text]) => {
    const nb = enc.encode(name), body = enc.encode(text), crc = CRC(body);
    const head = [].concat([0x50,0x4b,0x03,0x04], u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(body.length), u32(body.length), u16(nb.length), u16(0));
    parts.push(new Uint8Array(head), nb, body);
    dir.push({ name:nb, crc, size:body.length, at });
    at += head.length + nb.length + body.length;
  });
  const cd = [];
  dir.forEach(f => {
    const h = [].concat([0x50,0x4b,0x01,0x02], u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(f.crc), u32(f.size), u32(f.size), u16(f.name.length),
      u16(0), u16(0), u16(0), u16(0), u32(0), u32(f.at));
    cd.push(new Uint8Array(h), f.name);
  });
  const cdSize = cd.reduce((a2, b2) => a2 + b2.length, 0);
  const end = new Uint8Array([].concat([0x50,0x4b,0x05,0x06], u16(0), u16(0),
    u16(dir.length), u16(dir.length), u32(cdSize), u32(at), u16(0)));
  return new Blob(parts.concat(cd, [end]), { type:'application/zip' });
}
const csvCell = v => {
  let t = v == null ? '' : String(v);
  /* A cell that opens with = + @ or a control character is a FORMULA to Excel,
     Sheets and Numbers -- so a goat named =HYPERLINK("http://…","click") is a
     live link in the file, and worse is available. The whole point of this
     export is that somebody opens it in a spreadsheet, and the names in it can
     be typed by anybody you invited, so the two facts meet here.

     A leading quote defuses it and is the convention every spreadsheet knows.
     Minus is deliberately NOT guarded on its own, because -40 is a temperature
     somebody meant; it is guarded only when what follows is not a number, which
     is the shape an injection takes. */
  if (/^[=+@\t\r]/.test(t) || (/^-/.test(t) && !/^-?\d*\.?\d+$/.test(t))) t = "'" + t;
  return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
};
function csvOf(rows) {
  const cols = [];
  rows.forEach(r => Object.keys(r).forEach(k => { if (cols.indexOf(k) < 0) cols.push(k); }));
  return [cols.join(',')].concat(rows.map(r => cols.map(c => csvCell(r[c])).join(','))).join('\n');
}
/* What belongs under a subject. The whole place is the case the front page
   promises -- move out and your log moves with you -- but it is the same act at
   any size: a copy of the 442 goes with the car when somebody buys it, and a
   copy of the barn goes with the barn. Same walk as the work and the money. */
function rowsUnder(kind, id) {
  const out = {}, ids = new Set();
  const tables = Object.keys(DB || {});
  tables.forEach(t => { out[t] = []; });
  const seed = (t, r) => { if (out[t].indexOf(r) < 0) { out[t].push(r); ids.add(r.id); } };
  descendants(kind, id).forEach(([k, i]) => {
    const tab = (SUBJECT[k] || {}).table; if (!tab) return;
    const r = (DB[tab] || []).find(x => x.id === i); if (r) seed(tab, r);
  });
  /* The place itself always comes, whatever level this started from: a box of
     rows with no property in it cannot say where any of it was. But it goes in
     the OUTPUT only, never into the walk set -- seeding it there made it a
     magnet, and a copy of one car came out carrying the cow's vet bill and
     every building on the place. */
  if (prop) (DB.property || []).filter(r => r.id === prop.id)
    .forEach(r => { if (out.property.indexOf(r) < 0) out.property.push(r); });
  for (let pass = 0; pass < 5; pass++) {
    let grew = false;
    // Outward: a step on a job on an asset in a room comes too.
    tables.forEach(t => {
      if (t === 'property') return;
      (DB[t] || []).forEach(r => {
        if (out[t].indexOf(r) > -1) return;
        const hit = Object.keys(r).some(k => k.endsWith('_id') && r[k] && ids.has(r[k]));
        if (hit) { out[t].push(r); ids.add(r.id); grew = true; }
      });
    });
    /* And inward, which the first version missed entirely: a person has no
       column pointing at anything, so nobody came -- and an export where every
       completion says who did it and no file says who that is answers the
       question with a uuid. Anything an included row POINTS AT comes as well. */
    const wanted = new Set();
    tables.forEach(t => out[t].forEach(r => Object.keys(r).forEach(k => {
      if (k.endsWith('_id') && r[k]) wanted.add(r[k]);
    })));
    tables.forEach(t => {
      if (t === 'property') return;
      (DB[t] || []).forEach(r => {
        if (out[t].indexOf(r) > -1 || !wanted.has(r.id)) return;
        out[t].push(r); ids.add(r.id); grew = true;
      });
    });
    if (!grew) break;
  }
  return out;
}
async function exportPlace(propId) { return exportSubject('property', propId); }
async function exportSubject(kind, id) {
  const label = subjName(kind, id) || 'dwellogs';
  say('Gathering it up…');
  let rows;
  try { rows = rowsUnder(kind, id); }
  catch (e) { return say('Could not build the export: ' + e.message); }
  const p = { name: label };
  const files = [];
  Object.keys(rows).sort().forEach(t => {
    if (!rows[t].length) return;
    files.push([t + '.csv', csvOf(rows[t])]);
  });
  if (!files.length) return say('Nothing to take yet.');
  const n = files.reduce((a2, f) => a2 + rows[f[0].replace('.csv', '')].length, 0);
  // A note in the box saying what this is, for the version of you that opens it
  // in four years having forgotten the app existed.
  files.push(['README.txt',
    'DwelLogs export\n' + (p.name || 'A place') + '\n' + today() + '\n\n' +
    'One CSV per table, exactly as the app holds it. Open any of them in a\n' +
    'spreadsheet. The id columns join the files to each other.\n' +
    (kind === 'property' ? '' :
      '\nThis is a copy of one part of ' + ((prop || {}).name || 'the place') +
      ', not the whole of it.\n')]);
  const slug = String(p.name || 'dwellogs').toLowerCase().replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '') || 'dwellogs';
  try {
    const url = URL.createObjectURL(zipOf(files));
    const a2 = document.createElement('a');
    a2.href = url; a2.download = slug + '-' + today() + '.zip';
    document.body.appendChild(a2); a2.click(); a2.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { return say('Could not save the file: ' + e.message); }
  say(n + ' rows in ' + (files.length - 1) + ' files. It is yours.');
}

  /* The rooms offered are the rooms in the building chosen, because a list that

     list that will eventually be believed. */
  const fillAreas = () => {
    const sel = $('#a-s').value, box = $('#a-ar');
    const mine = (DB.area || []).filter(a => a.structure_id === sel && a.status !== 'archived');
    /* Every area in the building, nested ones included -- an extinguisher goes
       in the electrical room, not vaguely on the ground floor. The parent rides
       along in the label because "Open room" on its own names nothing. */
    const up = a => ((DB.area || []).find(x => x.id === a.parent_area_id) || {}).name;
    box.innerHTML = `<option value="">Somewhere in the building</option>`
      + mine.map(a => `<option value="${a.id}">${esc(a.name)}${
          up(a) ? esc(' — in ' + up(a)) : ''}</option>`).join('');
    $('#a-arw').hidden = !mine.length;
  };
  $('#a-s').onchange = e => { $('#a-newb').hidden = e.target.value !== '__new'; fillAreas(); };
  fillAreas();
  /* What it comes with, shown before you agree to it. Setup asks this once for
     everything at the end; adding one thing later was creating its check-ups
     silently, which is the same screen full of work nobody chose, arriving one
     fridge at a time. Ticked by default, because they are the right answer --
     unticking is the decision, and it is kept rather than thrown away. */
  $('#a-t').onchange = fillChecks;
  fillChecks();
}
function fillChecks() {
  const box = $('#a-checks'); if (!box) return;
  const checks = suggestedFor($('#a-t').value);
  box.innerHTML = !checks.length ? '' :
    `<label style="margin-top:1.2rem">What it will watch for you</label>
     <div class="rows">${checks.map(([title, n, unit]) => `<div class="row">
       <label class="tick" style="flex:1;min-width:0">
         <input type="checkbox" class="ac" value="${esc(title)}" checked>
         <span>${esc(title)}<small style="display:block;color:var(--muted)"
           >${esc(everyWords(n, unit))}</small></span>
       </label></div>`).join('')}</div>
     <p class="hint">Untick anything you would rather not hear about. Nothing is thrown
       away — it stays set up and stays quiet.</p>`;
}
async function addThing() {
  const type = $('#a-t').value;
  // "Dishwasher" is a perfectly good name for the dishwasher. A second one
  // becomes Dishwasher 2 and can be renamed later, if it ever matters.
  const name = ($('#a-n').value || '').trim() ||
    uniqueName(type, (DB.asset || []).map(a => a.name));
  let structId = $('#a-s').value;
  const writes = [];
  if (structId === '__new') {
    structId = uid();
    const bk = $('#a-bk').value;
    const bn = ($('#a-bn').value || '').trim() ||
      uniqueName(bk === '__other' ? (($('#a-bko').value || '').trim() || 'Building') : kindLabel(bk),
                 (DB.structure || []).map(x => x.name));
    writes.push({ op:'upsert', table:'structure', record:{ id:structId, property_id:prop.id,
      name:bn, kind: bk === '__other' ? 'other' : bk,
      kind_other: bk === '__other' ? ($('#a-bko').value || '').trim() : '' } });
  }
  const want = new Set([...document.querySelectorAll('.ac:checked')].map(e => e.value));
  const t = thingWrites(type, { structId, name, installed:today(),
    areaId: structId === '__new' ? '' : (($('#a-ar') || {}).value || ''),
    keep: (tn, title) => want.has(title) });
  if (!t.id) return say('That one has no template yet.');
  t.writes.forEach(w => writes.push(w));
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  DB = (await DwelLogs.load()).db;
  const on = want.size;
  /* A thing you already own has a history, and the moment you have just typed
     its name is the moment you remember when the filter was last changed. Its
     own check-ups only -- the whole catch-up list here would be an ambush. */
  const fresh = (DB.schedule || []).filter(sc => sc.asset_id === t.id
    && sc.every_n && sc.kind !== 'once' && sc.muted !== 'TRUE');
  if (fresh.length) drawCatchUp(t.id); else show('home');
  say(name + ' added' + (t.checks
    ? ', with ' + on + ' check-up' + (on === 1 ? '' : 's')
      + (on < t.checks ? ' — the rest are kept quiet.' : '.')
    : '.'));
}

/* ---------------------------------------------------------------- readings

   The table draft 1 of the v1 line argued in by name -- "levels are half of
   what people actually track" -- and which then sat with no screen for weeks
   while three unrelated things asked for it: mite counts on a hive, the
   odometer on a car, eggs a day.

   The shape comes from the schema and is worth restating: result_type decides
   what a result may be USED for. A number can be trended; a pass/fail cannot.
   And `source` exists because instruments break -- a tank gauge reading 10%
   and the supplier saying 40% are both real readings, and averaging them is
   the wrong answer. */
const RESULT_KIND = [['numeric','A number'], ['present_absent','Present or absent'],
                     ['pass_fail','Pass or fail']];
const FLAGS = { present_absent: [['present','Present'],['absent','Absent']],
                pass_fail:      [['pass','Pass'],['fail','Fail']] };
const READ_FROM = [['gauge','A gauge'],['dipstick','A dipstick'],['sight_glass','A sight glass'],
                   ['meter','A meter'],['supplier','The supplier'],['delivery_ticket','A delivery ticket'],
                   ['by_eye','By eye'],['lab','A lab']];

/* Everything a reading can be about, in one list, because "which room is damp"
   and "how full is the tank" are the same question to the person asking. */
function readSubjects() {
  const out = [];
  (DB.asset || []).filter(a => a.status !== 'archived')
    .forEach(a => out.push(['asset:' + a.id, a.name]));
  (DB.animal || []).filter(a => a.status !== 'archived')
    .forEach(a => out.push(['animal:' + a.id, a.name || ('The ' + a.type)]));
  (DB.area || []).forEach(a => out.push(['area:' + a.id, a.name]));
  (DB.structure || []).forEach(s => out.push(['structure:' + s.id, s.name || 'the building']));
  out.push(['property:' + prop.id, prop.name]);
  return out;
}
function subjectWords(r) {
  const A = byId('asset'), N = byId('animal'), R = byId('area'), T = byId('structure');
  if (r.asset_id)     return (A[r.asset_id] || {}).name || 'something';
  if (r.animal_id)    return (N[r.animal_id] || {}).name || 'an animal';
  if (r.area_id)      return (R[r.area_id] || {}).name || 'a room';
  if (r.structure_id) return (T[r.structure_id] || {}).name || 'a building';
  return prop.name;
}
function readingWords(r) {
  if (String(r.result_type) === 'numeric')
    return (r.value_num === '' || r.value_num == null ? '—' : r.value_num)
           + (r.unit ? ' ' + r.unit : '');
  const f = (FLAGS[r.result_type] || []).find(x => x[0] === r.value_flag);
  return f ? f[1] : (r.value_flag || '—');
}
function readingsOf(limit) {
  return (DB.reading || []).filter(r => r.status !== 'archived')
    .sort((a, b) => String(b.taken_on).localeCompare(String(a.taken_on)))
    .slice(0, limit || 12);
}

function drawReading(subject, scheduleId) {
  $('#tabs').hidden = true;
  const subs = readSubjects();
  if (!draft.rd || subject || scheduleId) {
    draft.rd = { subject: subject || (subs[0] || [''])[0], result_type:'numeric',
                 value_num:'', value_flag:'', unit:'', source:'gauge',
                 taken_on: today(), doubt:false, schedule_id: scheduleId || '' };
  }
  const r = draft.rd;
  const rule = (DB.schedule || []).find(x => x.id === r.schedule_id);
  /* Arriving from a rule, the repeat it already has is what the control should
     show -- otherwise saving would quietly turn a monthly check into a one-off. */
  if (rule && r.rep === undefined) {
    r.rep = (rule.every_n && rule.kind !== 'once') ? 'yes' : '';
    r.every_n = rule.every_n || '1';
    r.every_unit = rule.every_unit || 'month';
  }
  const flags = FLAGS[r.result_type];
  app.innerHTML = `<button class="back" onclick="draft.rd=null;show('home')">&lsaquo; Back</button>
    <h1>${esc(rule ? rule.title : 'Take a reading')}</h1>

    <label for="rd-s">What is it about?</label>
    <select id="rd-s" onchange="keepReading();draft.rd.subject=this.value">
      ${subs.map(([k, l]) => `<option value="${esc(k)}"${
        r.subject === k ? ' selected' : ''}>${esc(l)}</option>`).join('')}
    </select>

    <label for="rd-k">What kind of answer?</label>
    <select id="rd-k" onchange="reReading(this.value)">
      ${optList(r.result_type, RESULT_KIND)}</select>

    ${flags ? `<label for="rd-f">Result</label>
      <select id="rd-f">${optList(r.value_flag || flags[0][0], flags)}</select>`
    : `<div class="counts" style="grid-template-columns:2fr 1fr">
        <div class="count"><span>Value</span>
          <input id="rd-v" inputmode="decimal" value="${esc(r.value_num)}"></div>
        <div class="count"><span>Unit</span>
          <input id="rd-u" value="${esc(r.unit)}" placeholder="%"></div>
      </div>`}

    <label for="rd-src">Read from</label>
    <select id="rd-src">${optList(r.source, READ_FROM)}</select>

    <label for="rd-d">Taken on</label>
    <input id="rd-d" type="date" value="${esc(r.taken_on)}">

    <label for="rd-rep">Ask me again?</label>
    <select id="rd-rep" onchange="keepReading();draft.rd.rep=this.value;drawReading()">
      <option value=""${!r.rep ? ' selected' : ''}>No &mdash; just this once</option>
      <option value="yes"${r.rep ? ' selected' : ''}>Yes, on a repeat</option>
    </select>
    ${r.rep ? `<div class="counts" style="grid-template-columns:1fr 2fr">
      <div class="count"><span>Every</span>
        <input id="rd-en" inputmode="numeric" value="${esc(r.every_n || '1')}"></div>
      <div class="count"><span>&nbsp;</span>
        <select id="rd-eu">${optList(r.every_unit || 'month', EVERY_UNIT)}</select></div>
    </div>` : ''}

    <label class="tick" style="margin-top:.9rem"><input type="checkbox" id="rd-q"
      ${r.doubt ? 'checked' : ''}><span>Not sure about this one</span></label>
    ${tip('A doubted reading is kept and marked rather than thrown away, and nothing is ' +
      'projected forward from it. A gauge that reads 10% while the supplier says 40% is not a ' +
      'contradiction to settle by averaging &mdash; both were read from something, and which ' +
      'instrument said so is the part worth keeping.')}

    <div class="actions" style="margin-top:1.2rem">
      <button class="primary" onclick="saveReading()">Save it</button>
    </div>

    ${(() => { const rs = readingsOf(); if (!rs.length) return '';
      return `<h2>Lately</h2><div class="rows">${rs.map(x => `<div class="row">
        <div class="grow"><b>${esc(subjectWords(x))} &middot; ${esc(readingWords(x))}</b>
          <small>${esc(x.taken_on)}${String(x.trusted).toUpperCase() === 'TRUE'
            ? '' : ' &middot; not sure'}</small></div></div>`).join('')}</div>`;
    })()}`;
}
function keepReading() {
  const r = draft.rd; if (!r) return;
  const v = k => { const e = $(k); return e ? (e.value || '').trim() : undefined; };
  if ($('#rd-s'))   r.subject     = v('#rd-s');
  if ($('#rd-v'))   r.value_num   = v('#rd-v');
  if ($('#rd-u'))   r.unit        = v('#rd-u');
  if ($('#rd-f'))   r.value_flag  = v('#rd-f');
  if ($('#rd-src')) r.source      = v('#rd-src');
  if ($('#rd-d'))   r.taken_on    = v('#rd-d');
  if ($('#rd-q'))   r.doubt       = $('#rd-q').checked;
  if ($('#rd-en'))  r.every_n     = v('#rd-en');
  if ($('#rd-eu'))  r.every_unit  = v('#rd-eu');
}
function reReading(k) { keepReading(); draft.rd.result_type = k; draft.rd.value_flag = ''; drawReading(); }

async function saveReading() {
  keepReading();
  const r = draft.rd;
  const [kind, id] = String(r.subject || '').split(':');
  if (r.result_type === 'numeric' && r.value_num === '') return say('Put a number in first.');
  const rec = { id: uid(), taken_on: r.taken_on || today(), result_type: r.result_type,
    value_num: r.result_type === 'numeric' ? r.value_num : '',
    value_flag: r.result_type === 'numeric' ? '' : (r.value_flag || (FLAGS[r.result_type] || [[]])[0][0]),
    unit: r.result_type === 'numeric' ? r.unit : '',
    source: r.source, trusted: r.doubt ? '' : 'TRUE',
    schedule_id: r.schedule_id || '', by_person_id: me.id,
    asset_id: kind === 'asset' ? id : '', animal_id: kind === 'animal' ? id : '',
    area_id: kind === 'area' ? id : '', structure_id: kind === 'structure' ? id : '',
    property_id: kind === 'property' ? id : prop.id };
  const writes = [{ op:'upsert', table:'reading', record:rec }];

  /* "Ask me again" is what makes a reading worth taking twice. Recording the
     propane level is useful; being asked in November instead of remembering in
     January is the point. The rule is a schedule of kind 'reading', which is
     what sends somebody back to this screen rather than to a job. */
  const num = x => { const n = Number(x); return Number.isFinite(n) && n > 0 ? n : 1; };
  let sc = (DB.schedule || []).find(x => x.id === r.schedule_id);
  if (r.rep === 'yes') {
    const every = num(r.every_n), unit = r.every_unit || 'month';
    const d = new Date();
    ({ day:() => d.setDate(d.getDate() + every), week:() => d.setDate(d.getDate() + every * 7),
       month:() => d.setMonth(d.getMonth() + every), year:() => d.setFullYear(d.getFullYear() + every)
     }[unit] || (() => d.setMonth(d.getMonth() + every)))();
    const rule = { id: (sc || {}).id || uid(), kind:'reading',
      title: (sc || {}).title || ('Check ' + subjectWords(rec)),
      asset_id: rec.asset_id, animal_id: rec.animal_id, area_id: rec.area_id,
      structure_id: rec.structure_id, every_n: every, every_unit: unit,
      next_due_on: ymd(d) };
    writes.push({ op:'upsert', table:'schedule', record:rule });
    rec.schedule_id = rule.id;
    sc = null;                      // already rolled, do not roll it twice
  } else if (sc && r.rep === '') {
    writes.push({ op:'upsert', table:'schedule', record:{ ...sc, kind:'once' } });
    sc = null;
  }

  /* A reading taken against a rule IS that rule being done, so it rolls the
     rule forward the same way finishing a job does. Otherwise "check the
     level" stays overdue forever with the answer already recorded. */
  if (sc && sc.every_n && sc.kind !== 'once') {
    const d = new Date(), n = Number(sc.every_n) || 1;
    ({ day:() => d.setDate(d.getDate() + n), week:() => d.setDate(d.getDate() + n * 7),
       month:() => d.setMonth(d.getMonth() + n), year:() => d.setFullYear(d.getFullYear() + n)
     }[sc.every_unit] || (() => d.setMonth(d.getMonth() + n)))();
    writes.push({ op:'upsert', table:'schedule',
      record:{ ...sc, next_due_on: ymd(d) } });
  }
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  const said = readingWords(rec), about = subjectWords(rec);
  draft.rd = null;
  await reload();
  drawReading();
  say(about + ': ' + said);
}

function drawLog() {
  const A = byId('asset'), P = byId('person');
  const rows = (DB.completion || []).slice().reverse();
  app.innerHTML = `<h1>Log</h1>
    <p class="sub">Everything done, newest first. Entries are permanent.</p>
    ${rows.map(c => `<div class="card"><span class="title">${esc(c.what)}</span>
      <p class="meta">${esc((A[c.asset_id] || {}).name || '')} · ${esc(c.done_on)} ·
        ${esc((P[c.by_person_id] || {}).name || '')}${c.cost ? ' · ' + esc(c.cost) : ''}</p></div>`).join('')
      || `<div class="empty">Nothing logged yet. The first entry is the useful one.</div>`}`;
}

boot();
</script>
</body>
</html>
