function keepReading() {
  const r = draft.rd; if (!r) return;
  const v = k => { const e = $(k); return e ? (e.value || '').trim() : undefined; };
  if ($('#rd-s'))   r.subject     = v('#rd-s');
  if ($('#rd-v'))   r.value_num   = v('#rd-v');
  if ($('#rd-u'))   r.unit        = v('#rd-u');
  if ($('#rd-f'))   r.value_flag  = v('#rd-f');
  if ($('#rd-src')) r.source      = v('#rd-src');
  if ($('#rd-d'))   r.taken_on    = v('#rd-d');
  if ($('#rd-q'))   r.doubt       = $('#rd-q').checked;
  if ($('#rd-en'))  r.every_n     = v('#rd-en');
  if ($('#rd-eu'))  r.every_unit  = v('#rd-eu');
}
function reReading(k) { keepReading(); draft.rd.result_type = k; draft.rd.value_flag = ''; drawReading(); }

async function saveReading() {
  keepReading();
  const r = draft.rd;
  const [kind, id] = String(r.subject || '').split(':');
  if (r.result_type === 'numeric' && r.value_num === '') return say('Put a number in first.');
  const rec = { id: uid(), taken_on: r.taken_on || today(), result_type: r.result_type,
    value_num: r.result_type === 'numeric' ? r.value_num : '',
    value_flag: r.result_type === 'numeric' ? '' : (r.value_flag || (FLAGS[r.result_type] || [[]])[0][0]),
    unit: r.result_type === 'numeric' ? r.unit : '',
    source: r.source, trusted: r.doubt ? '' : 'TRUE',
    schedule_id: r.schedule_id || '', by_person_id: me.id,
    asset_id: kind === 'asset' ? id : '', animal_id: kind === 'animal' ? id : '',
    area_id: kind === 'area' ? id : '', structure_id: kind === 'structure' ? id : '',
    property_id: kind === 'property' ? id : prop.id };
  const writes = [{ op:'upsert', table:'reading', record:rec }];

  /* "Ask me again" is what makes a reading worth taking twice. Recording the
     propane level is useful; being asked in November instead of remembering in
     January is the point. The rule is a schedule of kind 'reading', which is
     what sends somebody back to this screen rather than to a job. */
  const num = x => { const n = Number(x); return Number.isFinite(n) && n > 0 ? n : 1; };
  let sc = (DB.schedule || []).find(x => x.id === r.schedule_id);
  if (r.rep === 'yes') {
    const every = num(r.every_n), unit = r.every_unit || 'month';
    const d = new Date();
    ({ day:() => d.setDate(d.getDate() + every), week:() => d.setDate(d.getDate() + every * 7),
       month:() => d.setMonth(d.getMonth() + every), year:() => d.setFullYear(d.getFullYear() + every)
     }[unit] || (() => d.setMonth(d.getMonth() + every)))();
    const rule = { id: (sc || {}).id || uid(), kind:'reading',
      title: (sc || {}).title || ('Check ' + subjectWords(rec)),
      asset_id: rec.asset_id, animal_id: rec.animal_id, area_id: rec.area_id,
      structure_id: rec.structure_id, every_n: every, every_unit: unit,
      next_due_on: ymd(d) };
    /* The rule before the row that points at it: the database checks the
       link as that row arrives (2 Oct, accounts). */
    writes.unshift({ op:'upsert', table:'schedule', record:rule });
    rec.schedule_id = rule.id;
    sc = null;                      // already rolled, do not roll it twice
  } else if (sc && r.rep === '') {
    writes.push({ op:'upsert', table:'schedule', record:{ ...sc, kind:'once' } });
    sc = null;
  }

  /* A reading taken against a rule IS that rule being done, so it rolls the
     rule forward the same way finishing a job does. Otherwise "check the
     level" stays overdue forever with the answer already recorded. */
  if (sc && sc.every_n && sc.kind !== 'once') {
    const d = new Date(), n = Number(sc.every_n) || 1;
    ({ day:() => d.setDate(d.getDate() + n), week:() => d.setDate(d.getDate() + n * 7),
       month:() => d.setMonth(d.getMonth() + n), year:() => d.setFullYear(d.getFullYear() + n)
     }[sc.every_unit] || (() => d.setMonth(d.getMonth() + n)))();
    writes.push({ op:'upsert', table:'schedule',
      record:{ ...sc, next_due_on: ymd(d) } });
  }
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  const said = readingWords(rec), about = subjectWords(rec);
  draft.rd = null;
  await reload();
  drawReading();
  say(about + ': ' + said);
}

/* ---- Jobs: every job, done ones included, filtered ------------------------
   Decided 1 Oct: "if i wanted to see all the tasks with type x or status x or
   date range etc. the app needs to allow the same sort of filtering along with
   past data." One list made of three things:
     - every job, whatever its status (idea, open ... done, dropped);
     - check-ups coming due that have no job yet (the rule itself is not a job
       until somebody opens it -- openSched makes one);
     - what was logged done without a job (a past septic pump-out).
   The filter is one small object, kept per device, so a saved view later is the
   same object with a name (view.filters). */
/* Filters pick several at once, in plain words (8 Oct): Kind, When, Who has it
   and Repeats are taps that toggle; For is four short lists -- a building, a
   thing, an animal, a vehicle -- instead of one list of everything. */
const JOBS_DEFAULT = { status:'open', kinds:[], whens:[], who:[], rep:[], where:[], at:{}, from:'', to:'', sort:'due' };
function normF(F) {
  const f = { ...JOBS_DEFAULT, ...F };
  const arr = (v, old) => Array.isArray(v) && v.length ? v : old ? [old] : Array.isArray(v) ? v : [];
  f.kinds = arr(F.kinds, F.kind); f.whens = arr(F.whens, F.when); f.who = Array.isArray(F.who) ? F.who : F.who ? [F.who] : [];
  if (!f.rep.length && F.source) f.rep = [F.source === 'checkup' ? 'yes' : 'no'];
  f.rep = arr(F.rep, F.source === 'checkup' ? 'yes' : F.source === 'me' ? 'no' : '');
  f.at = { ...(F.at || {}) }; f.where = Array.isArray(F.where) ? F.where : [];
  if (F.about && !Object.values(f.at).some(Boolean)) { const [k, i] = String(F.about).split(':'); if (k && i) f.at[k === 'area' ? 'structure' : k] = i; }

let JOBS_F = (() => { try { return normF(JSON.parse(localStorage.getItem('dwellogs.jobs.f') || '{}')); }

function jobsFiltered(F0) {

  const isOpen = r => OPEN_STATUS.includes(r.status);

     takes what it was saved with, and plain Tasks follows the screen's choice. */

  const homeIds = new Set(myHomes().concat(othersHomes()).map(h => h.id));
  const rows = jobRows().filter(r => {

    else if (!F0.inList && S.mine && !mineIds.has(r.b)) return false;

    if (st === 'broken' && (!isOpen(r) || r.kind !== 'fault')) return false;
    if (st === 'prioritize' && (r.type !== 'job' || !isOpen(r) || r.idea || (r.due && r.who))) return false;
    if (st === 'done' && r.status !== 'done') return false;
    if (st === 'idea' && !r.idea) return false;
    if (F.kinds.length && !F.kinds.some(k => k === 'idea' ? r.idea : r.kind === k)) return false;
    if (F.rep.length && !F.rep.includes(r.source === 'checkup' ? 'yes' : 'no')) return false;
    if (F.who.length && !F.who.some(w => w === 'me' ? r.who === me.id : w === 'nobody' ? !r.who : r.who === w)) return false;
    if (within && !r.subjects.some(i => within.has(i))) return false;

    const d = r.status === 'done' ? r.done : r.due;

      : w === 'next7' ? !!d && r.status !== 'done' && d <= add(7)
      : w === 'next30' ? !!d && r.status !== 'done' && d <= add(30)
      : w === 'past30' ? !!r.done && r.done >= add(-30)

}

async function moveCard(id, rule, mode, col) {
