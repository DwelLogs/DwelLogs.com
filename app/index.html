<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DwelLogs</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eef3f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1726" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>
/* The escape hatch, first thing on the page and deliberately before anything
   that can throw. A service worker that serves a broken app is a broken app
   you cannot reach, so there has to be one URL that always undoes it:
   /app/?fresh=1 unregisters every worker, empties every cache and reloads
   clean. It is the link to text somebody when their phone is stuck. */
if (location.search.indexOf('fresh=1') > -1) {
  (async () => {
    try {
      if ('serviceWorker' in navigator) {
        const rs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(rs.map(r => r.unregister()));
      }
      if (window.caches) {
        const ks = await caches.keys();
        await Promise.all(ks.map(k => caches.delete(k)));
      }
    } catch (e) {}
    location.replace(location.pathname);
  })();
}
</script>
<style>
  :root {
    color-scheme: light;
    --bg:#eef3f7; --card:#ffffff; --ink:#15243a; --muted:#52627a; --line:#d6e0ea;
    --accent:#1f5fa8; --on-accent:#fff; --ok:#1b6b45; --soon:#8a5a00; --attn:#a3311f;
    --ok-bg:#e3f1e9; --soon-bg:#fbeed6; --attn-bg:#fbe4e0; --r:.75rem;
    --placeholder:#7b8798; --trace:#e0893a;
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --bg:#0e1726; --card:#152236; --ink:#e9f0f8; --muted:#9fb0c6; --line:#233450;
    --accent:#6aa8ee; --on-accent:#0e1726; --ok:#7fd3a6; --soon:#f0c674; --attn:#ff9c85;
    --ok-bg:#16301f; --soon-bg:#33270d; --attn-bg:#3a1d17;
    --placeholder:#76869d; --trace:#f0a257;
  } }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  /* viewport-fit=cover means the page really does reach the edges, so the safe
     area has to be paid for at BOTH ends. Only the bottom was, and installed to
     a home screen on a notched phone that put the first 59 pixels of every
     screen underneath the clock -- Randi's "What cools it?" came out as
     "Wh10:42 it?". In a browser tab the chrome hides it; the bug only exists
     for the people who liked it enough to install it. */
  .wrap { max-width:34rem; margin:0 auto; padding-inline:1rem;
          padding-block:calc(1rem + env(safe-area-inset-top,0px))
                        calc(5rem + env(safe-area-inset-bottom,0px)); }
  h1 { font-size:1.5rem; line-height:1.2; margin:.3rem 0 .4rem; }
  h2 { font-size:1rem; margin:1.5rem 0 .5rem; }
  p.sub { color:var(--muted); margin:.2rem 0 1rem; }
  label { display:block; font-weight:600; margin:.9rem 0 .3rem; font-size:.9rem; }
  input, select, button, textarea { font:inherit; color:inherit; min-height:2.75rem;
    border-radius:.6rem; border:1px solid var(--line); background:var(--card); padding:.6rem .8rem; }
  input, select, textarea { width:100%; }
  button { cursor:pointer; width:auto; }
  /* Four weights, each meaning one thing. They used to mean five: .ghost carried
     Save and Remove and Cancel and Add and Back at once, so it stopped saying
     anything and people walked past the button they wanted. */

  /* The one action that finishes the screen. */
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }

  /* Adding another of something. Orange because it is the one colour in the
     palette not already spoken for on a form, and because this is the button
     that has to be seen -- somebody pressed Done without noticing it. */
  button.add { background:transparent; border-color:var(--trace); color:var(--trace);
    font-weight:600; }
  button.add::before { content:'+'; margin-right:.4rem; font-weight:700; }
  button.add:hover { background:color-mix(in srgb, var(--trace) 10%, transparent); }

  /* A real choice that is not the main one. Looks like a button, because it is. */
  button.ghost { background:var(--card); border-color:var(--line); color:var(--accent);
    font-weight:500; }

  /* Undo, dismiss, take away. Present, reachable, and not competing. */
  button.quiet { background:transparent; border-color:transparent; color:var(--muted);
    font-weight:400; }
  button.quiet:hover { color:var(--ink); }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  /* An example that looks like a filled-in value gets skipped, and then the
     form complains about a field the person believes they answered. Two
     signals, not one: a quarter of the ink's contrast (3.65:1 light,
     4.31:1 dark — still legible) AND italic, so it never reads as typed. */
  ::placeholder { color:var(--placeholder); opacity:1; font-style:italic; }
  input.missing, select.missing { border-color:var(--attn); border-width:2px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap }
  /* Two controls stacked with nothing between them had no gap at all — labels
     carry the spacing everywhere else, and where two sit together there is no
     label. The focus ring made it look broken rather than merely tight: 3px of
     outline offset 2px draws five pixels OUTSIDE the box, straight over the top
     of the control beneath. So leave it somewhere to land. */
  input + input, input + select, input + textarea,
  select + input, select + select, select + textarea,
  textarea + input, textarea + select,
  /* A .sr label is invisible but it is still a sibling, so the adjacency above
     silently stopped matching the moment the name boxes got proper labels.
     Two controls with only a hidden label between them are still two controls
     stacked with nothing between them. */
  input + .sr + input, select + .sr + input, textarea + .sr + input,
  input + .sr + select, select + .sr + select { margin-top:.6rem; }
  .tick { display:flex; gap:.6rem; align-items:center; font-weight:400; padding:.35rem 0;
          min-height:2.4rem; }
  .tick input { width:1.25rem; height:1.25rem; min-height:0; flex:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r);
          padding:.85rem .9rem; margin-bottom:.6rem; }
  .card.tap { padding:0; } .card.tap > button { width:100%; text-align:start; border:0;
    background:none; padding:.85rem .9rem; border-radius:var(--r); display:block; }
  .meta { color:var(--muted); font-size:.92rem; margin:.2rem 0 0; }
  .title { font-weight:600; }
  .hint { color:var(--muted); font-size:.85rem; margin:.25rem 0 0; }
  .actions { display:flex; gap:.6rem; flex-wrap:wrap; margin-top:1.1rem; }
  .empty { border:1px dashed var(--line); border-radius:var(--r); padding:1.4rem 1rem;
           text-align:center; color:var(--muted); }
  .chip { display:inline-block; border-radius:999px; padding:.15rem .55rem; font-size:.78rem;
          font-weight:600; border:1px solid; }
  .chip.attn { color:var(--attn); background:var(--attn-bg); border-color:var(--attn); }
  .chip.soon { color:var(--soon); background:var(--soon-bg); border-color:var(--soon); }
  .chip.ok   { color:var(--ok);   background:var(--ok-bg);   border-color:var(--ok); }
  /* Slide a card left to get at Remove. The button stays under it rather than
     replacing it: a gesture nobody discovers must not be the only way, and on a
     desktop there is no swipe at all. */
  .swipe { position:relative; overflow:hidden; border-radius:var(--r, .7rem);
           margin-bottom:.6rem; }
  /* The card carries the gap between cards, so leaving it on would leave the
     panel underneath showing through as a pink sliver below every row. */
  .swipe > .card { position:relative; z-index:1; margin-bottom:0;
                   transition:transform .18s ease; touch-action:pan-y; }
  .swipe.open > .card { transform:translateX(-6rem); }
  .swipe > .under { position:absolute; inset:0 0 0 auto; width:6rem; border:0;
    background:var(--attn-bg); color:var(--attn); font-weight:600; font-size:.95rem;
    display:flex; align-items:center; justify-content:center; cursor:pointer; }
  /* Ten outdoor kinds rendered through icon() came out as ten identical houses,
     because the glyph map falls back to one. A wrong picture is worse than no
     picture, so these are words. */
  .chips { display:flex; flex-wrap:wrap; gap:.4rem; }
  .chips button { border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:999px; padding:.45rem .8rem; font-size:.92rem; font-weight:500;
    min-height:2.4rem; }
  .chips button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent);
    font-weight:600; box-shadow:inset 0 0 0 1px var(--accent); }
  .big { font-size:2.6rem; font-weight:700; line-height:1; display:block; }
  nav.tabs { position:fixed; inset:auto 0 0 0; background:var(--card); border-top:1px solid var(--line);
    display:flex; padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom,0px)); }
  nav.tabs button { flex:1; border:0; background:none; font-weight:600; font-size:.95rem; }
  nav.tabs button[aria-current="page"] { color:var(--accent); text-decoration:underline; }
  #say { position:fixed; inset:auto .75rem calc(4.3rem + env(safe-area-inset-bottom,0px)) .75rem;
    max-width:31rem; margin:0 auto; background:var(--ink); color:var(--bg); border-radius:.6rem;
    padding:.65rem .85rem; font-size:.92rem; z-index:5;
    /* It floats over whatever is underneath, including the buttons at the foot
       of a long screen. A message you did not ask for must never eat the tap
       you did. */
    pointer-events:none; }
  #say:empty { display:none; }
  .step { color:var(--muted); font-size:.8rem; letter-spacing:.06em; text-transform:uppercase;
          font-weight:600; }
  .banner { background:var(--soon-bg); border:1px solid var(--soon); color:var(--soon);
    border-radius:.6rem; padding:.5rem .7rem; font-size:.88rem; margin-bottom:.8rem; }
  [hidden] { display:none !important; }
  /* Two columns at phone width. Six questions stacked one option per line is a
     wall nobody reads to the bottom of; the same options in pairs fit a thumb
     scroll. Falls back to one column when a label is long. */
  /* One column. These labels are sentences of very different lengths, and in a
     grid the row height equalises to the tallest -- so "A basement" sat in a
     block of whitespace next to four wrapped lines and the whole thing read as
     jumbled. A list of sentences is a list. Capped so it does not run the full
     width of a laptop. */
  .opts { display:grid; grid-template-columns:1fr; gap:0; max-width:32rem }
  /* Top-aligned, because a checkbox floating level with the middle of a
     four-line label does not look attached to it. */
  .opts .tick { align-items:flex-start }
  .opts .tick input { margin-top:.45rem }
  .opts > button { grid-column:1/-1; justify-self:start; margin-top:.35rem }
  /* A grid, not wrapped flex: "Carbon monoxide detector" is three lines long and
     wrapped flex let its box drop out of the row. Equal rows, labels top, boxes
     bottom, so the inputs line up whatever the label does. */
  .counts { display:grid; grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr)); gap:.6rem }
  .count { display:flex; flex-direction:column; justify-content:space-between }
  .count span { display:block; font-size:.82rem; color:var(--muted); margin-bottom:.25rem }
  .count input { width:100%; margin:0 }
  /* It belongs to the question ABOVE it. A rule across the top said the
     opposite -- it read as the start of the next section, so "Something else?"
     looked like it was asking about the question underneath. Hung off the left
     instead, which attaches rather than divides. */
  .other { margin:.45rem 0 .2rem; padding:.1rem 0 .1rem .75rem;
           border-left:2px solid var(--line) }
  .other label { font-weight:400; color:var(--muted); font-size:.9rem }
  /* Reasoning belongs one tap away, not in front of somebody who just wants to
     answer the question. Native <details>, so it works with no JS and reads
     correctly to a screen reader. */
  /* .tip is an explanation the screen collects into one block. .disclose is a
     control somebody opens to reach a rarer option. They look the same and
     they are not the same thing. */
  .tip, .disclose { margin:.35rem 0 0 }
  .tip summary, .disclose summary { font-size:.86rem; color:var(--accent); cursor:pointer; list-style:none;
    display:inline-block; padding:.35rem 0; min-height:0 }
  .tip summary::-webkit-details-marker,
  .disclose summary::-webkit-details-marker { display:none }
  .tip summary::before, .disclose summary::before { content:'?'; display:inline-grid; place-items:center;
    width:1.05rem; height:1.05rem; margin-right:.35rem; border-radius:50%;
    border:1px solid currentColor; font-size:.7rem; vertical-align:-.15rem }
  .sub .skiplink::before { content:none }
  .tip[open] summary, .disclose[open] summary { color:var(--muted) }
  .tip p { font-size:.88rem; line-height:1.45; color:var(--muted); margin:.1rem 0 .2rem }
  .step .skiplink, .sub .skiplink { background:none; border:0; padding:.2rem .3rem; min-height:0;
    font:inherit; letter-spacing:inherit; color:var(--accent); text-decoration:underline;
    cursor:pointer }
  .step .skiplink::before { content:'· ' ; text-decoration:none; color:var(--muted) }
  /* Picture buttons. Big enough to hit with a thumb, square so a grid of twelve
     reads as a set rather than a list with pictures stuck on it. */
  .pick { display:grid; grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr)); gap:.6rem;
    margin:.5rem 0 .2rem }
  .pick button { display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:.45rem; padding:.9rem .4rem; min-height:6.2rem; width:100%; background:var(--card);
    border:1px solid var(--line); border-radius:12px; color:var(--ink); cursor:pointer;
    font:inherit; font-size:.86rem; line-height:1.25; text-align:center }
  .pick button:hover { border-color:var(--accent) }
  .pick button[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent) }
  .pick svg { color:var(--accent); flex:none }
  .pick .cap { color:var(--ink) }
  .group { font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
    margin:1.1rem 0 .1rem }
  /* The hub: same tiles, with a line of state under each. */
  .hub { display:grid; grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr)); gap:.6rem; margin:.6rem 0 }
  .hub button { display:flex; flex-direction:column; align-items:flex-start; gap:.4rem;
    padding:.9rem; width:100%; background:var(--card); border:1px solid var(--line);
    border-radius:12px; color:var(--ink); cursor:pointer; font:inherit; text-align:left }
  .hub button:hover { border-color:var(--accent) }
  .hub svg { color:var(--accent) }
  .hub b { font-weight:600; font-size:.95rem }
  .hub small { color:var(--muted); font-size:.83rem; line-height:1.3 }
  .hub .done { color:var(--ok) }
  /* One back, always top-left, on every screen that has somewhere to go back to.
     It was three buttons in three places called three things — Back at the foot
     of the picker, "Not that kind of place" on the hub, Cancel inside a tile. */
  .back { background:none; border:0; padding:.4rem .5rem .4rem 0; margin:0 0 .2rem -.15rem;
    min-height:2.2rem; font:inherit; font-size:.92rem; color:var(--muted); cursor:pointer }
  .back:hover { color:var(--accent) }
  /* The same trace as the site, but this one is generated from the rows. */
  .pulse { margin:.2rem 0 .6rem; height:3.4rem }
  .pulse svg { width:100%; height:100%; display:block; overflow:visible }
  .pulse path { fill:none; stroke:var(--trace); stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke }
  textarea { width:100%; font:inherit; padding:.7rem .8rem; border-radius:var(--r);
    border:1px solid var(--line); background:var(--card); color:var(--ink); resize:vertical }
  textarea::placeholder { color:var(--placeholder); font-style:italic }
  .ctx { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.82rem;
    white-space:pre-wrap; background:var(--card); border:1px solid var(--line);
    border-radius:var(--r); padding:.7rem .8rem; margin:.3rem 0 .2rem; color:var(--muted) }
  /* The way out to the person level. Top-left, where the back button lives on
     every other screen, because that is what it is: back, one level further. */
  .who { display:inline-flex; align-items:center; gap:.4rem; background:none; border:0;
    padding:.35rem .5rem .35rem 0; margin:0 0 .2rem -.1rem; font:inherit; font-size:.92rem;
    color:var(--muted); cursor:pointer }
  .who:hover { color:var(--accent) }
  .who svg { color:var(--accent) }
  .rows .row { display:flex; align-items:center; gap:.7rem; padding:.7rem .9rem;
    border:1px solid var(--line); border-radius:var(--r); background:var(--card); margin:.4rem 0 }
  .rows .row svg { color:var(--accent); flex:none }
  .rows .row b { display:block; font-size:.97rem }
  .rows .row small { color:var(--muted); font-size:.85rem }
  .rows .row .grow { flex:1; min-width:0 }
  .rows details.row summary::-webkit-details-marker { display:none }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<p id="say" role="status" aria-live="polite"></p>

<!-- ?v= bumped whenever api.js changes. The page and the script are cached
     separately, so without this a browser can hold a new page and an old
     script and call a function that is not there yet. Same rule the README
     already states for the icons. -->
<script src="api.js?v=002970ebe9"></script>
<script>
/* Registered after load so it never competes with boot. Failure here is not
   fatal and is not reported: a browser with no service worker support, or a
   page opened from a file, simply gets the app it always got. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0
    && location.search.indexOf('fresh=1') < 0) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
<script>
/* DwelLogs — the sheet-backed app, starting from nothing.
   ------------------------------------------------------------------------
   Deliberately smaller than the prototype. The prototype explores; this one
   only contains what a real person needs to get from an empty account to
   something worth opening tomorrow — which is also the most honest way to
   draw the v1 line. If a screen is not on the path from zero to useful, it
   is not here, and that is the argument for it not being in v1 either. */

const $ = s => document.querySelector(s);
const app = $('#app');
const say = m => { const e = $('#say'); e.textContent = m;
  clearTimeout(say._t); if (m) say._t = setTimeout(() => e.textContent = '', 6000); };
/* The apostrophe is in here for a reason worth keeping. Half the markup in this
   file interpolates into a SINGLE-quoted attribute -- onclick="go('${id}')" --
   and escaping only the double quote leaves that half open. It cost an evening
   once already, as a bug rather than an attack: capJobs('${redraw}') worked on
   the home screen and broke on subject('asset','x1'), because the value's own
   quotes closed the attribute early. Same hole, and the polite version of it
   shows up first. */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
/* Stored addresses are rendered as links, and "javascript:" is a perfectly
   good thing to type into a spreadsheet cell. api.js refuses one at the door;
   this is the second lock, on the one screen that makes a link clickable. */
const safeUrl = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';

/* A save that fails should never be silent. Most save paths catch and say so,
   but not all of them do, and the ones that do not are the ones that looked
   too simple to fail -- which is exactly where a rejected write disappears and
   the screen just sits there having apparently worked. The net is here so that
   the answer to "did that save?" is never nothing at all. */
/* Said in columns, not in counts: "3 values" tells nobody where to look, and
   "reading.value_num" tells them exactly which cell to go and fix. */
function readReport(r) {
  const bits = [];
  if (r.unreadableN)
    bits.push(r.unreadableN + ' value' + (r.unreadableN === 1 ? '' : 's')
      + " in the sheet could not be read (" + (r.unreadable || []).join(', ')
      + ') — shown blank here, still in the sheet.');
  if (r.dropped)
    bits.push(r.dropped + ' row' + (r.dropped === 1 ? '' : 's')
      + ' had no usable id and ' + (r.dropped === 1 ? 'was' : 'were') + ' skipped.');
  return bits.join(' ');
}

window.addEventListener('unhandledrejection', e => {
  const m = (e.reason && e.reason.message) || String(e.reason || '');
  console.error('[DwelLogs] unhandled:', e.reason);
  if (m) say(m.length > 160 ? 'Could not save that.' : m);
});
const uid = () => 'loc-' + Math.random().toString(36).slice(2, 10);
/* Every date in this app is a day on a calendar -- the day you did it, the day
   it is next wanted -- and `toISOString()` is not that. It is the UTC instant,
   so at 6pm in California it already says tomorrow: finish a job on Tuesday
   evening and the history has it on Wednesday. Days are formatted from the
   LOCAL clock, everywhere, and `ymd` is the only place that decides how. */
const ymd = d => [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'),
                  String(d.getDate()).padStart(2, '0')].join('-');
const today = () => ymd(new Date());
/* Move a date on by one turn of a rule. This switch existed in FIVE places --
   the template writer, finishing a job, and three around readings -- and two of
   them only knew months and years, which is how "every 2 weeks" came out due in
   two years. One copy, every unit, and a date that is a local calendar day at
   both ends. */
function rollFrom(from, n, unit) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(from || '').trim());
  const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date();
  const k = Math.max(1, Math.floor(Number(n) || 1));
  ({ day:  () => d.setDate(d.getDate() + k),
     week: () => d.setDate(d.getDate() + k * 7),
     month:() => d.setMonth(d.getMonth() + k),
     year: () => d.setFullYear(d.getFullYear() + k)
   }[unit] || (() => d.setMonth(d.getMonth() + k)))();
  return ymd(d);
}
const inMonths = n => { const d = new Date(); d.setMonth(d.getMonth() + n); return ymd(d); };
/* Randi, 2026-09-29: "the day late is still wrong - it has no date only a
   every 3 months on it." It had a date, and the date was TODAY.

   `new Date('2026-09-29')` is midnight UTC. `new Date()` is right now, where
   she is. Subtract them at 6:32am in California and you get minus thirteen and
   a half hours; round that and today becomes "1 day late". Every rule due
   today read as late from 5am onwards, for everybody west of Greenwich, and
   the further west the earlier it started.

   A due date is a day on a calendar, not an instant. So both sides are
   flattened to a local calendar day first and the subtraction is between two
   midnights -- which is a whole number of days before anything rounds it. */
const daysTo = d => {
  if (!d) return null;
  const s = String(d).trim();
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);

/* Nobody names a shed. They point at it and say "the shed", and the app making
   them type that word is the app asking for something it already knows. So a
   name is never required: it falls back to what the thing IS, and only when
   there are two of them does anything need distinguishing — at which point the
   second becomes "Shed 2" and they can rename it to "the one by the gate" if
   and when that is useful to them. */
function kindLabel(v) {
  const hit = Object.values(KINDS).flat().find(([k]) => k === v);
  return hit ? hit[1] : String(v || '').replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
}
function uniqueName(base, taken) {
  if (!taken.includes(base)) return base;
  let n = 2;
  while (taken.includes(base + ' ' + n)) n++;
  return base + ' ' + n;
}
/* Changing the kind redraws the screen, and a redraw rebuilds it from draft —
   so whatever is typed above has to land in draft first. Third time this bug
   has appeared; every redraw-mid-answer path now keeps what is on screen. */
function keepPlace() {
  ['place','city','region'].forEach(k => {
    const el = $('#f-' + k); if (el) draft[k] = (el.value || '').trim();
  });
}
/* Picking a kind IS the answer to this screen, so it moves on by itself. */
function pickPlace(v) {
  draft.pkind = v;
  draft.kind = v;
  draft.bkind = HOLDS_BUILDINGS.includes(v) ? 'house'
              : ['land','lot'].includes(v) ? '' : (PLACE_IS[v] || 'house');
  // A name we made up follows the kind. A name SHE typed does not — going back
  // and picking farm instead of ranch should not quietly rename "Hollow Creek".
  if (!draft.placeNamed) draft.place = placeLabel(v);
  if (!draft.buildingNamed)
    draft.building = HOLDS_BUILDINGS.includes(v) ? kindLabel(draft.bkind) : draft.place;
  drawHub();
}
function pickedPlace(v) {
  keepPlace();
  draft.pkind = v; draft.kindTouched = true;
  drawFirst();
}
function maybeKind(v) {
  if (draft.kindTouched) return;
  const g = guessPlace(v);
  if (g && $('#f-pk') && $('#f-pk').value !== g) {
    // Redrawing rebuilds the screen from draft, so what is being typed has to
    // land in draft first — otherwise the guess eats the name that triggered it.
    keepPlace(); draft.place = v;
    $('#f-pk').value = g; draft.pkind = g; drawFirst();
    const el = $('#f-place'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}
/* "The Ranch" is a ranch. Guessed from words people actually put in a place
   name, matched on whole words and longest-phrase-wins — so "Tiny house" lands
   on the moving home rather than on "house", and "Mom's place" matches nothing
   at all, which is the right answer. A wrong guess costs more than no guess:
   it is a wrong answer somebody has to notice before they can correct it. */
const PLACE_WORDS = {
  mobile_home:['tiny house','tiny home','mobile home','motorhome','camper','trailer','rv','airstream'],
  boat:['houseboat','sailboat','boat','yacht','slip','marina'],
  smallholding:['smallholding','croft'],
  homestead:['homestead'],
  ranch:['ranch'], farm:['farm'], estate:['estate'], compound:['compound'],
  cabin:['cabin','cottage','chalet','lodge'],
  townhouse:['townhouse','row house','rowhouse'],
  condo:['condo','apartment','flat'],
  rental:['rental'],
  land:['acreage','land'], lot:['lot'],
  house:['house','home']
};
function guessPlace(text) {
  const t = ' ' + String(text || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
  if (t.trim().length < 2) return null;
  let best = null;
  Object.entries(PLACE_WORDS).forEach(([v, words]) => words.forEach(w => {
    if (t.includes(' ' + w + ' ') && (!best || w.length > best.w.length)) best = { v, w };
  }));
  return best ? best.v : null;
}
function otherKind(sel) {
  const box = document.getElementById(sel.id + '-other');
  if (!box) return;
  box.hidden = sel.value !== '__other';
  if (sel.value === '__other') setTimeout(() => box.querySelector('input').focus(), 0);
}

// ---- boot ---------------------------------------------------------------
/* Places this person is actually on. A sheet can hold several and a person is
   not on all of them. */
function myPlaces() {
  if (!me) return DB.property || [];
  const on = new Set((DB.membership || []).filter(m => m.person_id === me.id)
    .map(m => m.property_id));
  return (DB.property || []).filter(p => on.has(p.id));
}
function switchPlace(id) {
  prop = (DB.property || []).find(p => p.id === id) || prop;
  localStorage.setItem('dwellogs.place', prop.id);
  localStorage.removeItem('dwellogs.new');
  show('home');
}
/* ---- links that carry the setup -----------------------------------------
   The invite code alone was useless to the person who most needed it. Somebody
   handed a six-character code still has to find the app, tap "connect to a
   sheet", and paste a URL and a token they were never given — which is exactly
   the wall you put a non-technical husband in front of. So the link carries the
   connection: he taps it and the app is already pointed at the right sheet with
   his invite waiting.

   It goes in the FRAGMENT, after the #, because fragments are never sent to a
   server — not ours, not a proxy's, not a log's. And it is worth being plain
   about what that link is: it holds the sheet's key. Send it the way you would
   send a house key, not the way you would post an address. */
function packLink(obj) {
  return btoa(JSON.stringify(obj)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unpackLink(sTxt) {
  try { return JSON.parse(atob(sTxt.replace(/-/g, '+').replace(/_/g, '/'))); }
  catch (e) { return null; }
}
function handoffLink(extra) {
  /* Whatever is in the address bar when this runs ends up in somebody else's
     hands and stays there, so normalise it instead of copying it. Drop the
     query — a cache-buster or a tracking param would ride along forever — and
     add the trailing slash, because /app redirects but a link handed to a
     person should not need to. (A path with a file extension is left alone:
     that is a local file, which is how the tests open it.) */
  const u = new URL(location.href);
  u.search = ''; u.hash = '';
  if (!/\.[a-z0-9]+$/i.test(u.pathname) && !u.pathname.endsWith('/')) u.pathname += '/';
  const base = u.toString();
  return base + '#j=' + packLink(Object.assign({
    u: localStorage.getItem('dwellogs.url') || '',
    t: localStorage.getItem('dwellogs.token') || '' }, extra || {}));
}
/* Read once, then scrub the address bar: a link this powerful should not sit in
   history or get shared on by a screenshot of the URL. */
function takeHandoff() {
  const m = /^#j=(.+)$/.exec(location.hash || '');
  if (!m) return null;
  const d = unpackLink(m[1]);
  history.replaceState(null, '', location.href.split('#')[0]);
  if (!d) return null;
  if (typeof d.u === 'string') localStorage.setItem('dwellogs.url', d.u);
  if (typeof d.t === 'string') localStorage.setItem('dwellogs.token', d.t);
  if (d.p) localStorage.setItem('dwellogs.me', d.p);
  return d;
}

async function boot() {
  /* Cheap, idempotent, and the browser answers on its own terms -- but it can
     only answer if it is asked, and somebody who set their place up before this
     shipped would never have been. */
  setTimeout(() => { try { askToKeep(); } catch (e) {} }, 1200);
  /* Belt as well as braces. The ?v= on the script tag is the prevention; this is
     what happens when somebody forgets to bump it. A page holding a stale api.js
     fails at the first call into it — uploading a paper, or looking for a device
     log — with a bare "not a function" and no clue that a reload would fix it. */
  const NEEDS = ['configure','load','write','archive','migrate','photo','upload',
                 'shrink','localSnapshot'];
  const missing = NEEDS.filter(f => typeof DwelLogs[f] !== 'function');
  if (missing.length) {
    $('#tabs').hidden = true;
    app.innerHTML = `<h1>Reload this page</h1>
      <p class="sub">Part of the app is a version behind the rest — your browser has kept an
        old copy of one file.</p>
      <div class="card"><span class="title">Nothing is wrong with your log</span>
        <p class="meta">This is a caching hiccup, not a data problem. Pull down to refresh, or
          close the tab and open it again.</p></div>
      <div class="actions">
        <button class="primary" onclick="location.reload()">Reload</button>
      </div>`;
    return;
  }
  const handoff = takeHandoff();
  /* A brand-new person is NOT asked where their data should live. They came to
     look at a home-maintenance app and the first screen used to be a question
     about Apps Script deployments — which is our plumbing showing through, not
     anything they wanted. So: start on the device, silently, and offer the
     sheet from the person screen once there is something worth syncing.
     An absent key still means "never chose"; we just answer it ourselves. */
  if (localStorage.getItem('dwellogs.url') === null)
    localStorage.setItem('dwellogs.url', '');
  const url = localStorage.getItem('dwellogs.url') || '';
  const tok = localStorage.getItem('dwellogs.token') || '';
  /* An address that can never work should not be reported as a network
     failure. "Could not reach that sheet, check three things" sends somebody
     to check their wifi when what they actually have saved is the spreadsheet's
     own URL — which we can see, and can name, without waiting for a timeout. */
  if (url) {
    const bad = connCheck(url);
    if (bad) { connDraft = { u:url, t:tok }; return connect(bad); }
  }
  DwelLogs.configure(url, tok);
  let res;
  try { res = await DwelLogs.load(); }
  catch (e) {
    // Show them the address that is failing. Blank boxes under an error about
    // a sheet they cannot see is how somebody gets stuck on this screen every
    // time they open the app, which is exactly what happened.
    connDraft = { u:url, t:tok };
    return connect(connFail(e));
  }
  DB = res.db;
  // Who you are is remembered, because on a shared sheet the first owner row is
  // not necessarily you — and picking the wrong person silently signs somebody
  // else's name to everything you log.
  const mine = localStorage.getItem('dwellogs.me');
  me = (DB.person || []).find(p => p.id === mine)
    || (DB.person || []).filter(p => p.role === 'owner')[0] || null;
  if (me) localStorage.setItem('dwellogs.me', me.id);
  const last = localStorage.getItem('dwellogs.place');
  prop = myPlaces().find(p => p.id === last) || myPlaces()[0] || (DB.property || [])[0] || null;
  if (prop) localStorage.setItem('dwellogs.place', prop.id);
  if (res.stale) say('Showing the last copy — could not reach the sheet.');
  /* A sheet is a document, and a document gets edited by hand. Somebody types
     "about 40" into a reading, drags a formula down a column of dates, or
     empties an id cell. The app reads what it can and opens either way, and
     this is the one line that stops the rest from being a mystery. */
  const bad = res.read || {};
  if (bad.dropped || bad.unreadableN)
    say(readReport(bad));
  behind = !!res.needsMigration;
  // A link with an invite in it goes straight to the invite, skipping the name
  // screen and the fork — he was sent here for one thing.
  if (handoff && handoff.c) return joinByLink(handoff.c);
  /* Somebody who has been running on this device alone has just pointed the app
     at an empty sheet. Their work is still in localStorage and nothing here can
     see it any more, so without this they land on "Start with your name" and
     conclude the app ate it. */
  if (url && !me && !prop && liftable()) return drawLift();
  if (!me || !prop) return firstRun();
  show('home');
}

/* This screen used to offer two equal buttons and no way to find out what the
   first one wanted. Almost everybody arriving here should run on the device —
   it needs nothing, loses nothing, and can be connected to a sheet later — so
   that is the one that leads, and the sheet gets its own section with a link
   to the instructions. A screen that asks for an address and does not say
   where to get it is a wall with a text box in it. */
let connDraft = { u:'', t:'' };

function connect(msg) {
  $('#tabs').hidden = true;
  // Reached from the person screen rather than from a failure: there is
  // somewhere to go back to, so offer it. Landing here on a bad saved address
  // is the other case, and then there is nothing behind us.
  const back = me ? `<button class="back" onclick="drawMe()">&lsaquo; Back to you</button>` : '';
  app.innerHTML = `${back}<h1>Where should this live?</h1>
    ${msg ? `<div class="banner">${esc(msg)}</div>` : ''}
    <div class="actions" style="margin:.4rem 0 .2rem">
      <button class="primary" onclick="saveConn(true)">Just on this device</button>
    </div>
    <p class="hint">Nothing leaves this device. You can connect a sheet later.</p>

    <h2>Or connect a Google Sheet</h2>
    <p class="sub">Keeps it on your phone and your computer, and lets you share it with
      somebody. About five minutes, once. <a href="setup.html">How to do it</a></p>
    <label for="u">Script URL</label>
    <input id="u" value="${esc(connDraft.u)}" placeholder="https://script.google.com/…/exec">
    <p class="hint">Ends in <code>/exec</code>. Not the sheet&rsquo;s own address.</p>
    <label for="t">Password <span style="font-weight:400;color:var(--muted)">— only if you set one</span></label>
    <input id="t" value="${esc(connDraft.t)}" placeholder="leave blank if you did not">
    <div class="actions">
      <button class="primary" onclick="saveConn()">Connect</button>
      ${localStorage.getItem('dwellogs.url')
        ? `<button class="ghost" onclick="forgetSheet()">Forget this sheet</button>` : ''}
    </div>`;
}

/* Without this there is no way off this screen. A wrong address saved once is
   retried on every open, fails, and greets them with the same error forever —
   with nothing on the page admitting a sheet is even saved. */
function forgetSheet() {
  localStorage.setItem('dwellogs.url', '');
  localStorage.setItem('dwellogs.token', '');
  connDraft = { u:'', t:'' };
  boot();
  say('Back to this device. Nothing you logged was touched.');
}

/* The sheet's own address is the obvious thing to paste and it can never work:
   the app talks to the script published from inside the sheet, not to the
   sheet. Catching that by name here saves the round trip of pasting it,
   waiting, and being told something about our cache. */
function connCheck(u) {
  const bare = u.replace(/[?#].*$/, '').replace(/\/+$/, '');
  if (!u) return 'Put the script address in, or choose “Just on this device”.';
  if (/docs\.google\.com\/spreadsheets/i.test(u))
    return 'That is the sheet itself. The app needs the script published from inside it: in the ' +
           'sheet, Extensions → Apps Script, then Deploy → New deployment → Web app. The address ' +
           'it hands you ends in /exec.';
  if (/script\.google\.com\/.*\/(edit|d\/)/i.test(u))
    return 'That is the script editor. Use Deploy → New deployment → Web app, and paste the ' +
           'address it hands you — it ends in /exec.';
  if (!/^https:\/\//i.test(u)) return 'That does not look like a web address.';
  if (!/\/exec$/i.test(bare))
    return 'That address should end in /exec. Deploy → New deployment → Web app gives you one ' +
           'that does; anything else is a link to the sheet or the editor.';
  return null;
}

/* Whatever they typed survives a rejection. Clearing the box and telling
   somebody they got it wrong is two insults for the price of one. */
function saveConn(local) {
  if (local) {
    localStorage.setItem('dwellogs.url', '');
    localStorage.setItem('dwellogs.token', '');
    return boot();
  }
  connDraft = { u: ($('#u').value || '').trim(), t: ($('#t').value || '').trim() };
  const bad = connCheck(connDraft.u);
  if (bad) return connect(bad);
  localStorage.setItem('dwellogs.url', connDraft.u);
  localStorage.setItem('dwellogs.token', connDraft.t);
  boot();
}

/* What the reader needs is what to do next, not the state of our cache.
   "No data, and nothing cached." is true and useless. */
function connFail(e) {
  const m = String((e && e.message) || e);
  if (/nothing cached/i.test(m))
    return 'Could not reach that sheet. Three things to check: the address is the one Deploy ' +
           'gave you and ends in /exec, Who has access is set to Anyone, and you are online.';
  if (/bad token/i.test(m))
    return 'The sheet answered, but the password did not match the TOKEN set on the script. ' +
           'If you never set one, leave it blank.';
  return 'Could not reach that sheet: ' + m;
}

// ---- first run ----------------------------------------------------------
/* Two flows, not one. A PERSON and a PROPERTY are separate rows joined by a
   membership, and the setup has to say so — otherwise "new user" quietly
   means "new property", and somebody invited to their mother's place gets
   asked what kind of building she lives in.

     signUp      -> who you are. Once, ever.
     fork        -> set up a place, or join one you were invited to.
     PLACE steps -> reused verbatim by "Add a place" later. A second home runs
                    exactly this, minus the person.
     JOIN steps  -> no property is created at all.
*/
let fs = 0, draft = {}, flow = null, hubStep = null;
const FLOW_LABEL = { place:'Setting up a place', join:'Joining a place' };

/* Opened an invite link: name, then the preview. Two taps, no codes typed. */
function joinByLink(code) {
  $('#tabs').hidden = true;
  fs = 0; draft = { code:String(code).toUpperCase() }; flow = 'join'; hubStep = null;
  const inv = lookupInvite(draft.code);
  app.innerHTML = `<p class="step">You have been invited</p>
    <h1>${esc(inv ? 'Join ' + (((DB.property || []).find(p => p.id === inv.property_id) || {}).name
      || 'their place') : 'That invite is not good')}</h1>
    <p class="sub">${inv ? 'First, what should we call you?'
      : 'It may have been used already, revoked, or run out. Ask them for a new link.'}</p>
    ${inv ? `<label for="f-name">Your name</label>
      <input id="f-name" >
      
      <div class="actions"><button class="primary" onclick="tookLinkName()">Next</button></div>`
    : `<div class="actions"><button class="ghost" onclick="firstRun()">Start fresh instead</button></div>`}`;
  if (inv) setTimeout(() => $('#f-name').focus(), 0);
}
function tookLinkName() {
  const n = ($('#f-name').value || '').trim();
  if (!n) { $('#f-name').classList.add('missing'); $('#f-name').focus();
            return say('We need something to put on the log entries.'); }
  draft.name = n;
  const inv = lookupInvite(draft.code);
  draft.invite = inv;
  fs = 1;                       // straight to "here is what you would get"
  drawFirst();
}
function firstRun() { $('#tabs').hidden = true; fs = 0; draft = {}; flow = null; hubStep = null; drawWho(); }

/* Name and door on one screen. They were two, and the first one held a single
   text box — a whole screen to ask one question somebody was always going to
   answer in three seconds. */
function drawWho() {
  $('#tabs').hidden = true;
  app.innerHTML = `<p class="step">Getting started</p>
    <h1>Start with your name.</h1>
    <p class="sub">Every entry says who made it. That is the whole of signing up.</p>
    <label for="f-name">What should we call you?</label>
    <input id="f-name" value="${esc(draft.name || '')}">
    
    <label style="margin-top:1.4rem">And then?</label>
    <div class="card tap"><button onclick="tookWho('place')">
      <span class="title">Set up a new place</span>
      <p class="meta">A house, a ranch, a rental, a boat, a tiny home.</p>
    </button></div>
    <div class="card tap"><button onclick="tookWho('join')">
      <span class="title">Join one that already exists</span>
      <p class="meta">Somebody sent you an invite.</p>
    </button></div>
    `;

function tookWho(f) {
  const n = ($('#f-name').value || '').trim();
  if (!n) { $('#f-name').classList.add('missing'); $('#f-name').focus();
            return say('We need something to put on the log entries.'); }
  draft.name = n;
  startFlow(f);
}

const icon = (k, size = 40) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}"
  fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
  stroke-linejoin="round" aria-hidden="true"><path d="${ICON[k] || ICON.house}"/></svg>`;

/* A ranch is a kind of PLACE. The house on it is a kind of BUILDING. Merging
   the two questions made somebody adding a farm answer "house" first and then
   go hunting for where the barn went — so they are two questions again, and
   the first one decides whether the second is asked at all. */
const PLACES = {
  'It is the one building': [
    ['house','A house'], ['townhouse','A townhouse or row house'],
    ['condo','A condo, flat or apartment'], ['cabin','A cabin or cottage'],
    ['mobile_home','A tiny house, RV or mobile home'], ['boat','A boat'],
    ['rental','a rental']],
  'It has buildings on it': [
    ['ranch','A ranch'], ['farm','A farm'], ['homestead','A homestead'],
    ['smallholding','A smallholding'], ['compound','A property with outbuildings'],
    ['estate','An estate']],
  'Nothing on it yet': [
    ['land','Land'], ['lot','A lot']]
};
/* Which building kind a single-building place implies. Where it is blank the
   place holds buildings and the main one gets its own question. */
const PLACE_IS = { house:'house', townhouse:'townhouse', condo:'apartment',
  cabin:'cabin', mobile_home:'tiny_house', boat:'houseboat', rental:'house' };
const HOLDS_BUILDINGS = ['ranch','farm','homestead','smallholding','compound','estate'];
const placeOptions = sel => Object.entries(PLACES).map(([g, list]) =>
  `<optgroup label="${esc(g)}">${list.map(([v, l]) =>
    `<option value="${v}"${v === sel ? ' selected' : ''}>${esc(l)}</option>`).join('')}</optgroup>`).join('');
/* The option text is written to be READ in a list — "A tiny house, RV or mobile
   home". As a fallback NAME it is absurd, so the short word is kept apart. */
const PLACE_SHORT = { house:'Home', townhouse:'Home', condo:'Home', cabin:'The cabin',
  mobile_home:'Home', boat:'The boat', rental:'Home', ranch:'The ranch', farm:'The farm',
  homestead:'The homestead', smallholding:'The smallholding', compound:'The property',
  estate:'The estate', land:'The land', lot:'The lot' };
function placeLabel(v) { return PLACE_SHORT[v] || 'Home'; }
/* What it IS, for a line that sits under the name — "The ranch · The ranch"
   tells nobody anything. */
function placeKindLabel(v) {
  const hit = Object.values(PLACES).flat().find(([k]) => k === v);
  return hit ? hit[1].replace(/^A /, 'a ').replace(/^An /, 'an ') : 'a place';
}

const PLACE = [
  /* Place and building were two screens, and for a tiny house they were the
     same question asked twice. One screen: what you call it, where it is, and
     what it is. The building takes the same name unless somebody says
     otherwise, which on a ranch they will and in a tiny house they will not. */
  /* One tap. No form. A grid of twelve outlines reads in a second and asks for
     nothing you have to compose — and it is the only thing the app actually
     needs before it can be useful, so it is the only screen before the hub. */
  { t:'What have you got?', s:'Pick the closest. You can change it whenever.',
    noNext:true,
    body: () => Object.entries(PLACES).map(([g, list]) => `<p class="group">${esc(g)}</p>
      <div class="pick">${list.map(([v, l]) => `<button type="button"
        aria-pressed="${draft.pkind === v}" onclick="pickPlace('${v}')">
        ${icon(v, 34)}<span class="cap">${esc(l.replace(/^(A|An) /, ''))}</span>
      </button>`).join('')}</div>`).join(''),
    take: () => draft.pkind ? true : 'Pick one — the closest is close enough.' },

  { t:'Where is it?', s:'The region is what the suggestions below are guessed from.',
    skippable:true,
    field:'#f-region',
    body: () => {
      const g = guessProfile(draft.region, draft.country);
      if (draft.freezes === undefined) draft.freezes = g.freezes;
      draft.hazards = draft.hazards || g.hazards.slice();
      draft.climate = draft.climate || g.climate.slice();
      draft.terrain = draft.terrain || (g.terrain || []).slice();
      /* Touching any of these stops the region guess overwriting them. The guard
         in keepHere() was already written and nothing ever set the flag, so
         typing a region after ticking a few boxes replaced the answers with a
         guess the moment the field lost focus. */
      const tick = (cls, v, on, label) =>
        `<label class="tick"><input type="checkbox" class="${cls}" value="${v}"${on ? ' checked' : ''}
          onchange="draft.profileTouched = true"> ${label}</label>`;
      return `<label for="f-city">Town or city</label>
        <input id="f-city" value="${esc(draft.city || '')}">
        <label for="f-region">State or region</label>
        <input id="f-region" placeholder="two letters is fine" value="${esc(draft.region || '')}"
          onchange="regionChanged()">
        <p class="hint" id="why" style="margin:.8rem 0">${esc(g.why)}</p>
        <label>Climate</label>
        <div class="opts">${CLIMATE
          .map(([k, l]) => tick('cl', k, draft.climate.includes(k), l)).join('')}</div>
        ${tip('Most places are more than one — hot dry summers <i>and</i> mild winters ' +
          '<i>and</i> drought. This list is only what the sky does; where the house sits is the next one.')}

        <label style="margin-top:1.2rem">Where it sits</label>
        <div class="opts">${TERRAIN.map(([k, label]) =>
          tick('tr', k, draft.terrain.includes(k), label)).join('')}</div>
        ${tip('Two houses at the same height in the same county need different work. ' +
          'Sea air eats metal, coils and fasteners. A lake or river means damp and flooding. ' +
          'A valley floor frosts when the hill above it does not, holds smoke, and funnels wind. ' +
          'A ridge takes the wind on its roof and fences. A mountain means snow load and roads that ' +
          'close. Trees mean gutters, roof debris and clearance. Open and flat means hail with ' +
          'nothing in the way.', 'What each one changes')}

        <label for="f-elev" style="margin-top:1.2rem">How high up are you? <span
          style="font-weight:400;color:var(--muted)">— optional</span></label>
        <input id="f-elev" inputmode="numeric" placeholder="feet above sea level"
          value="${draft.elevation == null ? '' : esc(String(draft.elevation))}">
        
        ${tip('Up there gas appliances need a different orifice and sun chews through roofing and ' +
          'finishes faster. Below it, nothing changes — so leaving this blank costs you nothing. ' +
          'It starts blank because nobody has measured it and the app will not guess.')}

        <label for="f-freeze" style="margin-top:1.2rem">Do pipes freeze here in winter?</label>
        <select id="f-freeze">
          <option value="yes"${draft.freezes === 'yes' ? ' selected' : ''}>Yes</option>
          <option value="no"${draft.freezes === 'no' ? ' selected' : ''}>No</option>
          <option value="not_sure_yet"${draft.freezes === 'not_sure_yet' ? ' selected' : ''}>Not sure yet</option>
        </select>
        <p class="hint"><i>Not sure yet</i> is a real answer.</p>
        ${tip('This decides whether you are ever asked to winterise anything. If you have not been ' +
          'here through a winter, say so — the app will ask again once you have.')}

        <label style="margin-top:1.2rem">What can happen here</label>
        <div class="opts">${HAZARD
          .map(([h, l]) => tick('hz', h, draft.hazards.includes(h), l)).join('')}</div>
        ${hazardHints().map(x => `<div class="card" style="margin-top:.6rem">
          <span class="title">${esc(hazLabel(x.h))}?</span>
          <p class="meta">You said ${esc(x.from)}${
            WHY_HAZARD[x.h] ? ' — ' + esc(WHY_HAZARD[x.h]) : ''}.</p>
          <button class="ghost" onclick="takeHazard('${x.h}')">Add it</button></div>`).join('')}
        ${tip('Ticking one offers you a plan for it later. It creates nothing now.')}

        ${otherBox('property.climate', 'Something about the weather here we did not ask?')}`;
    },
    field:'#f-elev',
    take: () => { takeOther(); keepHere();
                  draft.climate = [...document.querySelectorAll('.cl:checked')].map(e => e.value);
                  draft.freezes = $('#f-freeze').value;
                  draft.hazards = [...document.querySelectorAll('.hz:checked')].map(e => e.value);
                  draft.terrain = [...document.querySelectorAll('.tr:checked')].map(e => e.value);
                  const raw = ($('#f-elev').value || '').trim();
                  if (!raw) { draft.elevation = null; return true; }
                  // A number field that silently eats "about 1300 ft" would store
                  // nothing and say it stored something. Say so instead.
                  const n = Number(raw.replace(/[, ]/g, ''));
                  if (!Number.isFinite(n)) return 'Elevation wants a number, or nothing at all.';
                  draft.elevation = n;
                  return true; } },

  { t:'What does it run on?',
    s: () => sysName() + ' — tick what it has. Not sure yet is a real answer.',
    skippable:true,
    body: () => {
      const g = sysGroup();
      const cur0 = sysOf();
      const others = draft.more || [];
      /* A shed on its own tank is not on the house system, and this screen only
         ever asked about the main building -- the others existed in the draft
         with nowhere to put an answer. One row of names, because a barn with a
         sub-panel and an ADU with a water heater under the sink are ordinary. */
      /* Reopened from the hub, hydrate() builds a draft for ONE building and
         `more` is empty -- so this row vanished exactly where it was needed
         most, and changing the subject of the screen meant Done, home, back
         in, pick the other one. Off the real rows in that mode, and switching
         SAVES first, because the ticks already on screen are answers. */
      const picker = draft.reopened
        ? bldChips('What does it run on?', saidSystems)
        : others.length ? `<div class="chips" style="margin:.2rem 0 1rem">
        ${[['', draft.building || 'the main one']].concat(others.map((b2, i) => [String(i), b2.name]))
          .map(([v, l]) => `<button type="button" aria-pressed="${String(draft.sysFor || '') === v}"

            sysSaidDraft(v) ? '' : ' ·'}</button>`).join('')}</div>

          ? `<label class="tick${hidden ? ' extra' : ''}"${hidden ? ' hidden' : ''}><input type="checkbox"

          : `<label class="tick${hidden ? ' extra' : ''}"${hidden ? ' hidden' : ''}><input type="radio"
               name="sy-${sys.k}" class="sy-${sys.k}" value="${o[0]}"${cur === o[0] ? ' checked' : ''}> ${esc(o[1])}</label>`;
        return `<label style="margin-top:1.1rem">${esc(sys.q)}</label>
          <div class="opts">${keep.map(o => one(o, false)).join('')}
          ${rest.length ? rest.map(o => one(o, true)).join('') +
            `<button class="ghost" onclick="showRest(this)">Show the rest</button>` : ''}</div>
          ${otherBox('structure.' + sys.k + otherScope(), 'Another ' + SYS_NOUN[sys.k] + '?')}`;
      }).join('')
        + (['wheels','floating'].includes(g)
          ? tip('A house that moves does not have well water or city water — it has a hose, and what ' +
              'is on the other end changes with the address. Say <i>whatever I am parked next to</i> ' +
              'and the app asks what was there each time you tell it where you have stopped. ' +
              'It still affects you: hook onto a well or a pumped stream and your inline filter is the ' +
              'only thing between that water and your water heater. So the source is kept against the ' +
              'spot, the filter stays yours, and the check on it only comes up on the water that ' +
              'warrants it.', 'What “whatever I am parked next to” does')
          : '')
        + tip('Nothing is ticked for you. What a ' + esc(
        (draft.bkind || '').replace(/_/g,' ') || 'building') + ' cannot physically have is tucked ' +
        'behind <i>show the rest</i> rather than removed — if yours is unusual, it is still there.',
        'Why some are hidden');
    },
    take: () => { takeOther(); const g = sysGroup(), into = {};
      SYSTEMS.filter(sys => !(sys.off || []).includes(g)).forEach(sys => {
        const picked = [...document.querySelectorAll('.sy-' + sys.k + ':checked')].map(e => e.value);
        if (picked.length) into[sys.k] = sys.multi ? picked : picked[0];
      });
      // Only the building on screen. Writing into draft.sys regardless is how
      // the shed's answers would land on the house.
      if (draft.sysFor == null || draft.sysFor === '') draft.sys = into;
      else { const b2 = (draft.more || [])[draft.sysFor]; if (b2) b2.sys = into; }
      return true; } },

/* Somebody who moved in last month genuinely does not know whether the pipes

   browser is still dispatching to, and the next tap anywhere gets swallowed

/* Accepting spends the code, attaches the person, and brings whatever came
   with them. If the inviter had already been logging jobs against their name,
   they become THAT person rather than a second copy of them. */
async function acceptInvite() {
  const inv = draft.invite || {};
  const live = lookupInvite(String(draft.code || '').toUpperCase());
  // Re-checked at the moment of accepting, not only when it was typed. A code
  // revoked while somebody was reading the preview has to fail here.
  if (!live || live.state !== 'sent' || (live.expires_on && live.expires_on < today()))
    throw new Error('that invite is no longer good — ask them for a new code');

  const personId = inv.for_person_id || draft.existingPerson || uid();
  const writes = [];
  const existing = (DB.person || []).find(p => p.id === personId);
  if (existing) {
    // Keep their history; take the name they just gave us if it differs.
    if (draft.name && draft.name !== existing.name)
      writes.push({ op:'upsert', table:'person', record:{ ...existing, name:draft.name } });
  } else {
    writes.push({ op:'upsert', table:'person',
      record:{ id:personId, name:draft.name, role:'resident' } });
  }
  writes.push({ op:'upsert', table:'membership', record:{ id:uid(),
    property_id:inv.property_id, person_id:personId, access:inv.access || 'log',
    scope_structure_id:inv.scope_structure_id || '' } });
  // Land IN the place they were invited to, as themselves — not on whichever
  // property happens to be first in the sheet, and not as its owner.
  localStorage.setItem('dwellogs.me', personId);
  localStorage.setItem('dwellogs.place', inv.property_id);
  localStorage.setItem('dwellogs.new', inv.property_id);
  writes.push({ op:'upsert', table:'invite', record:{ ...live, state:'accepted',
    accepted_on:today(), accepted_by_id:personId } });
  if (inv.their_structure_id) {
    const st = (DB.structure || []).find(x => x.id === inv.their_structure_id);
    if (st) writes.push({ op:'upsert', table:'structure', record:{ ...st,
      responsible_id:personId, visibility:draft.share || 'presence_only' } });
  }
  (draft.animals || []).forEach(a => {
    const animalId = uid();
    writes.push({ op:'upsert', table:'animal', record:{ id:animalId, owner_id:personId,
      property_id:inv.property_id, name:a.name, type:a.type, role:'pet',
      cared_for_by_id:personId, acquired_on:'' } });
    writes.push({ op:'upsert', table:'placement', record:{ id:uid(), animal_id:animalId,
      property_id:inv.property_id, arrived_on:today(),
      note:'Came with ' + (draft.name || 'them') } });
  });
  await DwelLogs.write(writes);
}

/* A thing and the check-ups its template carries. Written three times over --

/* The rooms this draft describes, as area rows. Setup calls it with nothing on
   the books; the same screen reopened later calls it with rooms already there.
   So it is keyed by NAME and it only ever adds: reopening the rooms screen and
   pressing Done must not make a second Kitchen, and lowering a count is not a
   demolition order. Removing a room is its own decision, made on the room. */
function areaWrites(structId) {
  const out = [], byName = {};

    .forEach(a => { byName[a.name] = a.id; });
  const add = rec => { if (byName[rec.name]) return null;
    byName[rec.name] = rec.id; out.push({ op:'upsert', table:'area', record:rec }); return rec.id; };
  (draft.spaces || []).forEach(k => {
    const def = SPACES.find(x => x[0] === k);
    if (!def || !def[2]) return;          // a slab is not a room you can stand in
    add({ id:uid(), structure_id:structId, name:AREA_NAME[k] || k, kind:def[2] });
  });
  ROOMS.forEach(r => {
    const n = (draft.rooms || {})[r[0]] || 0;

  writes.push(
    { op:'upsert', table:'property', record:{ id:propId, name:draft.place, kind:draft.kind,
        city:draft.city, region:draft.region, country:draft.country || 'United States',
        currency:'USD', units:'imperial', acquired_on:today(),
        climate:(draft.climate || []).join(', '), freezes:draft.freezes || 'not_sure_yet',
        hazards:(draft.hazards || []).join(', '),
        terrain:(draft.terrain || []).join(', '),
        elevation: draft.elevation == null ? '' : draft.elevation,
        /* Confirmed only when a person actually said so. Unknown gets a date to

           region GUESS fills in, so the guess confirmed itself. Type a state,
           never scroll down, leave: three hazards on the record and a date
           saying somebody agreed to them. `profileTouched` is the only value
           here that means a person went near the screen. */

          draft.profileTouched && draft.freezes !== 'not_sure_yet' ? today() : '',
        profile_review_on:
          draft.profileTouched && draft.freezes !== 'not_sure_yet' ? '' : inMonths(4) } },
    { op:'upsert', table:'membership', record:{ id:uid(), property_id:propId,
        person_id:personId, access:'owner' } });
