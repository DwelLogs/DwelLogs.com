<script>
/* The escape hatch, first thing on the page and deliberately before anything
   that can throw. A service worker that serves a broken app is a broken app
   you cannot reach, so there has to be one URL that always undoes it:
   /app/?fresh=1 unregisters every worker, empties every cache and reloads
   clean. It is the link to text somebody when their phone is stuck. */
if (location.search.indexOf('fresh=1') > -1) {
  (async () => {
    try {
      if ('serviceWorker' in navigator) {
        const rs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(rs.map(r => r.unregister()));
      }
      if (window.caches) {
        const ks = await caches.keys();
        await Promise.all(ks.map(k => caches.delete(k)));
      }
    } catch (e) {}
    location.replace(location.pathname);
  })();
}
</script>
<style>

  * { box-sizing:border-box; }

  /* An example that looks like a filled-in value gets skipped, and then the

  ::placeholder { color:var(--placeholder); opacity:1; font-style:italic; }

  .tick { display:flex; gap:.6rem; align-items:center; font-weight:400; padding:.35rem 0;

    display:flex; padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom,0px)); }
  nav.tabs button { flex:1; border:0; background:none; font-weight:600; font-size:.95rem; }
  nav.tabs button[aria-current="page"] { color:var(--accent); text-decoration:underline; }
  #say { position:fixed; inset:auto .75rem calc(4.3rem + env(safe-area-inset-bottom,0px)) .75rem;
    max-width:31rem; margin:0 auto; background:var(--ink); color:var(--bg); border-radius:.6rem;

  [hidden] { display:none !important; }
  /* Two columns at phone width. Six questions stacked one option per line is a

  .opts { display:grid; grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr)); gap:0 .8rem }
  .opts > button { grid-column:1/-1; justify-self:start; margin-top:.35rem }
  /* A grid, not wrapped flex: "Carbon monoxide detector" is three lines long and
     wrapped flex let its box drop out of the row. Equal rows, labels top, boxes

  .count { display:flex; flex-direction:column; justify-content:space-between }

  .count input { width:100%; margin:0 }
  .other { margin-top:.9rem; padding-top:.7rem; border-top:1px dashed var(--line) }
  .other label { font-weight:400; color:var(--muted); font-size:.9rem }
  /* Reasoning belongs one tap away, not in front of somebody who just wants to

  .tip { margin:.35rem 0 0 }

    display:inline-block; padding:.35rem 0; min-height:0 }

  .step .skiplink, .sub .skiplink { background:none; border:0; padding:.2rem .3rem; min-height:0;

  /* Picture buttons. Big enough to hit with a thumb, square so a grid of twelve

  .pick svg { color:var(--accent); flex:none }

  .group { font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);

  .back:hover { color:var(--accent) }

<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<p id="say" role="status" aria-live="polite"></p>

<!-- ?v= bumped whenever api.js changes. The page and the script are cached
     separately, so without this a browser can hold a new page and an old
     script and call a function that is not there yet. Same rule the README
     already states for the icons. -->
<script src="api.js?v=440ec54c59"></script>
<script>
/* Registered after load so it never competes with boot. Failure here is not
   fatal and is not reported: a browser with no service worker support, or a
   page opened from a file, simply gets the app it always got. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0
    && location.search.indexOf('fresh=1') < 0) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
<script>
/* DwelLogs — the sheet-backed app, starting from nothing.
   ------------------------------------------------------------------------
   Deliberately smaller than the prototype. The prototype explores; this one
   only contains what a real person needs to get from an empty account to
   something worth opening tomorrow — which is also the most honest way to
   draw the v1 line. If a screen is not on the path from zero to useful, it
   is not here, and that is the argument for it not being in v1 either. */

const $ = s => document.querySelector(s);
const app = $('#app');
const say = m => { const e = $('#say'); e.textContent = m;
  clearTimeout(say._t); if (m) say._t = setTimeout(() => e.textContent = '', 6000); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const uid = () => 'loc-' + Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);
const inMonths = n => { const d = new Date(); d.setMonth(d.getMonth() + n);
                        return d.toISOString().slice(0, 10); };
const daysTo = d => d ? Math.round((new Date(d) - new Date()) / 864e5) : null;

let DB = null, me = null, prop = null, screen = 'home', behind = false;

/* The starter catalogue. Templates ship WITH the app — a first thing has to
   bring its check-ups with it or the first screen teaches nothing. Kept small
   on purpose: every type here is one somebody has to have got right. */
/* A stand-in for a sourced dataset. It exists to prove the SHAPE — the app
   offers, a person confirms, and profile_confirmed_on records that they did.
   A real version needs a licensed climate/hazard source that can be named on
   screen. Never a guess presented as a fact about somebody's house, and never
   a risk score the owner cannot argue with. */
const REGIONS = {
  ca:{ climate:['hot_dry_summer','mild_winter','arid'], freezes:'no',
       hazards:['wildfire','drought','earthquake'], terrain:[],
       why:'California — usually hot dry summers with mild winters, wildfire and drought, and earthquake country.' },
  or:{ climate:['wet_winter','mild_winter'], freezes:'yes', hazards:['wildfire','earthquake'], terrain:[],
       why:'Oregon — wet winters, wildfire through the dry months.' },
  wa:{ climate:['wet_winter'], freezes:'yes', hazards:['wildfire','earthquake','flood'], terrain:['coastal'],
       why:'Washington — wet, wildfire inland, earthquake risk.' },
  fl:{ climate:['humid_subtropical'], freezes:'no', hazards:['hurricane','flood'], terrain:['coastal'],
       why:'Florida — humid, hurricanes, flooding.' },
  tx:{ climate:['hot_dry_summer','mild_winter'], freezes:'yes', hazards:['tornado','hail','drought'], terrain:['open_plain'],
       why:'Texas — hot, tornado and hail, and a freeze that catches people out.' },
  mn:{ climate:['cold_winter'], freezes:'yes', hazards:['ice_storm','flood'], terrain:[],
       why:'Minnesota — real winters. Freezing pipes are the main event.' },
  ma:{ climate:['cold_winter'], freezes:'yes', hazards:['ice_storm','flood'], terrain:['coastal'],
       why:'Massachusetts — cold winters, ice storms, coastal flooding.' },
  co:{ climate:['cold_winter','arid'], freezes:'yes', hazards:['wildfire','hail','drought'], terrain:['mountain'],
       why:'Colorado — hail, wildfire, hard freezes.' }
};
function guessProfile(region, country) {
  const hit = REGIONS[String(region || '').trim().toLowerCase().slice(0, 2)];
  if (hit) return hit;
  return { climate:[], freezes:'not_sure_yet', hazards:[], terrain:[],
    why:'Nothing known about ' + (region || country || 'there') + ' yet, so nothing is assumed. Tick what you know.' };
}

/* Grouped because a flat list of forty is unreadable, and grouped THIS way
   because the groups are what differ in practice: a home that moves has tyres
   and a registration, an outbuilding usually has no plumbing, an area has no
   roof at all. Official taxonomies were little help — the US Census lumps
   "mobile homes or trailers, tents, and boats" together, because it is built
   for counting units rather than looking after them. */
/* Climate is what the sky does, elevation is a number, terrain is how the
   ground treats the house. Every value below changes actual work — that is the
   bar for being on the list. No "inland": inland is what you are when you have
   not ticked coastal, and a none-of-the-above option gets ticked by everyone
   and means nothing. */
const TERRAIN = [
  ['coastal',          'by the sea'],
  ['lakeside',         'on a lake'],
  ['riverside',        'on a river or creek'],
  ['valley_floor',     'valley floor'],
  ['ridge_or_exposed', 'a ridge, or exposed'],
  ['mountain',         'mountain'],
  ['wooded',           'in trees'],
  ['open_plain',       'open and flat']
];

/* Plain words, because "arid" is a geography word and nobody describes their
   own back yard with it. Every label here has to survive being read out loud
   to somebody who has never used the app. */
const CLIMATE = [
  ['hot_dry_summer',    'hot dry summers'],
  ['mild_winter',       'mild winters'],
  ['cold_winter',       'cold winters'],
  ['wet_winter',        'wet winters'],
  ['humid_subtropical', 'warm and humid most of the year'],
  ['arid',              'dry all year — very little rain']
];
const HAZARD = [
  ['wildfire','wildfire'], ['flood','flooding'], ['earthquake','earthquakes'],
  ['hurricane','hurricanes'], ['tornado','tornadoes'], ['ice_storm','ice storms'],
  ['drought','drought'], ['hail','hail']
];

/* Every extensible list ends with this. The list is never going to be complete
   — an attached greenhouse, a cistern, a swamp buggy — and the fastest way to
   find out what is missing is to let people say it in their own words and
   count how often the same word comes back. Nothing types itself into the
   list: a count is evidence, a person decides. That last part is what keeps a
   thoughtful addition thoughtful and a joke out of the picklist. */
/* Short line on the screen, the reason behind it. */
function tip(text, label) {
  return `<details class="tip"><summary>${esc(label || 'Why we ask')}</summary>
    <p>${text}</p></details>`;
}
function otherBox(key, label) {
  draft.other = draft.other || {};
  // The key carries a dot ("structure.water") because that is what it means.
  // The id cannot — a dot in a CSS selector is a class.
  const id = 'ot-' + key.replace(/\W/g, '-');
  return `<div class="other"><label for="${id}">${esc(label || 'Something else?')}</label>
    <input id="${id}" class="otv" data-k="${key}" placeholder="in your own words"
      value="${esc(draft.other[key] || '')}">
    ${tip('If enough people write the same thing, it becomes a real option. Somebody reads them ' +
       'first — nothing is added automatically.', 'What happens to this')}</div>`;
}
function takeOther() {
  draft.other = draft.other || {};
  document.querySelectorAll('.otv').forEach(e => {
    const v = (e.value || '').trim();
    if (v) draft.other[e.dataset.k] = v; else delete draft.other[e.dataset.k];
  });
}

/* She typed "tiny house" for the place, then the next screen asked her to
   classify it. She had already said it. Match what she wrote against the list
   and preselect it — and say on screen that is what happened, so the answer is
   still hers to change rather than something that quietly filled itself in. */
function guessKind(text) {
  const t = String(text || '').toLowerCase().trim();
  if (!t) return null;
  let hit = null;
  Object.values(KINDS).flat().forEach(([v, label]) => {
    const l = label.toLowerCase();
    const words = [v.replace(/_/g, ' '), l, l.split(/ or | ,|,/)[0]];
    words.forEach(w => {
      if (!w || w.length < 3) return;
      if (t === w || t.includes(w)) { if (!hit || w.length > hit.w.length) hit = { v, label, w }; }
    });
  });
  return hit;
}

/* ---- calibrating by kind ------------------------------------------------
   The rule, and it is narrow on purpose: kind may REORDER and may REMOVE what
   cannot physically exist. It may never tick anything, and it may never imply
   a hookup — a treehouse with power and a barn without are both ordinary, and
   structure.kind says exactly that. A houseboat is not asked about a basement
   because it cannot have one. A tiny house IS still asked about a crawlspace,
   because plenty sit on blocks over one. Anything hidden stays one tap away
   behind "show the rest", so an unusual place is never locked out of its own
   answer. An unrecognised kind — including whatever somebody typed into
   "other" — filters NOTHING, because we know nothing. */
const WHEELS   = ['tiny_house','mobile_home','rv','camper_van','travel_trailer',
                  'bus_conversion','park_model'];
const FLOATING = ['houseboat','sailboat'];
const SOFT     = ['yurt','treehouse'];
const HOMES    = ['house','townhouse','apartment','duplex_unit','adu','cabin','cottage'];
const OUTBUILD = ['detached_garage','carport','shed','workshop','barn','pole_barn','stable',
                  'attached_garage','deck','porch','patio','balcony','sunroom','breezeway','carport_attached',
                  'greenhouse','pump_house','root_cellar','boathouse','pool_house','studio',
                  'guest_cabin','coop','animal_pen','kennel','silo','warehouse'];
const LANDISH  = ['garden','orchard','pasture','yard','driveway','dock','pool_area',
                  'septic_field','well_site','fence_line'];
/* The group the later screens filter by. A bare lot has no building at all, so
   the building kind cannot answer it — the place kind has to. */
function flowGroup() {
  if (['land','lot'].includes(draft.pkind)) return 'land';
  return kgroup(draft.bkind);
}
function kgroup(k) {
  if (WHEELS.includes(k))   return 'wheels';
  if (FLOATING.includes(k)) return 'floating';
  if (SOFT.includes(k))     return 'soft';
  if (HOMES.includes(k))    return 'home';
  if (OUTBUILD.includes(k)) return 'outbuilding';
  if (LANDISH.includes(k))  return 'land';
  return 'unknown';   // filters nothing

  if (!me) return DB.property || [];

    .map(m => m.property_id));
  return (DB.property || []).filter(p => on.has(p.id));
}
function switchPlace(id) {
  prop = (DB.property || []).find(p => p.id === id) || prop;
  localStorage.setItem('dwellogs.place', prop.id);
  localStorage.removeItem('dwellogs.new');

/* ---- links that carry the setup -----------------------------------------
   The invite code alone was useless to the person who most needed it. Somebody
   handed a six-character code still has to find the app, tap "connect to a
   sheet", and paste a URL and a token they were never given — which is exactly
   the wall you put a non-technical husband in front of. So the link carries the
   connection: he taps it and the app is already pointed at the right sheet with
   his invite waiting.

   It goes in the FRAGMENT, after the #, because fragments are never sent to a
   server — not ours, not a proxy's, not a log's. And it is worth being plain
   about what that link is: it holds the sheet's key. Send it the way you would
   send a house key, not the way you would post an address. */
function packLink(obj) {
  return btoa(JSON.stringify(obj)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unpackLink(sTxt) {
  try { return JSON.parse(atob(sTxt.replace(/-/g, '+').replace(/_/g, '/'))); }
  catch (e) { return null; }
}
function handoffLink(extra) {
  /* Whatever is in the address bar when this runs ends up in somebody else's
     hands and stays there, so normalise it instead of copying it. Drop the
     query — a cache-buster or a tracking param would ride along forever — and
     add the trailing slash, because /app redirects but a link handed to a
     person should not need to. (A path with a file extension is left alone:
     that is a local file, which is how the tests open it.) */
  const u = new URL(location.href);
  u.search = ''; u.hash = '';
  if (!/\.[a-z0-9]+$/i.test(u.pathname) && !u.pathname.endsWith('/')) u.pathname += '/';
  const base = u.toString();
  return base + '#j=' + packLink(Object.assign({
    u: localStorage.getItem('dwellogs.url') || '',
    t: localStorage.getItem('dwellogs.token') || '' }, extra || {}));
}
/* Read once, then scrub the address bar: a link this powerful should not sit in
   history or get shared on by a screenshot of the URL. */
function takeHandoff() {
  const m = /^#j=(.+)$/.exec(location.hash || '');
  if (!m) return null;
  const d = unpackLink(m[1]);
  history.replaceState(null, '', location.href.split('#')[0]);
  if (!d) return null;
  if (typeof d.u === 'string') localStorage.setItem('dwellogs.url', d.u);
  if (typeof d.t === 'string') localStorage.setItem('dwellogs.token', d.t);
  if (d.p) localStorage.setItem('dwellogs.me', d.p);
  return d;
}

async function boot() {
  /* Belt as well as braces. The ?v= on the script tag is the prevention; this is
     what happens when somebody forgets to bump it. A page holding a stale api.js
     fails at the first call into it — uploading a paper, or looking for a device
     log — with a bare "not a function" and no clue that a reload would fix it. */
  const NEEDS = ['configure','load','write','archive','migrate','photo','upload',
                 'shrink','localSnapshot'];
  const missing = NEEDS.filter(f => typeof DwelLogs[f] !== 'function');
  if (missing.length) {
    $('#tabs').hidden = true;
    app.innerHTML = `<h1>Reload this page</h1>
      <p class="sub">Part of the app is a version behind the rest — your browser has kept an
        old copy of one file.</p>
      <div class="card"><span class="title">Nothing is wrong with your log</span>
        <p class="meta">This is a caching hiccup, not a data problem. Pull down to refresh, or
          close the tab and open it again.</p></div>
      <div class="actions">
        <button class="primary" onclick="location.reload()">Reload</button>
      </div>`;
    return;
  }
  const handoff = takeHandoff();
  /* A brand-new person is NOT asked where their data should live. They came to
     look at a home-maintenance app and the first screen used to be a question
     about Apps Script deployments — which is our plumbing showing through, not
     anything they wanted. So: start on the device, silently, and offer the
     sheet from the person screen once there is something worth syncing.
     An absent key still means "never chose"; we just answer it ourselves. */
  if (localStorage.getItem('dwellogs.url') === null)
    localStorage.setItem('dwellogs.url', '');
  const url = localStorage.getItem('dwellogs.url') || '';
  const tok = localStorage.getItem('dwellogs.token') || '';
  /* An address that can never work should not be reported as a network
     failure. "Could not reach that sheet, check three things" sends somebody
     to check their wifi when what they actually have saved is the spreadsheet's
     own URL — which we can see, and can name, without waiting for a timeout. */
  if (url) {
    const bad = connCheck(url);
    if (bad) { connDraft = { u:url, t:tok }; return connect(bad); }
  }
  DwelLogs.configure(url, tok);
  let res;
  try { res = await DwelLogs.load(); }
  catch (e) {
    // Show them the address that is failing. Blank boxes under an error about
    // a sheet they cannot see is how somebody gets stuck on this screen every
    // time they open the app, which is exactly what happened.
    connDraft = { u:url, t:tok };
    return connect(connFail(e));
  }
  DB = res.db;
  // Who you are is remembered, because on a shared sheet the first owner row is
  // not necessarily you — and picking the wrong person silently signs somebody
  // else's name to everything you log.
  const mine = localStorage.getItem('dwellogs.me');
  me = (DB.person || []).find(p => p.id === mine)
    || (DB.person || []).filter(p => p.role === 'owner')[0] || null;
  if (me) localStorage.setItem('dwellogs.me', me.id);
  const last = localStorage.getItem('dwellogs.place');
  prop = myPlaces().find(p => p.id === last) || myPlaces()[0] || (DB.property || [])[0] || null;
  if (prop) localStorage.setItem('dwellogs.place', prop.id);
  if (res.stale) say('Showing the last copy — could not reach the sheet.');
  behind = !!res.needsMigration;
  // A link with an invite in it goes straight to the invite, skipping the name
  // screen and the fork — he was sent here for one thing.
  if (handoff && handoff.c) return joinByLink(handoff.c);
  /* Somebody who has been running on this device alone has just pointed the app
     at an empty sheet. Their work is still in localStorage and nothing here can
     see it any more, so without this they land on "Start with your name" and
     conclude the app ate it. */
  if (url && !me && !prop && liftable()) return drawLift();
  if (!me || !prop) return firstRun();
  show('home');
}

        ? `<button class="ghost" onclick="forgetSheet()">Forget this sheet</button>` : ''}
    </div>`;
}

/* Without this there is no way off this screen. A wrong address saved once is
   retried on every open, fails, and greets them with the same error forever —
   with nothing on the page admitting a sheet is even saved. */
function forgetSheet() {
  localStorage.setItem('dwellogs.url', '');
  localStorage.setItem('dwellogs.token', '');
  connDraft = { u:'', t:'' };
  boot();
  say('Back to this device. Nothing you logged was touched.');
}

/* The sheet's own address is the obvious thing to paste and it can never work:
   the app talks to the script published from inside the sheet, not to the
   sheet. Catching that by name here saves the round trip of pasting it,
   waiting, and being told something about our cache. */
function connCheck(u) {
  const bare = u.replace(/[?#].*$/, '').replace(/\/+$/, '');
  if (!u) return 'Put the script address in, or choose “Just on this device”.';
  if (/docs\.google\.com\/spreadsheets/i.test(u))
    return 'That is the sheet itself. The app needs the script published from inside it: in the ' +
           'sheet, Extensions → Apps Script, then Deploy → New deployment → Web app. The address ' +
           'it hands you ends in /exec.';
  if (/script\.google\.com\/.*\/(edit|d\/)/i.test(u))
    return 'That is the script editor. Use Deploy → New deployment → Web app, and paste the ' +
           'address it hands you — it ends in /exec.';
  if (!/^https:\/\//i.test(u)) return 'That does not look like a web address.';
  if (!/\/exec$/i.test(bare))
    return 'That address should end in /exec. Deploy → New deployment → Web app gives you one ' +
           'that does; anything else is a link to the sheet or the editor.';
  return null;
}

/* Whatever they typed survives a rejection. Clearing the box and telling
   somebody they got it wrong is two insults for the price of one. */
function saveConn(local) {
  if (local) {
    localStorage.setItem('dwellogs.url', '');
    localStorage.setItem('dwellogs.token', '');
    return boot();
  }
  connDraft = { u: ($('#u').value || '').trim(), t: ($('#t').value || '').trim() };
  const bad = connCheck(connDraft.u);
  if (bad) return connect(bad);
  localStorage.setItem('dwellogs.url', connDraft.u);
  localStorage.setItem('dwellogs.token', connDraft.t);
  boot();
}

/* What the reader needs is what to do next, not the state of our cache.
   "No data, and nothing cached." is true and useless. */
function connFail(e) {
  const m = String((e && e.message) || e);
  if (/nothing cached/i.test(m))
    return 'Could not reach that sheet. Three things to check: the address is the one Deploy ' +
           'gave you and ends in /exec, Who has access is set to Anyone, and you are online.';
  if (/bad token/i.test(m))
    return 'The sheet answered, but the password did not match the TOKEN set on the script. ' +
           'If you never set one, leave it blank.';
  return 'Could not reach that sheet: ' + m;
}

/* Somebody who moved in last month genuinely does not know whether the pipes
   freeze, and a guess entered now is worse than a recorded unknown — it
   silently switches off every winterising prompt with nobody aware of it.
   So: take nothing, set a date, and ask once when they have actually been
   through a season here. */
/* Redraws on this screen have to keep the two text fields, same as everywhere
   else. Changing the region reguesses the climate, and reguessing redraws. */
/* Redrawing from inside the field's own change event replaces the element the
   browser is still dispatching to, and the next tap anywhere gets swallowed
   putting the focus right. So: take the value now, redraw on the next tick. */
/* No re-render. Typing a region reguesses the climate, and rebuilding the
   screen under somebody's fingers flashes, loses focus, and — as it turned out
   — queues a redraw that fires after they have already tapped Done. Tick the
   boxes in place instead: same result, nothing moves. */
function regionChanged() {
  const was = draft.region;
  keepHere();
  if (draft.region === was) return;
  const set = (cls, vals) => document.querySelectorAll('.' + cls).forEach(el => {
    el.checked = vals.includes(el.value);
  });
  set('cl', draft.climate || []);
  set('hz', draft.hazards || []);
  set('tr', draft.terrain || []);
  const f = $('#f-freeze'); if (f) f.value = draft.freezes || 'not_sure_yet';
  const why = $('#why'); if (why) why.textContent = guessProfile(draft.region, draft.country).why;
}
function keepHere() {
  const c = $('#f-city'), r = $('#f-region');
  if (c) draft.city = (c.value || '').trim();
  if (r) draft.region = (r.value || '').trim();
  // A new region means the old guess was about somewhere else.
  if (r && draft.guessedFor !== draft.region) {
    const g = guessProfile(draft.region, draft.country);
    if (!draft.profileTouched) {
      draft.climate = g.climate.slice(); draft.hazards = g.hazards.slice();
      draft.terrain = (g.terrain || []).slice(); draft.freezes = g.freezes;
    }
    draft.guessedFor = draft.region;
  }
}
function newHere() {
  draft.climate = []; draft.hazards = []; draft.terrain = [];
  draft.freezes = 'not_sure_yet'; draft.askLater = true;
  fs++; drawFirst();
  say('Nothing assumed. The app will ask again once you have had a season here.');
}

    // Keep their history; take the name they just gave us if it differs.
    if (draft.name && draft.name !== existing.name)
      writes.push({ op:'upsert', table:'person', record:{ ...existing, name:draft.name } });
  } else {
    writes.push({ op:'upsert', table:'person',
      record:{ id:personId, name:draft.name, role:'resident' } });
  }
  writes.push({ op:'upsert', table:'membership', record:{ id:uid(),
    property_id:inv.property_id, person_id:personId, access:inv.access || 'log',
    scope_structure_id:inv.scope_structure_id || '' } });
  // Land IN the place they were invited to, as themselves — not on whichever
  // property happens to be first in the sheet, and not as its owner.
  localStorage.setItem('dwellogs.me', personId);
  localStorage.setItem('dwellogs.place', inv.property_id);
  localStorage.setItem('dwellogs.new', inv.property_id);
  writes.push({ op:'upsert', table:'invite', record:{ ...live, state:'accepted',
    accepted_on:today(), accepted_by_id:personId } });
  if (inv.their_structure_id) {
    const st = (DB.structure || []).find(x => x.id === inv.their_structure_id);
    if (st) writes.push({ op:'upsert', table:'structure', record:{ ...st,
      responsible_id:personId, visibility:draft.share || 'presence_only' } });
  }
  (draft.animals || []).forEach(a => {
    const animalId = uid();
    writes.push({ op:'upsert', table:'animal', record:{ id:animalId, owner_id:personId,
      property_id:inv.property_id, name:a.name, type:a.type, role:'pet',
      cared_for_by_id:personId, acquired_on:'' } });
    writes.push({ op:'upsert', table:'placement', record:{ id:uid(), animal_id:animalId,
      property_id:inv.property_id, arrived_on:today(),
      note:'Came with ' + (draft.name || 'them') } });
  });
  await DwelLogs.write(writes);
}

/* The whole point of starting empty: this is every table a new person touches,
   and therefore the v1 core. Nine of them. */
async function createEverything() {
  // Joining is not setting up. It creates no place, no building and no
  // check-ups — it attaches a person to somebody else's place and stops.
  if (flow === 'join') return acceptInvite();
  const personId = draft.existingPerson || uid(), propId = uid(), structId = uid();
  const writes = [];
  if (!draft.existingPerson)
    writes.push({ op:'upsert', table:'person', record:{ id:personId, name:draft.name, role:'owner' } });
  writes.push(
    { op:'upsert', table:'property', record:{ id:propId, name:draft.place, kind:draft.kind,
        city:draft.city, region:draft.region, country:draft.country || 'United States',
        currency:'USD', units:'imperial', acquired_on:today(),
        climate:(draft.climate || []).join(', '), freezes:draft.freezes || 'not_sure_yet',
        hazards:(draft.hazards || []).join(', '),
        terrain:(draft.terrain || []).join(', '),
        elevation: draft.elevation == null ? '' : draft.elevation,
        // Confirmed only when a person actually said so. Unknown gets a date
        // to be asked again, not a blank that nags every time the app opens.
        profile_confirmed_on: draft.freezes === 'not_sure_yet' ? '' : today(),
        profile_review_on: draft.freezes === 'not_sure_yet' ? inMonths(4) : '' } },
    { op:'upsert', table:'membership', record:{ id:uid(), property_id:propId,
        person_id:personId, access:'owner' } });
  // Nothing on it yet means no building row. An empty lot with a phantom
  // "Main house" on it is a lie the app would then keep asking questions about.
  const bare = ['land','lot'].includes(draft.pkind);
  if (!bare)
    writes.push({ op:'upsert', table:'structure', record:{ id:structId, property_id:propId,
      name:draft.building,
      kind: draft.bkind === '__other' ? 'other' : draft.bkind,
      kind_other: draft.bkindOther || '' } });

  (draft.more || []).forEach(b => {
    writes.push({ op:'upsert', table:'structure', record:{ id:uid(), property_id:propId,
      name:b.name, kind: b.kind === '__other' ? 'other' : b.kind,
      attached_to_id: b.attached ? structId : '',
      // Opt-in, not opt-out. Somebody else's building starts closed and they
      // open it, rather than starting open and hoping they notice.
      visibility: b.theirs ? 'presence_only' : 'shared' } });
  });

  // Templates ship with the app, written once into this property's catalogue.
  const catIds = {}, typeIds = {};
  Object.entries(STARTER).forEach(([cat, list]) => {
    const cid = catIds[cat] = uid();
    writes.push({ op:'upsert', table:'category', record:{ id:cid, name:cat } });
    list.forEach(([tname, checks]) => {
      const tid = typeIds[tname] = uid();
      writes.push({ op:'upsert', table:'asset_type',
        record:{ id:tid, category_id:cid, name:tname, source:checks[0][3] } });
    });
  });

  // The systems answers land in TWO places on purpose. The structure field is a
  // fact about the building — "city water" is true and creates nothing to
  // service. The asset is a thing with a maintenance life. Neither is derivable
  // from the other, so both get written, and an unanswered question writes
  // 'not_sure_yet' rather than a default nobody chose.
  const sys = draft.sys || {};
  const structRec = (writes.find(w => w.table === 'structure') || { record:{} }).record;
  SYSTEMS.forEach(q => {
    const v = sys[q.k];
    structRec[q.k] = v == null ? 'not_sure_yet' : (q.multi ? v.join(', ') : v);
  });
  structRec.spaces = (draft.spaces || []).join(', ');
  structRec.visibility = 'shared';   // the one you set up is your own
  structRec.people_living = draft.people == null ? '' : draft.people;
  structRec.children_here = draft.kids || '';
  structRec.heated = (sys.heat || []).some(h => h !== 'none') ? 'TRUE' : '';

  // Areas first, so a thing can land in one.
  const areaIds = {};
  (draft.spaces || []).forEach(k => {
    const def = SPACES.find(x => x[0] === k);
    if (!def || !def[2]) return;          // a slab is not a room you can stand in
    const id = uid(); areaIds[k] = id;
    writes.push({ op:'upsert', table:'area', record:{ id, structure_id:structId,
      name:AREA_NAME[k] || k, kind:def[2] } });
  });
  // One room with corners inside it, not three rooms pretending to be separate.
  if (draft.openPlan) {
    const mainId = uid();
    writes.push({ op:'upsert', table:'area', record:{ id:mainId, structure_id:structId,
      name:draft.mainRoom || 'Main room' } });
    (draft.corners || []).forEach(c => {
      writes.push({ op:'upsert', table:'area', record:{ id:uid(), structure_id:structId,
        name:c, parent_area_id:mainId } });
    });
  }
  ROOMS.forEach(r => {
    if (draft.openPlan && r[0] !== 'bathrooms') return;
    const n = (draft.rooms || {})[r[0]] || 0;
    for (let i = 1; i <= n; i++)
      writes.push({ op:'upsert', table:'area', record:{ id:uid(), structure_id:structId,
        name:r[1].replace(/s$/, '') + (n > 1 ? ' ' + i : ''), kind:r[2] } });
  });

  // One asset per thing, each carrying its template's check-ups.
  const made = [];
  function addThing(typeName, name, powered, allowMore, areaId) {
    if (!typeIds[typeName]) return null;
    // Ticking the dryer on one screen and naming it as the problem on the next
    // is ONE dryer. If the second mention brought a better name, keep the name
    // and drop the duplicate — never end the first run with two of a thing
    // somebody owns one of.
    if (!allowMore) {
      const already = made.find(m => m.type === typeName);
      if (already) { if (name) already.rec.name = name; return already.rec.id; }
    }
    const id = uid();
    const rec = { id, property_id:propId, structure_id:structId,
      asset_type_id:typeIds[typeName], name:name || typeName, area_id: areaId || '',
      status:'active', power_source:powered || '' };
    writes.push({ op:'upsert', table:'asset', record:rec });
    Object.values(STARTER).flat().filter(x => x[0] === typeName)[0][1]
      .forEach(([title, n, unit, src, whenSource]) => {
        // An arrival check-up has no date. It is due when she pulls up somewhere
        // new, and a made-up date would only make it look overdue in the meantime.
        if (unit === 'arrival') {
          writes.push({ op:'upsert', table:'schedule', record:{ id:uid(), asset_id:id,
            title, kind:'on_arrival', responsibility:'owner', cost_source:'entered',
            muted: picked(typeName, title) ? '' : 'TRUE',
            interval_source:src, applies_when_source:(whenSource || []).join(', ') } });
          return;
        }
        const due = new Date();
        if (unit === 'month') due.setMonth(due.getMonth() + n); else due.setFullYear(due.getFullYear() + n);
        /* Unticked does not mean deleted. The rule is still written, muted, so it
           can be turned back on without retyping and so the app never quietly
           forgets what a water heater needs. */
        writes.push({ op:'upsert', table:'schedule', record:{ id:uid(), asset_id:id,
          title, kind:'interval', every_n:n, every_unit:unit, responsibility:'owner',
          cost_source:'entered', next_due_on:due.toISOString().slice(0, 10),
          muted: picked(typeName, title) ? '' : 'TRUE',
          interval_source:src, applies_when_source:(whenSource || []).join(', ') } });
      });
    made.push({ type:typeName, rec });
    return id;
  }
  SYSTEMS.forEach(q => {
    const v = sys[q.k]; if (!v) return;
    const picked = q.multi ? v : [v];
    picked.forEach(val => {
      const o = q.o.find(x => x[0] === val); if (!o) return;
      o[2].forEach(tn => addThing(tn, null, q.k === 'heat' ? val : ''));
    });
  });
  if (draft.parkedAt || draft.stayKind || Object.values(draft.here || {}).some(v => v.length))
    writes.push({ op:'upsert', table:'placement', record:{ id:uid(), structure_id:structId,
      property_id:propId, address:draft.parkedAt || '', arrived_on:today(),
      stay_kind:draft.stayKind || 'not_sure_yet',
      water:(draft.here.water || []).join(', '), waste:(draft.here.waste || []).join(', '),
      power:(draft.here.power || []).join(', ') } });

  (draft.household || []).forEach(name =>
    writes.push({ op:'upsert', table:'person', record:{ id:uid(), name, role:'resident' } }));
  (draft.animals || []).forEach(a => {
    const animalId = uid();
    writes.push({ op:'upsert', table:'animal', record:{ id:animalId, property_id:propId,
      name:a.name, type:a.type, role:'pet', acquired_on:'' } });
    writes.push({ op:'upsert', table:'placement', record:{ id:uid(), animal_id:animalId,
      property_id:propId, arrived_on:today() } });
  });

  // Counts, so three fridges are three rows. Each gets its own check-ups,
  // because the one in the garage and the one in the kitchen do not share a
  // filter change.
  /* Areas are already in `writes` by now, so their generated ids can be found
     by the name the picker offered. Names are unique within a plan. */
  const areaByName = {};
  writes.forEach(w => { if (w.table === 'area') areaByName[w.record.name] = w.record.id; });

  const units = {}, perRoom = {};
  Object.entries(draft.things || {}).forEach(([tn, n]) => {
    for (let i = 1; i <= n; i++) {
      const room = n > 1 ? ((draft.where || {})[tn + '#' + i] || '') : '';
      let nm;
      if (room) {
        /* Named after where it is, which is how she says it out loud. Two in
           the SAME room still need telling apart, so those keep a number. */
        const c = perRoom[tn + '|' + room] = (perRoom[tn + '|' + room] || 0) + 1;
        nm = room + ' ' + tn.toLowerCase() + (c > 1 ? ' ' + c : '');
      } else nm = n > 1 ? tn + ' ' + i : tn;
      const id = addThing(tn, nm, '', true, room ? (areaByName[room] || '') : '');
      if (id) units[tn + '#' + i] = id;
    }
  });
  made.forEach(m => { if (!units[m.type + '#1']) units[m.type + '#1'] = m.rec.id; });

  /* ONE table now. "Clean the gutters this week" and "the dryer works sometimes"
     are the same row with a different kind, which is the whole point of the
     merge: they end up on the same board, opened by the same screen, and the
     person can change their mind about which it is by editing one field.
     The asset is guessed from the words and never demanded. */
  (draft.jobs || []).forEach(j => {
    const key = guessThing(j.title);
    const fault = j.kind === 'fault';
    const jid = uid();
    let schedId = '';
    /* A repeat set during setup is the same rule the job screen would make, so
       the very first "mark it done" rolls it forward and puts the next one on
       the list. Without this the repeat would have been a note to nobody. */
    if (j.rep === 'yes') {
      schedId = uid();
      writes.push({ op:'upsert', table:'schedule', record:{ id:schedId,
        asset_id: key ? (units[key] || '') : '', structure_id:structId, title:j.title,
        kind: j.answer === 'reading' ? 'reading' : 'interval',
        every_n: j.every_n || 6, every_unit: j.every_unit || 'month',
        next_due_on: j.due_on || today() } });
    }
    writes.push({ op:'upsert', table:'job', record:{ id:jid, property_id:propId,
      kind: j.kind || 'task', title:j.title, notes:j.notes || '',
      source:'owner', status:'open', schedule_id:schedId,
      asset_id: key ? (units[key] || '') : '', structure_id:structId,
      start_on: j.start_on || '', due_on: j.due_on || '',
      est_minutes: j.est_minutes || '', est_cost: j.est_cost || '',
      prerequisites: j.prerequisites || '', safety: j.safety || 'none',
      first_seen_on: fault ? today() : '',
      state: fault ? (j.state || 'degraded') : '',
      workaround: fault ? (j.workaround || '') : '',
      reported_on: fault ? (j.reported_on || '') : '',
      reply: fault ? (j.reply || '') : '',
      now:  j.kind === 'improvement' ? (j.now  || '') : '',
      want: j.kind === 'improvement' ? (j.want || '') : '',
      slot: (!fault && !j.due_on) ? 'this_week' : '',
      column: fault ? 'investigating' : 'todo' } });
    (j.steps || []).forEach((st, n) => writes.push({ op:'upsert', table:'step',
      record:{ id:uid(), job_id:jid, text:st.text, position:n + 1,
               done: st.done ? 'TRUE' : '' } }));
  });

  // What nothing on our lists could say. One row per word, counted, and never
  // promoted without a person reading it.
  // Each typing carries WHERE it was typed, because that is the part that cannot
  // be reconstructed later and the part that decides the answer. "Forty people
  // asked for a cistern" and "thirty-eight of them are on boats" are different
  // findings, and only the second says where to put it. The tally across rows
  // is the server's job; the client only ever reports its own one.
  const ctxKind = draft.bkind === '__other' ? (draft.bkindOther || 'other') : draft.bkind;
  const ctxGroup = kgroup(draft.bkind);
  const suggest = (obj, field, typed) => writes.push({ op:'upsert', table:'suggestion',
    record:{ id:uid(), object:obj, field, typed, normalised:typed.toLowerCase().trim(),
      property_id:propId, count:1, context_kind:ctxKind, context_group:ctxGroup,
      by_kind:ctxKind + ':1', first_seen_on:today(), last_seen_on:today(), status:'new' } });
  Object.entries(draft.other || {}).forEach(([k, typed]) => {
    const [obj, field] = k.split('.'); suggest(obj, field, typed);
  });
  if (draft.bkindOther) suggest('structure', 'kind', draft.bkindOther);

  await DwelLogs.write(writes);
}

// ---- the app ------------------------------------------------------------
const byId = t => Object.fromEntries((DB[t] || []).map(r => [r.id, r]));
function schedules() {
  const A = byId('asset');
  /* Code.gs already skips muted rules when it builds the digest; the home
     screen was still listing them, which would have made unticking look like
     it did nothing. */
  const isMuted = s => s.muted === true || String(s.muted).toUpperCase() === 'TRUE';
  return (DB.schedule || []).filter(s => s.status !== 'archived' && !isMuted(s)).map(s => {
    const d = daysTo(s.next_due_on);
    return { ...s, thing:(A[s.asset_id] || {}).name || '—', d,
      state: d == null ? 'ok' : d <= 0 ? 'attn' : d <= 14 ? 'soon' : 'ok' };
  }).sort((a, b) => (a.d ?? 1e6) - (b.d ?? 1e6));
}

function show(s) {
  screen = s;
  $('#tabs').hidden = false;
  $('#tabs').innerHTML = [['home','Home'],['add','Add'],['log','Log']]
    .map(([k, l]) => `<button onclick="show('${k}')" aria-current="${k === s ? 'page' : 'false'}">${l}</button>`).join('');
  ({ home: drawHome, add: drawAdd, log: drawLog })[s]();
  window.scrollTo(0, 0);
}


/* ---- the pulse ----------------------------------------------------------
   The line on the site is drawn by hand. This one is drawn by YOUR HOUSE: one
   motif per thing you track, in the order you added them, with its height set
   by how close that thing is to needing you. Two people never get the same
   line, and yours changes as the place does — which is the whole idea, a pulse
   being a reading rather than a decoration.

   The motifs are the same visual language as the site: a baseline with events
   on it, some borrowed from a heart trace and some from the thing itself. A
   well gets a pump curve. A septic tank gets a square wave. Anything that
   burns gets a flame spike. */
const MOTIF = {
  'Water & well':   (x, w, a) => `L${x} 0 C${x + w * .25} ${-a} ${x + w * .75} ${-a} ${x + w} 0`,
  'Septic & sewer': (x, w, a) => `L${x} 0 L${x} ${-a * .7} L${x + w * .5} ${-a * .7} L${x + w * .5} 0 L${x + w} 0`,
  'Heating & fuel': (x, w, a) => `L${x + w * .2} 0 L${x + w * .35} ${-a} L${x + w * .5} ${a * .35} L${x + w * .65} ${-a * .6} L${x + w * .8} 0 L${x + w} 0`,
  'Power':          (x, w, a) => `L${x + w * .25} 0 L${x + w * .45} ${-a} L${x + w * .4} ${-a * .3} L${x + w * .6} ${-a * .3} L${x + w * .55} ${a * .4} L${x + w * .75} 0 L${x + w} 0`,
  'Cooling':        (x, w, a) => `L${x} 0 Q${x + w * .25} ${-a} ${x + w * .5} 0 Q${x + w * .75} ${a * .5} ${x + w} 0`,
  'Appliances':     (x, w, a) => `L${x + w * .2} 0 L${x + w * .2} ${-a * .6} L${x + w * .45} ${-a * .6} L${x + w * .45} 0 L${x + w * .6} 0 L${x + w * .6} ${-a * .35} L${x + w * .8} ${-a * .35} L${x + w * .8} 0 L${x + w} 0`,
  'Safety':         (x, w, a) => `L${x + w * .4} 0 L${x + w * .5} ${-a} L${x + w * .6} 0 L${x + w} 0`,
  _default:         (x, w, a) => `L${x + w * .3} 0 L${x + w * .4} ${-a * .5} L${x + w * .5} ${a * .25} L${x + w * .6} 0 L${x + w} 0`
};
/* Height says how close it is to wanting you. Nothing overdue means a calm
   line, which is a true reading and not a reward. */
const AMP = { attn: 30, soon: 18, ok: 9 };

function pulsePath(width) {
  const things = (DB.asset || []).filter(a => a.status !== 'archived');
  if (!things.length) {
    // An empty place has a heartbeat, not a flat line. It is alive and there is
    // simply nothing on it yet.
    const m = width / 2;
    return `M0 0 L${m - 14} 0 L${m - 8} -4 L${m - 2} 14 L${m + 4} -22 L${m + 10} 8 L${m + 16} 0 L${width} 0`;
  }
  const byType = Object.fromEntries((DB.asset_type || []).map(t => [t.id, t]));
  const byCat  = Object.fromEntries((DB.category || []).map(c => [c.id, c.name]));
  const worst = {};
  schedules().forEach(s => {
    const r = { attn: 3, soon: 2, ok: 1 }[s.state] || 1;
    if (!worst[s.asset_id] || r > worst[s.asset_id]) worst[s.asset_id] = r;
  });
  const shown = things.slice(0, 9);
  const w = width / shown.length;
  let d = 'M0 0 ';
  shown.forEach((a, i) => {
    const t = byType[a.asset_type_id], cat = t ? byCat[t.category_id] : null;
    const draw = MOTIF[cat] || MOTIF._default;
    const state = { 3:'attn', 2:'soon', 1:'ok' }[worst[a.id] || 1];
    d += draw(i * w, w, AMP[state]) + ' ';
  });
  return d + `L${width} 0`;
}
function pulseSvg() {
  const W = 320;
  return `<div class="pulse" aria-hidden="true"><svg viewBox="0 -34 ${W} 60"
    preserveAspectRatio="none" role="presentation">
    <path d="${pulsePath(W)}"/></svg></div>`;
}

/* iOS only runs a service worker for a page added to the home screen; in plain
   Safari the app has no offline copy at all. So this is not a nicety on iPhone,
   it is how somebody gets the app that works in a basement. Asked once, and
   never again once dismissed or once they have done it. */
function wantsHomeScreen() {
  if (localStorage.getItem('dwellogs.a2hs') === 'no') return false;
  const standalone = window.navigator.standalone === true
    || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (standalone) return false;
  const ua = navigator.userAgent || '';
  const ios = /iPad|iPhone|iPod/.test(ua)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  return ios;
}
function noHomeScreen() { localStorage.setItem('dwellogs.a2hs', 'no'); drawHome(); }

function drawHome() {
  const sch = schedules(), now = sch.filter(x => x.state === 'attn'), soon = sch.filter(x => x.state === 'soon');
  const things = (DB.asset || []).filter(a => a.status !== 'archived');
  const places = myPlaces(), fresh = localStorage.getItem('dwellogs.new');
  app.innerHTML = `<button class="who" onclick="drawMe()">${icon('person', 18)}
      <span>${esc(me.name)}</span></button>
    ${places.length > 1 ? `<div class="pick" style="margin-bottom:.8rem">${places.map(p =>
      `<button type="button" aria-pressed="${p.id === prop.id}" onclick="switchPlace('${p.id}')">
        ${icon(p.kind, 26)}<span class="cap">${esc(p.name)}${
          p.id === fresh ? '<br><span class="chip soon">new</span>' : ''}</span>
      </button>`).join('')}</div>` : ''}
    <h1>${esc(prop.name)}</h1>
    ${pulseSvg()}
    <p class="sub">${esc(prop.city || '')}${prop.city ? ' · ' : ''}${
      things.length ? things.length + ' thing' + (things.length === 1 ? '' : 's') + ' tracked'
                    : 'nothing tracked yet'}</p>
    <span class="big">${now.length}</span>
    <p class="title">${now.length === 1 ? 'thing needs you now' : 'things need you now'}</p>
    ${now.concat(soon).map(card).join('') ||
      `<div class="empty">Nothing due. That is a real state, not an empty one.</div>`}
    ${(() => {
      /* Jobs that are not a rule coming due \u2014 what somebody typed in, or a fault
         they logged. Without this they are written and then invisible, which is
         how the needs-doing screen has been quietly dropping things. */
      const loose = (DB.job || []).filter(x => String(x.status) !== 'done'
        && String(x.status) !== 'dropped' && !x.schedule_id);
      if (!loose.length) return '';
      const who = Object.fromEntries((DB.person || []).map(pp => [pp.id, pp.name]));
      return `<h2>On your list</h2>` + loose.map(x => `<div class="card tap">
        <button onclick="drawJob('${x.id}')">
          <span class="title">${esc(x.title)}</span>
          <p class="meta">${esc((JOB_KIND.find(k => k[0] === x.kind) || [])[1] || 'Job')}${
            x.due_on ? ' &middot; due ' + esc(x.due_on) : x.slot
              ? ' &middot; ' + esc((WHENS.find(w => w[0] === x.slot) || [])[1] || x.slot) : ''}${

/* The order that decides what a screen is allowed to claim:
     1. two completions here  -> the measured gap, and we say so
     2. somebody set it       -> theirs
     3. the book              -> the manual, the code, our estimate
   The household never produces a NUMBER. When nothing has been measured yet and
   there are more people here than the book assumed, it gets to say one sentence
   and no more — and the first logged replacement retires it for good. */
function intervalBasis(sched) {
  const done = (DB.history || []).filter(h => h.schedule_id === sched.id && h.done_on)
    .map(h => h.done_on).sort();
  if (done.length >= 2) {
    const a = new Date(done[done.length - 2]), b = new Date(done[done.length - 1]);
    const days = Math.round((b - a) / 86400000);
    return { source:'own_history', says:'Yours: about ' + days + ' days last time.' };
  }
  const st = (DB.structure || []).find(s => s.id === sched.structure_id) ||
             (DB.structure || [])[0] || {};
  const n = Number(st.people_living || 0);
  const book = { manufacturer:'the manual', code:'code', our_estimate:'our estimate' }[sched.interval_source];
  if (!done.length && n > 2 && book && sched.interval_source !== 'owner')
    return { source:sched.interval_source, says:'This is ' + book + '\u2019s figure. ' + n +
      ' people live here, so it may not last that long \u2014 the first time you replace it, ' +
      'we will know instead of guessing.' };
  return { source:sched.interval_source,
           says:book ? 'From ' + book + '.' : 'You set this one.' };
}

/* A job claimed three weeks ago and untouched is a different fact from one
   claimed this morning. The board should be able to say so without anybody
   doing arithmetic. */
function sinceWords(at) {
  if (!at) return '';
  const d = Math.round((Date.now() - new Date(at)) / 864e5);
  if (isNaN(d)) return '';
  if (d <= 0) return 'since today';
  if (d === 1) return 'since yesterday';
  if (d < 7) return 'for ' + d + ' days';
  if (d < 14) return 'for a week';
  if (d < 60) return 'for ' + Math.round(d / 7) + ' weeks';
  return 'for ' + Math.round(d / 30) + ' months';
}

  const steps  = live ? stepsOf(id) : (j.steps || []);
  const isDone = s => live ? String(s.done).toUpperCase() === 'TRUE' : !!s.done;
  const done   = steps.filter(isDone).length;
  const rep    = live ? repOn(j) : j.rep === 'yes';
  const sched  = live ? (DB.schedule || []).find(x => x.id === j.schedule_id) : null;
  const everyN = live ? ((sched || {}).every_n    || '6')     : (j.every_n    || '6');
  const everyU = live ? ((sched || {}).every_unit || 'month') : (j.every_unit || 'month');
  const kindGo = live ? `reKind('${id}', this.value)`               : 'reKindDraft(this.value)';
  const repGo  = live ? `draft.rep = this.value; drawJob('${id}')`  : 'setRepDraft(this.value)';
  const stepGo = live ? `addStep('${id}')`                          : 'addStepDraft()';
  const kind   = j.kind || 'task';
  /* Tyre pressure, vacuum, propane, mite counts: plenty of repeating jobs are
     answered with a NUMBER, not a tick. Saying so here makes the rule a reading
     rule, and a reading rule sends you to the reading screen when it comes due
     instead of to a checkbox with nowhere to put the answer. */
  const answerKind = live
    ? ((sched && sched.kind === 'reading') ? 'reading' : (j.answer || 'tick'))
    : (j.answer || 'tick');

  return `
    <label for="jb-t">Name</label>
    <input id="jb-t" value="${esc(j.title || '')}" placeholder="what you would call it">
    <label for="jb-k">What kind of thing is this?</label>
    <select id="jb-k" onchange="${kindGo}">${optList(kind, JOB_KIND.map(k => [k[0], k[1]]))}</select>
    <p class="hint">${esc((JOB_KIND.find(k => k[0] === kind) || [])[2] || '')}</p>

    <label for="jb-n">Notes</label>
    <textarea id="jb-n" rows="3" placeholder="anything worth remembering next time">${esc(j.notes || '')}</textarea>

    <h2>Steps${steps.length ? ` <span class="chip ${done === steps.length ? 'ok' : 'soon'}">${done} of ${steps.length}</span>` : ''}</h2>
    ${steps.length ? `<div class="rows">${steps.map((st, n) => `<div class="row">
      <label class="tick" style="flex:1;min-width:0">
        <input type="checkbox" ${isDone(st) ? 'checked' : ''}
          onchange="${live ? `tickStep('${st.id}','${id}',this.checked)` : `tickStepDraft(${n},this.checked)`}">
        <span${isDone(st) ? ' style="text-decoration:line-through;color:var(--muted)"' : ''}>${esc(st.text)}</span>
      </label>
      <button class="ghost" style="min-height:2rem;padding:.25rem .6rem"
        onclick="${live ? `dropStep('${st.id}','${id}')` : `dropStepDraft(${n})`}">Remove</button></div>`).join('')}</div>` : ''}
    <input id="jb-step" placeholder="add a step &mdash; borrow the ladder"
      onkeydown="if(event.key==='Enter'){event.preventDefault();${stepGo}}">
    <div class="actions" style="margin-top:.5rem">
      <button class="ghost" onclick="${stepGo}">Add step</button></div>

    <h2>When</h2>
    <label for="jb-s">Start</label>
    <input id="jb-s" type="date" value="${esc(j.start_on || '')}">
    <label for="jb-d">Due</label>
    <input id="jb-d" type="date" value="${esc(j.due_on || '')}">
    <label for="jb-r">Does it come round again?</label>
    <select id="jb-r" onchange="${repGo}">
      <option value=""${!rep ? ' selected' : ''}>No &mdash; just this once</option>
      <option value="yes"${rep ? ' selected' : ''}>Yes, on a repeat</option>
    </select>
    ${rep ? `<div class="counts" style="grid-template-columns:1fr 2fr">
      <div class="count"><span>Every</span>
        <input id="jb-en" inputmode="numeric" value="${esc(everyN)}"></div>
      <div class="count"><span>&nbsp;</span>
        <select id="jb-eu">${optList(everyU, EVERY_UNIT)}</select></div>
    </div>
    <label for="jb-ans">What does doing it look like?</label>
    <select id="jb-ans">${optList(answerKind, ANSWER_KIND)}</select>` : ''}`;
}

/* Reads whatever of the form is on screen. The fault and improvement tails are
   only in the DOM when that kind is selected, so a missing field is left alone
   rather than blanked. */
function readJobFields() {
  const v = k => { const el = $(k); return el ? (el.value || '').trim() : ''; };
  const num = x => { const n = Number(x); return Number.isFinite(n) && n > 0 ? n : ''; };
  const out = { kind: v('#jb-k') || 'task', title: v('#jb-t'), notes: v('#jb-n'),
    start_on: v('#jb-s'), due_on: v('#jb-d'),
    est_minutes: num(v('#jb-m')), est_cost: num(v('#jb-c')),
    prerequisites: v('#jb-p'), safety: v('#jb-sf') || 'none',
    rep: ($('#jb-r') && $('#jb-r').value === 'yes') ? 'yes' : '',
    every_n: num(v('#jb-en')) || 6, every_unit: v('#jb-eu') || 'month',
    answer: v('#jb-ans') || 'tick' };
  if (out.kind === 'fault') Object.assign(out, { state: v('#jb-st') || 'degraded',
    workaround: v('#jb-wa'), reported_on: v('#jb-ro'), reply: v('#jb-rp') });
  if (out.kind === 'improvement') Object.assign(out, { now: v('#jb-now'), want: v('#jb-want') });
  return out;
}

/* ---- the setup side of that form -------------------------------------- */
function blankEntry() { return { kind:'task', steps:[] }; }
/* Every redraw of the setup screen goes through here first, so nothing typed
   is lost when the kind changes or a step is added. This screen has dropped
   half-typed rows once before. */
function syncEntry() {
  if (!$('#jb-t')) return;
  const steps = (draft.entry || {}).steps || [];
  draft.entry = readJobFields();
  draft.entry.steps = steps;
}
function reKindDraft(k)  { syncEntry(); draft.entry.kind = k; drawFirst(); }
function setRepDraft(v)  { syncEntry(); draft.entry.rep = v;  drawFirst(); }
function addStepDraft() {
  const el = $('#jb-step'), t = (el.value || '').trim();
  if (!t) return say('Type the step first.');
  syncEntry(); draft.entry.steps.push({ text:t, done:false }); drawFirst();
}
function dropStepDraft(n) { syncEntry(); draft.entry.steps.splice(n, 1); drawFirst(); }
function tickStepDraft(n, on) {
  const s = ((draft.entry || {}).steps || [])[n]; if (s) s.done = !!on;
}
function jobWhenWords(j) {
  const bits = [];
  if (j.due_on) bits.push('due ' + j.due_on);
  if (j.rep === 'yes') bits.push('every ' + (j.every_n || 6) + ' ' +
    ((EVERY_UNIT.find(u => u[0] === (j.every_unit || 'month')) || [0, 'months'])[1]));
  if (j.kind === 'fault' && !bits.length) bits.push('something is wrong');
  if (!bits.length) bits.push('no date yet');
  return bits.join(' · ');
}
function addJob() {
  syncEntry();
  const e = draft.entry;
  if (!e || !e.title) return say('Say what needs doing first.');
  draft.jobs = draft.jobs || [];
  if (draft.editing != null) { draft.jobs[draft.editing] = e; draft.editing = null;
    say(e.title + ' updated.'); }
  else { draft.jobs.push(e); say(e.title + ' is on the list.'); }
  draft.entry = blankEntry();
  drawFirst();
}
function editJob(i) {
  syncEntry();
  /* Tapping Edit with something half-typed keeps it rather than binning it.
     Appending leaves index i where it was. */
  if (draft.editing == null && draft.entry && draft.entry.title) draft.jobs.push(draft.entry);
  draft.editing = i;
  draft.entry = JSON.parse(JSON.stringify(draft.jobs[i] || blankEntry()));
  drawFirst();
}
function cancelEditJob() { draft.editing = null; draft.entry = blankEntry(); drawFirst(); }
function dropJob(i) {
  (draft.jobs || []).splice(i, 1);
  if (draft.editing === i) { draft.editing = null; draft.entry = blankEntry(); }
  else if (draft.editing != null && draft.editing > i) draft.editing--;
  drawFirst();
}

function repOn(j) {
  if (draft.rep !== undefined) return draft.rep === 'yes';
  const sc = (DB.schedule || []).find(x => x.id === j.schedule_id);
  return !!(sc && sc.every_n && sc.kind !== 'once');
}

/* Nothing is folded. An earlier draft hid time, cost and what-you-need behind a
   drawer to keep the screen short, and Randi called it: "if they want to fill it
   all out its there vs making them go back in later to add more to it." She is
   right, and it is the opposite of the first-run lesson rather than a
   contradiction of it. First run is a stranger being asked for things before
   they have seen anything; this is somebody who has ALREADY decided to open one
   job and tell it what they know. Making them hunt for a second click to say
   "this needs a ladder" is how that detail never gets written down. */
function moreSection(j, sel) {
  const fault = j.kind === 'fault', imp = j.kind === 'improvement';
  return `<h2>What it takes</h2>
    <label for="jb-m">How long</label>
    <div class="counts">
      <input id="jb-m" inputmode="numeric" value="${esc(j.est_minutes || '')}" placeholder="20"
        style="max-width:7rem">
      <span class="meta">minutes${j.est_minutes >= 60
        ? ' &middot; about ' + hoursWords(j.est_minutes) : ''}</span>
    </div>
    
    <label for="jb-c">Roughly what it costs</label>
    <input id="jb-c" inputmode="decimal" value="${esc(j.est_cost || '')}" placeholder="0.00">
    <label for="jb-p">You need</label>
    <textarea id="jb-p" rows="2" placeholder="a ladder, and somebody to foot it">${esc(j.prerequisites || '')}</textarea>
    <label for="jb-sf">Anything to be careful of?</label>
    <select id="jb-sf">${sel(j.safety || 'none', SAFETY)}</select>
    

    ${fault ? `<h2>What it is doing</h2>
      <label for="jb-st">How is it?</label>
      <select id="jb-st">${sel(j.state || 'degraded', JOB_STATE)}</select>
      <label for="jb-wa">Workaround</label>
      <textarea id="jb-wa" rows="2" placeholder="how you are getting by meanwhile">${esc(j.workaround || '')}</textarea>
      <label for="jb-ro">Told somebody on</label>
      <input id="jb-ro" type="date" value="${esc(j.reported_on || '')}">
      <p class="hint">A date here is what a deposit argument turns on.</p>
      <label for="jb-rp">What they said</label>
      <textarea id="jb-rp" rows="2" placeholder="&ldquo;will look at it next week&rdquo;">${esc(j.reply || '')}</textarea>` : ''}

    ${imp ? `<h2>How it is, and how you want it</h2>
      <label for="jb-now">How it is now</label>
      <textarea id="jb-now" rows="2" placeholder="the ensuite was never built — used as a closet">${esc(j.now || '')}</textarea>
      <label for="jb-want">How you want it</label>
      <textarea id="jb-want" rows="2" placeholder="split it: bathroom one side, office the other">${esc(j.want || '')}</textarea>` : ''}`;
}

/* 90 minutes is a number; "an hour and a half" is a plan. Stored in minutes
   because one unit everywhere is what made the board possible — shown in
   whatever a person would actually say. */
function hoursWords(m) {
  const n = Number(m) || 0, h = Math.floor(n / 60), r = n % 60;
  if (n >= 480) return (n / 480).toFixed(n % 480 ? 1 : 0).replace('.0','') + ' day' + (n >= 960 ? 's' : '') + ' of work';
  if (!r) return h + ' hour' + (h === 1 ? '' : 's');
  return h + 'h ' + r + 'm';
}

function reKind(id, k) {
  const j = jobById(id); if (j) j.kind = k;   // redraw only; saved on Save
  drawJob(id);
}

async function addStep(id) {
  const el = $('#jb-step'), t = (el.value || '').trim();
  if (!t) return say('Type the step first.');
  const n = stepsOf(id).length;
  await DwelLogs.write([{ op:'upsert', table:'step',
    record:{ id:uid(), job_id:id, text:t, position:n + 1, done:'' } }]);
  await reload(); drawJob(id);
}
async function tickStep(stepId, jobId, on) {
  const st = (DB.step || []).find(x => x.id === stepId); if (!st) return;
  await DwelLogs.write([{ op:'upsert', table:'step', record:{ ...st,
    done: on ? 'TRUE' : '', done_on: on ? today() : '', done_by_id: on ? me.id : '' } }]);
  await reload(); drawJob(jobId);
}
async function dropStep(stepId, jobId) {
  await DwelLogs.write([{ op:'archive', table:'step', id:stepId }]);
  await reload(); drawJob(jobId);
}

async function claimJob(id, take) {
  const j = jobById(id); if (!j) return;
  await DwelLogs.write([{ op:'upsert', table:'job', record:{ ...j,
    claimed_by_id: take ? me.id : '', claimed_at: take ? new Date().toISOString() : '',
    status: take ? 'claimed' : 'open' } }]);
  await reload(); drawJob(id);
  say(take ? 'Yours.' : 'Back on the pile.');
}

async function saveJob(id) {
  const j = jobById(id); if (!j) return;
  const f = readJobFields();
  const rec = { ...j, kind:f.kind, title: f.title || j.title, notes:f.notes,
    start_on:f.start_on, due_on:f.due_on, est_minutes:f.est_minutes, est_cost:f.est_cost,
    prerequisites:f.prerequisites, safety:f.safety };
  if (f.kind === 'fault') Object.assign(rec, { state:f.state, workaround:f.workaround,
    reported_on:f.reported_on, reply:f.reply });
  if (f.kind === 'improvement') Object.assign(rec, { now:f.now, want:f.want });

  const writes = [{ op:'upsert', table:'job', record:rec }];

  /* A repeat is a RULE, and the rule is a schedule row - the job is one
     occurrence of it. Turning the repeat on here makes the rule if there is
     not one; turning it off makes the rule a 'once', which the schedule kind
     picklist has always had a value for. */
  const sc = (DB.schedule || []).find(x => x.id === j.schedule_id);
  if (f.rep === 'yes') {
    const rule = { id: (sc || {}).id || uid(), asset_id:j.asset_id || '',
      structure_id:j.structure_id || '', area_id:j.area_id || '', animal_id:j.animal_id || '',
      title: rec.title, kind: f.answer === 'reading' ? 'reading' : 'interval',
      every_n: f.every_n, every_unit: f.every_unit,
      next_due_on: rec.due_on || today() };
    writes.push({ op:'upsert', table:'schedule', record:rule });
    rec.schedule_id = rule.id;
  } else if (sc) {
    writes.push({ op:'upsert', table:'schedule', record:{ ...sc, kind:'once' } });
  }
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  draft.rep = undefined;
  await reload(); drawJob(id);
  say('Saved.');
}

/* Finishing writes a completion — append-only history — and, when there is a
   rule behind it, moves the rule on. That is the loop the whole app is for. */
async function finishJob(id) {
  const j = jobById(id); if (!j) return;
  const cid = uid();
  const writes = [{ op:'upsert', table:'completion',
      record:{ id:cid, job_id:id, asset_id:j.asset_id || '', schedule_id:j.schedule_id || '',
               done_on:today(), by_person_id:me.id } },
    /* Randi, 2026-09-27: "when a job gets completed, if un owned it could be
       assigned to who finished it." That is assignment used as a RECORD OF FACT
       rather than a directive \u2014 the only honest way to write this field by
       machine. Nobody is being told to do anything; the job simply turned out
       to be somebody's, and now the history says whose. If it was already
       assigned, that stands: the person it was meant for keeps the credit or
       the blame, and who actually did it is on the completion either way. The
       claim is left alone too \u2014 Dave taking it and Randi finishing it is a real
       and interesting fact, and overwriting it would hide that. */
    { op:'upsert', table:'job', record:{ ...j, status:'done', done_on:today(),
        owner_id: j.owner_id || me.id, completion_id:cid } }];
  const sc = (DB.schedule || []).find(x => x.id === j.schedule_id);
  if (sc && sc.every_n && sc.kind !== 'once') {
    const d = new Date(), n = Number(sc.every_n) || 1;
    ({ day:() => d.setDate(d.getDate() + n), week:() => d.setDate(d.getDate() + n * 7),
       month:() => d.setMonth(d.getMonth() + n), year:() => d.setFullYear(d.getFullYear() + n)
     }[sc.every_unit] || (() => d.setMonth(d.getMonth() + n)))();
    const next = d.toISOString().slice(0, 10);
    writes.push({ op:'upsert', table:'schedule', record:{ ...sc, next_due_on: next } });
    writes.push({ op:'upsert', table:'job', record:{ id:uid(), property_id:prop.id, kind:j.kind,
      title:j.title, source:'schedule', schedule_id:sc.id, asset_id:j.asset_id || '',
      structure_id:j.structure_id || '', area_id:j.area_id || '', animal_id:j.animal_id || '',
      notes:j.notes || '', est_minutes:j.est_minutes || '', est_cost:j.est_cost || '',
      prerequisites:j.prerequisites || '', safety:j.safety || '', status:'open', due_on: next } });
  }
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  await reload();
  show('home');
  say(sc && sc.kind !== 'once' ? 'Done. The next one is on the list.' : 'Done.');
}

/* Somewhere to put a thing that is not a check-up and not broken \u2014 which is
   most of what anybody actually wants to write down. Straight into the job
   screen so the notes, the checklist and the dates are all right there. */
async function newJob() {
  const j = { id:uid(), property_id:prop.id, kind:'task', title:'', source:'owner',
    status:'open', column:'todo' };
  await DwelLogs.write([{ op:'upsert', table:'job', record:j }]);
  await reload();
  drawJob(j.id);
  say('Give it a name and it is on the list.');
}

async function reload() { const r = await DwelLogs.load(); DB = r.db; }

/* ---- papers -------------------------------------------------------------
   Photos answer "what did it look like". Papers answer "what am I entitled to,
   and until when". The second question is the one with a deadline in it, which
   is why this screen exists separately rather than as a checkbox on the photo
   one: a warranty that lapsed in March is not a filing problem, it is the same
   kind of problem as a filter nobody changed. */

/* Everything a paper can be about, in one control. The place is the default
   because a deed, a policy and a survey are about the place and nothing
   smaller; the rest are there because a manual belongs to the dishwasher and a
   rabies certificate belongs to the dog, and filing both under "the house"
   loses them. */
function docTargets() {
  const g = (label, rows) => rows.length
    ? `<optgroup label="${label}">${rows.map(([id, n]) =>
        `<option value="${esc(id)}">${esc(n)}</option>`).join('')}</optgroup>` : '';
  const live = t => (DB[t] || []).filter(r => r.status !== 'archived');
  return g('Buildings', live('structure').map(r => ['structure:' + r.id, r.name]))
       + g('Rooms',     live('area').map(r => ['area:' + r.id, r.name]))
       + g('Things',    live('asset').map(r => ['asset:' + r.id, r.name]))
       + g('Animals',   live('animal').map(r => ['animal:' + r.id, r.name || r.kind]));
}
function docAbout(v) {
  const [t, id] = String(v || '').split(':');
  return { structure_id: t === 'structure' ? id : '', area_id: t === 'area' ? id : '',
           asset_id: t === 'asset' ? id : '', animal_id: t === 'animal' ? id : '' };
}

function drawDoc() {
  $('#tabs').hidden = true;
  draft.dc = draft.dc || { kind:'warranty', how:'file' };
  const k = PAPER_KIND.find(x => x[0] === draft.dc.kind) || PAPER_KIND[0];
  const onSheet = !!localStorage.getItem('dwellogs.url');
  app.innerHTML = `<button class="back" onclick="show('home')">&lsaquo; Back</button>
    <h1>Add a paper</h1>
    <p class="sub">The ones with a date on them, so the date can do something.</p>

    <label for="dc-k">What is it?</label>
    <select id="dc-k" onchange="draft.dc.kind=this.value;drawDoc()">
      ${PAPER_KIND.map(([v, l]) => `<option value="${v}"${
        v === draft.dc.kind ? ' selected' : ''}>${esc(l)}</option>`).join('')}
    </select>
    <p class="hint">${esc(k[2])}</p>

    <label style="margin-top:1.2rem">Have you got the file, or is it online?</label>
    <div class="pick">
      <button type="button" aria-pressed="${draft.dc.how === 'file'}"
        onclick="draft.dc.how='file';drawDoc()">${icon('paper', 24)}
        <span class="cap">I have the file</span></button>
      <button type="button" aria-pressed="${draft.dc.how === 'link'}"
        onclick="draft.dc.how='link';drawDoc()">${icon('link', 24)}
        <span class="cap">It is online</span></button>
    </div>

    ${draft.dc.how === 'file' ? `
      <label for="dc-f">The file</label>
      <input id="dc-f" type="file" onchange="pickedDoc(this)">
      <div id="dc-prev"></div>`
    : `
      <label for="dc-u">Link</label>
      <input id="dc-u" type="url" placeholder="https://…" value="${esc(draft.dc.url || '')}">
      <p class="hint">Good for a manual that lives on their website.</p>`}

    <label for="dc-w">What is it about?</label>
    <select id="dc-w"><option value="">${esc(prop.name)} — the place itself</option>
      ${docTargets()}</select>

    <label for="dc-n">Call it</label>
    <input id="dc-n" placeholder="leave it and we will name it after what it is">

    <label for="dc-d">Dated</label>
    <input id="dc-d" type="date" value="${today()}">

    <label for="dc-g">Good until <span style="font-weight:400;color:var(--muted)">— optional</span></label>
    <input id="dc-g" type="date">
    <p class="hint">${k[3] ? esc(k[3]) : "Most never run out."}</p>

    <label for="dc-note">Note <span style="font-weight:400;color:var(--muted)">— optional</span></label>
    <textarea id="dc-note" rows="2" placeholder="what it says, in your words"></textarea>

    ${draft.dc.how === 'link' ? '' : onSheet
      ? tip('It goes into a folder beside your sheet, in your own Drive — a separate one from your '
          + 'photos, so a lease is not filed among the move-in pictures. Never in the spreadsheet '
          + 'itself, and never on a server of ours.', 'Where it goes')
      : `<div class="card"><span class="title">This device only</span>
          <p class="meta">You have not connected a sheet, so nothing is uploaded — the record is
            kept but the file is not. For a policy or a lease, connect a sheet first.</p></div>`}

    <div class="actions">
      <button class="primary" onclick="saveDoc()">Save it</button>
    </div>`;
}

/* Say the size before they commit to waiting for it. Twenty megabytes is a
   real ceiling here, not a guess: the file goes up as base64 inside a JSON
   body, a third bigger than it started, through a Google Apps Script request. */
function pickedDoc(el) {
  const f = el.files && el.files[0], box = $('#dc-prev');
  if (!f) { box.innerHTML = ''; return; }
  const mb = f.size / 1048576;
  const warn = mb > 20
    ? `<span class="chip attn">too big</span> Over 20MB will not make it through. Link to it
       instead, or scan it smaller.`
    : mb > 5
      ? `<span class="chip soon">this will take a moment</span> ${mb.toFixed(1)} MB goes up as it
         is — papers are not shrunk, because a blurry lease is not a lease.`
      : `${mb.toFixed(1)} MB`;
  box.innerHTML = `<p class="hint" style="margin-top:.5rem">${esc(f.name)} · ${warn}</p>`;
}

async function saveDoc() {
  const kind = draft.dc.kind;
  const k = PAPER_KIND.find(x => x[0] === kind) || PAPER_KIND[0];
  const link = draft.dc.how === 'link';
  let up = { drive_id:'', url:'', bytes:0, mime:'', local:false };

  if (link) {
    const u = ($('#dc-u').value || '').trim();
    if (!u) { $('#dc-u').classList.add('missing'); return say('Put the address in.'); }

function papers() {

    (DB[t] || []).forEach(r => { names[r.id] = r.name || r.kind; }));

/* Everything else on the person screen says what state it is in — a place says
   "yours, one building", the sheet button says change-or-connect. Reminders
   were the one setting you had to open in order to find out what it was.

   The second half matters more than the summary. A digest is sent by a
   time-driven trigger INSIDE their sheet, so with no sheet there is nothing
   running to send it, and with no email address there is nowhere for it to
   arrive. Both are silent failures: you set a weekly digest, you are told you
   will hear from us, and then you never do. Say it here instead. */
const TELL_CH = { none:'Nothing is sent', email:'Emailed to you', calendar:'In your calendar' };
const TELL_CAD = { only_when_it_changes:'only when something changes', weekly:'once a week',
                   daily:'daily', monthly:'monthly' };
const TELL_WHAT = { due_soon:'things coming up', overdue:'things already late',
                    new_issues:'new problems', low_supplies:'running low',
                    someone_waiting:'somebody waiting on you' };

function tellSummary() {
  const p = (DB.reminder_pref || []).find(r => r.person_id === me.id && r.status !== 'archived');
  if (!p || !p.channel || p.channel === 'none')
    return { line:'Nothing is sent', detail:'You open the app and look, which is a real answer.' };
  const bits = String(p.what || '').split(',').map(x => TELL_WHAT[x.trim()]).filter(Boolean);
  const detail = [bits.join(', ') || 'nothing chosen',
    p.lead_days ? p.lead_days + ' days ahead' : null,
    p.max_per_week ? 'at most ' + p.max_per_week + ' a week' : null].filter(Boolean).join(' \u00b7 ');
  const warn = !localStorage.getItem('dwellogs.url')
    ? 'Nothing can send this yet \u2014 the digest goes out from your sheet, and there is no sheet.'
    : (p.channel === 'email' && !me.email)
      ? 'There is no email address on you, so it has nowhere to arrive.'
      : '';
  return { line:(TELL_CH[p.channel] || p.channel) + ', ' + (TELL_CAD[p.cadence] || p.cadence),
           detail, warn };
}

/* ---- bringing a device-only log up to a sheet ---------------------------

function liftable() {

  return ['person','property','structure','area','asset','schedule','document']

async function doLift() {
  const l = DwelLogs.localSnapshot() || {};
  // People and places first so the name-mirror columns have something to mirror
  // when a human opens the spreadsheet; the ids do not care about order.
  const ORDER = ['person','property','membership','structure','area','animal','placement',
    'category','asset_type','asset','supply','supply_link','schedule','completion','reading',
    'issue','work_item','document','service','visit','coverage','invite','suggestion',
    'reminder_pref','feedback'];
  const rows = [];
  ORDER.forEach(t => (l[t] || []).forEach(r => rows.push({ op:'upsert', table:t, record:r })));
  (Object.keys(l)).forEach(t => { if (!ORDER.includes(t))
    (l[t] || []).forEach(r => rows.push({ op:'upsert', table:t, record:r })); });
  if (!rows.length) return startOnSheet();

  // Chunked, because one request carrying a whole ranch is a request that times
  // out halfway and leaves nobody able to say what got through.
  const SIZE = 150, total = Math.ceil(rows.length / SIZE);
  for (let i = 0; i < total; i++) {
    say('Moving ' + rows.length + ' rows up… ' + (i + 1) + ' of ' + total);
    try { await DwelLogs.write(rows.slice(i * SIZE, (i + 1) * SIZE)); }
    catch (e) { return say('Stopped partway: ' + e.message + ' \u2014 nothing on this device was touched.'); }
  }
  await boot();
  say('Moved. The copy on this device is still there, untouched.');
}

  // They chose the empty sheet on purpose. Do not touch the local copy.
  firstRun();
  say('Starting fresh. Your device copy is still on this device.');
}
