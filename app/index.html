          <button class="ghost" onclick="EDIT_STEP=null;drawJob('${id}')">Cancel</button>
          <button class="quiet" onclick="EDIT_STEP=null;dropStep('${st.id}','${id}')">Remove</button></div></div>` : ''}`).join('')}</div>` : ''}
    <div class="inl" style="gap:.5rem;align-items:center">
      <input id="jb-step" placeholder="add a line" style="flex:1;min-width:0;margin:0"
        onkeydown="if(event.key==='Enter'){event.preventDefault();${stepGo}}">
      <button class="add" style="flex:none" onclick="${stepGo}">Add it</button></div>
    ${live ? (() => {
      /* A round -- watering, wasp checks, closing up for winter -- is ONE job
         with several stops. You set out once, so it is one job; the stops are
         steps. Letting a stop name its place is what makes the round show up in
         each place it visits, instead of somebody having to remember that
         "water" covers the greenhouse. */
      /* Folded (5 Oct): most lines are just words, and a place picker under
         every one made the checklist look like a form. */
      return `<details class="also"><summary>Somewhere in particular&hellip;</summary><div>${
        stepWherePicker('jb-stw', 'jb-stwe', {})}</div></details>`;
    })() : ''}`,
    start: `
    <label for="jb-s">Start</label>
    <input id="jb-s" type="date" value="${esc(j.start_on || '')}">`,
    due: `
    <label for="jb-d">Due</label>
    <input id="jb-d" type="date" value="${esc(j.due_on || '')}">`,
    repeat: `
    <label for="jb-r">Repeats</label>
    <select id="jb-r" onchange="${repGo}">
      <option value=""${!rep ? ' selected' : ''}>Once</option>
      <option value="yes"${rep ? ' selected' : ''}>Every&hellip;</option>
    </select>
    ${rep ? `<div class="counts" style="grid-template-columns:1fr 2fr">
      <div class="count"><span>Every</span>
        <input id="jb-en" inputmode="numeric" value="${esc(everyN)}"></div>
      <div class="count"><span>&nbsp;</span>
        <select id="jb-eu">${optList(everyU, EVERY_UNIT)}</select></div>
    </div>
    <label for="jb-ans">What does doing it look like?</label>
    <select id="jb-ans">${optList(answerKind, ANSWER_KIND)}</select>` : ''}`
  };
  if (parts) return P;
  return P.name + P.about + P.kind + '\n' + P.notes + '\n' + P.steps + '\n\n    <h2>When</h2>' + P.start + P.due + P.repeat;
}

/* Reads whatever of the form is on screen. The fault and improvement tails are
   only in the DOM when that kind is selected, so a missing field is left alone
   rather than blanked. */
function readJobFields() {
  const v = k => { const el = $(k); return el ? (el.value || '').trim() : ''; };
  const num = x => { const n = Number(x); return Number.isFinite(n) && n > 0 ? n : ''; };
  const out = { kind: v('#jb-k') || 'task', title: v('#jb-t'), notes: v('#jb-n'),
    start_on: v('#jb-s'), due_on: v('#jb-d'),
    est_minutes: num(v('#jb-m')), est_cost: num(v('#jb-c')),
    prerequisites: v('#jb-p'), safety: v('#jb-sf') || 'none',
    rep: ($('#jb-r') && $('#jb-r').value === 'yes') ? 'yes' : '',
    every_n: num(v('#jb-en')) || 6, every_unit: v('#jb-eu') || 'month',
    answer: v('#jb-ans') || 'tick', last: v('#jb-last') };
  /* Only what is on the screen: How bad is asked now (7 Oct), and the
     workaround and reported-on are not, so a saved one is left alone. */
  if (out.kind === 'fault') [['state','#jb-st'], ['workaround','#jb-wa'], ['reported_on','#jb-ro'], ['reply','#jb-rp']]
    .forEach(([k, sel]) => { if ($(sel)) out[k] = v(sel); });
  if (out.kind === 'improvement') Object.assign(out, { now: v('#jb-now'), want: v('#jb-want') });
  return out;
}

/* ---- the setup side of that form -------------------------------------- */
function blankEntry() { return { kind:'task', steps:[] }; }
/* Every redraw of the setup screen goes through here first, so nothing typed
   is lost when the kind changes or a step is added. This screen has dropped
   half-typed rows once before. */
function syncEntry() {
  if (!$('#jb-t')) return;
  const steps = (draft.entry || {}).steps || [];
  draft.entry = readJobFields();
  draft.entry.steps = steps;
}
/* The live twin of syncEntry(). The setup form has kept what is typed across a
   redraw since the day it dropped a half-typed row; the job screen redraws on
   the same two controls -- the kind, and "does it come round again" -- and kept
   nothing. Type a title, set it to repeat every six months, and the title went
   with the redraw, which is precisely the task somebody stood in their bathroom
   and decided to write down. Written onto the row in memory only: nothing is
   saved until Save. */
/* Randi, 2026-09-29: "the needs doing input screen is defaulted to the parent
   property 'the ranch' instead of letting me add it to a thing - I'd have to
   update it later to be added to a specific thing."

   A job added from a thing's own screen already knew its subject; a job added
   from anywhere else had no way to say one, so it landed on the place and
   stayed there. One control, listing everything on the place, on the screen
   where the job is being written. */
function aboutOptions(j) {
  const at = JOB_AT.map(([k, f]) => [k, j[f]]).find(([, v]) => v) || [];
  const sel = at[1] ? at[0] + ':' + at[1] : '';
  const opt = (v, l) => `<option value="${esc(v)}"${v === sel ? ' selected' : ''}>${esc(l)}</option>`;
  /* Opened from an animal, it is about animals (2 Oct): the list is those, and
     the general Add keeps everything. */
  if (JOB_ONLY && JOB_AT.some(x => x[0] === JOB_ONLY))
    return placeRows(JOB_ONLY).map(r => opt(JOB_ONLY + ':' + r.id, subjName(JOB_ONLY, r.id))).join('');
  return opt('', 'The whole place')
    + [['structure','Buildings'], ['area','Rooms and areas'], ['asset','Things'],
       ['animal','Animals'], ['vehicle','Vehicles']].map(([k, label]) => {
      const rows = placeRows(k);
      return rows.length ? `<optgroup label="${esc(label)}">${
        rows.map(r => opt(k + ':' + r.id, subjName(k, r.id))).join('')}</optgroup>` : '';
    }).join('');
}
async function setJobAbout(id, val) {
  if (!jobById(id)) return;
  syncJob(id);                       // whatever is typed on screen is not lost
  if (isDraft(id)) {                 // not saved yet: nothing to write
    JOB_AT.forEach(([, f]) => { DRAFT_JOB[f] = ''; });
    if (val) { const [k, i] = String(val).split(':');
      const f = (JOB_AT.find(x => x[0] === k) || [])[1]; if (f) DRAFT_JOB[f] = i; }
    return drawJob(id);
  }
  const rec = { ...jobById(id) };
  JOB_AT.forEach(([, f]) => { rec[f] = ''; });
  if (val) { const [k, i] = String(val).split(':');
    const f = (JOB_AT.find(x => x[0] === k) || [])[1]; if (f) rec[f] = i; }
  const writes = [{ op:'upsert', table:'job', record:rec }];
  /* A repeating job's rule carries the same columns. Moving the job and
     leaving the rule behind is how the check-up keeps coming due on the wrong
     thing for the next ten years. */
  const sc = (DB.schedule || []).find(x => x.id === rec.schedule_id);
  if (sc) { const s2 = { ...sc };
    JOB_AT.forEach(([, f]) => { s2[f] = rec[f] || ''; });
    writes.push({ op:'upsert', table:'schedule', record:s2 }); }
  try { await DwelLogs.write(writes); }
  catch (e) { return say('Could not save: ' + e.message); }
  await reload(); drawJob(id);
  say(val ? 'About ' + subjName(String(val).split(':')[0], String(val).split(':')[1]) + '.'
          : 'About the whole place.');
}
function syncJob(id) {
  if (!$('#jb-t')) return;
  const j = jobById(id); if (!j) return;
  const f = readJobFields();
  ['kind','title','notes','start_on','due_on','est_minutes','est_cost',
   'prerequisites','safety','state','workaround','reported_on','reply','now','want']
    .forEach(k => { if (f[k] !== undefined) j[k] = f[k]; });
  draft.everyN = f.every_n; draft.everyU = f.every_unit; draft.answer = f.answer;
}
function reKindDraft(k)  { syncEntry(); draft.entry.kind = k; drawFirst(); }
function setRepDraft(v)  { syncEntry(); draft.entry.rep = v;  drawFirst(); }
function addStepDraft() {
  const el = $('#jb-step'), t = (el.value || '').trim();
  if (!t) return say('Type the step first.');
  syncEntry(); draft.entry.steps.push({ text:t, done:false }); drawFirst();
}
function dropStepDraft(n) { syncEntry(); draft.entry.steps.splice(n, 1); drawFirst(); }

}
function jobWhenWords(j) {
  const bits = [];
  if (j.due_on) bits.push('due ' + j.due_on);
  if (j.rep === 'yes') bits.push('every ' + (j.every_n || 6) + ' ' +
    ((EVERY_UNIT.find(u => u[0] === (j.every_unit || 'month')) || [0, 'months'])[1]));
  if (j.kind === 'fault' && !bits.length) bits.push('something is wrong');
  if (!bits.length) bits.push('no date yet');
  return bits.join(' · ');
}
function addJob() {
  syncEntry();
  const e = draft.entry;
  if (!e || !e.title) return say('Say what needs doing first.');
  draft.jobs = draft.jobs || [];
  if (draft.editing != null) { draft.jobs[draft.editing] = e; draft.editing = null;
    say(e.title + ' updated.'); }

}
function editJob(i) {
  syncEntry();
  /* Tapping Edit with something half-typed keeps it rather than binning it.
     Appending leaves index i where it was. */
  if (draft.editing == null && draft.entry && draft.entry.title) draft.jobs.push(draft.entry);
  draft.editing = i;
  draft.entry = JSON.parse(JSON.stringify(draft.jobs[i] || blankEntry()));
  drawFirst();
}
function cancelEditJob() { draft.editing = null; draft.entry = blankEntry(); drawFirst(); }
function dropJob(i) {
  (draft.jobs || []).splice(i, 1);
  if (draft.editing === i) { draft.editing = null; draft.entry = blankEntry(); }
  else if (draft.editing != null && draft.editing > i) draft.editing--;

function repOn(j) {

/* Nothing is folded. An earlier draft hid time, cost and what-you-need behind a

function moreSection(j, sel) {
  const fault = j.kind === 'fault', imp = j.kind === 'improvement';

     boiler, and under a cow it asked whether she works, offered a workaround,

  const living = !!j.animal_id;

        style="max-width:7rem">

    ${fault ? `<h2>${living ? 'How it is' : 'What it is doing'}</h2>
      <label for="jb-st">How is ${living ? esc(subjName('animal', j.animal_id) || 'it') : 'it'}?</label>
      <select id="jb-st">${sel(j.state || 'degraded', living ? LIVING_STATE : JOB_STATE)}</select>
      <label for="jb-wa">${living ? 'What you are doing meanwhile' : 'Workaround'}</label>
      <textarea id="jb-wa" rows="2" placeholder="${living
        ? 'kept her in, hand-feeding' : 'how you are getting by meanwhile'}">${esc(j.workaround || '')}</textarea>
      <label for="jb-ro">${living ? 'Called the vet on' : 'Told somebody on'}</label>
      <input id="jb-ro" type="date" value="${esc(j.reported_on || '')}">
      <p class="hint">A date here is what a deposit argument turns on.</p>
      <label for="jb-rp">What they said</label>
      <textarea id="jb-rp" rows="2" placeholder="&ldquo;will look at it next week&rdquo;">${esc(j.reply || '')}</textarea>` : ''}

    ${imp ? `<h2>How it is, and how you want it</h2>
      <label for="jb-now">How it is now</label>
      <textarea id="jb-now" rows="2" placeholder="the ensuite was never built — used as a closet">${esc(j.now || '')}</textarea>
      <label for="jb-want">How you want it</label>
      <textarea id="jb-want" rows="2" placeholder="split it: bathroom one side, office the other">${esc(j.want || '')}</textarea>` : ''}`;
}

/* 90 minutes is a number; "an hour and a half" is a plan. Stored in minutes
   because one unit everywhere is what made the board possible — shown in
   whatever a person would actually say. */
function hoursWords(m) {
  const n = Number(m) || 0, h = Math.floor(n / 60), r = n % 60;
  if (n >= 480) return (n / 480).toFixed(n % 480 ? 1 : 0).replace('.0','') + ' day' + (n >= 960 ? 's' : '') + ' of work';
  if (!r) return h + ' hour' + (h === 1 ? '' : 's');
  return h + 'h ' + r + 'm';
}

function reKind(id, k) {
  syncJob(id);                                 // keep what is typed
  const j = jobById(id); if (j) j.kind = k;   // redraw only; saved on Save
  drawJob(id);
}

/* Where a step happens: one of your buildings or rooms, or somewhere that is
   not yours. One picker for adding a step and for changing one -- steps could
   only be removed and added again, which lost their tick and their place in
   the order (2 Oct). */
function stepWherePicker(sid, eid, st) {
  const places = (DB.structure || []).filter(x => x.status !== 'archived');
  const areas = (DB.area || []).filter(x => x.status !== 'archived');
  if (!places.length && !areas.length) return '';
  const up = a2 => ((DB.structure || []).find(x => x.id === a2.structure_id) || {}).name;
  const cur = st.area_id ? 'a:' + st.area_id : st.structure_id ? 's:' + st.structure_id : st.where_else ? 'x' : '';
  const o = (v, l) => `<option value="${v}"${v === cur ? ' selected' : ''}>${l}</option>`;
  /* "Get the test kit from environmental health" is a real step with a real
     address, and this list can only name buildings on this place -- so the
     shop and the vet had nowhere to go but inside the sentence (29 Sept). */
  return `<select id="${sid}" style="margin-top:.5rem"
      onchange="const e=$('#${eid}');if(e){e.hidden=this.value!=='x';if(!e.hidden)e.focus()}">
    ${o('', 'Anywhere in particular?')}
    ${places.map(x => o('s:' + x.id, esc(x.name))).join('')}
    ${areas.map(x => o('a:' + x.id, esc(x.name) + (up(x) ? esc(' — ' + up(x)) : ''))).join('')}
    ${o('x', 'Somewhere else &mdash; not here')}
  </select>
  <input id="${eid}"${cur === 'x' ? '' : ' hidden'} style="margin-top:.4rem" value="${esc(st.where_else || '')}"
    placeholder="where &mdash; the hardware shop, environmental health">`;
}
async function saveStepEdit(stId, jobId) {

    structure_id: w.startsWith('s:') ? w.slice(2) : '',

async function addStep(id) {

    record:{ id:uid(), job_id:id, text:t, position:n + 1, done:'',
      structure_id: w.startsWith('s:') ? w.slice(2) : '',
      area_id: w.startsWith('a:') ? w.slice(2) : '',

/* Every one of these writes something OTHER than the job and then reloads --
   and reload() replaces DB wholesale, so the title, notes and cost sitting in
   the form unsaved were thrown away by the act of attaching a filter to the
   job. It looked like the screen simply forgot what you had typed.

   syncJob() puts the form back into the row; sending the row with the write
   makes it survive the reload. Same shape as the bug where the repeat dropdown
   ate the job title, which is the third time this pattern has cost an hour. */
function keepJob(id, writes) {
  try { syncJob(id); } catch (e) {}
  const j = jobById(id);
  if (!j) return writes;
  if (!String(j.title || '').trim()) {
    const t = $('#jb-t'); if (t) { t.classList.add('missing'); t.focus(); }
    throw new Error('Give it a name first.');
  }
  /* The job FIRST: a step written before its job is refused by the database,
     whose rules check as rows arrive. The phone never cared about order. The
     repeat goes too: it is on the same screen, and recording a past test
     redrew the screen from the old every-1-year and threw away a change to
     every-1-month that was sitting there unsaved (5 Oct). */
  const rec = { ...j };
  const rule = $('#jb-r') ? repeatWrites(j, readJobFields(), rec) : [];
  return rule.concat([{ op:'upsert', table:'job', record:rec }], writes);
}

/* One owner (decided 6 Oct, "who owns it could also be the service"): you,

async function setJobWho(id, v) {
  if (v === 'new') { $('#jb-svcnew').hidden = false; return; }
  syncJob(id);
  const j = jobById(id); if (!j) return;
  const p = (DB.person || []).find(x => x.id === v);
  const open = j.status === 'claimed' ? 'open' : j.status;
  const patch = !v ? { claimed_by_id:'', claimed_at:'', provider_id:'', status:open }
    : p && CALLED_ROLES.includes(p.role) ? { provider_id:v, claimed_by_id:'', claimed_at:'', status:open }
    : { claimed_by_id:v, claimed_at:new Date().toISOString(), status:'claimed' };
  if (isDraft(id)) { Object.assign(j, patch); return drawJob(id); }
  try { await DwelLogs.write([{ op:'upsert', table:'job', record:{ ...jobById(id), ...patch } }]); }
  catch (e) { return say('Could not save: ' + e.message); }

/* Tasks nobody has taken, or with no date: off Home, here until somebody
   gives them both (7 Oct). Opening one and setting Who has it and Due moves it. */
function drawPrioritize() {
  setTab('log');
  $('#tabs').hidden = false;

async function saveJob(id, doneOn, stay) {
  const j = jobById(id); if (!j) return;
  // "Save it as done" on a new job (4 Oct): written down after the fact.
  if (doneOn && asDay(doneOn) > today()) return say('That is in the future. Mark it done when it happens.');
  const f = readJobFields();
  if (!String(f.title || j.title || '').trim()) {
    const t = $('#jb-t'); if (t) { t.classList.add('missing'); t.focus(); }
    return say('Give it a name first.');
  }
  const rec = { ...j, kind:f.kind, title: f.title || j.title, notes:f.notes,
    start_on:f.start_on, due_on:f.due_on, est_minutes:f.est_minutes, est_cost:f.est_cost,
    prerequisites:f.prerequisites, safety:f.safety };
  const slot = ($('#jb-slot') || {}).value;
  if (slot !== undefined && slot !== (j.slot || '')) { rec.slot = slot; rec.slot_set_on = slot ? today() : ''; }
  if (NEW_JOB === id) NEW_JOB = null;
  if (f.kind === 'fault') ['state','workaround','reported_on','reply']
    .forEach(k => { if (f[k] !== undefined) rec[k] = f[k]; });
  if (f.kind === 'improvement') Object.assign(rec, { now:f.now, want:f.want });

  const usingFor = FOR && FOR.job === id;
  if (usingFor) forApply(rec);
  const writes = [{ op:'upsert', table:'job', record:rec }];

  writes.unshift(...repeatWrites(j, f, rec));
  writes.push(...(usingFor ? forAlsoWrites(id) : alsoWrites(id, rec)));
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  draft.rep = undefined;
  const fresh = usingFor ? FOR.newThings.slice() : [];
  await reload();
  if (doneOn) return finishJob(id, doneOn);
  if (stay) return true;
  // Back to wherever it was opened from. It used to stay put, and Save looked
  // like it had done nothing (2 Oct). Something new the catalogue knew -- a
  // pool filter added from the For box -- shows its check-ups first, to keep
  // or untick, then goes back there too.
  if (fresh.length) {
    const back = JOB_BACK || (() => show('home'));
    JOB_OPEN = JOB_BACK = JOB_ONLY = DRAFT_JOB = NEW_JOB = EDIT_STEP = null; FOR = null;
    CATCH_BACK = back; drawCatchUp(fresh);
    return say('Saved. These come with what you added — untick any you would rather not hear about.');
  }
  leaveJob('Saved.');
}

/* A repeat is a RULE, and the rule is a schedule row - the job is one
   occurrence of it. Turning the repeat on here makes the rule if there is
   not one; turning it off makes the rule a 'once', which the schedule kind
   picklist has always had a value for. Sets rec.schedule_id; the rule comes
   first in the writes, because the database checks the link as the job lands. */
function repeatWrites(j, f, rec) {
  const out = [];
  const sc = (DB.schedule || []).find(x => x.id === j.schedule_id);
  if (f.rep === 'yes') {
    // What it is about comes from the record being saved: For may have changed it.
    const rule = { id: (sc || {}).id || uid(), asset_id:rec.asset_id || '',
      structure_id:rec.structure_id || '', area_id:rec.area_id || '', animal_id:rec.animal_id || '',
      vehicle_id:rec.vehicle_id || '',
      title: rec.title, kind: f.answer === 'reading' ? 'reading' : 'interval',
      every_n: f.every_n, every_unit: f.every_unit,
      /* Same rule as the setup path: a repeat is a cadence, not a start date.
         Defaulting to today was an invented number, which is the one thing
         this app is not allowed to do. */
      next_due_on: rec.due_on || '' };
    /* A new rule needs what the database requires of every rule. The job
       screen never sent them, so turning a repeat on for "Deworm" failed on an
       account with "Null value in column responsibility" (5 Oct); a phone-only
       log never checked. A person typing the interval is its source. */
    if (!sc) Object.assign(rule, { responsibility:'owner', interval_source:'owner', cost_source:'entered' });
    /* How often changed and the date was left alone: the next one moves to
       match, counted from the last time it was done. Every 1 year changed to
       every 1 month still said next September (5 Oct). Nothing done yet, or a
       date typed in by hand, and the date stays what it says. */
    const changed = sc && (String(sc.every_n) !== String(f.every_n) || sc.every_unit !== f.every_unit);
    const last = (DB.completion || []).filter(c => c.schedule_id === (sc || {}).id && c.done_on)
      .map(c => c.done_on).sort().pop();
    if (changed && last && (rec.due_on || '') === (sc.next_due_on || '')) {
      rule.next_due_on = rec.due_on = rollFrom(last, f.every_n, f.every_unit);
    }
    /* Last done, said on the job screen: the next one counts from it, and it
       goes in the history as done by us (v0.20.0). */
    const lastSaid = asDay(f.last);
    if (lastSaid && lastSaid <= today()) rule.next_due_on = rec.due_on = rollFrom(lastSaid, f.every_n, f.every_unit);
    out.push({ op:'upsert', table:'schedule', record:rule });
    if (lastSaid && lastSaid <= today()) out.push({ op:'upsert', table:'completion', record:{ id:uid(),
      schedule_id:rule.id, asset_id:rule.asset_id, animal_id:rule.animal_id, vehicle_id:rule.vehicle_id,
      done_on:lastSaid, recorded_on:today(), origin:'planned', what:rec.title || 'Done', did_it:'us' } });
    rec.schedule_id = rule.id;
  } else if (sc) {
    out.push({ op:'upsert', table:'schedule', record:{ ...sc, kind:'once' } });
  }
  return out;
}

/* ---- one job, several things ----------------------------------------------
   Decided 2 Oct: "Deworm the cats" is one chore for Tato and Biscuit both,
   ticked once (job_also). The job's own lookup stays the first one, so every
   screen that reads it still works; the ticks below the picker are the rest. */
function aboutKind(j) {
  const at = JOB_AT.map(([k, f]) => [k, j[f]]).find(([, v]) => v);
  return at ? at[0] : JOB_ONLY;
}
const alsoOf = id => (DB.job_also || []).filter(a => a.job_id === id && a.status !== 'archived');
function alsoBox(j) {
  const k = aboutKind(j); if (!k) return '';
  const f = (JOB_AT.find(x => x[0] === k) || [])[1];
  const others = placeRows(k).filter(r => r.id !== j[f]);
  if (!others.length) return '';
  const on = new Set(alsoOf(j.id).map(a => a[f]));
  /* Folded, and open only when something is already ticked: written out, it
     put six tick boxes under every job about a thing (5 Oct). */
  const what = { animal:'animals', asset:'things', structure:'buildings', area:'rooms', vehicle:'vehicles' }[k] || 'ones';
  /* Not open just because some are ticked: For each lists who the job is for,
     with their ticks, so this is only for changing who (5 Oct). */
  const open = !on.size && JOB_ONLY === k && others.length <= 3;
  return `<details class="also"${open ? ' open' : ''}><summary>Also for other ${what}&hellip;</summary>
    <div>${others.map(r =>
    `<label class="tick"><input type="checkbox" class="jb-also" value="${esc(r.id)}"${on.has(r.id) ? ' checked' : ''}>
      ${esc(subjName(k, r.id))}</label>`).join('')}</div></details>`;
}
function alsoWrites(id, rec) {
  const boxes = [...document.querySelectorAll('.jb-also')];
  if (!boxes.length) return [];
  const k = aboutKind(rec), f = (JOB_AT.find(x => x[0] === k) || [])[1];
  if (!f) return [];
  const had = alsoOf(id), want = new Set(boxes.filter(b => b.checked).map(b => b.value));
  const out = [];
  want.forEach(v => { if (!had.some(a => a[f] === v))
    out.push({ op:'upsert', table:'job_also', record:{ id:uid(), job_id:id, [f]:v } }); });
  had.forEach(a => { if (!want.has(a[f])) out.push({ op:'archive', table:'job_also', id:a.id }); });
  return out;
}

/* A date typed into a box, or nothing. Never a guess. */
const asDay = v => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || '').trim());
  if (!m) return '';
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return d.getFullYear() === +m[1] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[3]
    ? ymd(d) : '';
};

   nameless: not sure, us, whoever was here before, or a company.

   Randi, 2026-09-29: "Not sure we want to give an optional who did it question"
   -- then, a minute later: "maybe its previous owners, maybe its a service."
   Both are right, and together they are the whole rule. Asking WHICH HOUSEMATE
   did something three months ago is a ledger reconstructed from memory, which
   is the rift this app is built not to cause. Asking whether it was the people
   who lived here before, a company you can ring again, or simply the household
   is provenance -- it tells you how much to trust the date, and it survives
   somebody moving out. So `us` is as specific as this ever gets, and
   by_person_id is written only when somebody ticks a job off as they do it. */
const DID_IT = [['not_sure','Not sure'], ['us','Us'],
                ['before_us','Whoever was here before'], ['service','A company']];

/* Work that happened before the app knew about it. This is not "finish the
   open job" -- the open job is the NEXT one. It records what happened and
   re-anchors the rule to it, so a septic pumped in June on a three-year cycle
   is next due in June, not three years from the afternoon you typed it in. */
async function logPast(schedId, on, who, serviceId, jobId) {
  const sc = (DB.schedule || []).find(x => x.id === schedId);
  const done = asDay(on);
  if (!done) return say('Put a date on it first.');
  if (done > today()) return say('That is in the future. Mark it done when it happens.');
  const writes = [{ op:'upsert', table:'completion', record:{ id:uid(),
    schedule_id: schedId || '', job_id: jobId || '',
    asset_id:(sc || {}).asset_id || '', animal_id:(sc || {}).animal_id || '',
    vehicle_id:(sc || {}).vehicle_id || '',
    done_on:done, recorded_on:today(), origin:'planned',
    what:(sc || {}).title || 'Done before',
    did_it: who || 'not_sure', service_id: who === 'service' ? (serviceId || '') : '' } }];
  if (sc && sc.every_n && sc.kind !== 'once') {
    const next = rollFrom(done, sc.every_n, sc.every_unit);
    writes.push({ op:'upsert', table:'schedule', record:{ ...sc, next_due_on: next } });
    /* The open occurrence moves with the rule. Leaving it where it was is how
       you end up with a job due next September for something now anchored to
       June -- the rule and the card disagreeing about the same thing. */
    (DB.job || []).filter(x => x.schedule_id === schedId && openJob(x))
      .forEach(x => writes.push({ op:'upsert', table:'job', record:{ ...x, due_on: next } }));
  }
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  await reload();
  const nx = (DB.schedule || []).find(x => x.id === schedId) || {};
  say('Noted — done ' + agoWords(daysTo(done)) + (nx.next_due_on
    ? '. Next one ' + whenDue(daysTo(nx.next_due_on)) + '.' : '.'));
  return true;
}
async function recordPast(sid, tag, jobId) {
  const on = $('#ld-d-' + tag).value, who = $('#ld-w-' + tag).value, svc = ($('#ld-s-' + tag) || {}).value;
  if (!asDay(on)) return say('Put a date on it first.');
  if (!(await saveJob(jobId, null, true))) return;
  const j = jobById(jobId) || {};
  if (await logPast(j.schedule_id || sid, on, who, svc, jobId)) drawJob(jobId);
}
/* The control, wherever it is wanted: on the job screen, and on the catch-up
   list. One markup, so the two can never ask the question differently. */
function lastDoneBox(sid, tag, jobId) {
  const svc = (DB.service || []).filter(x => x.status !== 'archived');
  return `<div class="ldbox">
    <div>

    <div>
      <label for="ld-w-${tag}" style="margin:0 0 .2rem">Who did it</label>
      <select id="ld-w-${tag}" style="margin:0"
        onchange="const b=$('#ld-s-${tag}');if(b)b.hidden=this.value!=='service'">${
        DID_IT.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')}</select></div>
    ${svc.length ? `<select id="ld-s-${tag}" hidden style="margin:0">${
      svc.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>` : ''}
    <button class="ghost" style="margin:0" onclick="${jobId
      /* On the job screen, what is typed above is saved first, so "every
         month, last done 28 Sept" means the next one is 28 Oct (5 Oct). */
      ? `recordPast('${sid}','${tag}','${jobId}')` : `logPast('${sid}',
      $('#ld-d-${tag}').value, $('#ld-w-${tag}').value,
      ($('#ld-s-${tag}')||{}).value, '').then(ok=>{if(ok)drawCatchUp()})`}">Record it</button>
  </div>`;
}
/* Finishing writes a completion — append-only history — and, when there is a
   rule behind it, moves the rule on. That is the loop the whole app is for. */
async function finishJob(id, on, happened, paid) {
  const j = jobById(id); if (!j) return;
  /* What happened is a line, not a field per kind of result (5 Oct): "Pass",
     "Fail: bacteria, call the well guy". It rides on the completion's what,
     after the title, so the history reads as a sentence. */
  const line = String(happened || '').trim();
  const cost = Number(String(paid || '').replace(/[^0-9.]/g, ''));
  /* The date is whatever the box says, and the box starts on today. Ticking
     something off on Sunday that you actually did on Friday used to file it as
     Sunday and count the next one from Sunday -- two days of drift per turn,
     forever, on a rule nobody would think to check. */
  const done = asDay(on) || today();
  const cid = uid();
  /* A job for several: Done ticks whoever is left, each into its own history,
     and the job itself writes no completion of its own -- one would show on
     every animal's page as well as their own line (5 Oct). */
  const lines = jobLines(j);
  if (lines.length) {
    const pay = Number.isFinite(cost) && cost > 0 ? cost : '';
    const lw = lines.filter(l => !l.done).flatMap(l => lineWrites(j, l, done, line, pay));
    if (lines.some(l => l.key === 'first' && !l.done)) j.first_done_on = done;
    return finishWrites(id, j, done, '', lw);
  }
  const writes = [{ op:'upsert', table:'completion',
      record:{ id:cid, job_id:id, asset_id:j.asset_id || '', schedule_id:j.schedule_id || '',
               animal_id:j.animal_id || '', vehicle_id:j.vehicle_id || '',
               done_on:done, recorded_on:today(), origin:'planned',
               what:(j.title || 'Done') + (line ? ' — ' + line : ''),
               cost: Number.isFinite(cost) && cost > 0 ? cost : '', by_person_id:me.id } }];
  return finishWrites(id, j, done, cid, writes);
}
/* Marking a job done, and the next round of a repeating one: shared by a job
   for one and a job for several, which differ only in what they write first. */
async function finishWrites(id, j, done, cid, writes) {
    /* Randi, 2026-09-27: "when a job gets completed, if un owned it could be
       assigned to who finished it." That is assignment used as a RECORD OF FACT
       rather than a directive \u2014 the only honest way to write this field by
       machine. Nobody is being told to do anything; the job simply turned out
       to be somebody's, and now the history says whose. If it was already
       assigned, that stands: the person it was meant for keeps the credit or
       the blame, and who actually did it is on the completion either way. The
       claim is left alone too \u2014 Dave taking it and Randi finishing it is a real
       and interesting fact, and overwriting it would hide that. */
  writes.push({ op:'upsert', table:'job', record:{ ...j, status:'done', done_on:done,
        owner_id: j.owner_id || me.id, completion_id:cid } });
  const sc = (DB.schedule || []).find(x => x.id === j.schedule_id);
  if (sc && sc.every_n && sc.kind !== 'once') {
    const next = rollFrom(done, sc.every_n, sc.every_unit);
    writes.push({ op:'upsert', table:'schedule', record:{ ...sc, next_due_on: next } });
    const nid = uid();
    writes.push({ op:'upsert', table:'job', record:{ id:nid, property_id:prop.id, kind:j.kind,
      title:j.title, source:'schedule', schedule_id:sc.id, asset_id:j.asset_id || '',
      structure_id:j.structure_id || '', area_id:j.area_id || '', animal_id:j.animal_id || '',
      notes:j.notes || '', est_minutes:j.est_minutes || '', est_cost:j.est_cost || '',
      prerequisites:j.prerequisites || '', safety:j.safety || '', provider_id:j.provider_id || '',
      status:'open', due_on: next } });
    /* The checklist, what it needs and who else it is for come round with it,
       unticked (5 Oct). They were left behind on the finished job, so the
       well test's sample-taking steps had to be typed in again every round. */
    stepsOf(id).forEach(st => writes.push({ op:'upsert', table:'step', record:{ id:uid(), job_id:nid,
      text:st.text, position:st.position || '', structure_id:st.structure_id || '', area_id:st.area_id || '',
      where_else:st.where_else || '', done:'' } }));
    (DB.job_supply || []).filter(x => x.job_id === id && x.status !== 'archived').forEach(x =>
      writes.push({ op:'upsert', table:'job_supply', record:{ id:uid(), job_id:nid,
        supply_id:x.supply_id, how_many:x.how_many || 1 } }));
    alsoOf(id).forEach(a => { const r = { ...a, id:uid(), job_id:nid, done_on:'' }; delete r.created_at; delete r.updated_at;
      writes.push({ op:'upsert', table:'job_also', record:r }); });
  }
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  await reload();
  // Back where the job was opened from, like Save (it always went Home).
  leaveJob(sc && sc.kind !== 'once' ? 'Done. The next one is on the list.' : 'Done.');
}

/* Somewhere to put a thing that is not a check-up and not broken \u2014 which is
   most of what anybody actually wants to write down. Straight into the job
   screen so the notes, the checklist and the dates are all right there. */
/* Four kinds of task, each asked only what fits it (decided 7 Oct). The kind
   column already held task, fault and project; an idea is kind 'idea' now, and
   the old status 'idea' and kind 'improvement' read as one. */
const TASK_TYPES = [
  /* Combined with the objects tab's One time / Repeat / Issue / Reading
     (decided 7 Oct): one time and repeat are maintenance, an issue is broken,
     and a reading is how a repeating one is answered, under Set up. */
  ['task',    'Maintenance', 'once or on a repeat, checked off or a reading', 'todo'],
  ['fault',   'Broken',      'an issue: it broke, leaks or half works',       'broken'],
  ['idea',    'Idea',        'something you might do one day',     'idea'],
  ['project', 'Project',     'several tasks toward one thing',     'project']];
const jobType = j => j.kind === 'fault' ? 'fault' : j.kind === 'project' ? 'project'
  : (j.kind === 'idea' || j.kind === 'improvement' || j.status === 'idea') ? 'idea' : 'task';
function addTask(parent) {
  setTab('add');
  hideTabs();
  const back = LAST_VIEW;
  app.innerHTML = `<button class="back" onclick="${back ? 'LAST_VIEW()' : "show('home')"}">&lsaquo; Back</button>
    <h1>What kind?</h1>
    <div class="pick">${TASK_TYPES.map(([k, l, sub, ic]) => `<button type="button" onclick="newJob('${k}'${parent ? `,'${parent}'` : ''})">
      ${icon(ic, 28)}<span class="cap">${l}<br><span class="meta" style="font-size:.85em">${sub}</span></span></button>`).join('')}</div>`;
  window.scrollTo(0, 0);
}

async function newJob(kind, parent) {
  DRAFT_JOB = { id:uid(), property_id:prop.id, kind: kind || 'task', title:'', source:'owner',
    status:'open', column:'todo', parent_job_id: parent || '' };
  if (parent) { const pj = jobById(parent) || {};
    JOB_AT.forEach(([, f]) => { if (pj[f]) DRAFT_JOB[f] = pj[f]; }); }
  if (TASK_FOR) { const [k, i] = TASK_FOR, fk = (SUBJECT[k] || {}).fk;
    if (fk && k !== 'property') DRAFT_JOB[fk] = i; TASK_FOR = null; }
  NEW_JOB = DRAFT_JOB.id; JOB_ONLY = null;
  drawJob(DRAFT_JOB.id);
}
/* A task under a project: the project is saved first, so the task has a
   parent to point at, and Back from the task comes back to the project. */
async function addChildTask(id) {
  if (isDraft(id) || NEW_JOB === id) { if (!(await saveJob(id, null, true))) return; }
  else { try { await DwelLogs.write(keepJob(id, [])); } catch (e) { return say(e.message); } await reload(); }
  LAST_VIEW = () => drawJob(id); JOB_OPEN = null;

}

  return g('Buildings', live('structure').map(r => ['structure:' + r.id, r.name]))
       + g('Rooms',     live('area').map(r => ['area:' + r.id, r.name]))
       + g('Things',    live('asset').map(r => ['asset:' + r.id, r.name]))
       + g('Animals',   live('animal').map(r => ['animal:' + r.id, r.name || r.kind]));
}
function docAbout(v) {
  const [t, id] = String(v || '').split(':');

function papers() {

  return (DB.document || [])

                 || (prop || {}).name || '',
        state: n == null ? 'ok' : n <= 0 ? 'attn' : n <= 30 ? 'soon' : 'ok' };

async function saveTell(id) {
  const what = [...document.querySelectorAll('.t-w:checked')].map(e => e.value);
  const num = v => { const n = Number((v || '').trim()); return Number.isFinite(n) && n > 0 ? n : ''; };
  const rec = { id: id || uid(), person_id: me.id,
    channel: $('#t-ch').value,
    what: what.join(', ') || 'nothing',
    lead_days: num($('#t-lead').value),
    cadence: $('#t-cad').value,
    max_per_week: num($('#t-cap').value),
    only_mine: $('#t-mine').checked ? 'TRUE' : '',
    never_about_unknowns: $('#t-unk').checked ? 'TRUE' : 'FALSE' };
  if (rec.channel === 'calendar' && !rec.feed_key) rec.feed_key = uid() + uid();
  try { await DwelLogs.write([{ op:'upsert', table:'reminder_pref', record:rec }]); }
  catch (e) { return say('Could not save: ' + e.message); }
  await boot();
  say(rec.channel === 'none' ? 'Nothing will be sent.'
    : rec.channel === 'calendar' ? 'Saved. Subscribe to the feed from your sheet.'
    : 'Saved. You will hear from us only when there is something.');
}
/* Everything else on the person screen says what state it is in — a place says
   "yours, one building", the sheet button says change-or-connect. Reminders
   were the one setting you had to open in order to find out what it was.

   The second half matters more than the summary. A digest is sent by a
   time-driven trigger INSIDE their sheet, so with no sheet there is nothing
   running to send it, and with no email address there is nowhere for it to
   arrive. Both are silent failures: you set a weekly digest, you are told you
   will hear from us, and then you never do. Say it here instead. */
const TELL_CH = { none:'Nothing is sent', email:'Emailed to you', calendar:'In your calendar' };
const TELL_CAD = { only_when_it_changes:'only when something changes', weekly:'once a week',
                   daily:'daily', monthly:'monthly' };
const TELL_WHAT = { due_soon:'things coming up', overdue:'things already late',
                    new_issues:'new problems', low_supplies:'running low',
                    someone_waiting:'somebody waiting on you' };

function tellSummary() {
  const p = (DB.reminder_pref || []).find(r => r.person_id === me.id && r.status !== 'archived');
  if (!p || !p.channel || p.channel === 'none')
    return { line:'Nothing is sent', detail:'You open the app and look.' };
  const bits = String(p.what || '').split(',').map(x => TELL_WHAT[x.trim()]).filter(Boolean);
  const detail = [bits.join(', ') || 'nothing chosen',
    p.lead_days ? p.lead_days + ' days ahead' : null,
    p.max_per_week ? 'at most ' + p.max_per_week + ' a week' : null].filter(Boolean).join(' \u00b7 ');
  const warn = !localStorage.getItem('dwellogs.url')
    ? 'Nothing can send this yet \u2014 the digest goes out from your sheet, and there is no sheet.'
    : (p.channel === 'email' && !me.email)
      ? 'There is no email address on you, so it has nowhere to arrive.'
      : '';
  return { line:(TELL_CH[p.channel] || p.channel) + ', ' + (TELL_CAD[p.cadence] || p.cadence),
           detail, warn };
}

/* ---- bringing a device-only log up to a sheet ---------------------------
   The connect screen promises you can add a sheet later without losing what
   you have. That promise had no code behind it: connecting simply swapped one
   database for another and left the first one stranded. This is the code. */

  if (!l) return 0;
  return ['person','property','structure','area','asset','schedule','document']
    .reduce((n, t) => n + ((l[t] || []).length), 0);

async function doLift() {
  const l = DwelLogs.localSnapshot() || {};
  // People and places first so the name-mirror columns have something to mirror
  // when a human opens the spreadsheet; the ids do not care about order.
  const ORDER = ['person','property','membership','structure','area','animal','placement',
    'category','asset_type','asset','supply','supply_link','schedule','completion','reading',
    'issue','work_item','document','service','visit','coverage','invite','suggestion',
    'reminder_pref','feedback'];
  const rows = [];
  ORDER.forEach(t => (l[t] || []).forEach(r => rows.push({ op:'upsert', table:t, record:r })));
  (Object.keys(l)).forEach(t => { if (!ORDER.includes(t))
    (l[t] || []).forEach(r => rows.push({ op:'upsert', table:t, record:r })); });
  if (!rows.length) return startOnSheet();

  // Chunked, because one request carrying a whole ranch is a request that times
  // out halfway and leaves nobody able to say what got through.
  const SIZE = 150, total = Math.ceil(rows.length / SIZE);
  for (let i = 0; i < total; i++) {
    say('Moving ' + rows.length + ' rows up… ' + (i + 1) + ' of ' + total);
    try { await DwelLogs.write(rows.slice(i * SIZE, (i + 1) * SIZE)); }
    catch (e) { return say('Stopped partway: ' + e.message + ' \u2014 nothing on this device was touched.'); }
  }
  await boot();
  say('Moved. The copy on this device is still there, untouched.');
}

function startOnSheet() {
  // They chose the empty sheet on purpose. Do not touch the local copy.
  firstRun();
  say('Starting fresh. Your device copy is still on this device.');
}

/* ---- taking it with you --------------------------------------------------

   "Move out, and your log moves with you" has been on the front page since the
   start, and nothing in the app could do it. It belongs on the PERSON, not on
   the place: a place cannot want to be taken away, and `membership` already
   says which ones are yours.

   One zip per place, one CSV per table, because the whole premise is that this
   is your spreadsheet -- a JSON blob would be a thing only this app can read,
   which is the opposite of the promise. The zip is written by hand (stored, no
   compression) so the app stays self-contained: pulling in a library to leave
   would be its own small joke. */
const CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0; }
  return b => { let c = 0xFFFFFFFF;
    for (let i = 0; i < b.length; i++) c = t[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0; };
})();
function zipOf(files) {
  const enc = new TextEncoder(), parts = [], dir = [];
  let at = 0;
  const u16 = n => [n & 255, (n >> 8) & 255];
  const u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
  files.forEach(([name, text]) => {
    const nb = enc.encode(name), body = enc.encode(text), crc = CRC(body);
    const head = [].concat([0x50,0x4b,0x03,0x04], u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(body.length), u32(body.length), u16(nb.length), u16(0));
    parts.push(new Uint8Array(head), nb, body);
    dir.push({ name:nb, crc, size:body.length, at });
    at += head.length + nb.length + body.length;
  });
  const cd = [];
  dir.forEach(f => {
    const h = [].concat([0x50,0x4b,0x01,0x02], u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(f.crc), u32(f.size), u32(f.size), u16(f.name.length),
      u16(0), u16(0), u16(0), u16(0), u32(0), u32(f.at));
    cd.push(new Uint8Array(h), f.name);
  });
  const cdSize = cd.reduce((a2, b2) => a2 + b2.length, 0);
  const end = new Uint8Array([].concat([0x50,0x4b,0x05,0x06], u16(0), u16(0),
    u16(dir.length), u16(dir.length), u32(cdSize), u32(at), u16(0)));
  return new Blob(parts.concat(cd, [end]), { type:'application/zip' });
}
const csvCell = v => {
  let t = v == null ? '' : String(v);
  /* A cell that opens with = + @ or a control character is a FORMULA to Excel,
     Sheets and Numbers -- so a goat named =HYPERLINK("http://…","click") is a
     live link in the file, and worse is available. The whole point of this
     export is that somebody opens it in a spreadsheet, and the names in it can
     be typed by anybody you invited, so the two facts meet here.

     A leading quote defuses it and is the convention every spreadsheet knows.
     Minus is deliberately NOT guarded on its own, because -40 is a temperature
     somebody meant; it is guarded only when what follows is not a number, which
     is the shape an injection takes. */
  if (/^[=+@\t\r]/.test(t) || (/^-/.test(t) && !/^-?\d*\.?\d+$/.test(t))) t = "'" + t;
  return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
};
function csvOf(rows) {
  const cols = [];
  rows.forEach(r => Object.keys(r).forEach(k => { if (cols.indexOf(k) < 0) cols.push(k); }));
  return [cols.join(',')].concat(rows.map(r => cols.map(c => csvCell(r[c])).join(','))).join('\n');
}
/* What belongs under a subject. The whole place is the case the front page
   promises -- move out and your log moves with you -- but it is the same act at
   any size: a copy of the 442 goes with the car when somebody buys it, and a
   copy of the barn goes with the barn. Same walk as the work and the money. */
function rowsUnder(kind, id) {
  const out = {}, ids = new Set();
  const tables = Object.keys(DB || {});
  tables.forEach(t => { out[t] = []; });
  const seed = (t, r) => { if (out[t].indexOf(r) < 0) { out[t].push(r); ids.add(r.id); } };
  descendants(kind, id).forEach(([k, i]) => {
    const tab = (SUBJECT[k] || {}).table; if (!tab) return;
    const r = (DB[tab] || []).find(x => x.id === i); if (r) seed(tab, r);
  });
  /* The place itself always comes, whatever level this started from: a box of
     rows with no property in it cannot say where any of it was. But it goes in
     the OUTPUT only, never into the walk set -- seeding it there made it a
     magnet, and a copy of one car came out carrying the cow's vet bill and
     every building on the place. */
  if (prop) (DB.property || []).filter(r => r.id === prop.id)
    .forEach(r => { if (out.property.indexOf(r) < 0) out.property.push(r); });
  for (let pass = 0; pass < 5; pass++) {
    let grew = false;
    // Outward: a step on a job on an asset in a room comes too.
    tables.forEach(t => {
      if (t === 'property') return;
      (DB[t] || []).forEach(r => {
        if (out[t].indexOf(r) > -1) return;
        const hit = Object.keys(r).some(k => k.endsWith('_id') && r[k] && ids.has(r[k]));
        if (hit) { out[t].push(r); ids.add(r.id); grew = true; }
      });
    });
    /* And inward, which the first version missed entirely: a person has no
       column pointing at anything, so nobody came -- and an export where every
       completion says who did it and no file says who that is answers the
       question with a uuid. Anything an included row POINTS AT comes as well. */
    const wanted = new Set();
    tables.forEach(t => out[t].forEach(r => Object.keys(r).forEach(k => {
      if (k.endsWith('_id') && r[k]) wanted.add(r[k]);
    })));
    tables.forEach(t => {
      if (t === 'property') return;
      (DB[t] || []).forEach(r => {
        if (out[t].indexOf(r) > -1 || !wanted.has(r.id)) return;
        out[t].push(r); ids.add(r.id); grew = true;
      });
    });
    if (!grew) break;
  }
  return out;
}
async function exportPlace(propId) { return exportSubject('property', propId); }
async function exportSubject(kind, id) {
  const label = subjName(kind, id) || 'dwellogs';
  say('Gathering it up…');
  let rows;
  try { rows = rowsUnder(kind, id); }
  catch (e) { return say('Could not build the export: ' + e.message); }
  const p = { name: label };
  const files = [];
  Object.keys(rows).sort().forEach(t => {
    if (!rows[t].length) return;
    files.push([t + '.csv', csvOf(rows[t])]);
  });
  if (!files.length) return say('Nothing to take yet.');
  const n = files.reduce((a2, f) => a2 + rows[f[0].replace('.csv', '')].length, 0);
  // A note in the box saying what this is, for the version of you that opens it
  // in four years having forgotten the app existed.
  files.push(['README.txt',
    'DwelLogs export\n' + (p.name || 'A place') + '\n' + today() + '\n\n' +
    'One CSV per table, exactly as the app holds it. Open any of them in a\n' +
    'spreadsheet. The id columns join the files to each other.\n' +
    (kind === 'property' ? '' :
      '\nThis is a copy of one part of ' + ((prop || {}).name || 'the place') +
      ', not the whole of it.\n')]);
  const slug = String(p.name || 'dwellogs').toLowerCase().replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '') || 'dwellogs';
  try {
    const url = URL.createObjectURL(zipOf(files));
    const a2 = document.createElement('a');
    a2.href = url; a2.download = slug + '-' + today() + '.zip';
    document.body.appendChild(a2); a2.click(); a2.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { return say('Could not save the file: ' + e.message); }
  say(n + ' rows in ' + (files.length - 1) + ' files. It is yours.');
}

async function sendSignIn() {

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { $('#si-e').classList.add('missing');

  catch (err) { return say(err.message); }
  SIGNIN_EMAIL = e;
  app.innerHTML = `<h1>Check your email</h1>

    <label for="si-c">The code in the email</label>
    <input id="si-c" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="from the email">

    <div class="actions"><button class="ghost" onclick="drawSignIn()">Send a new one</button>

/* One way in: the code (5 Oct, "i dont want to do both"). The link only ever
   worked where the email app happened to open it, and copying it made iOS
   open it for the preview, which spent it. A code works wherever the app is. */
async function checkSignInCode() {
  const c = (($('#si-c') || {}).value || '').replace(/\s+/g, '');

  boot();
}

async function doLiftAccount() {
  const name = (((DwelLogs.localSnapshot() || {}).person || [])
    .find(p => p.id === localStorage.getItem('dwellogs.me')) || {}).name;
  say('Putting it in your account…');
  try { await DwelLogs.liftToAccount(name); }
  catch (e) { return say('Nothing went in: ' + e.message); }
  localStorage.setItem('dwellogs.claimed', DwelLogs.account.email());
  /* In, so the phone-only copy is done with. Kept, it was what Sign out went
     back to -- a stale ranch whose changes went nowhere (5 Oct). Until the move
     succeeded it was untouched, so a failed move still cost nothing. */
  localStorage.removeItem('dwellogs.local.v1');
  localStorage.removeItem('dwellogs.phoneonly');
  await boot();
  say('Done. Your log is in your account now.');

async function signOut() {
  await DwelLogs.account.signOut();
  localStorage.removeItem('dwellogs.claimed');
  /* Back to whatever this phone had before signing in. The account's copy on
     the phone goes: it is the account's, not this phone's, and the next person
     to pick the phone up should not be reading it. */
  localStorage.removeItem('dwellogs.account.v1');
  localStorage.removeItem('dwellogs.queue.v1');
  localStorage.removeItem('dwellogs.phoneonly');
  localStorage.setItem('dwellogs.signedout', '1');
  const l = DwelLogs.localSnapshot() || {};
  const mine = (l.person || []).find(p => p.role === 'owner');
  if (mine) localStorage.setItem('dwellogs.me', mine.id); else localStorage.removeItem('dwellogs.me');
  await boot();
  say('Signed out.');
}

async function saveEdit(kind, id) {
  const row = subjRow(kind, id); if (!row) return;
  const v = k => (($('#' + k) || {}).value || '').trim();
  const rec = { ...row }, writes = [];
  if (kind === 'structure') { const k = v('ed-k'); rec.kind = k === '__other' ? 'other' : k; rec.kind_other = k === '__other' ? v('ed-ko') : ''; }
  if (kind === 'property') rec.kind = v('ed-k');
  if (kind === 'asset') {
    const name = v('ed-t');
    let t = (DB.asset_type || []).find(x => x.name === name);
    if (!t) {
      // A kind this account has not got yet: added the way adding a thing adds it.
      const cat = Object.keys(STARTER).find(c => STARTER[c].some(x => x[0] === name)) || 'Other';
      let cid = ((DB.category || []).find(x => x.name === cat) || {}).id;
      if (!cid) { cid = uid(); writes.push({ op:'upsert', table:'category', record:{ id:cid, name:cat } }); }
      t = { id:uid(), category_id:cid, name, source:'owner' };
      writes.push({ op:'upsert', table:'asset_type', record:t });
    }
    rec.asset_type_id = t.id; rec.installed_on = v('ed-i');
  }
  if (kind === 'animal') {
    const ticked = c => [...document.querySelectorAll('.' + c)].filter(e => e.checked).map(e => e.value).join(', ');
    Object.assign(rec, { type: v('ed-t'), role: v('ed-r'), owner_id: v('ed-o'), structure_id: v('ed-s'),
      produces: ticked('ed-p'), helps_with: ticked('ed-h') });
  }
  writes.push({ op:'upsert', table: SUBJECT[kind].table, record: rec });
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  await reload(); if (kind === 'property') prop = DB.property.find(x => x.id === id) || prop;
  subject(kind, id); say('Saved.');
}

async function acceptAccountInvite(code, brings) {
  const name = (($('#ia-n') || {}).value || '').trim();
  if (!name) return say('We need something to put on the log.');
  let id;
  try { id = await DwelLogs.account.rpc('claim_me', { p_name: name, p_person_id: null, p_code: code }); }
  catch (e) { return say(e.message.replace(/ -- /g, ' — ')); }
  localStorage.removeItem('dwellogs.invite');
  localStorage.setItem('dwellogs.me', id);
  localStorage.setItem('dwellogs.claimed', DwelLogs.account.email());
  // Land in the place they were invited to: their newest membership.
  const res = await DwelLogs.load();
  const ms = (res.db.membership || []).filter(m => m.person_id === id).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  if (ms[0]) localStorage.setItem('dwellogs.place', ms[0].property_id);
  if (brings && ms[0] && liftable()) {
    localStorage.setItem('dwellogs.bring', ms[0].property_id);
    await boot();
    return drawBringIn();
  }
  await boot();
  say('You are in.');
}

/* ---- whose a building is (5 Oct) -------------------------------------------
   Only setup could say a building was somebody else's, so the shed being
   built for Mom -- hers to use, anchored to the ranch -- could not be handed
   over once she had joined. Whose it is, what the place sees, and whether it
   leaves with them are three questions, and each belongs to one person: the
   owner hands a building over and says if it stays; from then on what the
   place sees inside is the new person's call, not the owner's. */
const leavesWith = st => st.leaves_with || (st.mobile === true || String(st.mobile).toUpperCase() === 'TRUE'
  ? 'them' : 'the_place');
function whoseSection(st) {
  if (!me || !prop) return '';
  const owner = (DB.membership || []).some(m => m.person_id === me.id && m.property_id === prop.id
    && m.access === 'owner' && liveRow(m));
  const P = byId('person'), who = st.responsible_id && P[st.responsible_id];
  const leaves = l => l === 'them' ? 'goes with them' : 'stays here';
  if (st.responsible_id === me.id && !owner) return `<h2 style="margin-top:1.6rem">Yours</h2>
    <label>What can ${esc(prop.name)} see?</label>
    <div class="opts">
      <label class="tick"><input type="radio" name="wh-v" value="presence_only"${st.visibility !== 'shared' ? ' checked' : ''}>
        That it is there, and what it is hooked up to</label>
      <label class="tick"><input type="radio" name="wh-v" value="shared"${st.visibility === 'shared' ? ' checked' : ''}>
        Everything in it</label></div>
    <p class="hint">If you move on, it ${leaves(leavesWith(st)) === 'stays here' ? 'stays here' : 'goes with you'}.</p>
    <div class="actions"><button class="ghost" onclick="saveSeen('${st.id}')">Save</button></div>
    ${helpLink('sharing')}`;
  if (who && st.responsible_id !== me.id) return `<h2 style="margin-top:1.6rem">Whose it is</h2>
    <p class="hint">${esc(who.name)}&rsquo;s. They decide what the rest of the place sees inside it.
      If they move on, it ${leaves(leavesWith(st))}.</p>`;
  if (!owner) return '';
  const others = (DB.membership || []).filter(m => m.property_id === prop.id && m.person_id !== me.id && liveRow(m))
    .map(m => P[m.person_id]).filter(Boolean);
  if (!others.length) return '';
  return `<h2 style="margin-top:1.6rem">Whose it is</h2>
    <label for="wh-p">Is it somebody else&rsquo;s?</label>
    <select id="wh-p"><option value="">No, it is the place&rsquo;s</option>
      ${others.map(o => `<option value="${o.id}">${esc(o.name)}&rsquo;s</option>`).join('')}</select>
    <label for="wh-l">If they move on</label>
    <select id="wh-l">
      <option value="the_place"${leavesWith(st) === 'the_place' ? ' selected' : ''}>It stays here</option>
      <option value="them"${leavesWith(st) === 'them' ? ' selected' : ''}>It goes with them</option></select>
    <p class="hint">Once it is theirs, what you see inside it is up to them.</p>
    <div class="actions"><button class="ghost" onclick="saveWhose('${st.id}')">Save</button></div>
    ${helpLink('sharing')}`;
}
async function saveWhose(id) {
  const to = ($('#wh-p') || {}).value;
  if (!to) return say('Nothing changed: it is still the place\u2019s.');
  const st = (DB.structure || []).find(x => x.id === id) || {};
  const leaves = ($('#wh-l') || {}).value || leavesWith(st);
  try {
    // Signed in, the database checks it is yours to give (hand_over, 0002).
    if (DwelLogs.account.signedIn())
      await DwelLogs.account.rpc('hand_over', { p_structure:id, p_person:to, p_leaves_with:leaves });
    else await DwelLogs.write([{ op:'upsert', table:'structure', record:{ ...st, responsible_id:to,
      visibility:'presence_only', leaves_with:leaves } }]);
  } catch (e) { return say('Could not save: ' + e.message.replace(/ -- /g, ' \u2014 ')); }
  const name = ((DB.person || []).find(p => p.id === to) || {}).name || 'theirs';
  await boot(); subject('structure', id); say(st.name + ' is ' + name + '\u2019s now.');
}
async function saveSeen(id) {
  const st = (DB.structure || []).find(x => x.id === id) || {};
  const v = (document.querySelector('input[name="wh-v"]:checked') || {}).value || 'presence_only';
  try { await DwelLogs.write([{ op:'upsert', table:'structure', record:{ ...st, visibility:v } }]); }
  catch (e) { return say('Could not save: ' + e.message); }
  await boot(); subject('structure', id); say('Saved.');
}

/* ---- bringing a home in (5 Oct) -------------------------------------------
   Mom set her tiny house up on her own phone, then was invited to the ranch.
   Her log goes into her account the ordinary way first, then bring_in (0002)

// Things that stand on the land rather than in a home, and what they supply.
const ON_THE_LAND = { 'Well':'water', 'Septic tank':'sewer_septic', 'Water storage tank':'water',

const UTIL_WORD = { water:'water', sewer_septic:'waste' };
let BRING = null;
/* Decided 5 Oct: the owner sets the place up first, so the ranch's well is
   usually already on it when Mom's log arrives with a well of its own. The
   host's things come first -- what does your home get from here? -- and a
   thing of hers that matches one is asked "the same one?" rather than becoming
   a second well. Nothing is ticked for her: a hookup is asked, never assumed,
   and "yours" is the answer that changes nothing. */
function drawBringIn() {
  const into = localStorage.getItem('dwellogs.bring');
  const place = (DB.property || []).find(p => p.id === into);
  const l = DwelLogs.localSnapshot() || {};
  const home = (l.property || [])[0];
  if (!place || !home) { localStorage.removeItem('dwellogs.bring'); return show('home'); }
  hideTabs();
  const n = t => (l[t] || []).filter(r => r.status !== 'archived').length;
  const typeL = a => ((l.asset_type || []).find(t => t.id === a.asset_type_id) || {}).name || a.name || '';
  const typeH = a => ((DB.asset_type || []).find(t => t.id === a.asset_type_id) || {}).name || a.name || '';
  const host = (DB.asset || []).filter(a => a.property_id === into && a.status !== 'archived' && ON_THE_LAND[typeH(a)]);
  const land = (l.asset || []).filter(a => a.status !== 'archived' && ON_THE_LAND[typeL(a)])
    .map(a => ({ a, util:ON_THE_LAND[typeL(a)], match:host.find(h => typeH(h) === typeL(a)) }));
  BRING = { into, land, util:Object.fromEntries(host.map(h => [h.id, ON_THE_LAND[typeH(h)]])) };
  const pn = esc(place.name);
  app.innerHTML = `<p class="step">One more thing</p>
    <h1>Bring ${esc(home.name || 'your home')} in?</h1>
    <p class="sub">It goes on ${pn} as a building that is yours. Your things,

      <div class="grow"><b>${esc(home.name || 'Your home')}</b>
        <small>${[[n('structure'),'building'],[n('asset'),'thing'],[n('schedule'),'check-up'],[n('job'),'job']]
          .filter(x => x[0]).map(([c, w]) => c + ' ' + w + (c === 1 ? '' : 's')).join(' \u00b7 ')
          || 'nothing in it yet'}</small></div></div></div>
    <label>What can ${pn} see?</label>
    <div class="opts">
      <label class="tick"><input type="radio" name="bi-v" value="presence_only" checked>

      <label class="tick"><input type="radio" name="bi-v" value="shared">

    </div>

      <div class="opts">${host.map(h => `<label class="tick"><input type="checkbox" name="bi-h" value="${esc(h.id)}">
        ${esc(h.name || typeH(h))} <span class="hint">&middot; ${esc(UTIL_WORD[ON_THE_LAND[typeH(h)]] || '')}</span></label>`).join('')}</div>` : ''}
    ${land.map((x, i) => `<label>Your ${esc(x.a.name || typeL(x.a))}</label>
      <div class="opts">
        ${x.match ? `<label class="tick"><input type="radio" name="bi-s-${i}" value="same">
          The same one as ${pn}&rsquo;s ${esc(x.match.name || typeH(x.match))}</label>` : ''}
        <label class="tick"><input type="radio" name="bi-s-${i}" value="place">
          ${x.match ? 'Another one, and it is ' + pn + '&rsquo;s' : pn + '&rsquo;s — your home is hooked up to it'}</label>
        <label class="tick"><input type="radio" name="bi-s-${i}" value="mine" checked>

      <button class="ghost" onclick="show('home')">Not now</button>
    </div>

    ${helpLink('sharing')}`;
}
async function doBringIn() {
  const { into, land, util } = BRING || {};
  const l = DwelLogs.localSnapshot() || {};
  const from = ((l.property || [])[0] || {}).id;
  if (!into || !from) return show('home');
  const vis = (document.querySelector('input[name="bi-v"]:checked') || {}).value || 'presence_only';
  const feeds = new Map([...document.querySelectorAll('input[name="bi-h"]:checked')].map(x => [x.value, util[x.value]]));
  const same = [], theirs = [];
  land.forEach((x, i) => {
    const pick = (document.querySelector(`input[name="bi-s-${i}"]:checked`) || {}).value;
    if (pick === 'same' && x.match) { same.push({ hers:x.a.id, place:x.match.id }); feeds.set(x.match.id, x.util); }
    else if (pick === 'place') { theirs.push(x.a.id); feeds.set(x.a.id, x.util); }
  });
  const name = ((l.person || []).find(p => p.id === localStorage.getItem('dwellogs.me')) || {}).name;
  say('Bringing it in…');
  try {
    // Every write is update-or-insert, so a second try after a failure is safe.
    await DwelLogs.liftToAccount(name);
    await DwelLogs.account.rpc('bring_in', { p_from:from, p_into:into, p_visibility:vis,
      p_to_the_place:theirs, p_feeds:[...feeds].map(([asset_id, utility]) => ({ asset_id, utility })),
      p_same:same }, 60000);
  } catch (e) { return say('Nothing moved yet: ' + e.message.replace(/ -- /g, ' — ')); }
  localStorage.removeItem('dwellogs.local.v1');
  localStorage.removeItem('dwellogs.phoneonly');
  localStorage.removeItem('dwellogs.bring');
  localStorage.setItem('dwellogs.place', into);
  HOME_SCOPE = null;
  await boot();
  say('Your home is on ' + (((DB.property || []).find(p => p.id === into) || {}).name || 'the place') + ' now.');
}
async function copyLink(t) {
  try { await navigator.clipboard.writeText(t); say('Copied. Send it to them.'); }

/* ONE animal form. There were three: this one, and two copies inside the setup

function animalCore() {

/* Where a new animal most likely lives, so the question arrives answered and
   costs a tap only when it is wrong. The form never asked at all, so every
   animal landed in no building -- Randi's two cats were "on the ranch" and not
   in the house (export, 1 Oct). A guess, offered: a cat can be a barn cat. */
const ANIMAL_HOME = {
  chicken:['coop','animal_pen','barn'], duck:['coop','animal_pen','barn'],
  goat:['barn','animal_pen','pole_barn','stable','pasture'],
  sheep:['barn','animal_pen','pole_barn','pasture'], pig:['animal_pen','barn','pole_barn'],
  cow:['barn','pole_barn','pasture'], horse:['stable','barn','pasture'],
  cat:HOMES, dog:HOMES, bird:HOMES, bee:[] };
function animalHome(type) {
  const here = buildings().filter(x => !x.property_id || x.property_id === (prop || {}).id);
  for (const k of (ANIMAL_HOME[type] || HOMES)) {
    const b = here.find(x => x.kind === k); if (b) return b.id;

  return '';
}
function drawAnimal() {

     The tester read the hint, did not know what it wanted, and had to be told.
     The type is the thing she knows; the name is the thing she may not have.
     So the type is asked first, the count sits beside it, and the name boxes
     appear afterwards already knowing what they are naming. */
  draft.an = draft.an || { type:'dog', n:1, names:[] };
  app.innerHTML = `<h1>Add an animal</h1>
    ${animalCore()}
    <div class="fgrid"><div>
    <label for="an-r">Kept as</label>
    <select id="an-r">${[['pet','a pet'],['service','a service or assistance animal'],['laying','laying'],['meat','meat'],['dairy','dairy'],
        ['breeding','breeding'],['working','working'],['guard','guarding']]
      .map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')}</select>
    </div><div>
    <label for="an-o">Whose is it?</label>
    <select id="an-o">
      <option value="">It belongs to the place</option>
      ${people.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}
    </select>
    </div></div>
    <label for="an-s">Where does it live?</label>
    <select id="an-s" onchange="draft.an.where=this.value">
      <option value="">Nowhere in particular</option>
      ${buildings().filter(x => !x.property_id || x.property_id === (prop || {}).id).map(x => {
        const sel = (draft.an.where != null ? draft.an.where : animalHome(draft.an.type)) === x.id;

      <label class="tick" style="flex:1;min-width:0">
        <input type="checkbox" class="an-p" value="${v}"
          ${(draft.an.produces || []).indexOf(v) > -1 ? 'checked' : ''}>
        <span>${esc(v.replace(/_/g, ' '))}</span></label></div>`).join('')}</div>
    <label for="an-po" style="font-weight:400;color:var(--muted)">Something else?</label>
    <input id="an-po" value="${esc(draft.an.producesOther || '')}" placeholder="in your own words"
      oninput="draft.an.producesOther=this.value">

    <h2>What it helps with</h2>
    <div class="rows">${HELPS.map(v => `<div class="row">
      <label class="tick" style="flex:1;min-width:0">

}
/* Only the name boxes are rebuilt when the count or the type changes. Redrawing
   the whole screen from inside a field's own change event replaces the element
   the browser is still dispatching to, and the next tap anywhere gets swallowed. */
/* You keep three hives, not three bees. The count and the names are about the
   unit a person actually manages, which is not always the animal. */
const UNIT_NOUN = { bee: 'hive' };
function unitNoun(type) { return UNIT_NOUN[type] || (type === '__other' ? typeLabel(type) : type); }
/* You keep beehives. "bee" in the list with "How many?" beside it invites
   somebody to count bees, or queens, or to give up and put 1. Naming the unit
   in the list itself is better than explaining it underneath. */
const TYPE_LABEL = { bee: 'beehive' };
function typeLabel(t) {
  // Typed into "Something else…": what she called it, not the placeholder value.
  if (t === '__other') return String((draft.an || {}).typeOther || '').trim().toLowerCase() || 'animal';
  return TYPE_LABEL[t] || t;

function animalNames() {

  for (let i = 0; i < a.n; i++) {
    out.push(`<label for="an-n${i}" class="sr">Name ${i + 1}</label>
      <input id="an-n${i}" class="an-n" value="${esc(a.names[i] || '')}"
        placeholder="${esc(a.n > 1 ? unitNoun(a.type) + ' ' + (i + 1) : 'optional')}">`);
  }

}
function keepAnimalNames() {
  if (!draft.an) return;

  const ticked = c => [...document.querySelectorAll(c)].filter(e => e.checked).map(e => e.value);
  if (document.querySelector('.an-p')) draft.an.produces = ticked('.an-p');
  if (document.querySelector('.an-h')) draft.an.helps_with = ticked('.an-h');
  if (draft.an.names.some(Boolean) || (draft.an.produces || []).length
      || (draft.an.helps_with || []).length) draft.an.touched = true;
}
/* Both of these rebuild the name boxes, and both are wired to a change event,
   which fires on BLUR. Tapping from the count straight into a name box would
   therefore tear down and rebuild the box being tapped, losing the first thing
   typed into it -- the same way redrawing from inside a field's own event
   swallows the next tap elsewhere in this file. So: if the value has not
   actually changed, do nothing at all. */
function anKind(t) {
  if (!draft.an || draft.an.type === t) return;
  keepAnimalNames(); draft.an.type = t; draft.an.touched = true; addLabel('an-add', animalBtn());
  const w = $('#an-towrap'); if (w) { w.hidden = t !== '__other'; if (!w.hidden) $('#an-to').focus(); }
  const box = $('#an-names'); if (box) box.innerHTML = animalNames();
}
function anCount(v) {
  if (!draft.an) return;
  const n = Math.floor(Number(v));
  const want = Number.isFinite(n) && n > 0 ? Math.min(n, 40) : 1;
  const q = $('#an-q'), typing = q && document.activeElement === q;
  /* Never rewrite the box while they are still in it -- clamping "50" to "40"
     mid-keystroke fights the typist. Junk gets normalised when they leave. */
  if (want === draft.an.n) { if (q && !typing && q.value !== String(want)) q.value = String(want); return; }
  keepAnimalNames();
  draft.an.n = want; draft.an.touched = true; addLabel('an-add', animalBtn());
  if (q && !typing) q.value = String(want);
  const box = $('#an-names'); if (box) box.innerHTML = animalNames();

/* A smoke detector is replaced after ten years, which is right, and the card
   read "in 3652 days", which nobody has ever counted. Days are how the app
   stores a distance, not how a person says one: past a fortnight it is weeks,
   past a couple of months it is months, and past two years it is years. */
function whenDue(d) {
  /* A dash, and it stays a dash. No date is not a date the app is allowed to
     fill in, and it is not a distance it can measure from -- so it says so
     with the same mark it uses everywhere else it has no answer, and nothing
     downstream counts days from nothing. */
  if (d == null) return '—';
  const n = Math.abs(d);

    : n < 70 ? [Math.round(n / 7), 'week']
    : n < 330 ? [Math.round(n / 30.44), 'month']

  const said = unit[0] + ' ' + unit[1] + (unit[0] === 1 ? '' : 's');
  if (d < 0) return said + ' late';
  if (d === 0) return 'today';
  if (d === 1) return 'tomorrow';
  return 'in ' + said;

/* Which groups a building of this kind leads with on Add a thing. */
function typeLeads(kind) {

  if (kind === 'septic_field') return ['Septic & sewer'];

async function addThing() {

      kind_other: bk === '__other' ? ($('#a-bko').value || '').trim() : '' } });

  const t = thingWrites(type, { structId, name, installed:today(), parentId:ADD_PART,
    areaId: structId === '__new' ? '' : (($('#a-ar') || {}).value || ''),
    keep: (tn, title) => want.has(title) });
  if (!t.id) return say('That one has no template yet.');
  t.writes.forEach(w => writes.push(w));
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  DB = (await DwelLogs.load()).db;

  /* A thing you already own has a history, and the moment you have just typed
     its name is the moment you remember when the filter was last changed. Its
     own check-ups only -- the whole catch-up list here would be an ambush. */
  const fresh = (DB.schedule || []).filter(sc => sc.asset_id === t.id

    ? ', with ' + on + ' check-up' + (on === 1 ? '' : 's')
      + (on < t.checks ? ' — the rest are kept quiet.' : '.')
    : '.'));
}

/* ---------------------------------------------------------------- readings

   The table draft 1 of the v1 line argued in by name -- "levels are half of
   what people actually track" -- and which then sat with no screen for weeks
   while three unrelated things asked for it: mite counts on a hive, the
   odometer on a car, eggs a day.

   The shape comes from the schema and is worth restating: result_type decides
   what a result may be USED for. A number can be trended; a pass/fail cannot.
   And `source` exists because instruments break -- a tank gauge reading 10%
   and the supplier saying 40% are both real readings, and averaging them is
   the wrong answer. */
const RESULT_KIND = [['numeric','A number'], ['present_absent','Present or absent'],
                     ['pass_fail','Pass or fail']];
const FLAGS = { present_absent: [['present','Present'],['absent','Absent']],
                pass_fail:      [['pass','Pass'],['fail','Fail']] };
const READ_FROM = [['gauge','A gauge'],['dipstick','A dipstick'],['sight_glass','A sight glass'],
                   ['meter','A meter'],['supplier','The supplier'],['delivery_ticket','A delivery ticket'],
                   ['by_eye','By eye'],['lab','A lab']];

/* Everything a reading can be about, in one list, because "which room is damp"
   and "how full is the tank" are the same question to the person asking. */
function readSubjects() {
  const out = [];
  (DB.asset || []).filter(a => a.status !== 'archived')
    .forEach(a => out.push(['asset:' + a.id, a.name]));
  (DB.animal || []).filter(a => a.status !== 'archived')
    .forEach(a => out.push(['animal:' + a.id, a.name || ('The ' + a.type)]));
  (DB.area || []).forEach(a => out.push(['area:' + a.id, a.name]));
  (DB.structure || []).forEach(s => out.push(['structure:' + s.id, s.name || 'the building']));
  out.push(['property:' + prop.id, prop.name]);
  return out;
}
function subjectWords(r) {
  const A = byId('asset'), N = byId('animal'), R = byId('area'), T = byId('structure');
  if (r.asset_id)     return (A[r.asset_id] || {}).name || 'something';
  if (r.animal_id)    return (N[r.animal_id] || {}).name || 'an animal';
  if (r.area_id)      return (R[r.area_id] || {}).name || 'a room';
  if (r.structure_id) return (T[r.structure_id] || {}).name || 'a building';
  return prop.name;
}
function readingWords(r) {
  if (String(r.result_type) === 'numeric')
    return (r.value_num === '' || r.value_num == null ? '—' : r.value_num)
           + (r.unit ? ' ' + r.unit : '');
  const f = (FLAGS[r.result_type] || []).find(x => x[0] === r.value_flag);
  return f ? f[1] : (r.value_flag || '—');
}
function readingsOf(limit) {
  return (DB.reading || []).filter(r => r.status !== 'archived')
    .sort((a, b) => String(b.taken_on).localeCompare(String(a.taken_on)))
    .slice(0, limit || 12);
}

function drawReading(subject, scheduleId) {
  hideTabs();
  const subs = readSubjects();
  if (!draft.rd || subject || scheduleId) {
    draft.rd = { subject: subject || (subs[0] || [''])[0], result_type:'numeric',
                 value_num:'', value_flag:'', unit:'', source:'gauge',
                 taken_on: today(), doubt:false, schedule_id: scheduleId || '' };
  }
  const r = draft.rd;
  const rule = (DB.schedule || []).find(x => x.id === r.schedule_id);
  /* Arriving from a rule, the repeat it already has is what the control should
     show -- otherwise saving would quietly turn a monthly check into a one-off. */
  if (rule && r.rep === undefined) {
    r.rep = (rule.every_n && rule.kind !== 'once') ? 'yes' : '';
    r.every_n = rule.every_n || '1';
    r.every_unit = rule.every_unit || 'month';
  }
  const flags = FLAGS[r.result_type];
  app.innerHTML = `<button class="back" onclick="draft.rd=null;show('home')">&lsaquo; Back</button>
    <h1>${esc(rule ? rule.title : 'Take a reading')}</h1>

    <label for="rd-s">What is it about?</label>
    <select id="rd-s" onchange="keepReading();draft.rd.subject=this.value">
      ${subs.map(([k, l]) => `<option value="${esc(k)}"${
        r.subject === k ? ' selected' : ''}>${esc(l)}</option>`).join('')}
    </select>

    <label for="rd-k">What kind of answer?</label>
    <select id="rd-k" onchange="reReading(this.value)">
      ${optList(r.result_type, RESULT_KIND)}</select>

    ${flags ? `<label for="rd-f">Result</label>
      <select id="rd-f">${optList(r.value_flag || flags[0][0], flags)}</select>`
    : `<div class="counts" style="grid-template-columns:2fr 1fr">
        <div class="count"><span>Value</span>
          <input id="rd-v" inputmode="decimal" value="${esc(r.value_num)}"></div>
        <div class="count"><span>Unit</span>
          <input id="rd-u" value="${esc(r.unit)}" placeholder="%"></div>
      </div>`}

    <label for="rd-src">Read from</label>
    <select id="rd-src">${optList(r.source, READ_FROM)}</select>

    <label for="rd-d">Taken on</label>
    <input id="rd-d" type="date" value="${esc(r.taken_on)}">

      <option value="yes"${r.rep ? ' selected' : ''}>Yes, on a repeat</option>
    </select>
    ${r.rep ? `<div class="counts" style="grid-template-columns:1fr 2fr">
      <div class="count"><span>Every</span>
        <input id="rd-en" inputmode="numeric" value="${esc(r.every_n || '1')}"></div>
      <div class="count"><span>&nbsp;</span>

    <label class="tick" style="margin-top:.9rem"><input type="checkbox" id="rd-q"
      ${r.doubt ? 'checked' : ''}><span>Not sure about this one</span></label>

        <div class="grow"><b>${esc(subjectWords(x))} &middot; ${esc(readingWords(x))}</b>
          <small>${esc(x.taken_on)}${String(x.trusted).toUpperCase() === 'TRUE'
            ? '' : ' &middot; not sure'}</small></div></div>`).join('')}</div>`;
