/* Only the name boxes are rebuilt when the count or the type changes. Redrawing
   the whole screen from inside a field's own change event replaces the element
   the browser is still dispatching to, and the next tap anywhere gets swallowed. */
/* You keep three hives, not three bees. The count and the names are about the
   unit a person actually manages, which is not always the animal. */
const UNIT_NOUN = { bee: 'hive' };
function unitNoun(type) { return UNIT_NOUN[type] || type; }
function animalNames() {
  const a = draft.an, out = [];
  for (let i = 0; i < a.n; i++) {
    out.push(`<label for="an-n${i}" class="sr">Name ${i + 1}</label>
      <input id="an-n${i}" class="an-n" value="${esc(a.names[i] || '')}"
        placeholder="${esc(a.n > 1 ? unitNoun(a.type) + ' ' + (i + 1) : 'optional')}">`);
  }
  return out.join('');
}
function keepAnimalNames() {
  if (!draft.an) return;
  draft.an.names = [...document.querySelectorAll('.an-n')].map(e => (e.value || '').trim());
  const ticked = c => [...document.querySelectorAll(c)].filter(e => e.checked).map(e => e.value);
  if (document.querySelector('.an-p')) draft.an.produces = ticked('.an-p');
  if (document.querySelector('.an-h')) draft.an.helps_with = ticked('.an-h');
}
/* Both of these rebuild the name boxes, and both are wired to a change event,
   which fires on BLUR. Tapping from the count straight into a name box would
   therefore tear down and rebuild the box being tapped, losing the first thing
   typed into it -- the same way redrawing from inside a field's own event
   swallows the next tap elsewhere in this file. So: if the value has not
   actually changed, do nothing at all. */
function anKind(t) {
  if (!draft.an || draft.an.type === t) return;
  keepAnimalNames(); draft.an.type = t;
  const box = $('#an-names'); if (box) box.innerHTML = animalNames();
}
function anCount(v) {
  if (!draft.an) return;
  const n = Math.floor(Number(v));
  const want = Number.isFinite(n) && n > 0 ? Math.min(n, 40) : 1;
  const q = $('#an-q'), typing = q && document.activeElement === q;
  /* Never rewrite the box while they are still in it -- clamping "50" to "40"
     mid-keystroke fights the typist. Junk gets normalised when they leave. */
  if (want === draft.an.n) { if (q && !typing && q.value !== String(want)) q.value = String(want); return; }
  keepAnimalNames();
  draft.an.n = want;
  if (q && !typing) q.value = String(want);
  const box = $('#an-names'); if (box) box.innerHTML = animalNames();
  const h2 = box && box.previousElementSibling;
  if (h2 && h2.tagName === 'H2') h2.textContent = want > 1 ? 'Names' : 'Name';
  const go = $('#an-go');
  if (go) go.textContent = want > 1 ? 'Add them' : 'Add it';
}

  const a = draft.an, owner = $('#an-o').value, role = $('#an-r').value;

  for (let i = 0; i < a.n; i++) {

async function saveMove(stId) {
  const where = ($('#pk-a').value || '').trim();
  if (!where) return say('Say where it is, even roughly.');
  const when = $('#pk-d').value || today(), here = readHere(), was = openStay(stId);
  // A stay cannot end before it started. Left unchecked, moving in on a future
  // date and then moving again today writes a stay that ran backwards, and
  // every span measured off it afterwards is nonsense.
  if (was && was.arrived_on && when < was.arrived_on)
    return say('That is before you arrived at ' + (was.address || 'the last spot') +
      ' on ' + was.arrived_on + '. Check the date.');
  const writes = [];
  if (was) writes.push({ op:'upsert', table:'placement', record:{ ...was, left_on:when } });
  writes.push({ op:'upsert', table:'placement', record:{ id:uid(), structure_id:stId,
    property_id:(was || {}).property_id || prop.id, address:where, arrived_on:when,
    stay_kind:$('#pk-s').value,
    water:here.water.join(', '), waste:here.waste.join(', '), power:here.power.join(', ') } });
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  await boot();
  // The whole reason the source is kept per-stay: say what it just turned on.
  const due = arrivalChecks(stId, here.water);
  say(due.length
    ? 'Moved. On this water: ' + due.map(d => d.title).join(', ') + '.'
    : 'Moved. Nothing extra to do on this water.');
}

    s.kind === 'on_arrival' && mine.has(s.asset_id) &&
    (!s.applies_when_source ||
      s.applies_when_source.split(',').map(x => x.trim()).some(x => (water || []).includes(x))));
}

    .forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  DB = null; me = null; prop = null;
  boot();
}
const card = s => `<div class="card tap"><button onclick="openSched('${s.id}')">
  <span class="title">${esc(s.title)}</span>
  <p class="meta">${esc(s.thing)} · ${s.d == null ? 'no date yet'
    : s.d < 0 ? Math.abs(s.d) + ' days late' : s.d === 0 ? 'today' : 'in ' + s.d + ' days'}
    <span class="chip ${s.state}">${{ attn:'needs you', soon:'due soon', ok:'fine' }[s.state]}</span></p>
</button></div>`;

/* A rule is not a thing you do \u2014 the job is. Tapping a due check now finds
   the open job for that rule, or makes one, and opens the job screen. Which
   means a check-up, a fault and "wash the bathroom walls" are all the same
   screen with the same notes, checklist and history. */
async function openSched(id) {
  const rule = (DB.schedule || []).find(x => x.id === id);
  /* "Check the propane level" is answered with a number, not by ticking a box.
     A rule whose kind is a reading opens the reading screen and the answer
     rolls the rule forward. */
  if (rule && rule.kind === 'reading') {
    const a = rule.asset_id ? 'asset:' + rule.asset_id
            : rule.animal_id ? 'animal:' + rule.animal_id
            : rule.area_id ? 'area:' + rule.area_id : 'property:' + prop.id;
    return drawReading(a, id);
  }
  if (rule) {
    let j = (DB.job || []).find(x => x.schedule_id === id && String(x.status) !== 'done');
    if (!j) {
      j = { id:uid(), property_id:prop.id, kind:'task', title:rule.title || 'Check',
        source:'schedule', schedule_id:id, status:'open', due_on:rule.next_due_on || '',
        asset_id:rule.asset_id || '', structure_id:rule.structure_id || '',
        area_id:rule.area_id || '', animal_id:rule.animal_id || '' };
      await DwelLogs.write([{ op:'upsert', table:'job', record:j }]);
      await reload();
    }
    return drawJob(j.id);
  }
  return openSchedOld(id);
}
function openSchedOld(id) {
  const s = schedules().filter(x => x.id === id)[0];
  $('#tabs').hidden = false;
  const basis = intervalBasis(s);
  app.innerHTML = `<button class="ghost" onclick="show('home')">&lsaquo; Back</button>
    <h1>${esc(s.title)}</h1><p class="sub">${esc(s.thing)} · every ${s.every_n} ${esc(s.every_unit)}${s.every_n > 1 ? 's' : ''}</p>
    <p class="hint">${esc(basis.says)}</p>
    <label for="l-when">When was it done?</label><input id="l-when" type="date" value="${today()}">
    <label for="l-cost">What did it cost? <span style="font-weight:400">(optional)</span></label>
    <input id="l-cost" inputmode="decimal" placeholder="">
    <p class="hint">Blank means you do not know — it is not counted as zero.</p>
    <div class="actions"><button class="primary" onclick="logDone('${s.id}')">Log it done</button></div>`;
}
async function logDone(id) {
  const s = (DB.schedule || []).filter(x => x.id === id)[0];
  const when = $('#l-when').value || today(), cost = ($('#l-cost').value || '').trim();
  const next = new Date(when);
  if (s.every_unit === 'month') next.setMonth(next.getMonth() + Number(s.every_n));
  else next.setFullYear(next.getFullYear() + Number(s.every_n));
  try {
    await DwelLogs.write([
      { op:'upsert', table:'completion', record:{ id:uid(), schedule_id:s.id, asset_id:s.asset_id,
          done_on:when, what:s.title, by_person_id:me.id, origin:'planned',
          cost: cost === '' ? '' : cost } },
      { op:'upsert', table:'schedule', record:{ id:s.id, next_due_on:next.toISOString().slice(0,10) } }
    ]);
  } catch (e) { return say('Could not save: ' + e.message); }
  DB = (await DwelLogs.load()).db;
  show('home');
  say('Logged. Next one due ' + next.toISOString().slice(0, 10) + '.');
}

function drawAdd() {
  const types = Object.entries(STARTER).flatMap(([c, l]) => l.map(([n]) => [c, n]));
  const structs = (DB.structure || []).filter(s => s.status !== 'archived');
  app.innerHTML = `<h1>Add a thing</h1>
    <p class="sub">Add it the day you touch it. There is no finish line here.</p>
    <label for="a-s">Which building?</label>
    <select id="a-s">${structs.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}
      <option value="__new">+ A new building</option></select>
    <div id="a-newb" hidden><label for="a-bn">Call it
        <span style="font-weight:400;color:var(--muted)">— optional</span></label>
      <input id="a-bn" placeholder="leave it and we will use what it is">
      <label for="a-bk">What kind?</label>
      <select id="a-bk" onchange="otherKind(this)">${kindOptions('shed')}</select>
      <div id="a-bk-other" hidden><label for="a-bko">What is it?</label>
        <input id="a-bko" placeholder="in your own words"></div></div>
    <label for="a-t">What kind of thing?</label>
    <select id="a-t">${types.map(([c, n]) =>
      `<option value="${esc(n)}">${esc(n)} — ${esc(c)}</option>`).join('')}</select>
    <label for="a-n">Call it <span style="font-weight:400;color:var(--muted)">— optional</span></label>
    <input id="a-n" placeholder="leave it and we will use what it is">
    <div class="actions"><button class="primary" onclick="addThing()">Add it</button></div>`;
  $('#a-s').onchange = e => { $('#a-newb').hidden = e.target.value !== '__new'; };
}
async function addThing() {
  const type = $('#a-t').value;
  // "Dishwasher" is a perfectly good name for the dishwasher. A second one
  // becomes Dishwasher 2 and can be renamed later, if it ever matters.
  const name = ($('#a-n').value || '').trim() ||
    uniqueName(type, (DB.asset || []).map(a => a.name));
  let structId = $('#a-s').value;
  const writes = [];
  if (structId === '__new') {
    structId = uid();
    const bk = $('#a-bk').value;
    const bn = ($('#a-bn').value || '').trim() ||
      uniqueName(bk === '__other' ? (($('#a-bko').value || '').trim() || 'Building') : kindLabel(bk),
                 (DB.structure || []).map(x => x.name));
    writes.push({ op:'upsert', table:'structure', record:{ id:structId, property_id:prop.id,
      name:bn, kind: bk === '__other' ? 'other' : bk,
      kind_other: bk === '__other' ? ($('#a-bko').value || '').trim() : '' } });
  }
  const t = (DB.asset_type || []).filter(x => x.name === type)[0];
  const assetId = uid();
  writes.push({ op:'upsert', table:'asset', record:{ id:assetId, property_id:prop.id,
    structure_id:structId, asset_type_id:(t || {}).id, name, status:'active', installed_on:today() } });
  const tmpl = Object.values(STARTER).flat().filter(x => x[0] === type)[0];
  tmpl[1].forEach(([title, n, unit]) => {
    const due = new Date();
    if (unit === 'month') due.setMonth(due.getMonth() + n); else due.setFullYear(due.getFullYear() + n);
    writes.push({ op:'upsert', table:'schedule', record:{ id:uid(), asset_id:assetId, title,
      kind:'interval', every_n:n, every_unit:unit, responsibility:'owner', cost_source:'entered',
      next_due_on:due.toISOString().slice(0, 10) } });
  });
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  DB = (await DwelLogs.load()).db;
  show('home');
  say(name + ' added, with ' + tmpl[1].length + ' check-up' + (tmpl[1].length === 1 ? '' : 's') + '.');
}

/* ---------------------------------------------------------------- readings

   The table draft 1 of the v1 line argued in by name -- "levels are half of
   what people actually track" -- and which then sat with no screen for weeks
   while three unrelated things asked for it: mite counts on a hive, the
   odometer on a car, eggs a day.

   The shape comes from the schema and is worth restating: result_type decides
   what a result may be USED for. A number can be trended; a pass/fail cannot.
   And `source` exists because instruments break -- a tank gauge reading 10%
   and the supplier saying 40% are both real readings, and averaging them is
   the wrong answer. */
const RESULT_KIND = [['numeric','A number'], ['present_absent','Present or absent'],
                     ['pass_fail','Pass or fail']];
const FLAGS = { present_absent: [['present','Present'],['absent','Absent']],
                pass_fail:      [['pass','Pass'],['fail','Fail']] };
const READ_FROM = [['gauge','A gauge'],['dipstick','A dipstick'],['sight_glass','A sight glass'],
                   ['meter','A meter'],['supplier','The supplier'],['delivery_ticket','A delivery ticket'],
                   ['by_eye','By eye'],['lab','A lab']];

/* Everything a reading can be about, in one list, because "which room is damp"
   and "how full is the tank" are the same question to the person asking. */
function readSubjects() {
  const out = [];
  (DB.asset || []).filter(a => a.status !== 'archived')
    .forEach(a => out.push(['asset:' + a.id, a.name]));
  (DB.animal || []).filter(a => a.status !== 'archived')
    .forEach(a => out.push(['animal:' + a.id, a.name || ('The ' + a.type)]));
  (DB.area || []).forEach(a => out.push(['area:' + a.id, a.name]));
  (DB.structure || []).forEach(s => out.push(['structure:' + s.id, s.name || 'the building']));
  out.push(['property:' + prop.id, prop.name]);
  return out;
}
function subjectWords(r) {
  const A = byId('asset'), N = byId('animal'), R = byId('area'), T = byId('structure');
  if (r.asset_id)     return (A[r.asset_id] || {}).name || 'something';
  if (r.animal_id)    return (N[r.animal_id] || {}).name || 'an animal';
  if (r.area_id)      return (R[r.area_id] || {}).name || 'a room';
  if (r.structure_id) return (T[r.structure_id] || {}).name || 'a building';
  return prop.name;
}
function readingWords(r) {
  if (String(r.result_type) === 'numeric')
    return (r.value_num === '' || r.value_num == null ? '—' : r.value_num)
           + (r.unit ? ' ' + r.unit : '');
  const f = (FLAGS[r.result_type] || []).find(x => x[0] === r.value_flag);
  return f ? f[1] : (r.value_flag || '—');
}
function readingsOf(limit) {
  return (DB.reading || []).filter(r => r.status !== 'archived')
    .sort((a, b) => String(b.taken_on).localeCompare(String(a.taken_on)))
    .slice(0, limit || 12);
}

function drawReading(subject, scheduleId) {
  $('#tabs').hidden = true;
  const subs = readSubjects();
  if (!draft.rd || subject || scheduleId) {
    draft.rd = { subject: subject || (subs[0] || [''])[0], result_type:'numeric',
                 value_num:'', value_flag:'', unit:'', source:'gauge',
                 taken_on: today(), doubt:false, schedule_id: scheduleId || '' };
  }
  const r = draft.rd;
  const rule = (DB.schedule || []).find(x => x.id === r.schedule_id);
  /* Arriving from a rule, the repeat it already has is what the control should
     show -- otherwise saving would quietly turn a monthly check into a one-off. */
  if (rule && r.rep === undefined) {
    r.rep = (rule.every_n && rule.kind !== 'once') ? 'yes' : '';
    r.every_n = rule.every_n || '1';
    r.every_unit = rule.every_unit || 'month';
  }
  const flags = FLAGS[r.result_type];
  app.innerHTML = `<button class="back" onclick="draft.rd=null;show('home')">&lsaquo; Back</button>
    <h1>${esc(rule ? rule.title : 'Take a reading')}</h1>

    <label for="rd-s">What is it about?</label>
    <select id="rd-s" onchange="keepReading();draft.rd.subject=this.value">
      ${subs.map(([k, l]) => `<option value="${esc(k)}"${
        r.subject === k ? ' selected' : ''}>${esc(l)}</option>`).join('')}
    </select>

    <label for="rd-k">What kind of answer?</label>
    <select id="rd-k" onchange="reReading(this.value)">
      ${optList(r.result_type, RESULT_KIND)}</select>

    ${flags ? `<label for="rd-f">Result</label>
      <select id="rd-f">${optList(r.value_flag || flags[0][0], flags)}</select>`
    : `<div class="counts" style="grid-template-columns:2fr 1fr">
        <div class="count"><span>Value</span>
          <input id="rd-v" inputmode="decimal" value="${esc(r.value_num)}"></div>
        <div class="count"><span>Unit</span>
          <input id="rd-u" value="${esc(r.unit)}" placeholder="%"></div>
      </div>`}

    <label for="rd-src">Read from</label>
    <select id="rd-src">${optList(r.source, READ_FROM)}</select>

    <label for="rd-d">Taken on</label>
    <input id="rd-d" type="date" value="${esc(r.taken_on)}">

    <label for="rd-rep">Ask me again?</label>
    <select id="rd-rep" onchange="keepReading();draft.rd.rep=this.value;drawReading()">
      <option value=""${!r.rep ? ' selected' : ''}>No &mdash; just this once</option>
      <option value="yes"${r.rep ? ' selected' : ''}>Yes, on a repeat</option>
    </select>
    ${r.rep ? `<div class="counts" style="grid-template-columns:1fr 2fr">
      <div class="count"><span>Every</span>
        <input id="rd-en" inputmode="numeric" value="${esc(r.every_n || '1')}"></div>
      <div class="count"><span>&nbsp;</span>
        <select id="rd-eu">${optList(r.every_unit || 'month', EVERY_UNIT)}</select></div>
    </div>` : ''}

    <label class="tick" style="margin-top:.9rem"><input type="checkbox" id="rd-q"
      ${r.doubt ? 'checked' : ''}><span>Not sure about this one</span></label>
    ${tip('A doubted reading is kept and marked rather than thrown away, and nothing is ' +
      'projected forward from it. A gauge that reads 10% while the supplier says 40% is not a ' +
      'contradiction to settle by averaging &mdash; both were read from something, and which ' +
      'instrument said so is the part worth keeping.')}

    <div class="actions" style="margin-top:1.2rem">
      <button class="primary" onclick="saveReading()">Save it</button>
    </div>

    ${(() => { const rs = readingsOf(); if (!rs.length) return '';
      return `<h2>Lately</h2><div class="rows">${rs.map(x => `<div class="row">
        <div class="grow"><b>${esc(subjectWords(x))} &middot; ${esc(readingWords(x))}</b>
          <small>${esc(x.taken_on)}${String(x.trusted).toUpperCase() === 'TRUE'
            ? '' : ' &middot; not sure'}</small></div></div>`).join('')}</div>`;
    })()}`;
}
function keepReading() {
  const r = draft.rd; if (!r) return;
  const v = k => { const e = $(k); return e ? (e.value || '').trim() : undefined; };
  if ($('#rd-s'))   r.subject     = v('#rd-s');
  if ($('#rd-v'))   r.value_num   = v('#rd-v');
  if ($('#rd-u'))   r.unit        = v('#rd-u');
  if ($('#rd-f'))   r.value_flag  = v('#rd-f');
  if ($('#rd-src')) r.source      = v('#rd-src');
  if ($('#rd-d'))   r.taken_on    = v('#rd-d');
  if ($('#rd-q'))   r.doubt       = $('#rd-q').checked;
  if ($('#rd-en'))  r.every_n     = v('#rd-en');
  if ($('#rd-eu'))  r.every_unit  = v('#rd-eu');
}
function reReading(k) { keepReading(); draft.rd.result_type = k; draft.rd.value_flag = ''; drawReading(); }

async function saveReading() {
  keepReading();
  const r = draft.rd;
  const [kind, id] = String(r.subject || '').split(':');
  if (r.result_type === 'numeric' && r.value_num === '') return say('Put a number in first.');
  const rec = { id: uid(), taken_on: r.taken_on || today(), result_type: r.result_type,
    value_num: r.result_type === 'numeric' ? r.value_num : '',
    value_flag: r.result_type === 'numeric' ? '' : (r.value_flag || (FLAGS[r.result_type] || [[]])[0][0]),
    unit: r.result_type === 'numeric' ? r.unit : '',
    source: r.source, trusted: r.doubt ? '' : 'TRUE',
    schedule_id: r.schedule_id || '', by_person_id: me.id,
    asset_id: kind === 'asset' ? id : '', animal_id: kind === 'animal' ? id : '',
    area_id: kind === 'area' ? id : '', structure_id: kind === 'structure' ? id : '',
    property_id: kind === 'property' ? id : prop.id };
  const writes = [{ op:'upsert', table:'reading', record:rec }];

  /* "Ask me again" is what makes a reading worth taking twice. Recording the
     propane level is useful; being asked in November instead of remembering in
     January is the point. The rule is a schedule of kind 'reading', which is
     what sends somebody back to this screen rather than to a job. */
  const num = x => { const n = Number(x); return Number.isFinite(n) && n > 0 ? n : 1; };
  let sc = (DB.schedule || []).find(x => x.id === r.schedule_id);
  if (r.rep === 'yes') {
    const every = num(r.every_n), unit = r.every_unit || 'month';
    const d = new Date();
    ({ day:() => d.setDate(d.getDate() + every), week:() => d.setDate(d.getDate() + every * 7),
       month:() => d.setMonth(d.getMonth() + every), year:() => d.setFullYear(d.getFullYear() + every)
     }[unit] || (() => d.setMonth(d.getMonth() + every)))();
    const rule = { id: (sc || {}).id || uid(), kind:'reading',
      title: (sc || {}).title || ('Check ' + subjectWords(rec)),
      asset_id: rec.asset_id, animal_id: rec.animal_id, area_id: rec.area_id,
      structure_id: rec.structure_id, every_n: every, every_unit: unit,
      next_due_on: d.toISOString().slice(0, 10) };
    writes.push({ op:'upsert', table:'schedule', record:rule });
    rec.schedule_id = rule.id;
    sc = null;                      // already rolled, do not roll it twice
  } else if (sc && r.rep === '') {
    writes.push({ op:'upsert', table:'schedule', record:{ ...sc, kind:'once' } });
    sc = null;
  }

  /* A reading taken against a rule IS that rule being done, so it rolls the
     rule forward the same way finishing a job does. Otherwise "check the
     level" stays overdue forever with the answer already recorded. */
  if (sc && sc.every_n && sc.kind !== 'once') {
    const d = new Date(), n = Number(sc.every_n) || 1;
    ({ day:() => d.setDate(d.getDate() + n), week:() => d.setDate(d.getDate() + n * 7),
       month:() => d.setMonth(d.getMonth() + n), year:() => d.setFullYear(d.getFullYear() + n)
     }[sc.every_unit] || (() => d.setMonth(d.getMonth() + n)))();
    writes.push({ op:'upsert', table:'schedule',
      record:{ ...sc, next_due_on: d.toISOString().slice(0, 10) } });
  }
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  const said = readingWords(rec), about = subjectWords(rec);
  draft.rd = null;
  await reload();
  drawReading();
  say(about + ': ' + said);
}

function drawLog() {
  const A = byId('asset'), P = byId('person');
  const rows = (DB.completion || []).slice().reverse();
  app.innerHTML = `<h1>Log</h1>
    <p class="sub">Everything done, newest first. Entries are permanent.</p>
    ${rows.map(c => `<div class="card"><span class="title">${esc(c.what)}</span>
      <p class="meta">${esc((A[c.asset_id] || {}).name || '')} · ${esc(c.done_on)} ·
        ${esc((P[c.by_person_id] || {}).name || '')}${c.cost ? ' · ' + esc(c.cost) : ''}</p></div>`).join('')
      || `<div class="empty">Nothing logged yet. The first entry is the useful one.</div>`}`;
}

boot();
</script>
</body>
</html>
