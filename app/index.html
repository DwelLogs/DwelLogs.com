<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DwelLogs</title>
<style>
  :root {
    color-scheme: light;
    --bg:#eef3f7; --card:#ffffff; --ink:#15243a; --muted:#52627a; --line:#d6e0ea;
    --accent:#1f5fa8; --on-accent:#fff; --ok:#1b6b45; --soon:#8a5a00; --attn:#a3311f;
    --ok-bg:#e3f1e9; --soon-bg:#fbeed6; --attn-bg:#fbe4e0; --r:.75rem;
    --placeholder:#7b8798; --trace:#e0893a;
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --bg:#0e1726; --card:#152236; --ink:#e9f0f8; --muted:#9fb0c6; --line:#233450;
    --accent:#6aa8ee; --on-accent:#0e1726; --ok:#7fd3a6; --soon:#f0c674; --attn:#ff9c85;
    --ok-bg:#16301f; --soon-bg:#33270d; --attn-bg:#3a1d17;
    --placeholder:#76869d; --trace:#f0a257;
  } }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:34rem; margin:0 auto; padding-inline:1rem;
          padding-block:1rem calc(5rem + env(safe-area-inset-bottom,0px)); }
  h1 { font-size:1.5rem; line-height:1.2; margin:.3rem 0 .4rem; }
  h2 { font-size:1rem; margin:1.5rem 0 .5rem; }
  p.sub { color:var(--muted); margin:.2rem 0 1rem; }
  label { display:block; font-weight:600; margin:.9rem 0 .3rem; font-size:.9rem; }
  input, select, button, textarea { font:inherit; color:inherit; min-height:2.75rem;
    border-radius:.6rem; border:1px solid var(--line); background:var(--card); padding:.6rem .8rem; }
  input, select, textarea { width:100%; }
  button { cursor:pointer; width:auto; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  button.ghost { background:transparent; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  /* An example that looks like a filled-in value gets skipped, and then the
     form complains about a field the person believes they answered. Two
     signals, not one: a quarter of the ink's contrast (3.65:1 light,
     4.31:1 dark — still legible) AND italic, so it never reads as typed. */
  ::placeholder { color:var(--placeholder); opacity:1; font-style:italic; }
  input.missing, select.missing { border-color:var(--attn); border-width:2px; }
  .tick { display:flex; gap:.6rem; align-items:center; font-weight:400; padding:.35rem 0;
          min-height:2.4rem; }
  .tick input { width:1.25rem; height:1.25rem; min-height:0; flex:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r);
          padding:.85rem .9rem; margin-bottom:.6rem; }
  .card.tap { padding:0; } .card.tap > button { width:100%; text-align:start; border:0;
    background:none; padding:.85rem .9rem; border-radius:var(--r); display:block; }
  .meta { color:var(--muted); font-size:.92rem; margin:.2rem 0 0; }
  .title { font-weight:600; }
  .hint { color:var(--muted); font-size:.85rem; margin:.25rem 0 0; }
  .actions { display:flex; gap:.6rem; flex-wrap:wrap; margin-top:1.1rem; }
  .empty { border:1px dashed var(--line); border-radius:var(--r); padding:1.4rem 1rem;
           text-align:center; color:var(--muted); }
  .chip { display:inline-block; border-radius:999px; padding:.15rem .55rem; font-size:.78rem;
          font-weight:600; border:1px solid; }
  .chip.attn { color:var(--attn); background:var(--attn-bg); border-color:var(--attn); }
  .chip.soon { color:var(--soon); background:var(--soon-bg); border-color:var(--soon); }
  .chip.ok   { color:var(--ok);   background:var(--ok-bg);   border-color:var(--ok); }
  .big { font-size:2.6rem; font-weight:700; line-height:1; display:block; }
  nav.tabs { position:fixed; inset:auto 0 0 0; background:var(--card); border-top:1px solid var(--line);
    display:flex; padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom,0px)); }
  nav.tabs button { flex:1; border:0; background:none; font-weight:600; font-size:.95rem; }
  nav.tabs button[aria-current="page"] { color:var(--accent); text-decoration:underline; }
  #say { position:fixed; inset:auto .75rem calc(4.3rem + env(safe-area-inset-bottom,0px)) .75rem;
    max-width:31rem; margin:0 auto; background:var(--ink); color:var(--bg); border-radius:.6rem;
    padding:.65rem .85rem; font-size:.92rem; z-index:5;
    /* It floats over whatever is underneath, including the buttons at the foot
       of a long screen. A message you did not ask for must never eat the tap
       you did. */
    pointer-events:none; }
  #say:empty { display:none; }
  .step { color:var(--muted); font-size:.8rem; letter-spacing:.06em; text-transform:uppercase;
          font-weight:600; }
  .banner { background:var(--soon-bg); border:1px solid var(--soon); color:var(--soon);
    border-radius:.6rem; padding:.5rem .7rem; font-size:.88rem; margin-bottom:.8rem; }
  [hidden] { display:none !important; }
  /* Two columns at phone width. Six questions stacked one option per line is a
     wall nobody reads to the bottom of; the same options in pairs fit a thumb
     scroll. Falls back to one column when a label is long. */
  .opts { display:grid; grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr)); gap:0 .8rem }
  .opts > button { grid-column:1/-1; justify-self:start; margin-top:.35rem }
  /* A grid, not wrapped flex: "Carbon monoxide detector" is three lines long and
     wrapped flex let its box drop out of the row. Equal rows, labels top, boxes
     bottom, so the inputs line up whatever the label does. */
  .counts { display:grid; grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr)); gap:.6rem }
  .count { display:flex; flex-direction:column; justify-content:space-between }
  .count span { display:block; font-size:.82rem; color:var(--muted); margin-bottom:.25rem }
  .count input { width:100%; margin:0 }
  .other { margin-top:.9rem; padding-top:.7rem; border-top:1px dashed var(--line) }
  .other label { font-weight:400; color:var(--muted); font-size:.9rem }
  /* Reasoning belongs one tap away, not in front of somebody who just wants to
     answer the question. Native <details>, so it works with no JS and reads
     correctly to a screen reader. */
  .tip { margin:.35rem 0 0 }
  .tip summary { font-size:.86rem; color:var(--accent); cursor:pointer; list-style:none;
    display:inline-block; padding:.35rem 0; min-height:0 }
  .tip summary::-webkit-details-marker { display:none }
  .tip summary::before { content:'?'; display:inline-grid; place-items:center;
    width:1.05rem; height:1.05rem; margin-right:.35rem; border-radius:50%;
    border:1px solid currentColor; font-size:.7rem; vertical-align:-.15rem }
  .sub .skiplink::before { content:none }
  .tip[open] summary { color:var(--muted) }
  .tip p { font-size:.88rem; line-height:1.45; color:var(--muted); margin:.1rem 0 .2rem }
  .step .skiplink, .sub .skiplink { background:none; border:0; padding:.2rem .3rem; min-height:0;
    font:inherit; letter-spacing:inherit; color:var(--accent); text-decoration:underline;
    cursor:pointer }
  .step .skiplink::before { content:'· ' ; text-decoration:none; color:var(--muted) }
  /* Picture buttons. Big enough to hit with a thumb, square so a grid of twelve
     reads as a set rather than a list with pictures stuck on it. */
  .pick { display:grid; grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr)); gap:.6rem;
    margin:.5rem 0 .2rem }
  .pick button { display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:.45rem; padding:.9rem .4rem; min-height:6.2rem; width:100%; background:var(--card);
    border:1px solid var(--line); border-radius:12px; color:var(--ink); cursor:pointer;
    font:inherit; font-size:.86rem; line-height:1.25; text-align:center }
  .pick button:hover { border-color:var(--accent) }
  .pick button[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent) }
  .pick svg { color:var(--accent); flex:none }
  .pick .cap { color:var(--ink) }
  .group { font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
    margin:1.1rem 0 .1rem }
  /* The hub: same tiles, with a line of state under each. */
  .hub { display:grid; grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr)); gap:.6rem; margin:.6rem 0 }
  .hub button { display:flex; flex-direction:column; align-items:flex-start; gap:.4rem;
    padding:.9rem; width:100%; background:var(--card); border:1px solid var(--line);
    border-radius:12px; color:var(--ink); cursor:pointer; font:inherit; text-align:left }
  .hub button:hover { border-color:var(--accent) }
  .hub svg { color:var(--accent) }
  .hub b { font-weight:600; font-size:.95rem }
  .hub small { color:var(--muted); font-size:.83rem; line-height:1.3 }
  .hub .done { color:var(--ok) }
  /* One back, always top-left, on every screen that has somewhere to go back to.
     It was three buttons in three places called three things — Back at the foot
     of the picker, "Not that kind of place" on the hub, Cancel inside a tile. */
  .back { background:none; border:0; padding:.4rem .5rem .4rem 0; margin:0 0 .2rem -.15rem;
    min-height:2.2rem; font:inherit; font-size:.92rem; color:var(--muted); cursor:pointer }
  .back:hover { color:var(--accent) }
  /* The same trace as the site, but this one is generated from the rows. */
  .pulse { margin:.2rem 0 .6rem; height:3.4rem }
  .pulse svg { width:100%; height:100%; display:block; overflow:visible }
  .pulse path { fill:none; stroke:var(--trace); stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke }
  textarea { width:100%; font:inherit; padding:.7rem .8rem; border-radius:var(--r);
    border:1px solid var(--line); background:var(--card); color:var(--ink); resize:vertical }
  textarea::placeholder { color:var(--placeholder); font-style:italic }
  .ctx { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.82rem;
    white-space:pre-wrap; background:var(--card); border:1px solid var(--line);
    border-radius:var(--r); padding:.7rem .8rem; margin:.3rem 0 .2rem; color:var(--muted) }
  /* The way out to the person level. Top-left, where the back button lives on
     every other screen, because that is what it is: back, one level further. */
  .who { display:inline-flex; align-items:center; gap:.4rem; background:none; border:0;
    padding:.35rem .5rem .35rem 0; margin:0 0 .2rem -.1rem; font:inherit; font-size:.92rem;
    color:var(--muted); cursor:pointer }
  .who:hover { color:var(--accent) }
  .who svg { color:var(--accent) }
  .rows .row { display:flex; align-items:center; gap:.7rem; padding:.7rem .9rem;
    border:1px solid var(--line); border-radius:var(--r); background:var(--card); margin:.4rem 0 }
  .rows .row svg { color:var(--accent); flex:none }
  .rows .row b { display:block; font-size:.97rem }
  .rows .row small { color:var(--muted); font-size:.85rem }
  .rows .row .grow { flex:1; min-width:0 }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<p id="say" role="status" aria-live="polite"></p>

<script src="api.js"></script>
<script>
/* DwelLogs — the sheet-backed app, starting from nothing.
   ------------------------------------------------------------------------
   Deliberately smaller than the prototype. The prototype explores; this one
   only contains what a real person needs to get from an empty account to
   something worth opening tomorrow — which is also the most honest way to
   draw the v1 line. If a screen is not on the path from zero to useful, it
   is not here, and that is the argument for it not being in v1 either. */

const $ = s => document.querySelector(s);
const app = $('#app');
const say = m => { const e = $('#say'); e.textContent = m;
  clearTimeout(say._t); if (m) say._t = setTimeout(() => e.textContent = '', 6000); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const uid = () => 'loc-' + Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);
const inMonths = n => { const d = new Date(); d.setMonth(d.getMonth() + n);
                        return d.toISOString().slice(0, 10); };
const daysTo = d => d ? Math.round((new Date(d) - new Date()) / 864e5) : null;

let DB = null, me = null, prop = null, screen = 'home', behind = false;

/* The starter catalogue. Templates ship WITH the app — a first thing has to
   bring its check-ups with it or the first screen teaches nothing. Kept small
   on purpose: every type here is one somebody has to have got right. */
/* A stand-in for a sourced dataset. It exists to prove the SHAPE — the app
   offers, a person confirms, and profile_confirmed_on records that they did.
   A real version needs a licensed climate/hazard source that can be named on
   screen. Never a guess presented as a fact about somebody's house, and never
   a risk score the owner cannot argue with. */
const REGIONS = {
  ca:{ climate:['hot_dry_summer','mild_winter','arid'], freezes:'no',
       hazards:['wildfire','drought','earthquake'], terrain:[],
       why:'California — usually hot dry summers with mild winters, wildfire and drought, and earthquake country.' },
  or:{ climate:['wet_winter','mild_winter'], freezes:'yes', hazards:['wildfire','earthquake'], terrain:[],
       why:'Oregon — wet winters, wildfire through the dry months.' },
  wa:{ climate:['wet_winter'], freezes:'yes', hazards:['wildfire','earthquake','flood'], terrain:['coastal'],
       why:'Washington — wet, wildfire inland, earthquake risk.' },
  fl:{ climate:['humid_subtropical'], freezes:'no', hazards:['hurricane','flood'], terrain:['coastal'],
       why:'Florida — humid, hurricanes, flooding.' },
  tx:{ climate:['hot_dry_summer','mild_winter'], freezes:'yes', hazards:['tornado','hail','drought'], terrain:['open_plain'],
       why:'Texas — hot, tornado and hail, and a freeze that catches people out.' },
  mn:{ climate:['cold_winter'], freezes:'yes', hazards:['ice_storm','flood'], terrain:[],
       why:'Minnesota — real winters. Freezing pipes are the main event.' },
  ma:{ climate:['cold_winter'], freezes:'yes', hazards:['ice_storm','flood'], terrain:['coastal'],
       why:'Massachusetts — cold winters, ice storms, coastal flooding.' },
  co:{ climate:['cold_winter','arid'], freezes:'yes', hazards:['wildfire','hail','drought'], terrain:['mountain'],
       why:'Colorado — hail, wildfire, hard freezes.' }
};
function guessProfile(region, country) {
  const hit = REGIONS[String(region || '').trim().toLowerCase().slice(0, 2)];
  if (hit) return hit;
  return { climate:[], freezes:'not_sure_yet', hazards:[], terrain:[],
    why:'Nothing known about ' + (region || country || 'there') + ' yet, so nothing is assumed. Tick what you know.' };
}

/* Grouped because a flat list of forty is unreadable, and grouped THIS way
   because the groups are what differ in practice: a home that moves has tyres
   and a registration, an outbuilding usually has no plumbing, an area has no
   roof at all. Official taxonomies were little help — the US Census lumps
   "mobile homes or trailers, tents, and boats" together, because it is built
   for counting units rather than looking after them. */
/* Climate is what the sky does, elevation is a number, terrain is how the
   ground treats the house. Every value below changes actual work — that is the
   bar for being on the list. No "inland": inland is what you are when you have
   not ticked coastal, and a none-of-the-above option gets ticked by everyone
   and means nothing. */
const TERRAIN = [
  ['coastal',          'by the sea'],
  ['lakeside',         'on a lake'],
  ['riverside',        'on a river or creek'],
  ['valley_floor',     'valley floor'],
  ['ridge_or_exposed', 'a ridge, or exposed'],
  ['mountain',         'mountain'],
  ['wooded',           'in trees'],
  ['open_plain',       'open and flat']
];

/* Plain words, because "arid" is a geography word and nobody describes their
   own back yard with it. Every label here has to survive being read out loud
   to somebody who has never used the app. */
const CLIMATE = [
  ['hot_dry_summer',    'hot dry summers'],
  ['mild_winter',       'mild winters'],
  ['cold_winter',       'cold winters'],
  ['wet_winter',        'wet winters'],
  ['humid_subtropical', 'warm and humid most of the year'],
  ['arid',              'dry all year — very little rain']
];
const HAZARD = [
  ['wildfire','wildfire'], ['flood','flooding'], ['earthquake','earthquakes'],
  ['hurricane','hurricanes'], ['tornado','tornadoes'], ['ice_storm','ice storms'],
  ['drought','drought'], ['hail','hail']
];

/* Every extensible list ends with this. The list is never going to be complete
   — an attached greenhouse, a cistern, a swamp buggy — and the fastest way to
   find out what is missing is to let people say it in their own words and
   count how often the same word comes back. Nothing types itself into the
   list: a count is evidence, a person decides. That last part is what keeps a
   thoughtful addition thoughtful and a joke out of the picklist. */
/* Short line on the screen, the reason behind it. */
function tip(text, label) {
  return `<details class="tip"><summary>${esc(label || 'Why we ask')}</summary>
    <p>${text}</p></details>`;
}
function otherBox(key, label) {
  draft.other = draft.other || {};
  // The key carries a dot ("structure.water") because that is what it means.
  // The id cannot — a dot in a CSS selector is a class.
  const id = 'ot-' + key.replace(/\W/g, '-');
  return `<div class="other"><label for="${id}">${esc(label || 'Something else?')}</label>
    <input id="${id}" class="otv" data-k="${key}" placeholder="in your own words"
      value="${esc(draft.other[key] || '')}">
    ${tip('If enough people write the same thing, it becomes a real option. Somebody reads them ' +
       'first — nothing is added automatically.', 'What happens to this')}</div>`;
}
function takeOther() {
  draft.other = draft.other || {};
  document.querySelectorAll('.otv').forEach(e => {
    const v = (e.value || '').trim();
    if (v) draft.other[e.dataset.k] = v; else delete draft.other[e.dataset.k];
  });
}

/* She typed "tiny house" for the place, then the next screen asked her to
   classify it. She had already said it. Match what she wrote against the list
   and preselect it — and say on screen that is what happened, so the answer is
   still hers to change rather than something that quietly filled itself in. */
function guessKind(text) {
  const t = String(text || '').toLowerCase().trim();
  if (!t) return null;
  let hit = null;
  Object.values(KINDS).flat().forEach(([v, label]) => {
    const l = label.toLowerCase();
    const words = [v.replace(/_/g, ' '), l, l.split(/ or | ,|,/)[0]];
    words.forEach(w => {
      if (!w || w.length < 3) return;
      if (t === w || t.includes(w)) { if (!hit || w.length > hit.w.length) hit = { v, label, w }; }
    });
  });
  return hit;
}

/* ---- calibrating by kind ------------------------------------------------
   The rule, and it is narrow on purpose: kind may REORDER and may REMOVE what
   cannot physically exist. It may never tick anything, and it may never imply
   a hookup — a treehouse with power and a barn without are both ordinary, and
   structure.kind says exactly that. A houseboat is not asked about a basement
   because it cannot have one. A tiny house IS still asked about a crawlspace,
   because plenty sit on blocks over one. Anything hidden stays one tap away
   behind "show the rest", so an unusual place is never locked out of its own
   answer. An unrecognised kind — including whatever somebody typed into
   "other" — filters NOTHING, because we know nothing. */
const WHEELS   = ['tiny_house','mobile_home','rv','camper_van','travel_trailer',
                  'bus_conversion','park_model'];
const FLOATING = ['houseboat','sailboat'];
const SOFT     = ['yurt','treehouse'];
const HOMES    = ['house','townhouse','apartment','duplex_unit','adu','cabin','cottage'];
const OUTBUILD = ['detached_garage','carport','shed','workshop','barn','pole_barn','stable',
                  'attached_garage','deck','porch','patio','balcony','sunroom','breezeway','carport_attached',
                  'greenhouse','pump_house','root_cellar','boathouse','pool_house','studio',
                  'guest_cabin','coop','animal_pen','kennel','silo','warehouse'];
const LANDISH  = ['garden','orchard','pasture','yard','driveway','dock','pool_area',
                  'septic_field','well_site','fence_line'];
/* The group the later screens filter by. A bare lot has no building at all, so
   the building kind cannot answer it — the place kind has to. */
function flowGroup() {
  if (['land','lot'].includes(draft.pkind)) return 'land';
  return kgroup(draft.bkind);
}
function kgroup(k) {
  if (WHEELS.includes(k))   return 'wheels';
  if (FLOATING.includes(k)) return 'floating';
  if (SOFT.includes(k))     return 'soft';
  if (HOMES.includes(k))    return 'home';
  if (OUTBUILD.includes(k)) return 'outbuilding';
  if (LANDISH.includes(k))  return 'land';
  return 'unknown';   // filters nothing
}
/* [value, label, asset types it creates, rules] — rules are {no:[groups]} or
   {only:[groups]}. Anything that creates no asset creates no asset: city water
   is a true fact with nothing to service, and inventing a row for it would be
   a lie about what you own. */
const SYSTEMS = [
  { k:'water', multi:true, q:'Where does the water come from?', off:['land'], o:[
    ['hookup','Whatever I am parked next to',['Inline hookup filter'],{only:['wheels','floating']}],
    ['well','A well',['Well'],{}],
    ['city','City or municipal',[],{no:['floating']}],
    ['shared','A shared or community system',[],{no:['floating']}],
    ['spring','A spring',['Well'],{no:['floating']}],
    ['hauled','Hauled in to a tank',['Water storage tank'],{}],
    ['dockside','A dockside hookup',[],{only:['floating']}],
    ['onboard_tank','A tank aboard',['Water storage tank'],{only:['floating','wheels']}],
    ['none','No water here',[],{}] ] },

  { k:'waste', multi:true, q:'Where does the waste go?', off:['land'], o:[
    ['hookup','Whatever is there when I park',[],{only:['wheels','floating']}],
    ['septic','A septic system',['Septic tank'],{no:['floating']}],
    ['sewer','City sewer',[],{no:['floating']}],
    ['holding_tank','A holding tank',['Holding tank'],{}],
    ['composting','A composting toilet',['Composting toilet'],{}],
    ['none','No plumbing here',[],{}] ] },

  { k:'power', q:'Where does the power come from?', multi:true, o:[
    ['hookup','Whatever is there when I park',[],{only:['wheels','floating']}],
    ['grid','The grid',[],{}],
    ['shore','Shore power',[],{only:['floating','wheels']}],
    ['solar','Solar',['Solar array'],{}],
    ['battery','A battery bank',['Battery bank'],{}],
    ['generator','A generator',['Generator'],{}],
    ['none','No power here',[],{}] ] },

  { k:'heat', q:'What heats it?', multi:true, off:['land'], o:[
    ['wood','Wood',['Wood stove'],{}],
    ['pellet','Pellets',['Pellet stove'],{}],
    ['propane','Propane',['Propane tank'],{}],
    ['natural_gas','Natural gas',[],{no:['floating','wheels']}],
    ['kerosene','Kerosene',['Kerosene heater'],{}],
    ['oil','Heating oil',['Oil tank'],{no:['floating','wheels']}],
    ['electric','Electric',[],{}],
    ['heat_pump','A heat pump',['Heat pump'],{}],
    ['none','Nothing heats it',[],{}] ] },

  { k:'cooling', q:'What cools it?', multi:true, off:['land'], o:[
    ['central','Central air',['Central air'],{no:['floating','wheels','soft']}],

/* Places this person is actually on. A sheet can hold several and a person is
   not on all of them. */
function myPlaces() {
  if (!me) return DB.property || [];
  const on = new Set((DB.membership || []).filter(m => m.person_id === me.id)
    .map(m => m.property_id));
  return (DB.property || []).filter(p => on.has(p.id));
}
function switchPlace(id) {
  prop = (DB.property || []).find(p => p.id === id) || prop;
  localStorage.setItem('dwellogs.place', prop.id);
  localStorage.removeItem('dwellogs.new');
  show('home');
}
/* ---- links that carry the setup -----------------------------------------
   The invite code alone was useless to the person who most needed it. Somebody
   handed a six-character code still has to find the app, tap "connect to a
   sheet", and paste a URL and a token they were never given — which is exactly
   the wall you put a non-technical husband in front of. So the link carries the
   connection: he taps it and the app is already pointed at the right sheet with
   his invite waiting.

   It goes in the FRAGMENT, after the #, because fragments are never sent to a
   server — not ours, not a proxy's, not a log's. And it is worth being plain
   about what that link is: it holds the sheet's key. Send it the way you would
   send a house key, not the way you would post an address. */
function packLink(obj) {
  return btoa(JSON.stringify(obj)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unpackLink(sTxt) {
  try { return JSON.parse(atob(sTxt.replace(/-/g, '+').replace(/_/g, '/'))); }
  catch (e) { return null; }
}
function handoffLink(extra) {
  const base = location.href.split('#')[0];
  return base + '#j=' + packLink(Object.assign({
    u: localStorage.getItem('dwellogs.url') || '',
    t: localStorage.getItem('dwellogs.token') || '' }, extra || {}));
}
/* Read once, then scrub the address bar: a link this powerful should not sit in
   history or get shared on by a screenshot of the URL. */
function takeHandoff() {
  const m = /^#j=(.+)$/.exec(location.hash || '');
  if (!m) return null;
  const d = unpackLink(m[1]);
  history.replaceState(null, '', location.href.split('#')[0]);
  if (!d) return null;
  if (typeof d.u === 'string') localStorage.setItem('dwellogs.url', d.u);
  if (typeof d.t === 'string') localStorage.setItem('dwellogs.token', d.t);
  if (d.p) localStorage.setItem('dwellogs.me', d.p);
  return d;
}

async function boot() {
  const handoff = takeHandoff();
  // An absent key means they have never chosen; an empty one means they chose
  // this device. Those are different, and conflating them means a new person
  // never gets offered the sheet.
  if (localStorage.getItem('dwellogs.url') === null) return connect();
  const url = localStorage.getItem('dwellogs.url') || '';
  const tok = localStorage.getItem('dwellogs.token') || '';
  DwelLogs.configure(url, tok);
  let res;
  try { res = await DwelLogs.load(); }
  catch (e) { return connect('Could not reach the sheet: ' + e.message); }
  DB = res.db;
  // Who you are is remembered, because on a shared sheet the first owner row is
  // not necessarily you — and picking the wrong person silently signs somebody
  // else's name to everything you log.
  const mine = localStorage.getItem('dwellogs.me');
  me = (DB.person || []).find(p => p.id === mine)
    || (DB.person || []).filter(p => p.role === 'owner')[0] || null;
  if (me) localStorage.setItem('dwellogs.me', me.id);
  const last = localStorage.getItem('dwellogs.place');
  prop = myPlaces().find(p => p.id === last) || myPlaces()[0] || (DB.property || [])[0] || null;
  if (prop) localStorage.setItem('dwellogs.place', prop.id);
  if (res.stale) say('Showing the last copy — could not reach the sheet.');
  behind = !!res.needsMigration;
  // A link with an invite in it goes straight to the invite, skipping the name
  // screen and the fork — he was sent here for one thing.
  if (handoff && handoff.c) return joinByLink(handoff.c);
  if (!me || !prop) return firstRun();
  show('home');
}

const icon = (k, size = 40) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}"
  fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
  stroke-linejoin="round" aria-hidden="true"><path d="${ICON[k] || ICON.house}"/></svg>`;

/* A ranch is a kind of PLACE. The house on it is a kind of BUILDING. Merging
   the two questions made somebody adding a farm answer "house" first and then
   go hunting for where the barn went — so they are two questions again, and
   the first one decides whether the second is asked at all. */
const PLACES = {
  'It is the one building': [
    ['house','A house'], ['townhouse','A townhouse or row house'],
    ['condo','A condo, flat or apartment'], ['cabin','A cabin or cottage'],
    ['mobile_home','A tiny house, RV or mobile home'], ['boat','A boat'],
    ['rental','a rental']],
  'It has buildings on it': [
    ['ranch','A ranch'], ['farm','A farm'], ['homestead','A homestead'],
    ['smallholding','A smallholding'], ['compound','A property with outbuildings'],
    ['estate','An estate']],
  'Nothing on it yet': [
    ['land','Land'], ['lot','A lot']]
};
/* Which building kind a single-building place implies. Where it is blank the
   place holds buildings and the main one gets its own question. */
const PLACE_IS = { house:'house', townhouse:'townhouse', condo:'apartment',
  cabin:'cabin', mobile_home:'tiny_house', boat:'houseboat', rental:'house' };
const HOLDS_BUILDINGS = ['ranch','farm','homestead','smallholding','compound','estate'];
const placeOptions = sel => Object.entries(PLACES).map(([g, list]) =>
  `<optgroup label="${esc(g)}">${list.map(([v, l]) =>
    `<option value="${v}"${v === sel ? ' selected' : ''}>${esc(l)}</option>`).join('')}</optgroup>`).join('');
/* The option text is written to be READ in a list — "A tiny house, RV or mobile
   home". As a fallback NAME it is absurd, so the short word is kept apart. */
const PLACE_SHORT = { house:'Home', townhouse:'Home', condo:'Home', cabin:'The cabin',
  mobile_home:'Home', boat:'The boat', rental:'Home', ranch:'The ranch', farm:'The farm',
  homestead:'The homestead', smallholding:'The smallholding', compound:'The property',
  estate:'The estate', land:'The land', lot:'The lot' };
function placeLabel(v) { return PLACE_SHORT[v] || 'Home'; }
/* What it IS, for a line that sits under the name — "The ranch · The ranch"
   tells nobody anything. */
function placeKindLabel(v) {
  const hit = Object.values(PLACES).flat().find(([k]) => k === v);
  return hit ? hit[1].replace(/^A /, 'a ').replace(/^An /, 'an ') : 'a place';
}

const PLACE = [
  /* Place and building were two screens, and for a tiny house they were the
     same question asked twice. One screen: what you call it, where it is, and

  /* One tap. No form. A grid of twelve outlines reads in a second and asks for

  { t:'What have you got?', s:'Pick the closest. You can change it whenever.',

  { t:'Where is it?', s:'The region is what the suggestions below are guessed from.',

                  if (!raw) { draft.elevation = null; return true; }

                  // nothing and say it stored something. Say so instead.
                  const n = Number(raw.replace(/[, ]/g, ''));

  { t:'What does it run on?',

    body: () => {

        return `<label style="margin-top:1.1rem">${esc(sys.q)}${sys.multi

              'warrants it.', 'What “whatever I am parked next to” does')
          : '')
        + tip('Nothing is ticked for you. What a ' + esc(
        (draft.bkind || '').replace(/_/g,' ') || 'building') + ' cannot physically have is tucked ' +
        'behind <i>show the rest</i> rather than removed — if yours is unusual, it is still there.',

    },
    take: () => { takeOther(); const g = flowGroup(); draft.sys = {};
      SYSTEMS.filter(sys => !(sys.off || []).includes(g)).forEach(sys => {

  /* Only for something that moves. A house on a foundation is parked where it

  { t:'Where are you parked?', s:'And what is on the other end of the hose.',

/* Somebody who moved in last month genuinely does not know whether the pipes
   freeze, and a guess entered now is worse than a recorded unknown — it
   silently switches off every winterising prompt with nobody aware of it.
   So: take nothing, set a date, and ask once when they have actually been
   through a season here. */
/* Redraws on this screen have to keep the two text fields, same as everywhere
   else. Changing the region reguesses the climate, and reguessing redraws. */
/* Redrawing from inside the field's own change event replaces the element the
   browser is still dispatching to, and the next tap anywhere gets swallowed
   putting the focus right. So: take the value now, redraw on the next tick. */
/* No re-render. Typing a region reguesses the climate, and rebuilding the
   screen under somebody's fingers flashes, loses focus, and — as it turned out
   — queues a redraw that fires after they have already tapped Done. Tick the
   boxes in place instead: same result, nothing moves. */
function regionChanged() {
  const was = draft.region;
  keepHere();
  if (draft.region === was) return;
  const set = (cls, vals) => document.querySelectorAll('.' + cls).forEach(el => {
    el.checked = vals.includes(el.value);
  });
  set('cl', draft.climate || []);
  set('hz', draft.hazards || []);
  set('tr', draft.terrain || []);
  const f = $('#f-freeze'); if (f) f.value = draft.freezes || 'not_sure_yet';
  const why = $('#why'); if (why) why.textContent = guessProfile(draft.region, draft.country).why;
}
function keepHere() {
  const c = $('#f-city'), r = $('#f-region');
  if (c) draft.city = (c.value || '').trim();
  if (r) draft.region = (r.value || '').trim();
  // A new region means the old guess was about somewhere else.
  if (r && draft.guessedFor !== draft.region) {
    const g = guessProfile(draft.region, draft.country);
    if (!draft.profileTouched) {
      draft.climate = g.climate.slice(); draft.hazards = g.hazards.slice();
      draft.terrain = (g.terrain || []).slice(); draft.freezes = g.freezes;
    }
    draft.guessedFor = draft.region;
  }
}
function newHere() {
  draft.climate = []; draft.hazards = []; draft.terrain = [];
  draft.freezes = 'not_sure_yet'; draft.askLater = true;
  fs++; drawFirst();
  say('Nothing assumed. The app will ask again once you have had a season here.');
}

/* In this harness both people point at the same sheet, so an invite really is
   just a row the other one can read. A hosted version would do the same lookup
   on a server; the shape does not change. */
function lookupInvite(code) {
  return (DB.invite || []).find(i => String(i.code || '').toUpperCase() === code);
}
/* Anything that redraws a step mid-answer has to keep what is already on it.
   Add a chicken and lose the headcount you typed two fields up is the kind of
   bug that makes somebody stop trusting a form. take() invents nothing for a
   blank field, so calling it early is always safe. */
function syncStep() {
  const step = STEPS()[fs];
  if (step && step.take) { try { step.take(); } catch (e) {} }
}

const STEPS = () => (flow === 'join' ? JOIN : PLACE).filter(x => !x.when || x.when());

  if (!draft.buildingNamed && !HOLDS_BUILDINGS.includes(draft.pkind) &&
      !['land','lot'].includes(draft.pkind))
    draft.building = draft.place;
  draft.renaming = false; drawHub();
}
/* A tile opens its screen in hub mode: one button, Done, and it comes back.
   Addressed by index rather than by title — a title in an onclick attribute is
   a quoting accident waiting to happen, and "What's bugging you today?" has an
   apostrophe in it. */
function openTile(i) {
  const tiles = HUB.filter(h => !h.when || h.when());
  if (tiles[i]) openStep(tiles[i].id);
}
function openStep(id) {
  const list = STEPS();
  const i = list.findIndex(x => x.t === id);
  if (i < 0) return say('That one is not here yet.');
  hubStep = id; fs = i; drawFirst();
}

function drawFirst() {
  const list = STEPS(), f = list[fs];
  // "Step 7 of 8" reads as seven things you have to do. Only the first few are,
  // and saying so is the difference between a setup and a form.
  const need = list.filter(x => !x.skippable).length;
  // The escape sits ABOVE the questions. Making somebody scroll past forty ticks
  // to find out they did not have to answer them is the screen telling them the
  // wrong thing for the whole time it takes to scroll.
  const backTo = hubStep ? 'hubStep=null;drawHub()'
    : fs ? 'fs--;drawFirst()'
    : flow === 'place' ? 'drawWho()' : 'drawWho()';
  app.innerHTML = `<button class="back" onclick="syncStep();${backTo}">&lsaquo; Back</button>
    <p class="step">${hubStep ? esc(draft.place || 'Setting up') : f.skippable
      ? `Optional <button class="skiplink" onclick="skipFirst()">${
          fs === list.length - 1 ? 'skip and finish' : 'skip this'}</button>`
      : FLOW_LABEL[flow] + (need > 1 ? ' · step ' + (fs + 1) + ' of ' + need : '')}</p>
    <h1>${esc(f.t)}</h1><p class="sub">${esc(typeof f.s === 'function' ? f.s() : f.s)}</p>
    ${f.topOut ? `<div class="actions" style="margin:0 0 1rem">${f.topOut}</div>` : ''}
    ${f.body()}
    <div class="actions">
      ${hubStep ? `<button class="primary" onclick="doneStep()">Done</button>`
      : f.noNext ? '' : `<button class="primary" onclick="nextFirst()">${
        fs === list.length - 1 ? (flow === 'join' ? 'Accept' : 'Set it up') : 'Next'}</button>

      ${f.skippable && fs < list.length - 1
        ? '<button class="ghost" onclick="finishFirst()">Finish later</button>' : ''}
      ${f.skippable && fs === list.length - 1
        ? '<button class="ghost" onclick="skipFirst()">Skip and finish</button>' : ''}`}
    </div>`;
}
/* What the earlier screens have already put on the list, one entry per unit. */
function madeSoFar() {
  const out = [];
  Object.entries(draft.things || {}).forEach(([name, n]) => {
    for (let i = 1; i <= n; i++) out.push({ key:name + '#' + i, name,
      label: n > 1 ? name + ' ' + i : name });
  });
  SYSTEMS.forEach(q => {
    const v = (draft.sys || {})[q.k]; if (!v) return;
    (q.multi ? v : [v]).forEach(val => {
      const o = q.o.find(x => x[0] === val); if (!o) return;
      o[2].forEach(tn => out.push({ key:tn + '#1', name:tn, label:tn }));
    });
  });
  return out;
}
function pickedThing(sel) {
  const box = document.getElementById('f-new');
  if (box) box.hidden = !sel.value.startsWith('new:');
}
/* The same three questions, asked at setup and asked again every time she
   pulls up somewhere new. One definition so the two can never drift. */
const STAY = [['staying_put','Parked here for the foreseeable'],
              ['a_season','A season or so'],
              ['few_weeks','A few weeks at a time'],
              ['always_moving','Always on the move'],
              ['not_sure_yet','Not sure yet']];
const HERE = [
  ['water', 'Water here', [['well','a well'],['city','city or municipal'],['shared','shared or community'],
    ['spring','a spring or creek'],['hauled','hauled in'],['dockside','a dockside hookup'],
    ['none','none'],['not_sure_yet','not sure']]],
  ['waste', 'Waste here', [['septic','septic'],['sewer','sewer'],['holding_tank','a holding tank'],
    ['pump_out','a pump-out'],['composting','composting'],['none','none'],['not_sure_yet','not sure']]],
  ['power', 'Power here', [['grid','the grid'],['shore','shore power'],['solar','solar'],
    ['generator','a generator'],['none','none'],['not_sure_yet','not sure']]]
];
function hereForm(v) {
  v = v || {};
  return HERE.map(([k, label, opts]) => `<label style="margin-top:1rem">${esc(label)}
      <span style="font-weight:400;color:var(--muted)">— tick all that apply</span></label>
    <div class="opts">${opts.map(([val, l]) =>
      `<label class="tick"><input type="checkbox" class="hr-${k}" value="${val}"${
        (v[k] || []).includes(val) ? ' checked' : ''}> ${esc(l)}</label>`).join('')}</div>`).join('');
}
function readHere() {
  const out = {};
  HERE.forEach(([k]) => { out[k] = [...document.querySelectorAll('.hr-' + k + ':checked')].map(e => e.value); });
  return out;
}
function addCorner() {
  syncStep();
  const v = ($('#cn-n').value || '').trim();
  if (!v) return say('Name it first — bed, kitchen, whatever you call that end.');
  draft.corners = draft.corners || []; draft.corners.push(v);
  drawFirst(); say(v + ' added.');
}
function dropCorner(i) { syncStep(); draft.corners.splice(i, 1); drawFirst(); }
function saveMain() {
  const typed = ($('#mh-n').value || '').trim();
  draft.buildingNamed = !!typed;
  draft.building = typed || kindLabel($('#mh-k').value);
  draft.bkind = $('#mh-k').value;
  draft.kindTouched = true;
  draft.editMain = false;
  drawFirst(); say(draft.building + ' · ' + kindLabel(draft.bkind));
}
function addBuilding() {
  syncStep();
  draft.more = draft.more || [];
  const kind = draft.mbKind || 'shed';
  const taken = [draft.building].concat(draft.more.map(x => x.name));
  const name = uniqueName(($('#mb-n').value || '').trim() || kindLabel(kind), taken);
  draft.more.push({ name, kind, attached:$('#mb-a').checked, theirs:$('#mb-o').checked });
  drawFirst(); say(name + ' added.');
}
function dropBuilding(i) { syncStep(); draft.more.splice(i, 1); drawFirst(); }
function showRest(btn) {
  btn.parentElement.querySelectorAll('.extra').forEach(e => { e.hidden = false; });
  btn.remove();
}
/* Skip records nothing rather than recording a default. A blank we know is
   blank is worth more than a guess nobody made. On the last step it finishes
   the setup — somebody who only wants in should not have to describe a thing
   first. */
function doneStep() {
  const step = STEPS()[fs];
  if (step && step.take) { const r = step.take(); if (typeof r === 'string') return say(r); }
  hubStep = null; drawHub();
}
function skipFirst() {
  // Filling a screen in and then tapping Skip should not silently bin it. These
  // screens invent nothing for a blank field, so reading them is always safe —
  // skipping an untouched one still records nothing.
  const step = STEPS()[fs];
  if (step && step.skippable) { try { step.take(); } catch (e) {} }
  if (fs < STEPS().length - 1) { fs++; return drawFirst(); }
  draft.type = null; draft.thingName = '';
  return finishFirst();
}
async function nextFirst() {
  document.querySelectorAll('.missing').forEach(e => e.classList.remove('missing'));
  const list = STEPS(), r = list[fs].take();
  if (r !== true && typeof r === 'string') {
    // Name the field, mark it, put the cursor in it. "Give it a name" on a
    // screen with three inputs is a riddle, not an error message.
    const el = list[fs].field && $(list[fs].field);
    if (el) { el.classList.add('missing'); el.focus(); }
    return say(r);
  }
  if (fs < list.length - 1) { fs++; return drawFirst(); }
  return finishFirst();
}
async function finishFirst() {
  app.innerHTML = `<h1>Setting it up…</h1><p class="sub">Writing the first rows.</p>`;
  try { await createEverything(); } catch (e) { return say('Could not save: ' + e.message); }
  await boot();
  const n = (DB.asset || []).length;
  say(flow === 'join'
    ? 'You are in. This is ' + (prop || {}).name + '.'
    : n ? n + (n === 1 ? ' thing tracked' : ' things tracked') + ' — add the next one when you touch it.'
        : 'Your place is set up. Add things as you touch them.');
}

/* Adding a second place later: the same PLACE steps, no person step, and it
   lands you in the new property. */
function addPlace() {
  flow = 'place'; fs = 0;
  draft = { name: me.name, existingPerson: me.id };
  drawFirst();
}

/* Accepting spends the code, attaches the person, and brings whatever came
   with them. If the inviter had already been logging jobs against their name,
   they become THAT person rather than a second copy of them. */
async function acceptInvite() {
  const inv = draft.invite || {};
  const live = lookupInvite(String(draft.code || '').toUpperCase());
  // Re-checked at the moment of accepting, not only when it was typed. A code
  // revoked while somebody was reading the preview has to fail here.
  if (!live || live.state !== 'sent' || (live.expires_on && live.expires_on < today()))
    throw new Error('that invite is no longer good — ask them for a new code');

  const personId = inv.for_person_id || draft.existingPerson || uid();
  const writes = [];
  const existing = (DB.person || []).find(p => p.id === personId);
  if (existing) {
    // Keep their history; take the name they just gave us if it differs.
    if (draft.name && draft.name !== existing.name)
      writes.push({ op:'upsert', table:'person', record:{ ...existing, name:draft.name } });
  } else {
    writes.push({ op:'upsert', table:'person',
      record:{ id:personId, name:draft.name, role:'resident' } });
  }
  writes.push({ op:'upsert', table:'membership', record:{ id:uid(),
    property_id:inv.property_id, person_id:personId, access:inv.access || 'log',
    scope_structure_id:inv.scope_structure_id || '' } });
  // Land IN the place they were invited to, as themselves — not on whichever
  // property happens to be first in the sheet, and not as its owner.
  localStorage.setItem('dwellogs.me', personId);
  localStorage.setItem('dwellogs.place', inv.property_id);
  localStorage.setItem('dwellogs.new', inv.property_id);
  writes.push({ op:'upsert', table:'invite', record:{ ...live, state:'accepted',
    accepted_on:today(), accepted_by_id:personId } });
  if (inv.their_structure_id) {
    const st = (DB.structure || []).find(x => x.id === inv.their_structure_id);
    if (st) writes.push({ op:'upsert', table:'structure', record:{ ...st,
      responsible_id:personId, visibility:draft.share || 'presence_only' } });
  }
  (draft.animals || []).forEach(a => {
    const animalId = uid();
    writes.push({ op:'upsert', table:'animal', record:{ id:animalId, owner_id:personId,
      property_id:inv.property_id, name:a.name, type:a.type, role:'pet',
      cared_for_by_id:personId, acquired_on:'' } });
    writes.push({ op:'upsert', table:'placement', record:{ id:uid(), animal_id:animalId,
      property_id:inv.property_id, arrived_on:today(),
      note:'Came with ' + (draft.name || 'them') } });
  });
  await DwelLogs.write(writes);
}

/* The whole point of starting empty: this is every table a new person touches,
   and therefore the v1 core. Nine of them. */
async function createEverything() {
  // Joining is not setting up. It creates no place, no building and no
  // check-ups — it attaches a person to somebody else's place and stops.
  if (flow === 'join') return acceptInvite();
  const personId = draft.existingPerson || uid(), propId = uid(), structId = uid();
  const writes = [];
  if (!draft.existingPerson)
    writes.push({ op:'upsert', table:'person', record:{ id:personId, name:draft.name, role:'owner' } });
  writes.push(
    { op:'upsert', table:'property', record:{ id:propId, name:draft.place, kind:draft.kind,
        city:draft.city, region:draft.region, country:draft.country || 'United States',
        currency:'USD', units:'imperial', acquired_on:today(),
        climate:(draft.climate || []).join(', '), freezes:draft.freezes || 'not_sure_yet',
        hazards:(draft.hazards || []).join(', '),
        terrain:(draft.terrain || []).join(', '),
        elevation: draft.elevation == null ? '' : draft.elevation,
        // Confirmed only when a person actually said so. Unknown gets a date
        // to be asked again, not a blank that nags every time the app opens.
        profile_confirmed_on: draft.freezes === 'not_sure_yet' ? '' : today(),
        profile_review_on: draft.freezes === 'not_sure_yet' ? inMonths(4) : '' } },
    { op:'upsert', table:'membership', record:{ id:uid(), property_id:propId,
        person_id:personId, access:'owner' } });
  // Nothing on it yet means no building row. An empty lot with a phantom
  // "Main house" on it is a lie the app would then keep asking questions about.
  const bare = ['land','lot'].includes(draft.pkind);
  if (!bare)
    writes.push({ op:'upsert', table:'structure', record:{ id:structId, property_id:propId,
      name:draft.building,
      kind: draft.bkind === '__other' ? 'other' : draft.bkind,
      kind_other: draft.bkindOther || '' } });

  (draft.more || []).forEach(b => {
    writes.push({ op:'upsert', table:'structure', record:{ id:uid(), property_id:propId,
      name:b.name, kind: b.kind === '__other' ? 'other' : b.kind,
      attached_to_id: b.attached ? structId : '',
      // Opt-in, not opt-out. Somebody else's building starts closed and they
      // open it, rather than starting open and hoping they notice.
      visibility: b.theirs ? 'presence_only' : 'shared' } });
  });

  // Templates ship with the app, written once into this property's catalogue.
  const catIds = {}, typeIds = {};
  Object.entries(STARTER).forEach(([cat, list]) => {
    const cid = catIds[cat] = uid();
    writes.push({ op:'upsert', table:'category', record:{ id:cid, name:cat } });
    list.forEach(([tname, checks]) => {
      const tid = typeIds[tname] = uid();
      writes.push({ op:'upsert', table:'asset_type',
        record:{ id:tid, category_id:cid, name:tname, source:checks[0][3] } });
    });
  });

  // The systems answers land in TWO places on purpose. The structure field is a
  // fact about the building — "city water" is true and creates nothing to
  // service. The asset is a thing with a maintenance life. Neither is derivable
  // from the other, so both get written, and an unanswered question writes
  // 'not_sure_yet' rather than a default nobody chose.
  const sys = draft.sys || {};
  const structRec = (writes.find(w => w.table === 'structure') || { record:{} }).record;
  SYSTEMS.forEach(q => {
    const v = sys[q.k];
    structRec[q.k] = v == null ? 'not_sure_yet' : (q.multi ? v.join(', ') : v);
  });
  structRec.spaces = (draft.spaces || []).join(', ');
  structRec.visibility = 'shared';   // the one you set up is your own
  structRec.people_living = draft.people == null ? '' : draft.people;
  structRec.children_here = draft.kids || '';
  structRec.heated = (sys.heat || []).some(h => h !== 'none') ? 'TRUE' : '';

  // Areas first, so a thing can land in one.
  const areaIds = {};
  (draft.spaces || []).forEach(k => {
    const def = SPACES.find(x => x[0] === k);
    if (!def || !def[2]) return;          // a slab is not a room you can stand in
    const id = uid(); areaIds[k] = id;
    writes.push({ op:'upsert', table:'area', record:{ id, structure_id:structId,
      name:AREA_NAME[k] || k, kind:def[2] } });
  });
  // One room with corners inside it, not three rooms pretending to be separate.
  if (draft.openPlan) {
    const mainId = uid();
    writes.push({ op:'upsert', table:'area', record:{ id:mainId, structure_id:structId,
      name:draft.mainRoom || 'Main room' } });
    (draft.corners || []).forEach(c => {
      writes.push({ op:'upsert', table:'area', record:{ id:uid(), structure_id:structId,
        name:c, parent_area_id:mainId } });
    });
  }
  ROOMS.forEach(r => {
    if (draft.openPlan && r[0] !== 'bathrooms') return;
    const n = (draft.rooms || {})[r[0]] || 0;
    for (let i = 1; i <= n; i++)
      writes.push({ op:'upsert', table:'area', record:{ id:uid(), structure_id:structId,
        name:r[1].replace(/s$/, '') + (n > 1 ? ' ' + i : ''), kind:r[2] } });
  });

  // One asset per thing, each carrying its template's check-ups.
  const made = [];
  function addThing(typeName, name, powered, allowMore) {
    if (!typeIds[typeName]) return null;
    // Ticking the dryer on one screen and naming it as the problem on the next
    // is ONE dryer. If the second mention brought a better name, keep the name
    // and drop the duplicate — never end the first run with two of a thing
    // somebody owns one of.
    if (!allowMore) {
      const already = made.find(m => m.type === typeName);
      if (already) { if (name) already.rec.name = name; return already.rec.id; }
    }
    const id = uid();
    const rec = { id, property_id:propId, structure_id:structId,
      asset_type_id:typeIds[typeName], name:name || typeName,
      status:'active', power_source:powered || '' };
    writes.push({ op:'upsert', table:'asset', record:rec });
    Object.values(STARTER).flat().filter(x => x[0] === typeName)[0][1]
      .forEach(([title, n, unit, src, whenSource]) => {
        // An arrival check-up has no date. It is due when she pulls up somewhere
        // new, and a made-up date would only make it look overdue in the meantime.
        if (unit === 'arrival') {
          writes.push({ op:'upsert', table:'schedule', record:{ id:uid(), asset_id:id,
            title, kind:'on_arrival', responsibility:'owner', cost_source:'entered',
            interval_source:src, applies_when_source:(whenSource || []).join(', ') } });
          return;
        }
        const due = new Date();
        if (unit === 'month') due.setMonth(due.getMonth() + n); else due.setFullYear(due.getFullYear() + n);
        writes.push({ op:'upsert', table:'schedule', record:{ id:uid(), asset_id:id,
          title, kind:'interval', every_n:n, every_unit:unit, responsibility:'owner',
          cost_source:'entered', next_due_on:due.toISOString().slice(0, 10),
          interval_source:src, applies_when_source:(whenSource || []).join(', ') } });
      });
    made.push({ type:typeName, rec });
    return id;
  }
  SYSTEMS.forEach(q => {
    const v = sys[q.k]; if (!v) return;
    const picked = q.multi ? v : [v];
    picked.forEach(val => {
      const o = q.o.find(x => x[0] === val); if (!o) return;
      o[2].forEach(tn => addThing(tn, null, q.k === 'heat' ? val : ''));
    });
  });
  if (draft.parkedAt || draft.stayKind || Object.values(draft.here || {}).some(v => v.length))
    writes.push({ op:'upsert', table:'placement', record:{ id:uid(), structure_id:structId,
      property_id:propId, address:draft.parkedAt || '', arrived_on:today(),
      stay_kind:draft.stayKind || 'not_sure_yet',
      water:(draft.here.water || []).join(', '), waste:(draft.here.waste || []).join(', '),
      power:(draft.here.power || []).join(', ') } });

  (draft.household || []).forEach(name =>
    writes.push({ op:'upsert', table:'person', record:{ id:uid(), name, role:'resident' } }));
  (draft.animals || []).forEach(a => {
    const animalId = uid();
    writes.push({ op:'upsert', table:'animal', record:{ id:animalId, property_id:propId,
      name:a.name, type:a.type, role:'pet', acquired_on:'' } });
    writes.push({ op:'upsert', table:'placement', record:{ id:uid(), animal_id:animalId,
      property_id:propId, arrived_on:today() } });
  });

  // Counts, so three fridges are three rows. Each gets its own check-ups,
  // because the one in the garage and the one in the kitchen do not share a
  // filter change.
  const units = {};
  Object.entries(draft.things || {}).forEach(([tn, n]) => {
    for (let i = 1; i <= n; i++) {
      const id = addThing(tn, n > 1 ? tn + ' ' + i : tn, '', true);
      if (id) units[tn + '#' + i] = id;
    }
  });
  made.forEach(m => { if (!units[m.type + '#1']) units[m.type + '#1'] = m.rec.id; });

  // The thing bugging them is an ISSUE against a thing, not a second thing.
  const pick = draft.pick || '';
  let hurtId = null;
  if (pick.startsWith('have:')) hurtId = units[pick.slice(5)] || null;
  else if (pick.startsWith('new:')) hurtId = addThing(pick.slice(4), draft.thingName, '', true);
  if (hurtId && draft.state && draft.state !== 'works')
    writes.push({ op:'upsert', table:'issue', record:{ id:uid(), asset_id:hurtId,
      structure_id:structId,
      // An issue called "Needs a look" tells nobody anything. Name it after the
      // thing when they picked one they already own.
      title: draft.thingName || (made.find(m => m.rec.id === hurtId) || {}).rec?.name || 'Needs a look',
      first_seen_on:today(), state:draft.state } });

  // What nothing on our lists could say. One row per word, counted, and never
  // promoted without a person reading it.
  // Each typing carries WHERE it was typed, because that is the part that cannot
  // be reconstructed later and the part that decides the answer. "Forty people
  // asked for a cistern" and "thirty-eight of them are on boats" are different
  // findings, and only the second says where to put it. The tally across rows
  // is the server's job; the client only ever reports its own one.
  const ctxKind = draft.bkind === '__other' ? (draft.bkindOther || 'other') : draft.bkind;
  const ctxGroup = kgroup(draft.bkind);
  const suggest = (obj, field, typed) => writes.push({ op:'upsert', table:'suggestion',
    record:{ id:uid(), object:obj, field, typed, normalised:typed.toLowerCase().trim(),
      property_id:propId, count:1, context_kind:ctxKind, context_group:ctxGroup,
      by_kind:ctxKind + ':1', first_seen_on:today(), last_seen_on:today(), status:'new' } });
  Object.entries(draft.other || {}).forEach(([k, typed]) => {
    const [obj, field] = k.split('.'); suggest(obj, field, typed);
  });
  if (draft.bkindOther) suggest('structure', 'kind', draft.bkindOther);

  await DwelLogs.write(writes);
}

// ---- the app ------------------------------------------------------------
const byId = t => Object.fromEntries((DB[t] || []).map(r => [r.id, r]));
function schedules() {
  const A = byId('asset');
  return (DB.schedule || []).filter(s => s.status !== 'archived').map(s => {
    const d = daysTo(s.next_due_on);
    return { ...s, thing:(A[s.asset_id] || {}).name || '—', d,
      state: d == null ? 'ok' : d <= 0 ? 'attn' : d <= 14 ? 'soon' : 'ok' };
  }).sort((a, b) => (a.d ?? 1e6) - (b.d ?? 1e6));
}

function show(s) {
  screen = s;
  $('#tabs').hidden = false;
  $('#tabs').innerHTML = [['home','Home'],['add','Add'],['log','Log']]
    .map(([k, l]) => `<button onclick="show('${k}')" aria-current="${k === s ? 'page' : 'false'}">${l}</button>`).join('');
  ({ home: drawHome, add: drawAdd, log: drawLog })[s]();
  window.scrollTo(0, 0);
}


/* ---- the pulse ----------------------------------------------------------
   The line on the site is drawn by hand. This one is drawn by YOUR HOUSE: one
   motif per thing you track, in the order you added them, with its height set
   by how close that thing is to needing you. Two people never get the same
   line, and yours changes as the place does — which is the whole idea, a pulse
   being a reading rather than a decoration.

   The motifs are the same visual language as the site: a baseline with events
   on it, some borrowed from a heart trace and some from the thing itself. A
   well gets a pump curve. A septic tank gets a square wave. Anything that
   burns gets a flame spike. */
const MOTIF = {
  'Water & well':   (x, w, a) => `L${x} 0 C${x + w * .25} ${-a} ${x + w * .75} ${-a} ${x + w} 0`,
  'Septic & sewer': (x, w, a) => `L${x} 0 L${x} ${-a * .7} L${x + w * .5} ${-a * .7} L${x + w * .5} 0 L${x + w} 0`,

const AMP = { attn: 30, soon: 18, ok: 9 };

function pulsePath(width) {
  const things = (DB.asset || []).filter(a => a.status !== 'archived');
  if (!things.length) {
    // An empty place has a heartbeat, not a flat line. It is alive and there is
    // simply nothing on it yet.
    const m = width / 2;
    return `M0 0 L${m - 14} 0 L${m - 8} -4 L${m - 2} 14 L${m + 4} -22 L${m + 10} 8 L${m + 16} 0 L${width} 0`;
  }
  const byType = Object.fromEntries((DB.asset_type || []).map(t => [t.id, t]));
  const byCat  = Object.fromEntries((DB.category || []).map(c => [c.id, c.name]));
  const worst = {};
  schedules().forEach(s => {
    const r = { attn: 3, soon: 2, ok: 1 }[s.state] || 1;
    if (!worst[s.asset_id] || r > worst[s.asset_id]) worst[s.asset_id] = r;
  });
  const shown = things.slice(0, 9);
  const w = width / shown.length;
  let d = 'M0 0 ';
  shown.forEach((a, i) => {
    const t = byType[a.asset_type_id], cat = t ? byCat[t.category_id] : null;
    const draw = MOTIF[cat] || MOTIF._default;
    const state = { 3:'attn', 2:'soon', 1:'ok' }[worst[a.id] || 1];
    d += draw(i * w, w, AMP[state]) + ' ';
  });
  return d + `L${width} 0`;
}

}

/* The order that decides what a screen is allowed to claim:

     2. somebody set it       -> theirs

   there are more people here than the book assumed, it gets to say one sentence
   and no more — and the first logged replacement retires it for good. */
function intervalBasis(sched) {
  const done = (DB.history || []).filter(h => h.schedule_id === sched.id && h.done_on)
    .map(h => h.done_on).sort();
  if (done.length >= 2) {
    const a = new Date(done[done.length - 2]), b = new Date(done[done.length - 1]);
    const days = Math.round((b - a) / 86400000);
    return { source:'own_history', says:'Yours: about ' + days + ' days last time.' };
  }
  const st = (DB.structure || []).find(s => s.id === sched.structure_id) ||
             (DB.structure || [])[0] || {};
  const n = Number(st.people_living || 0);
  const book = { manufacturer:'the manual', code:'code', our_estimate:'our estimate' }[sched.interval_source];
  if (!done.length && n > 2 && book && sched.interval_source !== 'owner')
    return { source:sched.interval_source, says:'This is ' + book + '\u2019s figure. ' + n +
      ' people live here, so it may not last that long \u2014 the first time you replace it, ' +
      'we will know instead of guessing.' };

async function saveMove(stId) {
  const where = ($('#pk-a').value || '').trim();
  if (!where) return say('Say where it is, even roughly.');
  const when = $('#pk-d').value || today(), here = readHere(), was = openStay(stId);
  // A stay cannot end before it started. Left unchecked, moving in on a future
  // date and then moving again today writes a stay that ran backwards, and
  // every span measured off it afterwards is nonsense.
  if (was && was.arrived_on && when < was.arrived_on)
    return say('That is before you arrived at ' + (was.address || 'the last spot') +
      ' on ' + was.arrived_on + '. Check the date.');
  const writes = [];
  if (was) writes.push({ op:'upsert', table:'placement', record:{ ...was, left_on:when } });
  writes.push({ op:'upsert', table:'placement', record:{ id:uid(), structure_id:stId,
    property_id:(was || {}).property_id || prop.id, address:where, arrived_on:when,
    stay_kind:$('#pk-s').value,
    water:here.water.join(', '), waste:here.waste.join(', '), power:here.power.join(', ') } });
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  await boot();
  // The whole reason the source is kept per-stay: say what it just turned on.
  const due = arrivalChecks(stId, here.water);
  say(due.length
    ? 'Moved. On this water: ' + due.map(d => d.title).join(', ') + '.'
    : 'Moved. Nothing extra to do on this water.');
}
/* Arrival check-ups whose source condition matches what is here now. */
function arrivalChecks(stId, water) {
  const mine = new Set((DB.asset || []).filter(a => a.structure_id === stId).map(a => a.id));
  return (DB.schedule || []).filter(s =>
    s.kind === 'on_arrival' && mine.has(s.asset_id) &&
    (!s.applies_when_source ||
      s.applies_when_source.split(',').map(x => x.trim()).some(x => (water || []).includes(x))));
}

   described in the abstract. */
function startOver() {
  const n = t => (DB[t] || []).filter(r => r.status !== 'archived').length;
  const sheet = !!localStorage.getItem('dwellogs.url');
  $('#tabs').hidden = true;
  app.innerHTML = `<h1>Start over?</h1>
    <p class="sub">This clears what is on this device and takes you back to the first screen.</p>
    <div class="card"><span class="title">What goes</span>
      <p class="meta">${[['property','place'],['structure','building'],['area','area'],
        ['asset','thing'],['schedule','check-up'],['issue','issue'],['animal','animal']]
        .map(([t, l]) => n(t) + ' ' + l + (n(t) === 1 ? '' : 's'))
        .filter(x => !x.startsWith('0 ')).join(' · ') || 'nothing yet'}</p></div>
    ${sheet ? `<div class="card"><span class="title">Your sheet is not touched</span>
        <p class="meta">This only clears this device and disconnects it. The rows stay in your
          spreadsheet — delete them there if you want them gone.</p></div>`
      : `<div class="card"><span class="title">There is no copy</span>
        <p class="meta">This device is the only place these rows exist. Gone is gone.</p></div>`}
    <div class="actions">
      <button class="primary" onclick="wipe()">Yes, start over</button>
      <button class="ghost" onclick="show('home')">Keep it</button>
    </div>`;
}
function wipe() {
  // Every key, not just the ones I happened to remember: a stale "which place
  // was I in" pointing at a property that no longer exists is worse than none.
  ['dwellogs.local.v1','dwellogs.cache.v1','dwellogs.url','dwellogs.token',
   'dwellogs.me','dwellogs.place','dwellogs.new']
    .forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  DB = null; me = null; prop = null;
  boot();
}
const card = s => `<div class="card tap"><button onclick="openSched('${s.id}')">
  <span class="title">${esc(s.title)}</span>
  <p class="meta">${esc(s.thing)} · ${s.d == null ? 'no date yet'
    : s.d < 0 ? Math.abs(s.d) + ' days late' : s.d === 0 ? 'today' : 'in ' + s.d + ' days'}
    <span class="chip ${s.state}">${{ attn:'needs you', soon:'due soon', ok:'fine' }[s.state]}</span></p>
</button></div>`;

function openSched(id) {
  const s = schedules().filter(x => x.id === id)[0];
  $('#tabs').hidden = false;
  const basis = intervalBasis(s);
  app.innerHTML = `<button class="ghost" onclick="show('home')">&lsaquo; Back</button>
    <h1>${esc(s.title)}</h1><p class="sub">${esc(s.thing)} · every ${s.every_n} ${esc(s.every_unit)}${s.every_n > 1 ? 's' : ''}</p>
    <p class="hint">${esc(basis.says)}</p>
    <label for="l-when">When was it done?</label><input id="l-when" type="date" value="${today()}">
    <label for="l-cost">What did it cost? <span style="font-weight:400">(optional)</span></label>
    <input id="l-cost" inputmode="decimal" placeholder="">
    <p class="hint">Blank means you do not know — it is not counted as zero.</p>
    <div class="actions"><button class="primary" onclick="logDone('${s.id}')">Log it done</button></div>`;
}
async function logDone(id) {
  const s = (DB.schedule || []).filter(x => x.id === id)[0];
  const when = $('#l-when').value || today(), cost = ($('#l-cost').value || '').trim();
  const next = new Date(when);
  if (s.every_unit === 'month') next.setMonth(next.getMonth() + Number(s.every_n));
  else next.setFullYear(next.getFullYear() + Number(s.every_n));
  try {
    await DwelLogs.write([
      { op:'upsert', table:'completion', record:{ id:uid(), schedule_id:s.id, asset_id:s.asset_id,
          done_on:when, what:s.title, by_person_id:me.id, origin:'planned',
          cost: cost === '' ? '' : cost } },
      { op:'upsert', table:'schedule', record:{ id:s.id, next_due_on:next.toISOString().slice(0,10) } }
    ]);
  } catch (e) { return say('Could not save: ' + e.message); }
  DB = (await DwelLogs.load()).db;
  show('home');
  say('Logged. Next one due ' + next.toISOString().slice(0, 10) + '.');
}

function drawAdd() {
  const types = Object.entries(STARTER).flatMap(([c, l]) => l.map(([n]) => [c, n]));
  const structs = (DB.structure || []).filter(s => s.status !== 'archived');
  app.innerHTML = `<h1>Add a thing</h1>
    <p class="sub">Add it the day you touch it. There is no finish line here.</p>
    <label for="a-s">Which building?</label>
    <select id="a-s">${structs.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}
      <option value="__new">+ A new building</option></select>
    <div id="a-newb" hidden><label for="a-bn">Call it
        <span style="font-weight:400;color:var(--muted)">— optional</span></label>
      <input id="a-bn" placeholder="leave it and we will use what it is">
      <label for="a-bk">What kind?</label>
      <select id="a-bk" onchange="otherKind(this)">${kindOptions('shed')}</select>
      <div id="a-bk-other" hidden><label for="a-bko">What is it?</label>
        <input id="a-bko" placeholder="in your own words"></div></div>
    <label for="a-t">What kind of thing?</label>
    <select id="a-t">${types.map(([c, n]) =>
      `<option value="${esc(n)}">${esc(n)} — ${esc(c)}</option>`).join('')}</select>
    <label for="a-n">Call it <span style="font-weight:400;color:var(--muted)">— optional</span></label>
    <input id="a-n" placeholder="leave it and we will use what it is">
    <div class="actions"><button class="primary" onclick="addThing()">Add it</button></div>`;
  $('#a-s').onchange = e => { $('#a-newb').hidden = e.target.value !== '__new'; };
}
async function addThing() {
  const type = $('#a-t').value;
  // "Dishwasher" is a perfectly good name for the dishwasher. A second one
  // becomes Dishwasher 2 and can be renamed later, if it ever matters.
  const name = ($('#a-n').value || '').trim() ||
    uniqueName(type, (DB.asset || []).map(a => a.name));
  let structId = $('#a-s').value;
  const writes = [];
  if (structId === '__new') {
    structId = uid();
    const bk = $('#a-bk').value;
    const bn = ($('#a-bn').value || '').trim() ||
      uniqueName(bk === '__other' ? (($('#a-bko').value || '').trim() || 'Building') : kindLabel(bk),
                 (DB.structure || []).map(x => x.name));
    writes.push({ op:'upsert', table:'structure', record:{ id:structId, property_id:prop.id,
      name:bn, kind: bk === '__other' ? 'other' : bk,
      kind_other: bk === '__other' ? ($('#a-bko').value || '').trim() : '' } });
  }
  const t = (DB.asset_type || []).filter(x => x.name === type)[0];
  const assetId = uid();
  writes.push({ op:'upsert', table:'asset', record:{ id:assetId, property_id:prop.id,
    structure_id:structId, asset_type_id:(t || {}).id, name, status:'active', installed_on:today() } });
  const tmpl = Object.values(STARTER).flat().filter(x => x[0] === type)[0];
  tmpl[1].forEach(([title, n, unit]) => {
    const due = new Date();
    if (unit === 'month') due.setMonth(due.getMonth() + n); else due.setFullYear(due.getFullYear() + n);
    writes.push({ op:'upsert', table:'schedule', record:{ id:uid(), asset_id:assetId, title,
      kind:'interval', every_n:n, every_unit:unit, responsibility:'owner', cost_source:'entered',
      next_due_on:due.toISOString().slice(0, 10) } });
  });
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  DB = (await DwelLogs.load()).db;
  show('home');
  say(name + ' added, with ' + tmpl[1].length + ' check-up' + (tmpl[1].length === 1 ? '' : 's') + '.');
}

function drawLog() {
  const A = byId('asset'), P = byId('person');
  const rows = (DB.completion || []).slice().reverse();
  app.innerHTML = `<h1>Log</h1>
    <p class="sub">Everything done, newest first. Entries are permanent.</p>
    ${rows.map(c => `<div class="card"><span class="title">${esc(c.what)}</span>
      <p class="meta">${esc((A[c.asset_id] || {}).name || '')} · ${esc(c.done_on)} ·
        ${esc((P[c.by_person_id] || {}).name || '')}${c.cost ? ' · ' + esc(c.cost) : ''}</p></div>`).join('')
      || `<div class="empty">Nothing logged yet. The first entry is the useful one.</div>`}`;
}

boot();
</script>
</body>
</html>
