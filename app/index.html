      kind_other: draft.bkindOther || '' } });

  const moreIds = [];
  (draft.more || []).forEach((b, i) => {
    const id2 = uid(); moreIds[i] = id2;
    writes.push({ op:'upsert', table:'structure', record:{ id:id2, property_id:propId,
      name:b.name, kind: b.kind === '__other' ? 'other' : b.kind,
      attached_to_id: b.attached ? structId : '',
      // Opt-in, not opt-out. Somebody else's building starts closed and they
      // open it, rather than starting open and hoping they notice.
      visibility: b.theirs ? 'presence_only' : 'shared' } });
  });

  // Templates ship with the app, written once into this property's catalogue.
  const catIds = {}, typeIds = {};
  Object.entries(STARTER).forEach(([cat, list]) => {
    const cid = catIds[cat] = uid();
    writes.push({ op:'upsert', table:'category', record:{ id:cid, name:cat } });
    list.forEach(([tname, checks]) => {
      const tid = typeIds[tname] = uid();
      writes.push({ op:'upsert', table:'asset_type',
        record:{ id:tid, category_id:cid, name:tname, source:checks[0][3] } });
    });
  });

  // The systems answers land in TWO places on purpose. The structure field is a
  // fact about the building — "city water" is true and creates nothing to
  // service. The asset is a thing with a maintenance life. Neither is derivable
  // from the other, so both get written, and an unanswered question writes
  // 'not_sure_yet' rather than a default nobody chose.
  const sys = draft.sys || {};
  const structRec = (writes.find(w => w.table === 'structure') || { record:{} }).record;
  SYSTEMS.forEach(q => {
    const v = sys[q.k];
    structRec[q.k] = v == null ? 'not_sure_yet' : (q.multi ? v.join(', ') : v);
  });
  structRec.spaces = (draft.spaces || []).join(', ');
  structRec.visibility = 'shared';   // the one you set up is your own
  structRec.people_living = draft.people == null ? '' : draft.people;
  structRec.children_here = draft.kids || '';
  structRec.heated = (sys.heat || []).some(h => h !== 'none') ? 'TRUE' : '';

  // Areas first, so a thing can land in one.
  areaWrites(structId).forEach(w => writes.push(w));

  // One asset per thing, each carrying its template's check-ups.
  const made = [];
  function addThing(typeName, name, powered, allowMore, areaId) {
    if (!typeIds[typeName]) return null;
    // Ticking the dryer on one screen and naming it as the problem on the next
    // is ONE dryer. If the second mention brought a better name, keep the name
    // and drop the duplicate — never end the first run with two of a thing
    // somebody owns one of.
    if (!allowMore) {
      const already = made.find(m => m.type === typeName);
      if (already) { if (name) already.rec.name = name; return already.rec.id; }
    }
    const t = thingWrites(typeName, { typeIds, propId, structId, areaId, powered,
      name: name || typeName, keep:picked, every:everyFor });
    t.writes.forEach(w => writes.push(w));
    made.push({ type:typeName, rec:t.rec });
    return t.id;
  }
  SYSTEMS.forEach(q => {
    const v = sys[q.k]; if (!v) return;
    const picked = q.multi ? v : [v];
    picked.forEach(val => {
      const o = q.o.find(x => x[0] === val); if (!o) return;
      o[2].forEach(tn => addThing(tn, null, q.k === 'heat' ? val : ''));
    });
  });
  /* The other buildings answered for themselves. Their answers go on their own
     rows, and what those answers imply -- a holding tank, a heater under the
     sink -- is made against that building rather than thrown on the house. The
     dedupe is per building on purpose: two buildings really do have two water
     heaters, and the one thing nobody has is two of them in the same shed. */
  (draft.more || []).forEach((b, i) => {
    const own = b.sys;
    if (!own || !Object.keys(own).length || !moreIds[i]) return;
    const rec2 = (writes.find(w => w.table === 'structure'
      && w.record.id === moreIds[i]) || {}).record;
    if (!rec2) return;
    const g2 = kgroup(b.kind);
    SYSTEMS.filter(q => !(q.off || []).includes(g2)).forEach(q => {
      const v = own[q.k];
      rec2[q.k] = v == null ? 'not_sure_yet' : (q.multi ? v.join(', ') : v);
    });
    rec2.heated = (own.heat || []).some(h => h !== 'none') ? 'TRUE' : '';
    const seen = new Set();
    SYSTEMS.forEach(q => {
      const v = own[q.k]; if (!v) return;
      (q.multi ? v : [v]).forEach(val => {
        const o = q.o.find(x => x[0] === val); if (!o) return;
        o[2].forEach(tn => {
          if (seen.has(tn)) return; seen.add(tn);
          thingWrites(tn, { typeIds, propId, structId:moreIds[i],
            powered: q.k === 'heat' ? val : '', keep:picked })
            .writes.forEach(w => writes.push(w));
        });
      });
    });
  });
  if (draft.parkedAt || draft.stayKind || Object.values(draft.here || {}).some(v => v.length))
    writes.push({ op:'upsert', table:'placement', record:{ id:uid(), structure_id:structId,
      property_id:propId, address:draft.parkedAt || '', arrived_on:today(),
      stay_kind:draft.stayKind || 'not_sure_yet',
      water:(draft.here.water || []).join(', '), waste:(draft.here.waste || []).join(', '),
      power:(draft.here.power || []).join(', ') } });

  (draft.household || []).forEach(name =>
    writes.push({ op:'upsert', table:'person', record:{ id:uid(), name, role:'resident' } }));
  (draft.animals || []).forEach(a => {
    const animalId = uid();
    writes.push({ op:'upsert', table:'animal', record:{ id:animalId, property_id:propId,
      name:a.name, type:a.type, role:'pet', acquired_on:'' } });
    writes.push({ op:'upsert', table:'placement', record:{ id:uid(), animal_id:animalId,
      property_id:propId, arrived_on:today() } });
  });

  // Counts, so three fridges are three rows. Each gets its own check-ups,
  // because the one in the garage and the one in the kitchen do not share a
  // filter change.
  /* Areas are already in `writes` by now, so their generated ids can be found
     by the name the picker offered. Names are unique within a plan. */
  const areaByName = {};
  writes.forEach(w => { if (w.table === 'area') areaByName[w.record.name] = w.record.id; });

  const units = {}, perRoom = {};
  Object.entries(draft.things || {}).forEach(([tn, n]) => {
    for (let i = 1; i <= n; i++) {
      const room = n > 1 ? ((draft.where || {})[tn + '#' + i] || '') : '';
      let nm;
      if (room) {
        /* Named after where it is, which is how she says it out loud. Two in
           the SAME room still need telling apart, so those keep a number. */
        const c = perRoom[tn + '|' + room] = (perRoom[tn + '|' + room] || 0) + 1;
        nm = room + ' ' + tn.toLowerCase() + (c > 1 ? ' ' + c : '');
      } else nm = n > 1 ? tn + ' ' + i : tn;
      const id = addThing(tn, nm, '', true, room ? (areaByName[room] || '') : '');
      if (id) units[tn + '#' + i] = id;
    }
  });
  made.forEach(m => { if (!units[m.type + '#1']) units[m.type + '#1'] = m.rec.id; });

  /* ONE table now. "Clean the gutters this week" and "the dryer works sometimes"
     are the same row with a different kind, which is the whole point of the
     merge: they end up on the same board, opened by the same screen, and the
     person can change their mind about which it is by editing one field.
     The asset is guessed from the words and never demanded. */
  (draft.jobs || []).forEach(j => {
    const key = guessThing(j.title);
    const fault = j.kind === 'fault';
    const jid = uid();
    let schedId = '';
    /* A repeat set during setup is the same rule the job screen would make, so
       the very first "mark it done" rolls it forward and puts the next one on
       the list. Without this the repeat would have been a note to nobody. */
    if (j.rep === 'yes') {
      schedId = uid();
      writes.push({ op:'upsert', table:'schedule', record:{ id:schedId,
        asset_id: key ? (units[key] || '') : '', structure_id:structId, title:j.title,
        kind: j.answer === 'reading' ? 'reading' : 'interval',
        every_n: j.every_n || 6, every_unit: j.every_unit || 'month',
        /* NOT `|| today()`. Saying a thing repeats is not saying when it is
           first wanted, and filling that in for them makes the app produce a
           date nobody chose -- which reads as late the following morning. An
           undated rule sits under "No date" until it is dated or done once;
           doing it once is what anchors "every six months" anyway. */
        next_due_on: j.due_on || '' } });
    }
    writes.push({ op:'upsert', table:'job', record:{ id:jid, property_id:propId,
      kind: j.kind || 'task', title:j.title, notes:j.notes || '',
      source:'owner', status:'open', schedule_id:schedId,
      asset_id: key ? (units[key] || '') : '', structure_id:structId,
      start_on: j.start_on || '', due_on: j.due_on || '',
      est_minutes: j.est_minutes || '', est_cost: j.est_cost || '',
      prerequisites: j.prerequisites || '', safety: j.safety || 'none',
      first_seen_on: fault ? today() : '',
      state: fault ? (j.state || 'degraded') : '',
      workaround: fault ? (j.workaround || '') : '',
      reported_on: fault ? (j.reported_on || '') : '',
      reply: fault ? (j.reply || '') : '',
      now:  j.kind === 'improvement' ? (j.now  || '') : '',
      want: j.kind === 'improvement' ? (j.want || '') : '',
      slot: (!fault && !j.due_on) ? 'this_week' : '',
      column: fault ? 'investigating' : 'todo' } });
    (j.steps || []).forEach((st, n) => writes.push({ op:'upsert', table:'step',
      record:{ id:uid(), job_id:jid, text:st.text, position:n + 1,
               done: st.done ? 'TRUE' : '' } }));
  });

  // What nothing on our lists could say. One row per word, counted, and never
  // promoted without a person reading it.
  // Each typing carries WHERE it was typed, because that is the part that cannot
  // be reconstructed later and the part that decides the answer. "Forty people
  // asked for a cistern" and "thirty-eight of them are on boats" are different
  // findings, and only the second says where to put it. The tally across rows
  // is the server's job; the client only ever reports its own one.
  const ctxKind = draft.bkind === '__other' ? (draft.bkindOther || 'other') : draft.bkind;
  const ctxGroup = kgroup(draft.bkind);
  const suggest = (obj, field, typed) => writes.push({ op:'upsert', table:'suggestion',
    record:{ id:uid(), object:obj, field, typed, normalised:typed.toLowerCase().trim(),
      property_id:propId, count:1, context_kind:ctxKind, context_group:ctxGroup,
      by_kind:ctxKind + ':1', first_seen_on:today(), last_seen_on:today(), status:'new' } });
  Object.entries(draft.other || {}).forEach(([k, typed]) => {
    const [obj, field] = k.split('.'); suggest(obj, String(field).split('#')[0], typed);
  });
  if (draft.bkindOther) suggest('structure', 'kind', draft.bkindOther);
  /* One row per room typed. draft.other keeps a single value per key, so
     routing these through it meant the second room quietly erased the first. */
  (draft.namedRooms || []).forEach(nm => suggest('area', 'kind', nm));

  await DwelLogs.write(writes);
}

// ---- the app ------------------------------------------------------------
const byId = t => Object.fromEntries((DB[t] || []).map(r => [r.id, r]));
function schedules() {
  const A = byId('asset');
  /* Code.gs already skips muted rules when it builds the digest; the home
     screen was still listing them, which would have made unticking look like
     it did nothing. */
  const isMuted = s => s.muted === true || String(s.muted).toUpperCase() === 'TRUE';
  return (DB.schedule || []).filter(s => s.status !== 'archived' && !isMuted(s)).map(s => {
    const d = daysTo(s.next_due_on);
    return { ...s, thing:(A[s.asset_id] || {}).name || '—', d,
      state: d == null ? 'ok' : d <= 0 ? 'attn' : d <= 14 ? 'soon' : 'ok' };
  }).sort((a, b) => (a.d ?? 1e6) - (b.d ?? 1e6));
}

function show(s) {
  screen = s;
  SUBJ_TRAIL = [];
  $('#tabs').hidden = false;
  $('#tabs').innerHTML = [['home','Home'],['add','Add'],['log','Log']]
    .map(([k, l]) => `<button onclick="show('${k}')" aria-current="${k === s ? 'page' : 'false'}">${l}</button>`).join('');
  ({ home: drawHome, add: drawAdd, log: drawLog })[s]();
  window.scrollTo(0, 0);
}


/* ---- the pulse ----------------------------------------------------------
   The line on the site is drawn by hand. This one is drawn by YOUR HOUSE: one
   motif per thing you track, in the order you added them, with its height set
   by how close that thing is to needing you. Two people never get the same
   line, and yours changes as the place does — which is the whole idea, a pulse
   being a reading rather than a decoration.

   The motifs are the same visual language as the site: a baseline with events
   on it, some borrowed from a heart trace and some from the thing itself. A
   well gets a pump curve. A septic tank gets a square wave. Anything that
   burns gets a flame spike. */
const MOTIF = {
  'Water & well':   (x, w, a) => `L${x} 0 C${x + w * .25} ${-a} ${x + w * .75} ${-a} ${x + w} 0`,
  'Septic & sewer': (x, w, a) => `L${x} 0 L${x} ${-a * .7} L${x + w * .5} ${-a * .7} L${x + w * .5} 0 L${x + w} 0`,
  'Heating & fuel': (x, w, a) => `L${x + w * .2} 0 L${x + w * .35} ${-a} L${x + w * .5} ${a * .35} L${x + w * .65} ${-a * .6} L${x + w * .8} 0 L${x + w} 0`,
  'Power':          (x, w, a) => `L${x + w * .25} 0 L${x + w * .45} ${-a} L${x + w * .4} ${-a * .3} L${x + w * .6} ${-a * .3} L${x + w * .55} ${a * .4} L${x + w * .75} 0 L${x + w} 0`,
  'Cooling':        (x, w, a) => `L${x} 0 Q${x + w * .25} ${-a} ${x + w * .5} 0 Q${x + w * .75} ${a * .5} ${x + w} 0`,
  'Appliances':     (x, w, a) => `L${x + w * .2} 0 L${x + w * .2} ${-a * .6} L${x + w * .45} ${-a * .6} L${x + w * .45} 0 L${x + w * .6} 0 L${x + w * .6} ${-a * .35} L${x + w * .8} ${-a * .35} L${x + w * .8} 0 L${x + w} 0`,
  'Safety':         (x, w, a) => `L${x + w * .4} 0 L${x + w * .5} ${-a} L${x + w * .6} 0 L${x + w} 0`,
  _default:         (x, w, a) => `L${x + w * .3} 0 L${x + w * .4} ${-a * .5} L${x + w * .5} ${a * .25} L${x + w * .6} 0 L${x + w} 0`
};
/* Height says how close it is to wanting you. Nothing overdue means a calm
   line, which is a true reading and not a reward. */
const AMP = { attn: 30, soon: 18, ok: 9 };

function pulsePath(width) {
  /* The place's line is the same line, rolled up -- every beat under it, on the
     same axis. It used to be one blip per asset in the order they were added,
     which sat a smoke detector due in a decade beside a filter due Tuesday and
     said they were the same kind of event. The property is its buildings and
     their things; its pulse should be theirs. */
  if (prop) { const d = pulseUnder('property', prop.id, width); if (d) return d; }
  // An empty place has a heartbeat, not a flat line. It is alive and there is
  // simply nothing on it yet.
  const m = width / 2;
  return `M0 0 L${m - 14} 0 L${m - 8} -4 L${m - 2} 14 L${m + 4} -22 L${m + 10} 8 L${m + 16} 0 L${width} 0`;
}
/* A thing's own pulse. On a single thing the axis is TIME -- the coming year,
   left to right -- and every beat is a moment this thing will want you. Which
   makes it say what a list of dates does not: a dishwasher with a quarterly
   filter beats four times and a smoke detector due in ten years is a flat line,
   and that is the difference between owning the two. Height is urgency.
   Overdue beats sit at the left edge, because they have not gone anywhere. */
function pulseUnder(kind, id, width) {
  const HORIZON = 365, BACK = 30;
  const byType = Object.fromEntries((DB.asset_type || []).map(t => [t.id, t]));
  const byCat  = Object.fromEntries((DB.category || []).map(c => [c.id, c.name]));
  const catOf = x => {
    const a2 = (DB.asset || []).find(y => y.id === x.asset_id);
    const t = a2 && byType[a2.asset_type_id];
    return t ? byCat[t.category_id] : null;
  };
  const beats = [];
  descendants(kind, id).forEach(([k, i]) => {
    const fk = (SUBJECT[k] || {}).fk; if (!fk) return;
    (DB.schedule || []).filter(x => x.status !== 'archived' && x.muted !== 'TRUE'
      && x[fk] === i).forEach(x => {
      let d = daysTo(x.next_due_on); if (d == null) return;
      const n = Number(x.every_n) || 0;
      const step = { day:n, week:n * 7, month:n * 30.44, year:n * 365.25 }[x.every_unit] || 0;
      const cat = catOf(x);
      let guard = 0;
      while (d <= HORIZON && guard++ < 40) {
        if (d >= -BACK) beats.push({ d, cat });
        if (step < 1) break;
        d += step;
      }
    });
  });
  if (!beats.length) return null;
  beats.sort((x, y) => x.d - y.d);
  const span = HORIZON + BACK;
  let d2 = 'M0 0 ', end = 0;
  beats.slice(0, 26).forEach(bt => {
    const w = 24;
    // Never stepping backwards, or the line doubles over itself and stops
    // reading as a trace. A dense cluster becomes a run of beats, which is what
    // a busy month feels like anyway.
    const x = Math.max(end, ((bt.d + BACK) / span) * (width - w));
    if (x > width - w) return;
    const state = bt.d <= 0 ? 'attn' : bt.d <= 14 ? 'soon' : 'ok';
    d2 += (MOTIF[bt.cat] || MOTIF._default)(x, w, AMP[state]) + ' ';
    end = x + w;
  });
  return d2 + `L${width} 0`;
}
function pulseSvgFor(kind, id) {
  const W = 320, d = pulseUnder(kind, id, W);
  if (!d) return '';
  return `<div class="pulse" aria-hidden="true"><svg viewBox="0 -34 ${W} 60"
    preserveAspectRatio="none" role="presentation"><path d="${d}"/></svg></div>`;
}
function pulseSvg() {
  const W = 320;
  return `<div class="pulse" aria-hidden="true"><svg viewBox="0 -34 ${W} 60"
    preserveAspectRatio="none" role="presentation">
    <path d="${pulsePath(W)}"/></svg></div>`;
}

/* iOS only runs a service worker for a page added to the home screen; in plain
   Safari the app has no offline copy at all. So this is not a nicety on iPhone,
   it is how somebody gets the app that works in a basement. Asked once, and
   never again once dismissed or once they have done it. */
function wantsHomeScreen() {
  if (localStorage.getItem('dwellogs.a2hs') === 'no') return false;
  const standalone = window.navigator.standalone === true
    || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (standalone) return false;
  const ua = navigator.userAgent || '';
  const ios = /iPad|iPhone|iPod/.test(ua)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  return ios;
}
function noHomeScreen() { localStorage.setItem('dwellogs.a2hs', 'no'); drawHome(); }

/* Ask the browser not to bin this. Chrome and Firefox grant it to a site that
   looks like one you actually use, silently and with no prompt; Safari answers
   on its own terms. It is four lines and it is the only lever that works for
   somebody who will never add anything to a home screen.

   Asked once there is real data to lose -- asking on an empty app would be
   asking for a promise about nothing, and a denied request is not re-asked by
   the browser for a while. */
let STORAGE_KEPT = null;
async function askToKeep() {
  try {
    if (!navigator.storage || !navigator.storage.persist) return null;
    if (await navigator.storage.persisted()) return (STORAGE_KEPT = true);
    if (!tracked()) return null;                 // nothing worth keeping yet
    STORAGE_KEPT = await navigator.storage.persist();
    return STORAGE_KEPT;
  } catch (e) { return null; }
}
/* What this browser will actually do with their log, in a sentence. Safari
   empties script storage after seven days of not opening a site, unless it is
   on the home screen -- which is a thing somebody deserves to know BEFORE they
   spend an evening typing a ranch into it, not after. */
function keepWords() {
  const ua = navigator.userAgent || '';
  const ios = /iPad|iPhone|iPod/.test(ua)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = window.navigator.standalone === true
    || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (standalone) return 'On your home screen, so it stays put.';
  if (STORAGE_KEPT) return 'Your browser has been asked to keep it, and agreed.';
  if (ios) return 'Safari empties this after about a week of not opening it. '
    + 'On your home screen it stays.';
  return 'It lives in this browser. Clearing site data clears this.';
}

      return `<h2>On your list</h2>`

    building: st.name, bkind: st.kind,
    people: st.people_living || null, kids: st.children_here || '',

    sys: {}, rooms: {}, namedRooms: [], corners: [], more: [], things: {},

  const writes = [];

       thing with a maintenance life. Saying you have a well and getting no well
       to service would make this screen a worse version of the one in setup.

       But a second building saying "a well" is usually the SAME well. Making a
       second one silently gives the place two wells, two sets of check-ups and
       two things to test every year, one of which does not exist. So: a thing
       already on this building is left alone, a thing that exists nowhere is
       made here, and a thing that exists on some OTHER building is a question
       for the person -- it is their place, and only they know whether the pipe

      (q.multi ? v : [v]).forEach(val => {
        const o = q.o.find(x => x[0] === val); if (!o) return;

          const elsewhere = live.find(x => typeOf(x) === tn && x.structure_id !== stId);
          if (elsewhere) { pending.push({ tn, sys:q.k, powered, other:elsewhere.id,

       the shortfall is created. Lowering a number is not a disposal order --

    (DB.asset || []).filter(a => a.structure_id === stId && a.status !== 'archived')

     way to answer for the barn was Done, home, back in, pick the barn -- four

  if (goToStructId) return reopen(stepId, goToStructId);

  <button class="under" onclick="${go}">Remove</button>${inner}</div>`;
let SW = null;
function swClose() { document.querySelectorAll('.swipe.open').forEach(e => e.classList.remove('open')); }

  const t = e.touches[0];
  SW = { x:t.clientX, y:t.clientY, el, moved:false };
}
function swMove(e, el) {
  if (!SW || SW.el !== el) return;
  const t = e.touches[0], dx = t.clientX - SW.x, dy = t.clientY - SW.y;
  // Vertical wins: the list has to stay scrollable, and a thumb travelling down
  // the screen is not reaching for Remove.
  if (Math.abs(dy) > Math.abs(dx)) { SW = null; return; }
  if (Math.abs(dx) > 8) SW.moved = true;
  if (SW.moved) e.preventDefault();
}
function swEnd(e, el) {
  if (!SW || SW.el !== el) return;
  const dx = (e.changedTouches[0].clientX) - SW.x;
  const wasOpen = el.classList.contains('open');
  swClose();

}

/* ---- the shelf ----------------------------------------------------------

   The half of a check-up that makes it doable. "Replace the water filter" is
   not an instruction, it is a shopping trip somebody has to reconstruct from
   memory every six months: which filter, where from, and is there one already
   in the cupboard.

   Two ways of knowing how long a stock lasts, kept apart on purpose. A bottle
   of algaecide doing four treatments is COUNTED -- it is on the label. A propane
   tank lasting about three months is HEARSAY until two deliveries bracket a
   measured span, which is why `rate_source` names whoever said so. The counted
   kind is arithmetic and the app may do it; the other kind is somebody's word
   and the app must never print it as its own. */
function shelfLine(x) {
  const n = Number(x.on_hand);
  if (!Number.isFinite(n)) return x.rate_estimate || 'no count';
  const unit = x.unit || (n === 1 ? 'left' : 'left');
  const head = n + ' ' + unit;
  const per = Number(x.covers);
  if (!Number.isFinite(per) || per <= 1) return head;
  const uses = n * per;
  return head + ' · ' + uses + (uses === 1 ? ' use' : ' uses');
}

  const n = Number(x.on_hand), keep = Number(x.keep_at_least);

};
/* The line she drew herself, crossed. Only supplies with a reorder line count --

   threshold would be the app deciding something nobody asked it to decide. */
function lowStock() {
  const names = {};
  ['structure','area','asset','animal','vehicle'].forEach(t =>
    (DB[t] || []).forEach(r => { names[r.id] = r.name || r.kind; }));
  return (DB.supply || []).filter(x => x.status !== 'archived' && supplyLow(x))
    .map(x => ({ ...x, about: names[x.asset_id || x.vehicle_id || x.animal_id || x.area_id]
      || (prop || {}).name || '' }))
    .sort((a, b) => (Number(a.on_hand) || 0) - (Number(b.on_hand) || 0));
}

async function saveThingTo(kind, id) {
  const row = subjRow(kind, id), table = SUBJECT[kind].table;

  const writes = [{ op:'upsert', table, record:{ ...row, structure_id:stId, area_id:arId } }];
  // Close the stay it was on rather than editing it: where it used to be is a
  // fact that stays true, and a history you can rewrite is not a history.
  const open = (DB.placement || []).find(pl => pl[SUBJECT[kind].fk] === id && !pl.left_on);

    record:{ ...open, left_on:when } });
  /* Nothing writes a placement when a thing is first added -- a row per asset
     saying "it is where it is" earns nothing. So the first move is also where

  await boot(); subject(kind, id);
  const to = stId ? ((DB.structure || []).find(x => x.id === stId) || {}).name : 'nowhere in particular';

/* The work anywhere under here -- including a round that merely STOPS here. A
   watering job hung off the property with a stop in the greenhouse is work in
   the greenhouse, and standing in there is exactly when you want to know. */
function jobsUnder(kind, id) {
  const seen = new Set(), out = [];
  const ids = new Set(descendants(kind, id).map(([, i]) => i));
  descendants(kind, id).forEach(([k, i]) => subjJobs(k, i).forEach(j => {
    if (seen.has(j.id)) return; seen.add(j.id); out.push(j);
  }));
  (DB.step || []).forEach(st => {
    if (!ids.has(st.area_id) && !ids.has(st.structure_id)) return;
    const j = jobById(st.job_id);
    if (!j || seen.has(j.id)) return;
    seen.add(j.id); out.push(j);
  });
  return out;
}
/* whenDue() is for something coming. A thing that already happened is not
   "4 weeks late", it is 4 weeks ago, and reading the first on a history line
   makes a finished job look overdue. */
const agoWords = d => d == null ? '' : d === 0 ? 'today' : d === -1 ? 'yesterday'
  : whenDue(d).replace(/ late$/, ' ago');
const openJob = j => j.status !== 'done' && j.status !== 'archived' && j.status !== 'dropped';
/* What has already happened under here -- completions and readings in one list,
   because "when did I last do a mite check" and "what did it read" are the same
   question asked two ways, and answering them from two lists interleaved by eye
   is the app handing back work it was supposed to do. */
function historyUnder(kind, id) {
  const ids = new Set(descendants(kind, id).map(([, i]) => i));
  const jobIds = new Set(jobsUnder(kind, id).map(j => j.id));
  const mine = r => SUBJ_FKS.some(f => r[f] && ids.has(r[f]))
    || (r.job_id && jobIds.has(r.job_id));
  const name = i => {
    for (const k of Object.keys(SUBJECT)) { const r = subjRow(k, i); if (r) return r.name || ''; }
    return ((DB.supply || []).find(x => x.id === i) || {}).name || '';
  };
  const about = r => { const f = SUBJ_FKS.find(x => r[x]); return f ? name(r[f]) : ''; };
  const who = i => ((DB.person || []).find(p => p.id === i) || {}).name || '';
  const out = [];
  (DB.completion || []).filter(mine).forEach(c => out.push({
    id:c.id, kind: c.origin === 'purchase' ? 'bought' : 'done', on:c.done_on,
    what:c.what || 'Done', about:about(c), by:who(c.by_person_id),
    extra:[c.cost ? money(c.cost) : '', c.how_many ? c.how_many + ' in' : ''].filter(Boolean).join(' · '),
    job:c.job_id || '' }));
  (DB.reading || []).filter(r => r.status !== 'archived').filter(mine).forEach(r => out.push({
    id:r.id, kind:'read', on:r.taken_on, what:r.what || 'Reading', about:about(r),
    by:who(r.by_person_id),
    extra:[(r.value_num != null && r.value_num !== '' ? r.value_num : r.value_flag || ''),
           r.unit || ''].filter(Boolean).join(' '),
    job:'' }));
  return out.sort((a2, b2) => String(b2.on || '').localeCompare(String(a2.on || '')));
}

/* What it has cost, anywhere under here. Same walk as the work, because the
   question is the same question: standing on the place you want the place's
   spend, and narrowing to the barn should narrow it. Deduped, because a
   completion naming the dishwasher AND the job on the dishwasher is one
   payment, and counting it twice would make the screen a liar about the only
   number on it nobody can check by eye. */
const COST_WINDOWS = [['all','All time'], ['y1','Last 12 months'], ['q','Last 3 months']];
function spendUnder(kind, id, win) {
  const ids = new Set(descendants(kind, id).map(([, i]) => i));
  const jobIds = new Set(jobsUnder(kind, id).map(j => j.id));
  const cut = win === 'y1' ? -365 : win === 'q' ? -92 : null;
  const seen = new Set(), out = [];
  (DB.completion || []).forEach(c => {
    if (seen.has(c.id)) return;
    const mine = SUBJ_FKS.some(f => c[f] && ids.has(c[f])) || (c.job_id && jobIds.has(c.job_id));
    if (!mine) return;
    if (cut != null) { const d = daysTo(c.done_on); if (d == null || d < cut) return; }
    seen.add(c.id); out.push(c);
  });
  return out;
}
const spendTotal = rows => rows.reduce((a, c) => a + (Number(c.cost) || 0), 0);

/* Work pointing at this subject. A person's is the work they hold or were
   meant for; everything else is the column with its name on it. */
function subjJobs(kind, id) {
  const open = j => j.status !== 'done' && j.status !== 'archived';
  if (kind === 'person')
    return (DB.job || []).filter(j => j.claimed_by_id === id || j.owner_id === id);
  return (DB.job || []).filter(j => j[SUBJECT[kind].fk] === id);
}
/* What it has cost. Some subjects are named on a completion directly; the rest
   reach money through the jobs that were done on them. Both, never twice --
   a completion naming the dishwasher AND the job on the dishwasher is one
   payment, and counting it twice would make the screen a liar about the only
   number on it nobody can check by eye. */
function subjSpend(kind, id) {
  const fk = SUBJECT[kind].fk, seen = new Set(), out = [];
  const take = c => { if (!c || seen.has(c.id)) return; seen.add(c.id); out.push(c); };
  if (fk && (DB.completion || []).some(c => fk in c))
    (DB.completion || []).filter(c => c[fk] === id).forEach(take);
  const jobs = new Set(subjJobs(kind, id).map(j => j.id));
  (DB.completion || []).filter(c => jobs.has(c.job_id)).forEach(take);
  return out;
}
const money = v => {
  const n = Number(v);
  return Number.isFinite(n) && n ? n.toLocaleString(undefined,
    { style:'currency', currency:((prop || {}).currency || 'USD'),
      maximumFractionDigits:0 }) : '';
};
/* Where it is, from the inside out. Each step is tappable, because "which
   building was that room in" is a question you ask by wanting to go there. */
function subjWhere(kind, row) {
  const out = [];
  let a = kind === 'area' ? (DB.area || []).find(x => x.id === row.parent_area_id)
        : row.area_id ? (DB.area || []).find(x => x.id === row.area_id) : null;
  let guard = 0;
  while (a && guard++ < 6) {
    out.push(['area', a.id, a.name]);
    a = (DB.area || []).find(x => x.id === a.parent_area_id);
  }
  const stId = kind === 'structure' ? row.attached_to_id : row.structure_id;
  const st = stId && (DB.structure || []).find(x => x.id === stId);
  if (st) out.push(['structure', st.id, st.name]);
  if (kind !== 'property' && prop) out.push(['property', prop.id, prop.name]);
  /* On a place that is one building, the house is named after the place, so the
     chain comes out "Home > Home". Saying it twice is not more information. */
  return out.filter((x, i) => !i || x[2] !== out[i - 1][2]);
}

let SUBJ_TAB = 'todo', SUBJ_Q = '', SUBJ_SORT = 'date', SUBJ_WIN = 'all';
/* One thing, and the four questions somebody actually arrives with: where did I
   leave off, what is next, what am I doing, and what does it need before I can
   start. Two tabs because those are two different jobs -- To do is a list you
   act on, History is the same records with the inputs taken off. */
function subject(kind, id, tab) {
  const def = SUBJECT[kind]; if (!def) return show('home');
  const row = subjRow(kind, id); if (!row) return show('home');
  $('#tabs').hidden = true;
  const last = SUBJ_TRAIL[SUBJ_TRAIL.length - 1];
  if (!last || last[0] !== kind || last[1] !== id) { SUBJ_TRAIL.push([kind, id]); SUBJ_Q = ''; }
  if (SUBJ_TRAIL.length > 20) SUBJ_TRAIL.shift();
  if (tab) SUBJ_TAB = tab;
  const here = `subject('${kind}','${id}')`;
  const name = subjName(kind, id);
  const all = jobsUnder(kind, id), open = all.filter(openJob);
  const past = historyUnder(kind, id);
  const where = subjWhere(kind, row).filter(x => x[2] !== name);
  const has = t => (DB[t] || []).filter(r => def.fk && r[def.fk] === id);
  const papers = has('document'), stock = has('supply');
  const rules = has('schedule').filter(r => r.muted !== 'TRUE');
  const q = SUBJ_Q.toLowerCase();
  const hit = (...bits) => !q || bits.filter(Boolean).join(' ').toLowerCase().includes(q);

  const sect = (title, body, add) => !body && !add ? '' :
    `<h2 style="margin-top:1.6rem">${esc(title)}</h2>${body || ''}${add || ''}`;

  /* Before you can start. Prose in `prerequisites` cannot be checked against
     anything; the rest can, and saying "waiting on Dave" or "no filter on the
     shelf" on the card is the difference between a list and a plan. */
  const blockers = j => {
    const out = [];
    if (j.blocked_on_person_id) out.push('waiting on '
      + (((DB.person || []).find(p => p.id === j.blocked_on_person_id)) || {}).name || 'somebody');
    if (j.depends_on_id) { const d = jobById(j.depends_on_id);
      if (d && openJob(d)) out.push('after ' + (d.title || 'another job')); }
    (DB.job_supply || []).filter(x => x.job_id === j.id).forEach(x => {
      const sp = (DB.supply || []).find(y => y.id === x.supply_id); if (!sp) return;
      const have = Number(sp.on_hand), need = Number(x.how_many) || 1;
      if (!Number.isFinite(have) || have < need) out.push('needs ' + sp.name);
    });
    if (j.needs_decision) out.push('a decision first');
    return out;
  };
  const jobCard = j => {
    const at = JOB_AT.map(([k2, f]) => [k2, j[f]]).find(([, v]) => v);
    const about = at && at[1] !== id ? subjName(at[0], at[1]) : '';
    const stop = blockers(j);
    /* A round that merely calls here is not ABOUT here, and saying so is the
       difference between "water the greenhouse" and "watering comes through". */
    const via = !at || at[1] !== id
      ? (DB.step || []).find(st => st.job_id === j.id
          && (st.area_id === id || st.structure_id === id)) : null;
    return `<div class="card tap"><button onclick="drawJob('${j.id}')">
      <span class="title">${esc(j.title || 'A job')}</span>
      <p class="meta">${via ? 'comes through &middot; ' : about ? esc(about) + ' &middot; ' : ''}${esc(jobMeta(j))}${
        j.claimed_by_id ? ' &middot; ' + esc((((DB.person || []).find(p => p.id === j.claimed_by_id)) || {}).name || 'taken') : ''}
        ${stop.length ? `<span class="chip soon">${esc(stop[0])}</span>` : ''}</p>
    </button></div>`;
  };

  const spend = spendUnder(kind, id, SUBJ_WIN);
  const tabs = `<div class="pick" style="grid-template-columns:1fr 1fr 1fr;margin:.9rem 0 .2rem">
      <button type="button" aria-pressed="${SUBJ_TAB === 'todo'}"
        onclick="SUBJ_TAB='todo';${here}"><span class="cap">To do${
        open.length ? ' · ' + open.length : ''}</span></button>
      <button type="button" aria-pressed="${SUBJ_TAB === 'past'}"
        onclick="SUBJ_TAB='past';${here}"><span class="cap">History${
        past.length ? ' · ' + past.length : ''}</span></button>
      <button type="button" aria-pressed="${SUBJ_TAB === 'cost'}"
        onclick="SUBJ_TAB='cost';${here}"><span class="cap">Costs${
        spendTotal(spend) ? ' · ' + esc(money(spendTotal(spend))) : ''}</span></button>
    </div>`;

  /* Costs drill the way work drills: this level, then what it splits into,
     down to one job. The split is what makes it worth opening -- a number for
     the place tells you nothing you can act on, and "the barn, £340" tells you
     where to look next. */
  const costs = () => {
    const total = spendTotal(spend);
    const win = `<div class="chips" style="margin:.6rem 0 .2rem">
      ${COST_WINDOWS.map(([k2, l]) => `<button type="button" aria-pressed="${SUBJ_WIN === k2}"
        onclick="SUBJ_WIN='${k2}';${here}">${l}</button>`).join('')}</div>`;
    if (!spend.length) return win + `<p class="hint" style="margin-top:.8rem">Nothing recorded${
      SUBJ_WIN === 'all' ? ' here yet' : ' in that window'}.</p>`;
    const noFig = spend.filter(c => !c.cost).length;
    const head = `<div class="card"><span class="title" style="font-size:1.4rem">${
      esc(money(total) || 'nothing recorded')}</span>
      <p class="meta">${spend.length} ${spend.length === 1 ? 'entry' : 'entries'}${
        noFig ? ' · ' + noFig + ' with no figure' : ''}</p></div>`;
    /* Blank is not zero. A place whose spend is mostly unpriced should say so
       rather than quietly reading as cheap. */
    /* Only the outermost children. A property holds its structures AND, by
       property_id, every animal and asset on it -- so a vet bill in the barn
       came out under the barn and again under Bessie, and the percentages
       summed past a hundred. A row is dropped when it already lives inside
       another row on the same list. */
    let kids = def.holds.map(child => subjHolds(kind, id, child)
      .map(r => ({ child, r, n: spendTotal(spendUnder(child, r.id, SUBJ_WIN)) })))
      .flat().filter(x => x.n > 0);
    const inside = new Set();
    kids.forEach(x => descendants(x.child, x.r.id)
      .forEach(([, i]) => { if (i !== x.r.id) inside.add(i); }));
    kids = kids.filter(x => !inside.has(x.r.id)).sort((a3, b3) => b3.n - a3.n);
    const split = kids.length ? `<h3 style="font-size:.95rem;color:var(--muted);margin:1.1rem 0 .4rem"
      >Where it went</h3>` + kids.map(x => `<div class="card tap">
        <button onclick="SUBJ_TAB='cost';subject('${x.child}','${x.r.id}')">
          <span class="title">${esc(x.r.name || SUBJECT[x.child].what(x.r))}</span>
          <p class="meta">${esc(money(x.n))}${total ? ' · ' + Math.round(x.n / total * 100) + '%' : ''}</p>
        </button></div>`).join('') : '';
    const rest = total - kids.reduce((a3, x) => a3 + x.n, 0);
    const here2 = kids.length && rest > 0
      ? `<div class="card"><span class="title">${esc(money(rest))}</span>
         <p class="meta">on ${esc(name)} itself</p></div>` : '';
    const lines = `<h3 style="font-size:.95rem;color:var(--muted);margin:1.1rem 0 .4rem"
      >Every entry</h3><div class="rows">${spend.slice()
      .sort((a3, b3) => String(b3.done_on).localeCompare(String(a3.done_on)))
      .map(c => `<div class="row">
        <span>${esc(c.what || 'Done')}${c.job_id
          ? ` <button class="skiplink" onclick="drawJob('${c.job_id}')">the job</button>` : ''}</span>
        <span class="meta">${[c.cost ? money(c.cost) : 'no figure',
          agoWords(daysTo(c.done_on))].filter(Boolean).map(esc).join(' · ')}</span>
      </div>`).join('')}</div>`;
    return win + head + split + here2 + lines;
  };

  const search = `<input id="sq" placeholder="search ${esc(name)}" value="${esc(SUBJ_Q)}"
    onchange="SUBJ_Q=this.value;${here};queueMicrotask(()=>{const e=$('#sq');if(e){e.focus();
      e.setSelectionRange(e.value.length,e.value.length);}})" style="margin:.6rem 0 .2rem">`;

  const todo = () => {
    const shown = orderJobs(open.filter(j => hit(j.title, j.notes)));
    /* The drill-down, and it carries the count -- narrowing blind is how you
       tap into a room to find out it had nothing in it. */
    const holds = def.holds.map(child => {
      const rows = subjHolds(kind, id, child).filter(r => hit(r.name));
      if (!rows.length) return '';
      return sect(HOLD_LABEL[child] || child, rows.map(r => {
        const n = jobsUnder(child, r.id).filter(openJob).length;
        const inside = (SUBJECT[child].holds || [])
          .reduce((t, c) => t + subjHolds(child, r.id, c).length, 0);
        return `<div class="card tap"><button onclick="subject('${child}','${r.id}')">
          <span class="title">${esc(r.name || SUBJECT[child].what(r))}</span>
          <p class="meta">${esc(SUBJECT[child].what(r))}${
            inside ? ' &middot; ' + inside + (inside === 1 ? ' thing inside' : ' things inside') : ''}${
            n ? ' &middot; ' + n + (n === 1 ? ' to do' : ' to do') : ''}</p>
        </button></div>`; }).join(''));
    }).join('');
    /* What is IN a place comes before what needs doing in it. On a property with
       any real amount of work the buildings were below the fold, so the screen
       for a place answered "what is outstanding" and never "what is here" --
       which is the question you open a building with. A thing has nothing
       inside it, so its work stays first. */
    const box = ['property','structure','area'].includes(kind);
    const work = sect('Needs doing',
      open.length ? (open.length > 1 ? jobBar(here) : '')
        + (shown.map(jobCard).join('') || `<p class="hint">Nothing matches.</p>`)
        : `<p class="hint">Nothing open here.</p>`,
      `<div class="actions" style="margin-top:.6rem">
        <button class="add" onclick="addJobHere('${kind}','${id}')">Add a job here</button></div>`);
    return (box ? holds + work : work + holds)
      + (rules.length ? sect('Comes round', rules.filter(r => hit(r.title)).map(r =>
        `<div class="card tap"><button onclick="openSched('${r.id}')">
          <span class="title">${esc(r.title)}</span>
          <p class="meta">${r.every_n ? 'every ' + esc(r.every_n) + ' ' + esc(r.every_unit)
            + (r.every_n > 1 ? 's' : '') : esc(r.kind || '')}${
            r.next_due_on ? ' &middot; ' + esc(whenDue(daysTo(r.next_due_on))) : ''}</p>
        </button></div>`).join('')) : '')
      + fedBy()
      + (stock.length ? sect('On the shelf', stock.filter(x => hit(x.name, x.part_number)).map(x =>
        `<div class="card tap"><button onclick="drawSupply('${x.id}')">
          <span class="title">${esc(x.name)}${x.part_number
            ? ` <span style="font-weight:400;color:var(--muted)">${esc(x.part_number)}</span>` : ''}</span>
          <p class="meta">${esc(shelfLine(x))}${supplyLow(x)
            ? ' <span class="chip soon">running low</span>' : ''}</p></button></div>`).join(''),
        `<div class="actions" style="margin-top:.6rem">
          <button class="add" onclick="drawSupply('', '${kind}', '${id}')">Something you keep</button></div>`)
        : (MOVABLE.includes(kind) || kind === 'area' ? sect('On the shelf', '',
          `<div class="actions"><button class="add"
            onclick="drawSupply('', '${kind}', '${id}')">Something you keep</button></div>`) : ''))
      /* `document` stores `name` and `good_until`. This read `title` and
         `expires_on`, so every paper here showed as "Paper" with a blank line
         under it, and the tap called drawDoc with an id it ignores -- opening a
         blank new-paper form instead of the paper. Invisible while the file
         itself was in a Drive folder you could go and look in. Not invisible
         now that a paper IS its link. */
      + (papers.length ? sect('Papers', papers.filter(d => hit(d.name, d.kind)).map(d => {
        const u = safeUrl(d.url);
        const what = (PAPER_KIND.find(x => x[0] === d.kind) || [])[1] || d.kind || '';
        return `<div class="card"><span class="title">${esc(d.name || what || 'Paper')}</span>
          <p class="meta">${esc(what)}${d.good_until
            ? ' \u00b7 good until ' + esc(d.good_until) : ''}</p>
          ${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">Open it</a>` : ''}</div>`;
      }).join('')) : '');
  };

  /* History is the to-do list with the inputs taken off -- same records, read
     only. Sorted by when, or grouped by what it was about, because "when did I
     last do a mite check" and "everything that ever happened to hive 2" are the
     same rows asked for two different ways. */
  const past2 = () => {
    const rows = past.filter(r => hit(r.what, r.about, r.by, r.extra));
    if (!rows.length) return `<p class="hint" style="margin-top:1rem">${
      past.length ? 'Nothing matches.' : 'Nothing has happened here yet.'}</p>`;
    const line = r => `<div class="row"><span>${esc(r.what)}${
      r.kind === 'read' ? ' <span class="chip ok">reading</span>'
      : r.kind === 'bought' ? ' <span class="chip ok">bought</span>' : ''}</span>
      <span class="meta">${[r.about, r.extra, r.by,
        r.on ? agoWords(daysTo(r.on)) + ' · ' + r.on : ''].filter(Boolean).map(esc).join(' · ')}</span>
    </div>`;
    if (SUBJ_SORT === 'thing') {
      const by = {};
      rows.forEach(r => { (by[r.about || name] = by[r.about || name] || []).push(r); });
      return Object.keys(by).sort().map(k =>
        `<h3 style="font-size:.95rem;color:var(--muted);margin:1rem 0 .3rem">${esc(k)}</h3>
         <div class="rows">${by[k].map(line).join('')}</div>`).join('');
    }
    return `<div class="rows" style="margin-top:.6rem">${rows.map(line).join('')}</div>`;
  };
  const sortBar = past.length > 2 ? `<div class="chips" style="margin:.6rem 0 .2rem">
      ${[['date','By when'], ['thing','By thing']].map(([k2, l]) =>
        `<button type="button" aria-pressed="${SUBJ_SORT === k2}"
          onclick="SUBJ_SORT='${k2}';${here}">${l}</button>`).join('')}</div>` : '';

  function fedBy() {
    const fed = (DB.hookup || []).filter(h => h.structure_id === id && !h.ended_on);
    const feeds = kind === 'asset'
      ? (DB.hookup || []).filter(h => h.source_asset_id === id && !h.ended_on) : [];
    if (!fed.length && !feeds.length) return '';
    const asset = i2 => (DB.asset || []).find(x => x.id === i2) || {};
    const struct = i2 => (DB.structure || []).find(x => x.id === i2) || {};
    const upstream = h => {
      const out = [], seen = new Set([id]); let cur = h;
      while (cur && out.length < 6) {
        const a2 = asset(cur.source_asset_id); if (!a2.id) break;
        const inSt = a2.structure_id;
        out.push(inSt && inSt !== id ? struct(inSt).name : null);
        if (!inSt || seen.has(inSt)) break;
        seen.add(inSt);
        cur = (DB.hookup || []).find(x => x.structure_id === inSt
          && x.utility === h.utility && !x.ended_on);
      }
      return out.filter(Boolean);
    };
    return sect('Fed by',
      fed.map(h => { const a2 = asset(h.source_asset_id), chain = upstream(h);
        return `<div class="card tap"><button onclick="subject('asset','${a2.id}')">
          <span class="title">${esc(a2.name || h.utility)}</span>
          <p class="meta">${esc(String(h.utility || '').replace(/_/g, ' '))}${
            chain.length ? ' &middot; ' + chain.map(esc).join(' &lsaquo; ') : ''}${
            h.started_on ? '' : ' &middot; not live yet'}</p></button></div>`; }).join('')
      + feeds.map(h => `<div class="card tap"><button onclick="subject('structure','${h.structure_id}')">
          <span class="title">${esc(struct(h.structure_id).name || 'a building')}</span>
          <p class="meta">runs on this${h.utility ? ' &middot; '
            + esc(String(h.utility).replace(/_/g, ' ')) : ''}</p></button></div>`).join(''));
  }

  const worst = open.filter(j => ({ unusable:3, degraded:2, intermittent:1 })[j.state])
    .sort((x, y) => ({ unusable:3, degraded:2, intermittent:1 })[y.state]

const HOLD_LABEL = { area:'Rooms and areas', asset:'Things', animal:'Animals',

const MOVABLE = ['asset', 'animal', 'vehicle'];
/* Back goes where you came from, which on a drill-down is up the chain rather
   than out to the home screen. A trail of one is still a trail. */
let SUBJ_TRAIL = [];
function subjBack() {
  SUBJ_TRAIL.pop();                     // the one we are on
  const prev = SUBJ_TRAIL.pop();
  if (!prev) return show('home');
  /* A group is a scope, not a row, so it rides the same trail under a name no
     table uses. Without it, backing out of the barn landed on the home screen
     and the list of buildings you were working through was gone. */
  return prev[0] === '#group' ? group(prev[1]) : subject(prev[0], prev[1]);

/* ---- one scope wider than a thing ---------------------------------------
   Randi, 2026-09-29: "I want to see the buildings as an icon I can click into,
   the animals an icon I can click into etc. The way it is now seems like more
   to scroll. I thought buildings - click - all buildings with tasks for all.
   Click a building - tasks for it."

   The home screen had quietly become the whole inventory: every building a
   card, then the animals, then the vehicles, stacked above the thing you
   opened the app to see. That is a list doing a menu's job. A tile is a door,
   and behind this one is the subject screen at one scope wider -- every
   building's work in one list, with the buildings underneath to narrow it.
   Same tabs, same cards, same drill. One step out.                        */
const GROUP = {
  buildings:{ label:'Buildings',      icon:'buildings', kinds:['structure'],
              sub:'Everything you can stand in, and what each one needs.' },
  rooms:    { label:'Rooms & things', icon:'rooms',     kinds:['area','asset'],
              sub:'Rooms, and the things in them.' },
  animals:  { label:'Animals',        icon:'animal',    kinds:['animal'],
              sub:'Feed, papers, vet trips — the same machinery, pointed at something with a pulse.' },
  vehicles: { label:'Vehicles',       icon:'things',    kinds:['vehicle'],
              sub:'Anything you drive and do not sleep in.' },
  feeds:    { label:'What feeds it',  icon:'systems',   kinds:['structure'], feeds:true,
              sub:'Water, waste, power, heat — per building, because they differ.' }

/* Everything of one kind actually on this place. Walked down from the property
   rather than filtered on property_id, because a room hangs off a building and
   a thing off a room -- neither carries the property on it -- and the walk
   already dedupes. */
const placeRows = k => prop
  ? descendants('property', prop.id).filter(([kk]) => kk === k)
      .map(([, i]) => subjRow(k, i)).filter(Boolean)
  : [];
const groupRoots = key => (GROUP[key].kinds || [])
  .map(k => placeRows(k).map(r => [k, r])).flat();
/* The union of what each root holds, deduped by id. A fire extinguisher in a
   room of a building is reachable two ways and is still one extinguisher. */
const across = (roots, fn) => {
  const seen = new Set(), out = [];
  roots.forEach(([k, r]) => fn(k, r.id).forEach(x => {
    if (seen.has(x.id)) return; seen.add(x.id); out.push(x); }));
  return out;
};
/* Only the outermost rows get listed. The same containment rule the costs
   split uses: a thing that already sits inside a room on this list is not a
   second entry beside it. */
const outermost = pairs => {
  const inside = new Set();
  pairs.forEach(([k, r]) => descendants(k, r.id)
    .forEach(([, i]) => { if (i !== r.id) inside.add(i); }));
  return pairs.filter(([, r]) => !inside.has(r.id));
};
const fedWith = st => (DB.hookup || [])
  .filter(h => h.structure_id === st.id && !h.ended_on)
  .map(h => String(h.utility || '').replace(/_/g, ' '));

function group(key, tab) {
  const g = GROUP[key]; if (!g || !prop) return show('home');
  $('#tabs').hidden = true;
  const last = SUBJ_TRAIL[SUBJ_TRAIL.length - 1];
  if (!last || last[0] !== '#group' || last[1] !== key) {
    SUBJ_TRAIL.push(['#group', key]); SUBJ_Q = '';
  }
  if (tab) SUBJ_TAB = tab;
  const here = `group('${key}')`;
  const roots = groupRoots(key), rows = outermost(roots);
  const all = across(roots, jobsUnder), open = all.filter(openJob);
  const past = across(roots, historyUnder)
    .sort((a, b) => String(b.on || '').localeCompare(String(a.on || '')));
  const spend = across(roots, (k, i) => spendUnder(k, i, SUBJ_WIN));

  const hit = (...bits) => !q || bits.filter(Boolean).join(' ').toLowerCase().includes(q);

  const rowCard = ([k, r]) => {

        onclick="SUBJ_TAB='past';${here}"><span class="cap">History${
        past.length ? ' · ' + past.length : ''}</span></button>
      <button type="button" aria-pressed="${SUBJ_TAB === 'cost'}"

        r.kind === 'read' ? ' <span class="chip ok">reading</span>'
        : r.kind === 'bought' ? ' <span class="chip ok">bought</span>' : ''}</span>

      </div>`).join('')}</div>`;

  const costs = () => {

  app.innerHTML = `<button class="back" onclick="subjBack()">&lsaquo; Back</button>

          <input id="jb-don" type="date" max="${esc(today())}" value="${esc(today())}"

        <button class="primary" style="margin:0"
          onclick="finishJob('${id}', $('#jb-don').value)">Mark it done</button>
      </div>
      <p class="hint">It starts on today. Change it if you did it earlier &mdash; the next one
        counts from the day you actually did it.</p>`}`;
}

/* WHEN it was last done, and deliberately not BY WHOM.

   An earlier draft of this said "Last done by Dave \u2014 and the 3 before that",
   and Randi cut it: "we dont want the data to cause rifts or fact checks or
   resentment... people can see the history logs under an item and see that for
   themselves if they care to check."

   She is right, and the line to hold is worth stating once: a run of somebody's
   name is not a fact, it is a scoreboard, and a scoreboard in a shared
   household has one use. The maintenance question \u2014 when was this last done,
   is it due \u2014 needs no person in it at all. The record of who did it is kept,
   in the log, where somebody goes to look on purpose. The app does not put it
   in front of anybody, and it never counts. */
/* History is the FINISHED CARDS, not a list of receipts. A repeating job makes
   a new row each time round and the finished one keeps everything that was on
   it \u2014 title, notes, ticked steps, what it was estimated at \u2014 so the record of
   "what did this look like last March" already exists and needs no snapshot.
   The completion beside it carries what it actually cost and who did it. */
function historyOf(j) {
  const past = (DB.job || []).filter(x => x.id !== j.id && String(x.status) === 'done'
    && ((j.schedule_id && x.schedule_id === j.schedule_id) || x.parent_job_id === j.id));
  const comp = Object.fromEntries((DB.completion || []).map(c => [c.job_id, c]));
  return past
    .map(x => ({ job:x, done: x.done_on || (comp[x.id] || {}).done_on || '', c: comp[x.id] || {} }))
    .filter(r => r.done)
    .sort((x, y) => String(y.done).localeCompare(String(x.done)));
}

/* The same card, frozen. Same order, same headings, no inputs \u2014 so opening a
   past one feels like looking at the job rather than reading a report about it.
   Randi: "id expect the history card to look just like the card to be done when
   clicked but no inputs." */
function jobCardRead(r) {
  const j = r.job, c = r.c;
  const who = ((DB.person || []).find(p => p.id === c.by_person_id) || {}).name;
  const steps = (DB.step || []).filter(x => x.job_id === j.id)
    .sort((a, b) => (+a.position || 0) - (+b.position || 0));
  const kind = (JOB_KIND.find(k => k[0] === j.kind) || [])[1] || 'Job';
  const row = (label, val) => val ? `<p class="meta"><b>${esc(label)}</b> ${esc(val)}</p>` : '';
  return `<p class="step" style="margin-top:.6rem">${esc(kind)}</p>
    <p class="title">${esc(j.title || '')}</p>
    ${j.notes ? `<p class="meta">${esc(j.notes)}</p>` : ''}
    ${steps.length ? `<p class="meta" style="margin-top:.6rem"><b>Steps</b></p>
      ${steps.map(st => `<p class="meta" style="margin:.1rem 0">${
        String(st.done).toUpperCase() === 'TRUE' ? '&#10003;' : '&#9744;'} ${esc(st.text)}</p>`).join('')}` : ''}
    <p class="meta" style="margin-top:.6rem"><b>When</b></p>
    ${row('Started', j.start_on)}${row('Was due', j.due_on)}${row('Done', r.done)}
    <p class="meta" style="margin-top:.6rem"><b>What it took</b></p>
    ${row('Estimated', j.est_minutes ? j.est_minutes + ' minutes' : '')}
    ${row('Cost', c.cost || j.est_cost || '')}
    ${row('Needed', j.prerequisites)}
    ${j.safety && j.safety !== 'none' ? row('Careful of', j.safety.replace(/_/g, ' ')) : ''}
    ${who ? `<p class="meta" style="margin-top:.6rem"><b>Done by</b> ${esc(who)}</p>` : ''}
    ${c.what ? `<p class="meta">${esc(c.what)}</p>` : ''}`;
}


/* A job claimed three weeks ago and untouched is a different fact from one
   claimed this morning. The board should be able to say so without anybody
   doing arithmetic. */
function sinceWords(at) {
  if (!at) return '';
  const d = Math.round((Date.now() - new Date(at)) / 864e5);
  if (isNaN(d)) return '';
  if (d <= 0) return 'since today';
  if (d === 1) return 'since yesterday';
  if (d < 7) return 'for ' + d + ' days';
  if (d < 14) return 'for a week';
  if (d < 60) return 'for ' + Math.round(d / 7) + ' weeks';
  return 'for ' + Math.round(d / 30) + ' months';
}

/* ONE form for a job, used by the job screen and by setup.

   There were two. Setup collected a title and a vague "this week / sometime";
   the job screen collected everything. So somebody setting up a place could
   not say "November" at the moment they were thinking about November, and the
   dates and the repeat they wanted were on a screen they could only reach by
   tapping a job that did not exist yet. Two forms for one object is the bug.
   A date picker bolted onto the old one would only have made two forms that
   disagreed less.

   `live` means the job is a row in DB: steps write straight through and the
   repeat is a schedule row. Otherwise it is a draft entry held in memory until
   the place exists, and the same markup reads and writes that object instead. */
function optList(v, list) {
  return list.map(([k, l]) =>
    `<option value="${k}"${v === k ? ' selected' : ''}>${esc(l)}</option>`).join('');
}

function jobFields(j, live, id) {
  const steps  = live ? stepsOf(id) : (j.steps || []);
  const isDone = s => live ? String(s.done).toUpperCase() === 'TRUE' : !!s.done;
  const done   = steps.filter(isDone).length;
  const rep    = live ? repOn(j) : j.rep === 'yes';
  const sched  = live ? (DB.schedule || []).find(x => x.id === j.schedule_id) : null;
  const everyN = live ? ((sched || {}).every_n    || '6')     : (j.every_n    || '6');
  const everyU = live ? ((sched || {}).every_unit || 'month') : (j.every_unit || 'month');
  const kindGo = live ? `reKind('${id}', this.value)`               : 'reKindDraft(this.value)';
  const repGo  = live ? `syncJob('${id}');draft.rep = this.value; drawJob('${id}')`
                      : 'setRepDraft(this.value)';
  const stepGo = live ? `addStep('${id}')`                          : 'addStepDraft()';
  const kind   = j.kind || 'task';
  /* Tyre pressure, vacuum, propane, mite counts: plenty of repeating jobs are
     answered with a NUMBER, not a tick. Saying so here makes the rule a reading
     rule, and a reading rule sends you to the reading screen when it comes due
     instead of to a checkbox with nowhere to put the answer. */
  const answerKind = live
    ? ((sched && sched.kind === 'reading') ? 'reading' : (j.answer || 'tick'))
    : (j.answer || 'tick');

  return `
    <label for="jb-t">Name</label>
    <input id="jb-t" value="${esc(j.title || '')}" >
    ${live ? `<label for="jb-ab">What is it about?</label>
    <select id="jb-ab" onchange="setJobAbout('${id}', this.value)">${aboutOptions(j)}</select>
    <p class="hint">Whatever you pick, this job shows up on its screen &mdash; and on
      everything it is inside. A job on the dishwasher is also the kitchen's and the
      house's.</p>` : ''}
    <label for="jb-k">What kind of job is this?</label>
    <select id="jb-k" onchange="${kindGo}">${optList(kind, JOB_KIND.map(k => [k[0], k[1]]))}</select>
    <p class="hint">${esc((JOB_KIND.find(k => k[0] === kind) || [])[2] || '')}</p>

    <label for="jb-n">Notes</label>
    <textarea id="jb-n" rows="3" placeholder="anything worth remembering next time">${esc(j.notes || '')}</textarea>

    <h2>Steps${steps.length ? ` <span class="chip ${done === steps.length ? 'ok' : 'soon'}">${done} of ${steps.length}</span>` : ''}</h2>
    ${steps.length ? `<div class="rows">${steps.map((st, n) => `<div class="row">
      <label class="tick" style="flex:1;min-width:0">
        <input type="checkbox" ${isDone(st) ? 'checked' : ''}
          onchange="${live ? `tickStep('${st.id}','${id}',this.checked)` : `tickStepDraft(${n},this.checked)`}">
        <span${isDone(st) ? ' style="text-decoration:line-through;color:var(--muted)"' : ''}>${esc(st.text)}${
          stepWhere(st) ? ` <span class="meta">&middot; ${esc(stepWhere(st))}</span>` : ''}</span>
      </label>
      <button class="quiet" style="min-height:2rem;padding:.25rem .6rem"
        onclick="${live ? `dropStep('${st.id}','${id}')` : `dropStepDraft(${n})`}">Remove</button></div>`).join('')}</div>` : ''}
    ${live ? (() => {
      /* A round -- watering, wasp checks, closing up for winter -- is ONE job
         with several stops. You set out once, so it is one job; the stops are
         steps. Letting a stop name its place is what makes the round show up in
         each place it visits, instead of somebody having to remember that
         "water" covers the greenhouse. */
      const places = (DB.structure || []).filter(x => x.status !== 'archived');
      const areas = (DB.area || []).filter(x => x.status !== 'archived');
      if (!places.length && !areas.length) return '';
      const up = a2 => ((DB.structure || []).find(x => x.id === a2.structure_id) || {}).name;
      /* Randi, 2026-09-29: "how do I add a get from place (not here)".
         "Get the test kit from environmental health" is a real step with a
         real address, and this list can only ever name buildings that are
         hers -- so the shop, the council office and the vet had nowhere to go
         but inside the sentence, where nothing can use them. */
      return `<select id="jb-stw" style="margin-top:.5rem"
          onchange="const e=$('#jb-stwe');if(e){e.hidden=this.value!=='x';if(!e.hidden)e.focus()}">
        <option value="">Anywhere in particular?</option>
        ${places.map(x => `<option value="s:${x.id}">${esc(x.name)}</option>`).join('')}
        ${areas.map(x => `<option value="a:${x.id}">${esc(x.name)}${
          up(x) ? esc(' — ' + up(x)) : ''}</option>`).join('')}
        <option value="x">Somewhere else &mdash; not here</option>
      </select>
      <input id="jb-stwe" hidden style="margin-top:.4rem"
        placeholder="where &mdash; the hardware shop, environmental health">`;
    })() : ''}
    <input id="jb-step" placeholder="add a step &mdash; borrow the ladder"
      onkeydown="if(event.key==='Enter'){event.preventDefault();${stepGo}}">
    <div class="actions" style="margin-top:.5rem">
      <button class="add" onclick="${stepGo}">Add step</button></div>

    <h2>When</h2>
    <label for="jb-s">Start</label>
    <input id="jb-s" type="date" value="${esc(j.start_on || '')}">
    <label for="jb-d">Due</label>
    <input id="jb-d" type="date" value="${esc(j.due_on || '')}">
    <label for="jb-r">Does it come round again?</label>
    <select id="jb-r" onchange="${repGo}">
      <option value=""${!rep ? ' selected' : ''}>No &mdash; just this once</option>
      <option value="yes"${rep ? ' selected' : ''}>Yes, on a repeat</option>
    </select>
    ${rep ? `<div class="counts" style="grid-template-columns:1fr 2fr">
      <div class="count"><span>Every</span>
        <input id="jb-en" inputmode="numeric" value="${esc(everyN)}"></div>
      <div class="count"><span>&nbsp;</span>
        <select id="jb-eu">${optList(everyU, EVERY_UNIT)}</select></div>
    </div>
    <label for="jb-ans">What does doing it look like?</label>
    <select id="jb-ans">${optList(answerKind, ANSWER_KIND)}</select>` : ''}`;
}

/* Reads whatever of the form is on screen. The fault and improvement tails are
   only in the DOM when that kind is selected, so a missing field is left alone
   rather than blanked. */
function readJobFields() {
  const v = k => { const el = $(k); return el ? (el.value || '').trim() : ''; };
  const num = x => { const n = Number(x); return Number.isFinite(n) && n > 0 ? n : ''; };
  const out = { kind: v('#jb-k') || 'task', title: v('#jb-t'), notes: v('#jb-n'),
    start_on: v('#jb-s'), due_on: v('#jb-d'),
    est_minutes: num(v('#jb-m')), est_cost: num(v('#jb-c')),
    prerequisites: v('#jb-p'), safety: v('#jb-sf') || 'none',
    rep: ($('#jb-r') && $('#jb-r').value === 'yes') ? 'yes' : '',
    every_n: num(v('#jb-en')) || 6, every_unit: v('#jb-eu') || 'month',
    answer: v('#jb-ans') || 'tick' };
  if (out.kind === 'fault') Object.assign(out, { state: v('#jb-st') || 'degraded',
    workaround: v('#jb-wa'), reported_on: v('#jb-ro'), reply: v('#jb-rp') });
  if (out.kind === 'improvement') Object.assign(out, { now: v('#jb-now'), want: v('#jb-want') });
  return out;
}

/* ---- the setup side of that form -------------------------------------- */
function blankEntry() { return { kind:'task', steps:[] }; }
/* Every redraw of the setup screen goes through here first, so nothing typed
   is lost when the kind changes or a step is added. This screen has dropped
   half-typed rows once before. */
function syncEntry() {
  if (!$('#jb-t')) return;
  const steps = (draft.entry || {}).steps || [];
  draft.entry = readJobFields();
  draft.entry.steps = steps;
}
/* The live twin of syncEntry(). The setup form has kept what is typed across a
   redraw since the day it dropped a half-typed row; the job screen redraws on
   the same two controls -- the kind, and "does it come round again" -- and kept
   nothing. Type a title, set it to repeat every six months, and the title went
   with the redraw, which is precisely the task somebody stood in their bathroom
   and decided to write down. Written onto the row in memory only: nothing is
   saved until Save. */
/* Randi, 2026-09-29: "the needs doing input screen is defaulted to the parent
   property 'the ranch' instead of letting me add it to a thing - I'd have to
   update it later to be added to a specific thing."

   A job added from a thing's own screen already knew its subject; a job added
   from anywhere else had no way to say one, so it landed on the place and
   stayed there. One control, listing everything on the place, on the screen
   where the job is being written. */
function aboutOptions(j) {
  const at = JOB_AT.map(([k, f]) => [k, j[f]]).find(([, v]) => v) || [];
  const sel = at[1] ? at[0] + ':' + at[1] : '';
  const opt = (v, l) => `<option value="${esc(v)}"${v === sel ? ' selected' : ''}>${esc(l)}</option>`;
  return opt('', 'The whole place')
    + [['structure','Buildings'], ['area','Rooms and areas'], ['asset','Things'],
       ['animal','Animals'], ['vehicle','Vehicles']].map(([k, label]) => {
      const rows = placeRows(k);
      return rows.length ? `<optgroup label="${esc(label)}">${
        rows.map(r => opt(k + ':' + r.id, subjName(k, r.id))).join('')}</optgroup>` : '';
    }).join('');
}
async function setJobAbout(id, val) {
  if (!jobById(id)) return;
  syncJob(id);                       // whatever is typed on screen is not lost
  const rec = { ...jobById(id) };
  JOB_AT.forEach(([, f]) => { rec[f] = ''; });
  if (val) { const [k, i] = String(val).split(':');
    const f = (JOB_AT.find(x => x[0] === k) || [])[1]; if (f) rec[f] = i; }
  const writes = [{ op:'upsert', table:'job', record:rec }];
  /* A repeating job's rule carries the same columns. Moving the job and
     leaving the rule behind is how the check-up keeps coming due on the wrong
     thing for the next ten years. */
  const sc = (DB.schedule || []).find(x => x.id === rec.schedule_id);
  if (sc) { const s2 = { ...sc };
    JOB_AT.forEach(([, f]) => { s2[f] = rec[f] || ''; });
    writes.push({ op:'upsert', table:'schedule', record:s2 }); }
  try { await DwelLogs.write(writes); }
  catch (e) { return say('Could not save: ' + e.message); }
  await reload(); drawJob(id);
  say(val ? 'About ' + subjName(String(val).split(':')[0], String(val).split(':')[1]) + '.'
          : 'About the whole place.');
}
function syncJob(id) {
  if (!$('#jb-t')) return;
  const j = jobById(id); if (!j) return;
  const f = readJobFields();
  ['kind','title','notes','start_on','due_on','est_minutes','est_cost',
   'prerequisites','safety','state','workaround','reported_on','reply','now','want']
    .forEach(k => { if (f[k] !== undefined) j[k] = f[k]; });
  draft.everyN = f.every_n; draft.everyU = f.every_unit; draft.answer = f.answer;
}
function reKindDraft(k)  { syncEntry(); draft.entry.kind = k; drawFirst(); }
function setRepDraft(v)  { syncEntry(); draft.entry.rep = v;  drawFirst(); }
function addStepDraft() {
  const el = $('#jb-step'), t = (el.value || '').trim();
  if (!t) return say('Type the step first.');
  syncEntry(); draft.entry.steps.push({ text:t, done:false }); drawFirst();
}
function dropStepDraft(n) { syncEntry(); draft.entry.steps.splice(n, 1); drawFirst(); }
function tickStepDraft(n, on) {
  const s = ((draft.entry || {}).steps || [])[n]; if (s) s.done = !!on;
}
function jobWhenWords(j) {
  const bits = [];
  if (j.due_on) bits.push('due ' + j.due_on);
  if (j.rep === 'yes') bits.push('every ' + (j.every_n || 6) + ' ' +
    ((EVERY_UNIT.find(u => u[0] === (j.every_unit || 'month')) || [0, 'months'])[1]));
  if (j.kind === 'fault' && !bits.length) bits.push('something is wrong');
  if (!bits.length) bits.push('no date yet');
  return bits.join(' · ');
}
function addJob() {
  syncEntry();
  const e = draft.entry;
  if (!e || !e.title) return say('Say what needs doing first.');
  draft.jobs = draft.jobs || [];
  if (draft.editing != null) { draft.jobs[draft.editing] = e; draft.editing = null;
    say(e.title + ' updated.'); }
  else { draft.jobs.push(e); say(e.title + ' is on the list.'); }
  draft.entry = blankEntry();
  drawFirst();
}
function editJob(i) {
  syncEntry();
  /* Tapping Edit with something half-typed keeps it rather than binning it.
     Appending leaves index i where it was. */
  if (draft.editing == null && draft.entry && draft.entry.title) draft.jobs.push(draft.entry);
  draft.editing = i;
  draft.entry = JSON.parse(JSON.stringify(draft.jobs[i] || blankEntry()));
  drawFirst();
}
function cancelEditJob() { draft.editing = null; draft.entry = blankEntry(); drawFirst(); }
function dropJob(i) {
  (draft.jobs || []).splice(i, 1);
  if (draft.editing === i) { draft.editing = null; draft.entry = blankEntry(); }
  else if (draft.editing != null && draft.editing > i) draft.editing--;
  drawFirst();
}

function repOn(j) {
  if (draft.rep !== undefined) return draft.rep === 'yes';
  const sc = (DB.schedule || []).find(x => x.id === j.schedule_id);
  return !!(sc && sc.every_n && sc.kind !== 'once');
}

/* Nothing is folded. An earlier draft hid time, cost and what-you-need behind a
   drawer to keep the screen short, and Randi called it: "if they want to fill it
   all out its there vs making them go back in later to add more to it." She is
   right, and it is the opposite of the first-run lesson rather than a
   contradiction of it. First run is a stranger being asked for things before
   they have seen anything; this is somebody who has ALREADY decided to open one
   job and tell it what they know. Making them hunt for a second click to say
   "this needs a ladder" is how that detail never gets written down. */
function moreSection(j, sel) {
  const fault = j.kind === 'fault', imp = j.kind === 'improvement';
  /* The words follow what the job is ABOUT. All of this was written for a
     boiler, and under a cow it asked whether she works, offered a workaround,
     and listed carbon monoxide while saying nothing about being kicked. Shared
     by the setup form and the job screen, so it is computed from the row rather
     than from whichever screen is showing. */
  const living = !!j.animal_id;
  return `<h2>What it takes</h2>
    <label for="jb-m">How long</label>
    <div class="counts">
      <input id="jb-m" inputmode="numeric" value="${esc(j.est_minutes || '')}" placeholder="20"
        style="max-width:7rem">
      <span class="meta">minutes${j.est_minutes >= 60
        ? ' &middot; about ' + hoursWords(j.est_minutes) : ''}</span>
    </div>
    
    <label for="jb-c">Roughly what it costs</label>
    <input id="jb-c" inputmode="decimal" value="${esc(j.est_cost || '')}" placeholder="0.00">
    <label for="jb-p">You need</label>
    <textarea id="jb-p" rows="2" placeholder="a ladder, and somebody to foot it">${esc(j.prerequisites || '')}</textarea>
    <label for="jb-sf">Anything to be careful of?</label>
    <select id="jb-sf">${sel(j.safety || 'none', living ? LIVING_SAFETY : SAFETY)}</select>

    ${fault ? `<h2>${living ? 'How it is' : 'What it is doing'}</h2>
      <label for="jb-st">How is ${living ? esc(subjName('animal', j.animal_id) || 'it') : 'it'}?</label>
      <select id="jb-st">${sel(j.state || 'degraded', living ? LIVING_STATE : JOB_STATE)}</select>
      <label for="jb-wa">${living ? 'What you are doing meanwhile' : 'Workaround'}</label>
      <textarea id="jb-wa" rows="2" placeholder="${living
        ? 'kept her in, hand-feeding' : 'how you are getting by meanwhile'}">${esc(j.workaround || '')}</textarea>
      <label for="jb-ro">${living ? 'Called the vet on' : 'Told somebody on'}</label>
      <input id="jb-ro" type="date" value="${esc(j.reported_on || '')}">
      <p class="hint">A date here is what a deposit argument turns on.</p>
      <label for="jb-rp">What they said</label>
      <textarea id="jb-rp" rows="2" placeholder="&ldquo;will look at it next week&rdquo;">${esc(j.reply || '')}</textarea>` : ''}

    ${imp ? `<h2>How it is, and how you want it</h2>
      <label for="jb-now">How it is now</label>
      <textarea id="jb-now" rows="2" placeholder="the ensuite was never built — used as a closet">${esc(j.now || '')}</textarea>
      <label for="jb-want">How you want it</label>
      <textarea id="jb-want" rows="2" placeholder="split it: bathroom one side, office the other">${esc(j.want || '')}</textarea>` : ''}`;
}

/* 90 minutes is a number; "an hour and a half" is a plan. Stored in minutes
   because one unit everywhere is what made the board possible — shown in
   whatever a person would actually say. */
function hoursWords(m) {
  const n = Number(m) || 0, h = Math.floor(n / 60), r = n % 60;
  if (n >= 480) return (n / 480).toFixed(n % 480 ? 1 : 0).replace('.0','') + ' day' + (n >= 960 ? 's' : '') + ' of work';
  if (!r) return h + ' hour' + (h === 1 ? '' : 's');
  return h + 'h ' + r + 'm';
}

function reKind(id, k) {
  syncJob(id);                                 // keep what is typed
  const j = jobById(id); if (j) j.kind = k;   // redraw only; saved on Save
  drawJob(id);
}

async function addStep(id) {
  const el = $('#jb-step'), t = (el.value || '').trim();
  if (!t) return say('Type the step first.');
  const n = stepsOf(id).length;
  const w = (($('#jb-stw') || {}).value || '');
  await DwelLogs.write(keepJob(id, [{ op:'upsert', table:'step',
    record:{ id:uid(), job_id:id, text:t, position:n + 1, done:'',
      structure_id: w.startsWith('s:') ? w.slice(2) : '',
      area_id: w.startsWith('a:') ? w.slice(2) : '',
      where_else: w === 'x' ? (($('#jb-stwe') || {}).value || '').trim() : '' } }]));
  await reload(); drawJob(id);
}
/* Every one of these writes something OTHER than the job and then reloads --
   and reload() replaces DB wholesale, so the title, notes and cost sitting in
   the form unsaved were thrown away by the act of attaching a filter to the
   job. It looked like the screen simply forgot what you had typed.

   syncJob() puts the form back into the row; sending the row with the write
   makes it survive the reload. Same shape as the bug where the repeat dropdown
   ate the job title, which is the third time this pattern has cost an hour. */
function keepJob(id, writes) {
  try { syncJob(id); } catch (e) {}
  const j = jobById(id);
  if (j) writes.push({ op:'upsert', table:'job', record:{ ...j } });
  return writes;
}

         whether there is one on the shelf, and saying zero would put this on
         the Running low list on the strength of a guess. */
      asset_id: jobById(id) ? (jobById(id).asset_id || '') : '' } });

async function saveJob(id) {
  const j = jobById(id); if (!j) return;
  const f = readJobFields();
  const rec = { ...j, kind:f.kind, title: f.title || j.title, notes:f.notes,
    start_on:f.start_on, due_on:f.due_on, est_minutes:f.est_minutes, est_cost:f.est_cost,
    prerequisites:f.prerequisites, safety:f.safety };
  if (f.kind === 'fault') Object.assign(rec, { state:f.state, workaround:f.workaround,
    reported_on:f.reported_on, reply:f.reply });
  if (f.kind === 'improvement') Object.assign(rec, { now:f.now, want:f.want });

  const writes = [{ op:'upsert', table:'job', record:rec }];

  /* A repeat is a RULE, and the rule is a schedule row - the job is one
     occurrence of it. Turning the repeat on here makes the rule if there is
     not one; turning it off makes the rule a 'once', which the schedule kind
     picklist has always had a value for. */
  const sc = (DB.schedule || []).find(x => x.id === j.schedule_id);
  if (f.rep === 'yes') {
    const rule = { id: (sc || {}).id || uid(), asset_id:j.asset_id || '',
      structure_id:j.structure_id || '', area_id:j.area_id || '', animal_id:j.animal_id || '',
      title: rec.title, kind: f.answer === 'reading' ? 'reading' : 'interval',
      every_n: f.every_n, every_unit: f.every_unit,
      /* Same rule as the setup path: a repeat is a cadence, not a start date.
         Defaulting to today was an invented number, which is the one thing
         this app is not allowed to do. */
      next_due_on: rec.due_on || '' };
    writes.push({ op:'upsert', table:'schedule', record:rule });
    rec.schedule_id = rule.id;
  } else if (sc) {
    writes.push({ op:'upsert', table:'schedule', record:{ ...sc, kind:'once' } });
  }
  try { await DwelLogs.write(writes); } catch (e) { return say('Could not save: ' + e.message); }
  draft.rep = undefined;
  await reload(); drawJob(id);
  say('Saved.');
}
